category: ecommerce
author: Heddle
homepage: https://lojaintegrada.docs.apiary.io
base_url: https://api.awsli.com.br/v1/
headers:
  User-Agent: Heddle

credential:
  label: Loja Integrada
  fields:
    - {name: api_key, label: Store API key, secret: true, required: true}
    - {name: app_key, label: Application key, secret: true, required: true}
  auth:
    type: header
    name: Authorization
    value: "chave_api {{credential.api_key}} aplicacao {{credential.app_key}}"

errors:
  message_path: error_message

triggers:
  - name: New Order
    description: Starts the flow for each new order, checking every 5 minutes.
    request:
      method: GET
      path: pedido/search/
      query: {limit: 50}
    output: {path: objects}
    poll: {every: 5, id: numero}

actions:
  # Orders
  - name: Get Order
    resource: Order
    description: Reads an order, with items, customer, payment and shipping.
    fields:
      - {name: numero, label: Order number, required: true}
    request: {method: GET, path: "pedido/{{fields.numero}}"}

  - name: List Orders
    resource: Order
    description: Lists orders, by status or dates.
    fields:
      - {name: situacao_id, label: Status ID, description: "From List Order Statuses"}
      - {name: since_criado, label: Created since, description: "Like 2026-02-10"}
      - {name: until_criado, label: Created until}
      - {name: since_atualizado, label: Updated since}
    request:
      method: GET
      path: pedido/search/
      query: {situacao_id: "{{fields.situacao_id}}", since_criado: "{{fields.since_criado}}", until_criado: "{{fields.until_criado}}", since_atualizado: "{{fields.since_atualizado}}"}
    pagination: {type: offset, items_path: objects, offset_param: offset, limit_param: limit, page_size: 50}

  - name: Change Order Status
    resource: Order
    description: Moves an order to another status, like paid, shipped or canceled.
    fields:
      - name: codigo
        label: Status
        type: select
        required: true
        options:
          - {label: Waiting payment, value: aguardando_pagamento}
          - {label: Paid, value: pedido_pago}
          - {label: In production, value: em_producao}
          - {label: In separation, value: pedido_em_separacao}
          - {label: Shipped, value: pedido_enviado}
          - {label: Delivered, value: pedido_entregue}
          - {label: Ready for pickup, value: pronto_para_retirada}
          - {label: Canceled, value: pedido_cancelado}
      - {name: numero, label: Order number, required: true}
    request:
      method: PUT
      path: "situacao/pedido/{{fields.numero}}"
      body: {codigo: "{{fields.codigo}}"}

  - name: Set Tracking Code
    resource: Order
    description: Sets the tracking code of an order's shipment.
    fields:
      - {name: envio_id, label: Shipment ID, required: true, description: "From the order's envios"}
      - {name: objeto, label: Tracking code, required: true}
    request:
      method: PUT
      path: "pedido_envio/{{fields.envio_id}}"
      body: {objeto: "{{fields.objeto}}"}

  - name: List Order Statuses
    resource: Order
    description: Lists the order statuses, for their IDs.
    request: {method: GET, path: situacao/}
    output: {path: objects}

  # Products
  - name: Create Product
    resource: Product
    description: Creates a product. Set its price and stock after.
    fields:
      - {name: nome, label: Name, required: true}
      - {name: sku, label: SKU, required: true}
      - {name: descricao_completa, label: Description, type: textarea}
      - {name: tipo, label: Type, type: select, default: normal, options: [{label: Simple, value: normal}, {label: With variations, value: atributo}, {label: Variation, value: atributo_opcao}, {label: Virtual, value: virtual}]}
      - {name: peso, label: Weight (kg), type: number}
      - {name: altura, label: Height (cm), type: number}
      - {name: largura, label: Width (cm), type: number}
      - {name: profundidade, label: Depth (cm), type: number}
      - {name: categorias, label: Category IDs, type: json, description: 'Like ["/api/v1/categoria/123"]'}
      - {name: ativo, label: Active, type: boolean, default: true}
      - {name: extra, label: More fields, type: json}
    request:
      method: POST
      path: produto
      body: {nome: "{{fields.nome}}", sku: "{{fields.sku}}", descricao_completa: "{{fields.descricao_completa}}", tipo: "{{fields.tipo}}", peso: "{{fields.peso}}", altura: "{{fields.altura}}", largura: "{{fields.largura}}", profundidade: "{{fields.profundidade}}", categorias: "{{fields.categorias}}", ativo: "{{fields.ativo}}", _merge: "{{fields.extra}}"}

  - name: Get Product
    resource: Product
    description: Reads a product.
    fields:
      - {name: id, label: Product ID, required: true}
    request: {method: GET, path: "produto/{{fields.id}}"}

  - name: List Products
    resource: Product
    description: Lists products, by SKU if you like.
    fields:
      - {name: sku, label: SKU}
    request:
      method: GET
      path: produto/
      query: {sku: "{{fields.sku}}"}
    pagination: {type: offset, items_path: objects, offset_param: offset, limit_param: limit, page_size: 50}

  - name: Update Product
    resource: Product
    description: Changes a product. Empty fields stay as they are.
    fields:
      - {name: id, label: Product ID, required: true}
      - {name: nome, label: Name}
      - {name: descricao_completa, label: Description, type: textarea}
      - {name: ativo, label: Active, type: select, options: [{label: "Yes", value: "true"}, {label: "No", value: "false"}]}
      - {name: extra, label: More fields, type: json}
    request:
      method: PUT
      path: "produto/{{fields.id}}"
      body: {nome: "{{fields.nome}}", descricao_completa: "{{fields.descricao_completa}}", ativo: "{{fields.ativo}}", _merge: "{{fields.extra}}"}

  - name: Set Price
    resource: Product
    description: Sets a product's price, sale price and cost.
    fields:
      - {name: id, label: Product ID, required: true}
      - {name: cheio, label: Price, type: number, required: true}
      - {name: promocional, label: Sale price, type: number}
      - {name: custo, label: Cost, type: number}
    request:
      method: PUT
      path: "produto_preco/{{fields.id}}"
      body: {cheio: "{{fields.cheio}}", promocional: "{{fields.promocional}}", custo: "{{fields.custo}}"}

  - name: Set Stock
    resource: Product
    description: Sets a product's stock.
    fields:
      - {name: id, label: Product ID, required: true}
      - {name: quantidade, label: Quantity, type: number, required: true}
      - {name: situacao_em_estoque, label: Days to ship when in stock, type: number, default: 0}
      - {name: situacao_sem_estoque, label: Days to ship when out of stock, type: number, description: "-1 stops selling it"}
    request:
      method: PUT
      path: "produto_estoque/{{fields.id}}"
      body: {gerenciado: true, quantidade: "{{fields.quantidade}}", situacao_em_estoque: "{{fields.situacao_em_estoque}}", situacao_sem_estoque: "{{fields.situacao_sem_estoque}}"}

  - name: Get Stock
    resource: Product
    description: Reads a product's stock.
    fields:
      - {name: id, label: Product ID, required: true}
    request: {method: GET, path: "produto_estoque/{{fields.id}}"}

  # Customers and categories
  - name: Get Customer
    resource: Customer
    description: Reads a customer, with their addresses.
    fields:
      - {name: id, label: Customer ID, required: true}
    request: {method: GET, path: "cliente/{{fields.id}}"}

  - name: List Customers
    resource: Customer
    description: Lists customers, by email or CPF if you like.
    fields:
      - {name: email, label: Email}
      - {name: cpf, label: CPF}
    request:
      method: GET
      path: cliente/
      query: {email: "{{fields.email}}", cpf: "{{fields.cpf}}"}
    pagination: {type: offset, items_path: objects, offset_param: offset, limit_param: limit, page_size: 50}

  - name: List Categories
    resource: Category
    description: Lists the categories.
    request: {method: GET, path: categoria/}
    pagination: {type: offset, items_path: objects, offset_param: offset, limit_param: limit, page_size: 50}

  - name: Create Category
    resource: Category
    description: Creates a category.
    fields:
      - {name: nome, label: Name, required: true}
      - {name: descricao, label: Description}
      - {name: categoria_pai, label: Parent category, description: 'Like /api/v1/categoria/123'}
    request:
      method: POST
      path: categoria
      body: {nome: "{{fields.nome}}", descricao: "{{fields.descricao}}", categoria_pai: "{{fields.categoria_pai}}"}

