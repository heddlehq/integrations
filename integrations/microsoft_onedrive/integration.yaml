# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# OneDrive, personal or for work, through Microsoft Graph v1.0. Connect with an app
# registered in Microsoft Entra ID (Azure), with the delegated permission
# Files.ReadWrite.All.
id: microsoft_onedrive
name: Microsoft OneDrive
version: 1.0.0
description: Files and folders in OneDrive.
icon: hero-cloud
logo: |
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path d="M28 27s8.854-6.054 9.045-6.041A13.126 13.126 0 0 0 13.366 17h.134z" fill="#0364b8"/><path d="M19.016 18.564A10.447 10.447 0 0 0 13.5 17h-.134a10.5 10.5 0 0 0-8.479 16.5L19 32l8.833-8.155z" fill="#0f78d4"/><path d="M37.045 20.959a8.455 8.455 0 0 0-.576-.021 8.506 8.506 0 0 0-3.382.7l-5.254 2.21L34 31l9.98 2.517a8.532 8.532 0 0 0-6.935-12.558z" fill="#1490df"/><path d="M36.529 29.054l-2.178-1.3-4.994-2.991-1.524-.913-4.019 1.692-7.7 3.238-3.452 1.45-7.775 3.27A10.484 10.484 0 0 0 13.5 38h22.969a8.531 8.531 0 0 0 7.511-4.483z" fill="#28a8ea"/><path fill="none" d="M0 0h48v48H0z"/></svg>
category: files
author: Heddle
homepage: https://learn.microsoft.com/graph/api/resources/onedrive
base_url: https://graph.microsoft.com/v1.0/

credential:
  label: Microsoft OneDrive
  auth:
    type: oauth2
    authorize_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
    token_auth: body
    scopes: [offline_access, User.Read, Files.ReadWrite.All]

errors:
  message_path: error.message

triggers:
  - name: New Item
    description: Starts the flow for each new file or folder in a folder, checking every 5 minutes.
    fields:
      - {name: folder, label: Folder, type: select, required: true, default: root, description: "The top of the drive when left as is.", options_from: {request: {method: GET, path: me/drive/root/children, query: {$top: 200, $select: "id,name"}}, path: value, label: name, value: id}}
    request:
      method: GET
      path: "me/drive/items/{{fields.folder}}/children"
      query: {$top: 200}
    output:
      path: value
    poll:
      every: 5
      id: id

  - name: Item Changed
    description: Starts the flow when a file or folder in a folder is created or changed, checking every 5 minutes.
    fields:
      - {name: folder, label: Folder, type: select, required: true, default: root, description: "The top of the drive when left as is.", options_from: {request: {method: GET, path: me/drive/root/children, query: {$top: 200, $select: "id,name"}}, path: value, label: name, value: id}}
    request:
      method: GET
      path: "me/drive/items/{{fields.folder}}/children"
      query: {$top: 200}
    output:
      path: value
    poll:
      every: 5
      id: eTag

actions:
  # Files
  - name: Upload File
    resource: File
    description: Uploads a file, up to 250 MB, into a folder, with its own name.
    fields:
      - {name: file, label: File, type: file, required: true, default: "{{result}}"}
      - {name: folder, label: Folder, type: select, required: true, default: root, options_from: {request: {method: GET, path: me/drive/root/children, query: {$top: 200, $select: "id,name"}}, path: value, label: name, value: id}}
      - {name: conflict, label: If the name exists, type: select, default: rename, options: [{label: Keep both, value: rename}, {label: Replace, value: replace}, {label: Fail, value: fail}]}
    request:
      method: PUT
      path: "me/drive/items/{{fields.folder}}:/{{fields.file | name}}:/content"
      query: {"@microsoft.graph.conflictBehavior": "{{fields.conflict}}"}
      body_type: binary
      body: "{{fields.file}}"

  - name: Download File
    resource: File
    description: Downloads a file.
    fields:
      - {name: item, label: File ID, required: true}
    request: {method: GET, path: "me/drive/items/{{fields.item}}/content"}
    output:
      file: true

  - name: Get File
    resource: File
    description: Gets a file's details.
    fields:
      - {name: item, label: File ID, required: true}
    request: {method: GET, path: "me/drive/items/{{fields.item}}"}

  - name: Copy File
    resource: File
    description: Copies a file into a folder. OneDrive copies it in the background.
    fields:
      - {name: item, label: File ID, required: true}
      - {name: folder, label: Into folder, type: select, required: true, options_from: {request: {method: GET, path: me/drive/root/children, query: {$top: 200, $select: "id,name"}}, path: value, label: name, value: id}}
      - {name: name, label: New name, description: "The same name when empty."}
    request:
      method: POST
      path: "me/drive/items/{{fields.item}}/copy"
      body: {parentReference: {id: "{{fields.folder}}"}, name: "{{fields.name}}"}
    output:
      value: {copying: true}

  - name: Move File
    resource: File
    description: Moves a file into another folder.
    fields:
      - {name: item, label: File ID, required: true}
      - {name: folder, label: Into folder, type: select, required: true, options_from: {request: {method: GET, path: me/drive/root/children, query: {$top: 200, $select: "id,name"}}, path: value, label: name, value: id}}
    request:
      method: PATCH
      path: "me/drive/items/{{fields.item}}"
      body: {parentReference: {id: "{{fields.folder}}"}}

  - name: Rename File
    resource: File
    description: Renames a file.
    fields:
      - {name: item, label: File ID, required: true}
      - {name: name, label: New name, required: true}
    request:
      method: PATCH
      path: "me/drive/items/{{fields.item}}"
      body: {name: "{{fields.name}}"}

  - name: Search Files
    resource: File
    description: Finds files and folders by name or content, in the whole drive.
    fields:
      - {name: query, label: Search, required: true}
    request: {method: GET, path: "me/drive/root/search(q='{{fields.query}}')"}
    pagination: {type: link, items_path: value, next_path: "@odata.nextLink"}

  - name: Share File
    resource: File
    description: Makes a link to a file, to view or to edit, for anyone or for your organization.
    fields:
      - {name: item, label: File ID, required: true}
      - {name: type, label: Link type, type: select, required: true, default: view, options: [{label: View, value: view}, {label: Edit, value: edit}, {label: Embed, value: embed}]}
      - {name: scope, label: Who can open it, type: select, required: true, default: anonymous, options: [{label: Anyone with the link, value: anonymous}, {label: Your organization, value: organization}]}
      - {name: password, label: Password, description: For a personal OneDrive.}
      - {name: expires, label: Expires, type: datetime}
    request:
      method: POST
      path: "me/drive/items/{{fields.item}}/createLink"
      body: {type: "{{fields.type}}", scope: "{{fields.scope}}", password: "{{fields.password}}", expirationDateTime: "{{fields.expires}}"}

  - name: Delete File
    resource: File
    description: Deletes a file, to the recycle bin.
    fields:
      - {name: item, label: File ID, required: true}
    request: {method: DELETE, path: "me/drive/items/{{fields.item}}"}
    output:
      value: {deleted: true}

  # Folders
  - name: Create Folder
    resource: Folder
    description: Creates a folder, at the top of the drive or inside another.
    fields:
      - {name: name, label: Name, required: true}
      - {name: parent, label: Parent folder, type: select, required: true, default: root, options_from: {request: {method: GET, path: me/drive/root/children, query: {$top: 200, $select: "id,name"}}, path: value, label: name, value: id}}
      - {name: conflict, label: If the name exists, type: select, default: rename, options: [{label: Keep both, value: rename}, {label: Replace, value: replace}, {label: Fail, value: fail}]}
    request:
      method: POST
      path: "me/drive/items/{{fields.parent}}/children"
      body: {name: "{{fields.name}}", folder: {}, "@microsoft.graph.conflictBehavior": "{{fields.conflict}}"}

  - name: Get Folder Items
    resource: Folder
    description: Lists the files and folders inside a folder.
    fields:
      - {name: folder, label: Folder, type: select, required: true, default: root, options_from: {request: {method: GET, path: me/drive/root/children, query: {$top: 200, $select: "id,name"}}, path: value, label: name, value: id}}
    request: {method: GET, path: "me/drive/items/{{fields.folder}}/children", query: {$top: 200}}
    pagination: {type: link, items_path: value, next_path: "@odata.nextLink"}

  - name: Move Folder
    resource: Folder
    description: Moves a folder into another.
    fields:
      - {name: item, label: Folder ID, required: true}
      - {name: folder, label: Into folder, type: select, required: true, options_from: {request: {method: GET, path: me/drive/root/children, query: {$top: 200, $select: "id,name"}}, path: value, label: name, value: id}}
    request:
      method: PATCH
      path: "me/drive/items/{{fields.item}}"
      body: {parentReference: {id: "{{fields.folder}}"}}

  - name: Rename Folder
    resource: Folder
    description: Renames a folder.
    fields:
      - {name: item, label: Folder ID, required: true}
      - {name: name, label: New name, required: true}
    request:
      method: PATCH
      path: "me/drive/items/{{fields.item}}"
      body: {name: "{{fields.name}}"}

  - name: Search Folders
    resource: Folder
    description: Finds folders by name, in the whole drive.
    fields:
      - {name: query, label: Search, required: true}
    request: {method: GET, path: "me/drive/root/search(q='{{fields.query}}')", query: {$filter: folder ne null}}
    pagination: {type: link, items_path: value, next_path: "@odata.nextLink"}

  - name: Share Folder
    resource: Folder
    description: Makes a link to a folder, to view or to edit, for anyone or for your organization.
    fields:
      - {name: item, label: Folder ID, required: true}
      - {name: type, label: Link type, type: select, required: true, default: view, options: [{label: View, value: view}, {label: Edit, value: edit}]}
      - {name: scope, label: Who can open it, type: select, required: true, default: anonymous, options: [{label: Anyone with the link, value: anonymous}, {label: Your organization, value: organization}]}
      - {name: password, label: Password, description: For a personal OneDrive.}
      - {name: expires, label: Expires, type: datetime}
    request:
      method: POST
      path: "me/drive/items/{{fields.item}}/createLink"
      body: {type: "{{fields.type}}", scope: "{{fields.scope}}", password: "{{fields.password}}", expirationDateTime: "{{fields.expires}}"}

  - name: Delete Folder
    resource: Folder
    description: Deletes a folder and what is in it, to the recycle bin.
    fields:
      - {name: item, label: Folder ID, required: true}
    request: {method: DELETE, path: "me/drive/items/{{fields.item}}"}
    output:
      value: {deleted: true}

i18n:
  pt-BR:
    description: Arquivos e pastas no OneDrive.
    triggers:
      New Item: {name: Novo item, description: "Inicia o fluxo para cada arquivo ou pasta nova numa pasta, olhando a cada 5 minutos.", fields: {folder: Pasta}}
      Item Changed: {name: Item mudou, description: "Inicia o fluxo quando um arquivo ou pasta numa pasta é criado ou muda, olhando a cada 5 minutos.", fields: {folder: Pasta}}
    actions:
      Upload File: {name: Enviar arquivo, description: "Envia um arquivo, de até 250 MB, para uma pasta, com o nome dele.", fields: {file: Arquivo, folder: Pasta, conflict: Se o nome existir}}
      Download File: {name: Baixar arquivo, description: Baixa um arquivo., fields: {item: ID do arquivo}}
      Get File: {name: Ler arquivo, description: Lê os detalhes de um arquivo., fields: {item: ID do arquivo}}
      Copy File: {name: Copiar arquivo, description: Copia um arquivo para uma pasta. O OneDrive copia em segundo plano., fields: {item: ID do arquivo, folder: Para a pasta, name: Novo nome}}
      Move File: {name: Mover arquivo, description: Move um arquivo para outra pasta., fields: {item: ID do arquivo, folder: Para a pasta}}
      Rename File: {name: Renomear arquivo, description: Renomeia um arquivo., fields: {item: ID do arquivo, name: Novo nome}}
      Search Files: {name: Buscar arquivos, description: "Encontra arquivos e pastas pelo nome ou conteúdo, no drive todo.", fields: {query: Busca}}
      Share File: {name: Compartilhar arquivo, description: "Cria um link para um arquivo, para ver ou editar, para qualquer um ou para sua organização.", fields: {item: ID do arquivo, type: Tipo de link, scope: Quem pode abrir, password: Senha, expires: Expira em}}
      Delete File: {name: Excluir arquivo, description: "Exclui um arquivo, para a lixeira.", fields: {item: ID do arquivo}}
      Create Folder: {name: Criar pasta, description: "Cria uma pasta, no topo do drive ou dentro de outra.", fields: {name: Nome, parent: Pasta mãe, conflict: Se o nome existir}}
      Get Folder Items: {name: Listar itens da pasta, description: Lista os arquivos e pastas dentro de uma pasta., fields: {folder: Pasta}}
      Move Folder: {name: Mover pasta, description: Move uma pasta para dentro de outra., fields: {item: ID da pasta, folder: Para a pasta}}
      Rename Folder: {name: Renomear pasta, description: Renomeia uma pasta., fields: {item: ID da pasta, name: Novo nome}}
      Search Folders: {name: Buscar pastas, description: "Encontra pastas pelo nome, no drive todo.", fields: {query: Busca}}
      Share Folder: {name: Compartilhar pasta, description: "Cria um link para uma pasta, para ver ou editar, para qualquer um ou para sua organização.", fields: {item: ID da pasta, type: Tipo de link, scope: Quem pode abrir, password: Senha, expires: Expira em}}
      Delete Folder: {name: Excluir pasta, description: "Exclui uma pasta e o que tem nela, para a lixeira.", fields: {item: ID da pasta}}
