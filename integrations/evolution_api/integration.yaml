07.642 59.6686 209.404 57.8034C211.166 55.8865 212.046 53.0628 212.046 49.3325V28.6602H224.17Z" fill="#0F172A"/> <path d="M170.578 71.0912C165.864 71.0912 162.185 69.8478 159.543 67.3609C156.901 64.8222 155.579 61.2473 155.579 56.6362V12.8047H167.703V55.9367C167.703 57.6983 168.143 59.0713 169.024 60.0557C169.957 60.9882 171.252 61.4545 172.91 61.4545C173.532 61.4545 174.153 61.3768 174.775 61.2214C175.449 61.066 175.967 60.8846 176.329 60.6774L176.873 70.0809C174.853 70.7545 172.754 71.0912 170.578 71.0912Z" fill="#0F172A"/> <path d="M308.722 26.5957C321.574 26.5957 331.993 37.0143 331.993 49.8662C331.993 62.7182 321.574 73.1367 308.722 73.1367C295.87 73.1367 285.452 62.7182 285.452 49.8662C285.452 37.0143 295.87 26.5957 308.722 26.5957ZM308.722 38.1201C302.235 38.1201 296.976 43.3792 296.976 49.8662C296.976 56.3534 302.235 61.6123 308.722 61.6123C315.21 61.6123 320.468 56.3534 320.468 49.8662C320.468 43.3791 315.209 38.1201 308.722 38.1201Z" fill="#0F172A"/></svg></svg>
category: messaging
author: Heddle
homepage: https://doc.evolution-api.com/v2/api-reference
base_url: "{{credential.url}}/"

credential:
  label: Evolution API
  fields:
    - {name: url, label: Server URL, required: true, description: "Like https://evolution.acme.com"}
    - {name: api_key, label: API key, secret: true, required: true}
  auth:
    type: header
    name: apikey
    value: "{{credential.api_key}}"

errors:
  message_path: response.message.0

triggers:
  - name: WhatsApp Event
    description: Starts the flow when a message arrives or something changes on an instance.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
      - name: events
        label: Events
        type: multiselect
        required: true
        default: [MESSAGES_UPSERT]
        options:
          - {label: Message received or sent, value: MESSAGES_UPSERT}
          - {label: Message status changed, value: MESSAGES_UPDATE}
          - {label: Message deleted, value: MESSAGES_DELETE}
          - {label: Connection changed, value: CONNECTION_UPDATE}
          - {label: QR code updated, value: QRCODE_UPDATED}
          - {label: Contact created, value: CONTACTS_UPSERT}
          - {label: Group created, value: GROUPS_UPSERT}
          - {label: Group participants changed, value: GROUP_PARTICIPANTS_UPDATE}
          - {label: Call, value: CALL}
      - {name: base64, label: Media in base64, type: boolean, default: false, description: "Puts received media in the event."}
    webhook:
      register:
        request:
          method: POST
          path: "webhook/set/{{fields.instance}}"
          body: {webhook: {enabled: true, url: "{{webhook.url}}", headers: {x-heddle-token: "{{webhook.secret}}"}, byEvents: false, base64: "{{fields.base64}}", events: "{{fields.events}}"}}
      unregister:
        request:
          method: POST
          path: "webhook/set/{{fields.instance}}"
          body: {webhook: {enabled: false, url: "{{webhook.url}}", events: "{{fields.events}}"}}
      signature: {header: x-heddle-token, token: "{{webhook.secret}}"}

actions:
  # Messages
  - name: Send Text
    resource: Message
    description: Sends a text message.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
      - {name: number, label: To, required: true, description: "Number with country code, like 5511999990000, or a group ID ending in @g.us."}
      - {name: text, label: Text, type: textarea, required: true}
      - {name: link_preview, label: Show link previews, type: boolean, default: true}
      - {name: quoted, label: Reply to message ID}
      - {name: delay, label: Typing for (ms), type: number, description: "Shows typing before sending."}
    request:
      method: POST
      path: "message/sendText/{{fields.instance}}"
      body: {number: "{{fields.number}}", text: "{{fields.text}}", linkPreview: "{{fields.link_preview}}", quoted: {key: {id: "{{fields.quoted}}"}}, delay: "{{fields.delay}}"}

  - name: Send Media
    resource: Message
    description: Sends an image, video or document from a URL.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
      - {name: number, label: To, required: true, description: "Number with country code, like 5511999990000, or a group ID ending in @g.us."}
      - {name: mediatype, label: Kind, type: select, required: true, default: image, options: [{label: Image, value: image}, {label: Video, value: video}, {label: Document, value: document}]}
      - {name: url, label: URL, required: true}
      - {name: mimetype, label: Type, description: "Like application/pdf"}
      - {name: file_name, label: File name}
      - {name: caption, label: Caption, type: textarea}
      - {name: delay, label: Typing for (ms), type: number, description: "Shows typing before sending."}
    request:
      method: POST
      path: "message/sendMedia/{{fields.instance}}"
      body: {number: "{{fields.number}}", mediatype: "{{fields.mediatype}}", media: "{{fields.url}}", mimetype: "{{fields.mimetype}}", fileName: "{{fields.file_name}}", caption: "{{fields.caption}}", delay: "{{fields.delay}}"}

  - name: Send Media File
    resource: Message
    description: Sends an image, video or document from a file of the flow.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
      - {name: number, label: To, required: true, description: "Number with country code, like 5511999990000, or a group ID ending in @g.us."}
      - {name: mediatype, label: Kind, type: select, required: true, default: document, options: [{label: Image, value: image}, {label: Video, value: video}, {label: Document, value: document}]}
      - {name: file, label: File, type: file, required: true, default: "{{result}}"}
      - {name: caption, label: Caption, type: textarea}
    request:
      method: POST
      path: "message/sendMedia/{{fields.instance}}"
      body: {number: "{{fields.number}}", mediatype: "{{fields.mediatype}}", media: "{{fields.file | base64}}", fileName: "{{fields.file | name}}", caption: "{{fields.caption}}"}

  - name: Send Audio
    resource: Message
    description: Sends a voice message from an audio URL.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
      - {name: number, label: To, required: true, description: "Number with country code, like 5511999990000, or a group ID ending in @g.us."}
      - {name: audio, label: Audio URL, required: true}
      - {name: delay, label: Typing for (ms), type: number, description: "Shows typing before sending."}
    request:
      method: POST
      path: "message/sendWhatsAppAudio/{{fields.instance}}"
      body: {number: "{{fields.number}}", audio: "{{fields.audio}}", delay: "{{fields.delay}}"}

  - name: Send Location
    resource: Message
    description: Sends a pin on the map.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
      - {name: number, label: To, required: true, description: "Number with country code, like 5511999990000, or a group ID ending in @g.us."}
      - {name: latitude, label: Latitude, type: number, required: true}
      - {name: longitude, label: Longitude, type: number, required: true}
      - {name: name, label: Name}
      - {name: address, label: Address}
    request:
      method: POST
      path: "message/sendLocation/{{fields.instance}}"
      body: {number: "{{fields.number}}", latitude: "{{fields.latitude}}", longitude: "{{fields.longitude}}", name: "{{fields.name}}", address: "{{fields.address}}"}

  - name: Send Contact
    resource: Message
    description: Sends a contact card.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
      - {name: number, label: To, required: true, description: "Number with country code, like 5511999990000, or a group ID ending in @g.us."}
      - {name: full_name, label: Name, required: true}
      - {name: phone, label: Phone, required: true, description: "Like 5511999990000"}
      - {name: email, label: Email}
      - {name: organization, label: Company}
    request:
      method: POST
      path: "message/sendContact/{{fields.instance}}"
      body: {number: "{{fields.number}}", contact: [{fullName: "{{fields.full_name}}", wuid: "{{fields.phone}}", phoneNumber: "{{fields.phone}}", email: "{{fields.email}}", organization: "{{fields.organization}}"}]}

  - name: Send Poll
    resource: Message
    description: Sends a poll.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
      - {name: number, label: To, required: true, description: "Number with country code, like 5511999990000, or a group ID ending in @g.us."}
      - {name: question, label: Question, required: true}
      - {name: options, label: Options, required: true, description: "Like Yes, No, Maybe"}
      - {name: selectable, label: Answers each person may pick, type: number, default: 1}
    request:
      method: POST
      path: "message/sendPoll/{{fields.instance}}"
      body: {number: "{{fields.number}}", name: "{{fields.question}}", selectableCount: "{{fields.selectable}}", values: {_each: "{{fields.options}}", _value: "{{item}}"}}

  - name: React to Message
    resource: Message
    description: Reacts to a message with an emoji; empty takes the reaction back.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
      - {name: remote_jid, label: Chat, required: true, description: "Like 5511999990000@s.whatsapp.net"}
      - {name: message_id, label: Message ID, required: true}
      - {name: from_me, label: The message is mine, type: boolean, default: false}
      - {name: reaction, label: Emoji, description: "Like 👍"}
    request:
      method: POST
      path: "message/sendReaction/{{fields.instance}}"
      body: {key: {remoteJid: "{{fields.remote_jid}}", fromMe: "{{fields.from_me}}", id: "{{fields.message_id}}"}, reaction: "{{fields.reaction | keep}}"}

  # Chats
  - name: Check Numbers
    resource: Chat
    description: Reads which numbers have WhatsApp.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
      - {name: numbers, label: Numbers, required: true, description: "Like 5511999990000, 5521988880000"}
    request:
      method: POST
      path: "chat/whatsappNumbers/{{fields.instance}}"
      body: {numbers: {_each: "{{fields.numbers}}", _value: "{{item}}"}}

  - name: Mark as Read
    resource: Chat
    description: Marks messages as read.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
      - {name: remote_jid, label: Chat, required: true}
      - {name: message_id, label: Message ID, required: true}
    request:
      method: POST
      path: "chat/markMessageAsRead/{{fields.instance}}"
      body: {readMessages: [{remoteJid: "{{fields.remote_jid}}", fromMe: false, id: "{{fields.message_id}}"}]}

  - name: Find Messages
    resource: Chat
    description: Lists the stored messages of a chat.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
      - {name: remote_jid, label: Chat, required: true}
    request:
      method: POST
      path: "chat/findMessages/{{fields.instance}}"
      body: {where: {key: {remoteJid: "{{fields.remote_jid}}"}}}

  - name: Find Contacts
    resource: Chat
    description: Lists the instance's contacts.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
    request: {method: POST, path: "chat/findContacts/{{fields.instance}}", body: {}}

  - name: Get Profile Picture
    resource: Chat
    description: Reads the profile picture URL of a number.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
      - {name: number, label: To, required: true, description: "Number with country code, like 5511999990000, or a group ID ending in @g.us."}
    request:
      method: POST
      path: "chat/fetchProfilePictureUrl/{{fields.instance}}"
      body: {number: "{{fields.number}}"}

  # Groups
  - name: Create Group
    resource: Group
    description: Creates a group with some participants.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
      - {name: subject, label: Name, required: true}
      - {name: description, label: Description}
      - {name: participants, label: Participants, required: true, description: "Like 5511999990000, 5521988880000"}
    request:
      method: POST
      path: "group/create/{{fields.instance}}"
      body: {subject: "{{fields.subject}}", description: "{{fields.description}}", participants: {_each: "{{fields.participants}}", _value: "{{item}}"}}

  - name: List Groups
    resource: Group
    description: Lists the groups of the instance.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
      - {name: participants, label: With participants, type: boolean, default: false}
    request: {method: GET, path: "group/fetchAllGroups/{{fields.instance}}", query: {getParticipants: "{{fields.participants}}"}}

  - name: Update Participants
    resource: Group
    description: Adds, removes, promotes or demotes participants of a group.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
      - {name: group, label: Group ID, required: true, description: "Ends in @g.us."}
      - {name: action, label: Do, type: select, required: true, default: add, options: [{label: Add, value: add}, {label: Remove, value: remove}, {label: Make admin, value: promote}, {label: Remove admin, value: demote}]}
      - {name: participants, label: Participants, required: true}
    request:
      method: POST
      path: "group/updateParticipant/{{fields.instance}}"
      query: {groupJid: "{{fields.group}}"}
      body: {action: "{{fields.action}}", participants: {_each: "{{fields.participants}}", _value: "{{item}}"}}

  - name: Get Invite Link
    resource: Group
    description: Reads a group's invite link.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
      - {name: group, label: Group ID, required: true}
    request: {method: GET, path: "group/inviteCode/{{fields.instance}}", query: {groupJid: "{{fields.group}}"}}

  # Instances
  - name: Create Instance
    resource: Instance
    description: Creates an instance for a WhatsApp number; returns its QR code.
    fields:
      - {name: instance, label: Name, required: true}
      - {name: number, label: Number, description: "Like 5511999990000, for a pairing code."}
      - {name: integration, label: Kind, type: select, default: WHATSAPP-BAILEYS, options: [{label: WhatsApp Web (Baileys), value: WHATSAPP-BAILEYS}, {label: WhatsApp Cloud API, value: WHATSAPP-BUSINESS}]}
      - {name: extra, label: More settings, type: json, description: 'Like {"rejectCall": true, "groupsIgnore": true}'}
    request:
      method: POST
      path: instance/create
      body: {instanceName: "{{fields.instance}}", number: "{{fields.number}}", qrcode: true, integration: "{{fields.integration}}", _merge: "{{fields.extra}}"}

  - name: Connect Instance
    resource: Instance
    description: Returns the QR code, or pairing code, that connects an instance.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
    request: {method: GET, path: "instance/connect/{{fields.instance}}"}

  - name: Get Connection State
    resource: Instance
    description: Reads whether an instance is connected.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
    request: {method: GET, path: "instance/connectionState/{{fields.instance}}"}

  - name: List Instances
    resource: Instance
    description: Lists the instances on the server.
    request: {method: GET, path: instance/fetchInstances}

  - name: Logout Instance
    resource: Instance
    description: Disconnects the WhatsApp number of an instance.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
    request: {method: DELETE, path: "instance/logout/{{fields.instance}}"}

  - name: Delete Instance
    resource: Instance
    description: Deletes an instance.
    fields:
      - {name: instance, label: Instance, required: true, description: "The instance's name."}
    request: {method: DELETE, path: "instance/delete/{{fields.instance}}"}

i18n:
  pt-BR:
    description: "Mensagens, mídias, grupos e instâncias do WhatsApp por um servidor Evolution API."
    triggers:
      WhatsApp Event: {name: "Evento do WhatsApp", description: "Inicia o fluxo quando chega uma mensagem ou algo muda numa instância.", fields: {instance: "Instância", events: "Eventos", base64: "Mídia em base64"}}
    actions:
      Send Text: {name: "Enviar texto", description: "Envia uma mensagem de texto.", fields: {instance: "Instância", number: "Para", text: "Texto", link_preview: "Mostrar prévia de links", quoted: "Responder à mensagem", delay: "Digitando por (ms)"}}
      Send Media: {name: "Enviar mídia", description: "Envia uma imagem, vídeo ou documento, de uma URL.", fields: {instance: "Instância", number: "Para", mediatype: "Tipo", url: "URL", mimetype: "Tipo do arquivo", file_name: "Nome do arquivo", caption: "Legenda", delay: "Digitando por (ms)"}}
      Send Media File: {name: "Enviar arquivo", description: "Envia uma imagem, vídeo ou documento de um arquivo do fluxo.", fields: {instance: "Instância", number: "Para", mediatype: "Tipo", file: "Arquivo", caption: "Legenda"}}
      Send Audio: {name: "Enviar áudio", description: "Envia uma mensagem de voz de uma URL de áudio.", fields: {instance: "Instância", number: "Para", audio: "URL do áudio", delay: "Digitando por (ms)"}}
