# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Evolution API v2, the open-source WhatsApp API you run on your own server. Connect
# with the server's address and its global API key (AUTHENTICATION_API_KEY), or an
# instance's own key. Each WhatsApp number is an instance; connect it by reading the
# QR code from Connect Instance.
id: evolution_api
name: Evolution API
version: 1.0.0
description: WhatsApp messages, media, groups and instances through an Evolution API server.
icon: hero-chat-bubble-left-right
