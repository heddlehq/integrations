category: crm
author: Heddle
homepage: https://developers.pipe.run
base_url: https://api.pipe.run/v1/
headers:
  User-Agent: Heddle

credential:
  label: PipeRun
  fields:
    - {name: token, label: API token, secret: true, required: true, description: "From Minha conta › Integrações › Token API."}
  auth:
    type: header
    name: token
    value: "{{credential.token}}"

errors:
  message_path: message

triggers:
  - name: New Deal
    description: Starts the flow for each new deal, checking every 5 minutes.
    fields:
      - {name: pipeline_id, label: Pipeline ID, type: number, description: "Only deals of this pipeline. From List Pipelines."}
    request:
      method: GET
      path: deals
      query: {sort: DESC, show: 100, pipeline_id: "{{fields.pipeline_id}}"}
    output: {path: data}
    poll: {every: 5, id: id}

  - name: New Person
    description: Starts the flow for each new person, checking every 5 minutes.
    request:
      method: GET
      path: persons
      query: {sort: DESC, show: 100, with: "contactEmails,contactPhones"}
    output: {path: data}
    poll: {every: 5, id: id}

actions:
  # Deals
  - name: Create Deal
    resource: Deal
    description: Creates a deal in a stage of a pipeline.
    fields:
      - {name: title, label: Title, required: true}
      - {name: pipeline_id, label: Pipeline ID, type: number, required: true, description: "From List Pipelines."}
      - {name: stage_id, label: Stage ID, type: number, required: true, description: "From List Stages."}
      - {name: owner_id, label: Owner ID, type: number}
      - {name: person_id, label: Person ID, type: number}
      - {name: company_id, label: Company ID, type: number}
      - {name: origin_id, label: Origin ID, type: number, description: "From List Origins."}
      - {name: value, label: Value, type: number}
      - {name: value_mrr, label: Recurring value (MRR), type: number}
      - {name: probability, label: Probability, type: number, description: "0 to 90."}
      - name: temperature
        label: Temperature
        type: select
        options: [{label: Very hot, value: 1}, {label: Hot, value: 2}, {label: Warm, value: 3}, {label: Cold, value: 4}]
      - {name: probably_closed_at, label: Expected close, description: "Like 2026-01-31"}
      - {name: reference, label: Reference, description: "An ID from another system, like the lead's."}
      - {name: tags, label: Tag IDs, description: "Separated by commas."}
      - {name: custom_fields, label: Custom fields, type: json, description: 'Like [{"id": 12, "value": "Enterprise"}]'}
    request:
      method: POST
      path: deals
      body:
        title: "{{fields.title}}"
        pipeline_id: "{{fields.pipeline_id}}"
        stage_id: "{{fields.stage_id}}"
        owner_id: "{{fields.owner_id}}"
        person_id: "{{fields.person_id}}"
        company_id: "{{fields.company_id}}"
        origin_id: "{{fields.origin_id}}"
        value: "{{fields.value}}"
        value_mrr: "{{fields.value_mrr}}"
        probability: "{{fields.probability}}"
        temperature: "{{fields.temperature}}"
        probably_closed_at: "{{fields.probably_closed_at}}"
        reference: "{{fields.reference}}"
        tags: {_each: "{{fields.tags}}", id: "{{item}}"}
        custom_fields: "{{fields.custom_fields}}"
    output: {path: data}

  - name: Get Deal
    resource: Deal
    description: Reads a deal, with its items, people, companies and custom fields.
    fields:
      - {name: deal_id, label: Deal ID, required: true}
    request: {method: GET, path: "deals/{{fields.deal_id}}", query: {with: "items,persons,companies,customForms,users"}}
    output: {path: data}

  - name: Search Deals
    resource: Deal
    description: Lists deals by pipeline, stage, owner, status, title or dates.
    fields:
      - {name: pipeline_id, label: Pipeline ID, type: number}
      - {name: stage_id, label: Stage ID, type: number}
      - {name: owner_id, label: Owner ID, type: number}
      - {name: person_id, label: Person ID, type: number}
      - {name: company_id, label: Company ID, type: number}
      - name: status
        label: Status
        type: select
        options: [{label: Open, value: 0}, {label: Won, value: 1}, {label: Lost, value: 3}]
      - {name: title, label: Title}
      - {name: created_at_start, label: Created since, description: "Like 2026-01-31"}
      - {name: created_at_end, label: Created until}
      - {name: updated_at_start, label: Updated since}
      - {name: closed_at_start, label: Closed since}
      - {name: closed_at_end, label: Closed until}
      - {name: show, label: Per page, type: number, description: "Up to 200."}
      - {name: cursor, label: Page cursor, description: "From meta of the previous page."}
    request:
      method: GET
      path: deals
      query:
        sort: DESC
        pipeline_id: "{{fields.pipeline_id}}"
        stage_id: "{{fields.stage_id}}"
        owner_id: "{{fields.owner_id}}"
        person_id: "{{fields.person_id}}"
        company_id: "{{fields.company_id}}"
        status: "{{fields.status}}"
        title: "{{fields.title}}"
        created_at_start: "{{fields.created_at_start}}"
        created_at_end: "{{fields.created_at_end}}"
        updated_at_start: "{{fields.updated_at_start}}"
        closed_at_start: "{{fields.closed_at_start}}"
        closed_at_end: "{{fields.closed_at_end}}"
        show: "{{fields.show}}"
        cursor: "{{fields.cursor}}"
    output: {path: data}

  - name: Update Deal
    resource: Deal
    description: Changes a deal. Fields left empty stay as they are.
    fields:
      - {name: deal_id, label: Deal ID, required: true}
      - {name: title, label: Title}
      - {name: pipeline_id, label: Pipeline ID, type: number}
      - {name: stage_id, label: Stage ID, type: number}
      - {name: owner_id, label: Owner ID, type: number}
      - {name: person_id, label: Person ID, type: number}
      - {name: company_id, label: Company ID, type: number}
      - {name: value, label: Value, type: number}
      - {name: value_mrr, label: Recurring value (MRR), type: number}
      - {name: probability, label: Probability, type: number}
      - {name: probably_closed_at, label: Expected close, description: "Like 2026-01-31"}
      - {name: custom_fields, label: Custom fields, type: json, description: 'Like [{"id": 12, "value": "Enterprise"}]'}
    request:
      method: PUT
      path: "deals/{{fields.deal_id}}"
      body:
        title: "{{fields.title}}"
        pipeline_id: "{{fields.pipeline_id}}"
        stage_id: "{{fields.stage_id}}"
        owner_id: "{{fields.owner_id}}"
        person_id: "{{fields.person_id}}"
        company_id: "{{fields.company_id}}"
        value: "{{fields.value}}"
        value_mrr: "{{fields.value_mrr}}"
        probability: "{{fields.probability}}"
        probably_closed_at: "{{fields.probably_closed_at}}"
        custom_fields: "{{fields.custom_fields}}"
    output: {path: data}

  - name: Move Deal
    resource: Deal
    description: Moves a deal to another stage, of the same or another pipeline.
    fields:
      - {name: deal_id, label: Deal ID, required: true}
      - {name: stage_id, label: Stage ID, type: number, required: true}
      - {name: pipeline_id, label: Pipeline ID, type: number, description: "When the stage is in another pipeline."}
    request:
      method: PUT
      path: "deals/{{fields.deal_id}}"
      body: {stage_id: "{{fields.stage_id}}", pipeline_id: "{{fields.pipeline_id}}"}
    output: {path: data}

  - name: Win Deal
    resource: Deal
    description: Marks a deal as won.
    fields:
      - {name: deal_id, label: Deal ID, required: true}
      - {name: closed_at, label: Closed on, description: "Like 2026-01-31. Today when left empty."}
    request:
      method: PUT
      path: "deals/{{fields.deal_id}}"
      body: {status: 1, closed_at: "{{fields.closed_at}}"}
    output: {path: data}

  - name: Lose Deal
    resource: Deal
    description: Marks a deal as lost, with a reason.
    fields:
      - {name: deal_id, label: Deal ID, required: true}
      - {name: lost_reason_id, label: Lost reason ID, type: number, description: "From List Lost Reasons."}
      - {name: reason_close, label: Comment}
      - {name: closed_at, label: Closed on, description: "Like 2026-01-31. Today when left empty."}
    request:
      method: PUT
      path: "deals/{{fields.deal_id}}"
      body: {status: 3, lost_reason_id: "{{fields.lost_reason_id}}", reason_close: "{{fields.reason_close}}", closed_at: "{{fields.closed_at}}"}
    output: {path: data}

  - name: Delete Deal
    resource: Deal
    description: Deletes a deal.
    fields:
      - {name: deal_id, label: Deal ID, required: true}
    request: {method: DELETE, path: "deals/{{fields.deal_id}}"}

  - name: List Deal Items
    resource: Deal
    description: Lists the products and services of a deal.
    fields:
      - {name: deal_id, label: Deal ID, required: true}
    request: {method: GET, path: "deals/{{fields.deal_id}}/product"}
    output: {path: data}

  # People
  - name: Create Person
    resource: Person
    description: Creates a person, with emails and phones.
    fields:
      - {name: name, label: Name, required: true}
      - {name: emails, label: Emails, description: "Separated by commas."}
      - {name: phones, label: Phones, description: "Separated by commas."}
      - {name: company_id, label: Company ID, type: number}
      - {name: job_title, label: Job title}
      - {name: cpf, label: CPF}
      - {name: birth_day, label: Birthday, description: "Like 1990-05-20"}
      - {name: observation, label: Notes, type: textarea}
      - {name: tags, label: Tag IDs, description: "Separated by commas."}
      - {name: custom_fields, label: Custom fields, type: json, description: 'Like [{"id": 12, "value": "Diretor"}]'}
    request:
      method: POST
      path: persons
      body:
        name: "{{fields.name}}"
        contactEmails: {_each: "{{fields.emails}}", _value: "{{item}}"}
        contactPhones: {_each: "{{fields.phones}}", _value: "{{item}}"}
        company_id: "{{fields.company_id}}"
        job_title: "{{fields.job_title}}"
        cpf: "{{fields.cpf}}"
        birth_day: "{{fields.birth_day}}"
        observation: "{{fields.observation}}"
        tags: {_each: "{{fields.tags}}", id: "{{item}}"}
        custom_fields: "{{fields.custom_fields}}"
    output: {path: data}

  - name: Get Person
    resource: Person
    description: Reads a person, with emails and phones.
    fields:
      - {name: person_id, label: Person ID, required: true}
    request: {method: GET, path: "persons/{{fields.person_id}}", query: {with: "contactEmails,contactPhones"}}
    output: {path: data}

  - name: Search People
    resource: Person
    description: Lists people by name, CPF, company or dates.
    fields:
      - {name: name, label: Name}
      - {name: cpf, label: CPF}
      - {name: company_id, label: Company ID, type: number}
      - {name: external_code, label: External code}
      - {name: created_at_start, label: Created since, description: "Like 2026-01-31"}
      - {name: updated_at_start, label: Updated since}
      - {name: show, label: Per page, type: number, description: "Up to 200."}
      - {name: cursor, label: Page cursor}
    request:
      method: GET
      path: persons
      query: {sort: DESC, with: "contactEmails,contactPhones", name: "{{fields.name}}", cpf: "{{fields.cpf}}", company_id: "{{fields.company_id}}", external_code: "{{fields.external_code}}", created_at_start: "{{fields.created_at_start}}", updated_at_start: "{{fields.updated_at_start}}", show: "{{fields.show}}", cursor: "{{fields.cursor}}"}
    output: {path: data}

  - name: Update Person
    resource: Person
    description: Changes a person. Fields left empty stay as they are.
    fields:
      - {name: person_id, label: Person ID, required: true}
      - {name: name, label: Name}
      - {name: emails, label: Emails, description: "Separated by commas. Replace the ones there."}
      - {name: phones, label: Phones, description: "Separated by commas. Replace the ones there."}
      - {name: company_id, label: Company ID, type: number}
      - {name: job_title, label: Job title}
      - {name: observation, label: Notes, type: textarea}
      - {name: custom_fields, label: Custom fields, type: json, description: 'Like [{"id": 12, "value": "Diretor"}]'}
    request:
      method: PUT
      path: "persons/{{fields.person_id}}"
      body:
        name: "{{fields.name}}"
        contactEmails: {_each: "{{fields.emails}}", _value: "{{item}}"}
        contactPhones: {_each: "{{fields.phones}}", _value: "{{item}}"}
        company_id: "{{fields.company_id}}"
        job_title: "{{fields.job_title}}"
        observation: "{{fields.observation}}"
        custom_fields: "{{fields.custom_fields}}"
    output: {path: data}

  # Companies
  - name: Create Company
    resource: Company
    description: Creates a company.
    fields:
      - {name: name, label: Name, required: true}
      - {name: cnpj, label: CNPJ}
      - {name: company_name, label: Legal name}
      - {name: website, label: Website}
      - {name: emails, label: Emails, description: "Separated by commas."}
      - {name: phones, label: Phones, description: "Separated by commas."}
      - {name: address_postal_code, label: CEP}
      - {name: address, label: Street}
      - {name: address_number, label: Number}
      - {name: district, label: District}
      - {name: observation, label: Notes, type: textarea}
      - {name: custom_fields, label: Custom fields, type: json, description: 'Like [{"id": 12, "value": "Varejo"}]'}
    request:
      method: POST
      path: companies
      body:
        name: "{{fields.name}}"
        cnpj: "{{fields.cnpj}}"
        company_name: "{{fields.company_name}}"
        website: "{{fields.website}}"
        contactEmails: {_each: "{{fields.emails}}", _value: "{{item}}"}
        contactPhones: {_each: "{{fields.phones}}", _value: "{{item}}"}
        address_postal_code: "{{fields.address_postal_code}}"
        address: "{{fields.address}}"
        address_number: "{{fields.address_number}}"
        district: "{{fields.district}}"
        observation: "{{fields.observation}}"
        customFields: "{{fields.custom_fields}}"
    output: {path: data}

  - name: Get Company
    resource: Company
    description: Reads a company, with its people.
    fields:
      - {name: id, label: Company ID, required: true}
    request: {method: GET, path: "companies/{{fields.id}}", query: {with: "personsRelated.person"}}
    output: {path: data}

  - name: Search Companies
    resource: Company
    description: Lists companies by name, CNPJ or dates.
    fields:
      - {name: name, label: Name}
      - {name: cnpj, label: CNPJ}
      - {name: external_code, label: External code}
      - {name: created_at_start, label: Created since, description: "Like 2026-01-31"}
      - {name: updated_at_start, label: Updated since}
      - {name: show, label: Per page, type: number, description: "Up to 200."}
      - {name: cursor, label: Page cursor}
    request:
      method: GET
      path: companies
      query: {name: "{{fields.name}}", cnpj: "{{fields.cnpj}}", external_code: "{{fields.external_code}}", created_at_start: "{{fields.created_at_start}}", updated_at_start: "{{fields.updated_at_start}}", show: "{{fields.show}}", cursor: "{{fields.cursor}}"}
    output: {path: data}

  - name: Update Company
    resource: Company
    description: Changes a company. Fields left empty stay as they are.
    fields:
      - {name: id, label: Company ID, required: true}
      - {name: name, label: Name}
      - {name: cnpj, label: CNPJ}
      - {name: website, label: Website}
      - {name: observation, label: Notes, type: textarea}
      - {name: custom_fields, label: Custom fields, type: json, description: 'Like [{"id": 12, "value": "Varejo"}]'}
    request:
      method: PUT
      path: "companies/{{fields.id}}"
      body: {name: "{{fields.name}}", cnpj: "{{fields.cnpj}}", website: "{{fields.website}}", observation: "{{fields.observation}}", customFields: "{{fields.custom_fields}}"}
    output: {path: data}

  # Activities and notes
  - name: Create Activity
    resource: Activity
    description: Schedules an activity, like a call or a meeting, on a deal.
    fields:
      - {name: title, label: Title, required: true}
      - {name: activity_type_id, label: Activity type ID, type: number, required: true, description: "From List Activity Types."}
      - {name: owner_id, label: Owner ID, type: number, required: true}
      - {name: deal_id, label: Deal ID, type: number}
      - {name: start_at, label: Starts at, description: "Like 2026-01-31 09:00:00"}
      - {name: end_at, label: Ends at}
      - {name: duration, label: Duration in minutes, type: number}
      - {name: description, label: Description, type: textarea}
    request:
      method: POST
      path: activities
      body: {title: "{{fields.title}}", activity_type_id: "{{fields.activity_type_id}}", owner_id: "{{fields.owner_id}}", deal_id: "{{fields.deal_id}}", start_at: "{{fields.start_at}}", end_at: "{{fields.end_at}}", duration: "{{fields.duration}}", description: "{{fields.description}}", status: 0}
    output: {path: data}

  - name: Complete Activity
    resource: Activity
    description: Marks an activity as done, with a comment.
    fields:
      - {name: id, label: Activity ID, required: true}
      - {name: comment, label: Comment, type: textarea}
    request:
      method: PUT
      path: "activities/{{fields.id}}"
      body: {status: 2, comment: "{{fields.comment}}"}
    output: {path: data}

  - name: Search Activities
    resource: Activity
    description: Lists activities by deal, owner, type or status.
    fields:
      - {name: deal_id, label: Deal ID, type: number}
      - {name: owner_id, label: Owner ID, type: number}
      - {name: activity_type_id, label: Activity type ID, type: number}
      - name: status
        label: Status
        type: select
        options: [{label: Open, value: 0}, {label: Done, value: 2}, {label: No-show, value: 4}]
      - {name: start_at_start, label: Starting since, description: "Like 2026-01-31"}
      - {name: start_at_end, label: Starting until}
      - {name: show, label: Per page, type: number, description: "Up to 200."}
      - {name: cursor, label: Page cursor}
    request:
      method: GET
      path: activities
      query: {deal_id: "{{fields.deal_id}}", owner_id: "{{fields.owner_id}}", activity_type_id: "{{fields.activity_type_id}}", status: "{{fields.status}}", start_at_start: "{{fields.start_at_start}}", start_at_end: "{{fields.start_at_end}}", show: "{{fields.show}}", cursor: "{{fields.cursor}}"}
    output: {path: data}

  - name: Create Note
    resource: Note
    description: Adds a note to a deal, a person or a company.
    fields:
      - {name: text, label: Text, type: textarea, required: true}
      - {name: deal_id, label: Deal ID, type: number}
      - {name: person_id, label: Person ID, type: number}
      - {name: company_id, label: Company ID, type: number}
    request:
      method: POST
      path: notes
      body: {text: "{{fields.text}}", deal_id: "{{fields.deal_id}}", person_id: "{{fields.person_id}}", company_id: "{{fields.company_id}}"}
    output: {path: data}

  - name: List Notes
    resource: Note
    description: Lists the notes of a deal, a person or a company.
    fields:
      - {name: deal_id, label: Deal ID, type: number}
      - {name: person_id, label: Person ID, type: number}
      - {name: company_id, label: Company ID, type: number}
    request:
      method: GET
      path: notes
      query: {deal_id: "{{fields.deal_id}}", person_id: "{{fields.person_id}}", company_id: "{{fields.company_id}}"}
    output: {path: data}

  # Settings
  - name: List Pipelines
    resource: Settings
    description: Lists the pipelines.
    request: {method: GET, path: pipelines, query: {show: 200}}
    output: {path: data}

  - name: List Stages
    resource: Settings
    description: Lists the stages, of every pipeline or of one.
    fields:
      - {name: pipeline_id, label: Pipeline ID, type: number}
    request: {method: GET, path: stages, query: {show: 200, pipeline_id: "{{fields.pipeline_id}}"}}
    output: {path: data}

  - name: List Origins
    resource: Settings
    description: Lists the origins of deals.
    request: {method: GET, path: origins, query: {show: 200}}
    output: {path: data}

  - name: List Lost Reasons
    resource: Settings
    description: Lists the reasons to lose a deal.
    request: {method: GET, path: lostReasons, query: {show: 200}}
    output: {path: data}

  - name: List Tags
    resource: Settings
    description: Lists the tags, of deals, people or companies.
    fields:
      - name: belongs
        label: Used on
        type: select
        options: [{label: Deals, value: 1}, {label: People, value: 2}, {label: Companies, value: 3}]
    request: {method: GET, path: tags, query: {show: 200, belongs: "{{fields.belongs}}"}}
    output: {path: data}

  - name: List Activity Types
    resource: Settings
    description: Lists the types of activity.
    request: {method: GET, path: activityTypes, query: {show: 200}}
    output: {path: data}

  - name: List Users
    resource: Settings
    description: Lists the account's users, to use as owners.
    request: {method: GET, path: users, query: {show: 200}}
    output: {path: data}

