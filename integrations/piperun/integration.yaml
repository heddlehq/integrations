      Update Deal: {name: "Alterar oportunidade", description: "Altera uma oportunidade. Campos vazios ficam como estão.", fields: {deal_id: "ID da oportunidade", title: "Título", pipeline_id: "ID do funil", stage_id: "ID da etapa", owner_id: "ID do dono", person_id: "ID da pessoa", company_id: "ID da empresa", value: "Valor", value_mrr: "Valor recorrente (MRR)", probability: "Probabilidade", probably_closed_at: "Previsão de fechamento", custom_fields: "Campos customizados"}}
      Move Deal: {name: "Mover oportunidade", description: "Move uma oportunidade para outra etapa, do mesmo funil ou de outro.", fields: {deal_id: "ID da oportunidade", stage_id: "ID da etapa", pipeline_id: "ID do funil"}}
