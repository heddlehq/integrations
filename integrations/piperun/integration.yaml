      New Deal: {name: "Nova oportunidade", description: "Inicia o fluxo para cada nova oportunidade, verificando a cada 5 minutos.", fields: {pipeline_id: "ID do funil"}}
      New Person: {name: "Nova pessoa", description: "Inicia o fluxo para cada nova pessoa, verificando a cada 5 minutos."}
    actions:
      Create Deal: {name: "Criar oportunidade", description: "Cria uma oportunidade numa etapa de um funil.", fields: {title: "Título", pipeline_id: "ID do funil", stage_id: "ID da etapa", owner_id: "ID do dono", person_id: "ID da pessoa", company_id: "ID da empresa", origin_id: "ID da origem", value: "Valor", value_mrr: "Valor recorrente (MRR)", probability: "Probabilidade", temperature: "Temperatura", probably_closed_at: "Previsão de fechamento", reference: "Referência", tags: "IDs das tags", custom_fields: "Campos customizados"}}
