# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Notion's API, through a public integration: a system admin creates it at
# https://www.notion.so/profile/integrations and gives Heddle its client ID and secret.
id: notion
name: Notion
version: 1.0.0
description: Search, create and read pages and databases in Notion.
icon: hero-document-text
logo: |
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#fff"/><path fill="#000000" transform="translate(3.6 3.6) scale(0.7)" d="M4.459 4.208c.746.606 1.026.56 2.428.466l13.215-.793c.28 0 .047-.28-.046-.326L17.86 1.968c-.42-.326-.981-.7-2.055-.607L3.01 2.295c-.466.046-.56.28-.374.466zm.793 3.08v13.904c0 .747.373 1.027 1.214.98l14.523-.84c.841-.046.935-.56.935-1.167V6.354c0-.606-.233-.933-.748-.887l-15.177.887c-.56.047-.747.327-.747.933zm14.337.745c.093.42 0 .84-.42.888l-.7.14v10.264c-.608.327-1.168.514-1.635.514-.748 0-.935-.234-1.495-.933l-4.577-7.186v6.952L12.21 19s0 .84-1.168.84l-3.222.186c-.093-.186 0-.653.327-.746l.84-.233V9.854L7.822 9.76c-.094-.42.14-1.026.793-1.073l3.456-.233 4.764 7.279v-6.44l-1.215-.139c-.093-.514.28-.887.747-.933zM1.936 1.035l13.31-.98c1.634-.14 2.055-.047 3.082.7l4.249 2.986c.7.513.934.653.934 1.213v16.378c0 1.026-.373 1.634-1.68 1.726l-15.458.934c-.98.047-1.448-.093-1.962-.747l-3.129-4.06c-.56-.747-.793-1.306-.793-1.96V2.667c0-.839.374-1.54 1.447-1.632z"/></svg>
base_url: https://api.notion.com/v1/

credential:
  label: Notion
  auth:
    type: oauth2
    authorize_url: https://api.notion.com/v1/oauth/authorize
    token_url: https://api.notion.com/v1/oauth/token
    token_auth: basic
    token_body: json
    authorize_params:
      owner: user

errors:
  message_path: message

triggers:
  - name: New Database Row
    description: Starts the flow for each new row of a database, checking every 5 minutes.
    fields:
      - {name: database_id, label: Database ID}
    request:
      method: POST
      path: "databases/{{fields.database_id}}/query"
      headers:
        Notion-Version: "2022-06-28"
      body:
        sorts:
          - timestamp: created_time
            direction: descending
        page_size: 50
    output:
      path: results
      pick: [id, url, created_time, properties]
    poll:
      every: 5
      id: id

actions:
  - name: Search
    description: Finds the pages and databases shared with the integration, by title.
    fields:
      - {name: query, label: Text in the title}
      - name: object
        label: Find
        type: select
        default: page
        options:
          - {label: Pages, value: page}
          - {label: Databases, value: database}
    request:
      method: POST
      path: search
      headers:
        Notion-Version: "2022-06-28"
      body:
        query: "{{fields.query}}"
        filter:
          property: object
          value: "{{fields.object}}"
        page_size: 100
    output:
      path: results
      pick: [id, object, url, properties, title]

  - name: Query Database
    description: Returns the rows of a database.
    fields:
      - {name: database_id, label: Database ID}
    request:
      method: POST
      path: "databases/{{fields.database_id}}/query"
      headers:
        Notion-Version: "2022-06-28"
      body:
        page_size: 100
    output:
      path: results
      pick: [id, url, properties]

  - name: Create Page
    description: Creates a page inside another page, with a title and a first paragraph.
    fields:
      - {name: parent_id, label: Parent page ID}
      - {name: title, label: Title}
      - {name: text, label: Text, type: textarea}
    request:
      method: POST
      path: pages
      headers:
        Notion-Version: "2022-06-28"
      body:
        parent:
          page_id: "{{fields.parent_id}}"
        properties:
          title:
            - text:
                content: "{{fields.title}}"
        children:
          - object: block
            type: paragraph
            paragraph:
              rich_text:
                - type: text
                  text:
                    content: "{{fields.text}}"
    output:
      pick: [id, url]

  - name: Append Text
    description: Adds a paragraph to the end of a page.
    fields:
      - {name: page_id, label: Page ID, default: "{{result.id}}"}
      - {name: text, label: Text, type: textarea}
    request:
      method: PATCH
      path: "blocks/{{fields.page_id}}/children"
      headers:
        Notion-Version: "2022-06-28"
      body:
        children:
          - object: block
            type: paragraph
            paragraph:
              rich_text:
                - type: text
                  text:
                    content: "{{fields.text}}"
    output:
      value:
        page_id: "{{fields.page_id}}"
