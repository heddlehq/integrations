    actions:
      List Rows: {name: "Listar linhas", description: "Lista as linhas de uma tabela que atendem aos filtros.", fields: {table: "Tabela", filters: "Filtros", select: "Colunas", order: "Ordem", limit: "Limite", offset: "Pular"}}
      Get Row: {name: "Ler linha", description: "Lê a primeira linha que atende aos filtros.", fields: {table: "Tabela", filters: "Filtros", select: "Colunas"}}
