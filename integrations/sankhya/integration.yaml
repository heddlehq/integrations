 19.461C50.6658 19.461 48.8203 18.6351 48.8203 16.377C48.8203 13.5722 50.2538 12.9661 53.0981 12.8829C54.6896 12.8354 55.4628 12.9245 57.1728 13.085V12.3006C57.1728 11.2666 56.3262 10.6665 53.5609 10.6665C52.562 10.6665 51.3712 10.7378 49.9434 10.922C49.7966 10.9398 49.6668 10.821 49.6668 10.6724V9.73353C49.6668 9.09177 50.124 8.54508 50.7335 8.46783C52.0428 8.30144 53.2279 8.25391 54.4244 8.25391C58.0757 8.25391 59.9832 9.14525 59.9832 11.6648V18.0408C59.9832 18.748 59.4415 19.3184 58.7755 19.3184H57.6863C57.5622 19.3184 57.4606 19.2233 57.4437 19.0926L57.2913 17.7259H57.2856ZM57.1671 14.9746C56.2416 14.8498 55.1806 14.7488 54.4187 14.7488C52.6523 14.7488 51.6477 14.9152 51.6477 16.0323C51.6477 17.0663 52.7877 17.2089 54.1648 17.2089C55.7393 17.2089 56.5802 16.8761 57.1728 16.0502V14.9746H57.1671Z" fill="#2E3C50"/> </g> <defs> <clipPath id="clip0_6519_11716"> <rect width="124" height="28" fill="white"/> </clipPath> </defs></svg></svg>
category: erp
base_url: "https://{{credential.host}}/"
headers:
  User-Agent: Heddle/1.0

credential:
  label: Sankhya
  fields:
    - {name: client_id, label: Client ID, required: true}
    - {name: client_secret, label: Client secret, secret: true, required: true}
    - {name: x_token, label: Integration token, secret: true, required: true, description: The X-Token generated in SankhyaOm.}
    - name: host
      label: Environment
      type: select
      default: api.sankhya.com.br
      options:
        - {label: Production, value: api.sankhya.com.br}
        - {label: Sandbox, value: api.sandbox.sankhya.com.br}
  auth:
    type: login
    request:
      method: POST
      path: authenticate
      headers: {X-Token: "{{credential.x_token}}"}
      body_type: form
      body: {client_id: "{{credential.client_id}}", client_secret: "{{credential.client_secret}}", grant_type: client_credentials}
    token_path: access_token
    expires_path: expires_in

errors:
  message_path: error.message

triggers:
  - name: New Client
    description: Starts the flow for each new client, checking every 5 minutes.
    request:
      method: GET
      path: v1/parceiros/clientes
      query: {page: 1, sort_by: codigoCliente, sort_order: DESC}
    output: {path: clientes}
    poll: {every: 5, id: codigoCliente}

actions:
  # Clients
  - name: List Clients
    resource: Client
    description: Lists clients, or those changed since a moment.
    fields:
      - {name: changed_since, label: Changed since, description: "Like 31/01/2026 08:00"}
      - {name: page, label: Page, type: number, default: 1}
    request:
      method: GET
      path: v1/parceiros/clientes
      query: {page: "{{fields.page}}", dataHoraAlteracao: "{{fields.changed_since}}", sort_by: codigoCliente, sort_order: ASC}
    output: {path: clientes}

  - name: Create Client
    resource: Client
    description: Creates a client, a person or a company, with its address.
    fields:
      - {name: tipo, label: Kind, type: select, required: true, default: PF, options: [{label: Person, value: PF}, {label: Company, value: PJ}]}
      - {name: cnpj_cpf, label: CPF or CNPJ, required: true}
      - {name: nome, label: Name, required: true, description: The trade name for a company.}
      - {name: razao, label: Legal name}
      - {name: ie_rg, label: State registration or RG}
      - {name: email, label: Email}
      - {name: ddd, label: Area code}
      - {name: telefone, label: Phone}
      - {name: cep, label: CEP, required: true}
      - {name: logradouro, label: Street, required: true}
      - {name: numero, label: Number, required: true}
      - {name: complemento, label: Complement}
      - {name: bairro, label: District, required: true}
      - {name: cidade, label: City, required: true}
      - {name: uf, label: State, required: true}
      - {name: codigo_ibge, label: IBGE city code, required: true}
      - {name: extra, label: More attributes, type: json, description: "Like {\"limiteCredito\": 1000, \"camposAdicionais\": {\"AD_CANAL\": \"site\"}}"}
    request:
      method: POST
      path: v1/parceiros/clientes
      body:
        tipo: "{{fields.tipo}}"
        cnpjCpf: "{{fields.cnpj_cpf}}"
        nome: "{{fields.nome}}"
        razao: "{{fields.razao}}"
        ieRg: "{{fields.ie_rg}}"
        email: "{{fields.email}}"
        telefoneDdd: "{{fields.ddd}}"
        telefoneNumero: "{{fields.telefone}}"
        endereco: {cep: "{{fields.cep}}", logradouro: "{{fields.logradouro}}", numero: "{{fields.numero}}", complemento: "{{fields.complemento}}", bairro: "{{fields.bairro}}", cidade: "{{fields.cidade}}", uf: "{{fields.uf}}", codigoIbge: "{{fields.codigo_ibge}}"}
        _merge: "{{fields.extra}}"

  - name: Update Client
    resource: Client
    description: Changes a client. Send the attributes to change.
    fields:
      - {name: codigo_cliente, label: Client code, required: true}
      - {name: cliente, label: Attributes, type: json, required: true, description: "Like {\"email\": \"ana@example.com\"}"}
    request: {method: PUT, path: "v1/parceiros/clientes/{{fields.codigo_cliente}}", body: "{{fields.cliente}}"}

  - name: Add Client Contact
    resource: Client
    description: Adds a contact, with its address, to a client.
    fields:
      - {name: codigo_cliente, label: Client code, required: true}
      - {name: nome, label: Name, required: true}
      - {name: email, label: Email}
      - {name: ddd, label: Area code}
      - {name: telefone, label: Phone}
      - {name: cep, label: CEP, required: true}
      - {name: logradouro, label: Street, required: true}
      - {name: numero, label: Number, required: true}
      - {name: complemento, label: Complement}
      - {name: bairro, label: District, required: true}
      - {name: cidade, label: City, required: true}
      - {name: uf, label: State, required: true}
      - {name: codigo_ibge, label: IBGE city code, required: true}
    request:
      method: POST
      path: "v1/parceiros/clientes/{{fields.codigo_cliente}}/contatos"
      body: {nome: "{{fields.nome}}", email: "{{fields.email}}", telefoneDdd: "{{fields.ddd}}", telefoneNumero: "{{fields.telefone}}", cep: "{{fields.cep}}", logradouro: "{{fields.logradouro}}", numero: "{{fields.numero}}", complemento: "{{fields.complemento}}", bairro: "{{fields.bairro}}", cidade: "{{fields.cidade}}", uf: "{{fields.uf}}", codigoIbge: "{{fields.codigo_ibge}}"}

  # Products
  - name: List Products
    resource: Product
    description: Lists products, or those changed since a moment.
    fields:
      - {name: changed_since, label: Changed since, description: "Like 31/01/2026 08:00"}
      - {name: page, label: Page, type: number, default: 1}
    request: {method: GET, path: v1/produtos, query: {page: "{{fields.page}}", modifiedSince: "{{fields.changed_since}}"}}
    output: {path: produtos}

  - name: Get Product
    resource: Product
    description: Reads a product.
    fields:
      - {name: codigo_produto, label: Product code, required: true}
    request: {method: GET, path: "v1/produtos/{{fields.codigo_produto}}"}

  - name: Get Product Stock
    resource: Product
    description: Reads a product's stock in each place.
    fields:
      - {name: codigo_produto, label: Product code, required: true}
    request: {method: GET, path: "v1/estoque/produtos/{{fields.codigo_produto}}"}

  - name: List Stock
    resource: Product
    description: Lists the stock of the products, 50 at a time.
    fields:
      - {name: page, label: Page, type: number, default: 1}
    request: {method: GET, path: v1/estoque/produtos, query: {page: "{{fields.page}}"}}
    output: {path: estoque}

  - name: Get Product Prices
    resource: Product
    description: Lists a product's prices in every price table.
    fields:
      - {name: codigo_produto, label: Product code, required: true}
      - {name: page, label: Page, type: number, default: 1}
    request: {method: GET, path: "v1/precos/produto/{{fields.codigo_produto}}", query: {pagina: "{{fields.page}}"}}

  # Orders
  - name: List Orders
    resource: Order
    description: Lists a company's sales orders, by client or negotiation date, or changed since a moment.
    fields:
      - {name: codigo_empresa, label: Company code, required: true, description: From List Companies.}
      - {name: codigo_cliente, label: Client code}
      - {name: inicio, label: Negotiated from, description: "Like 01/01/2026"}
      - {name: fim, label: Negotiated until, description: "Like 31/01/2026"}
      - {name: changed_since, label: Changed since, description: "Like 31/01/2026 08:00"}
      - {name: page, label: Page, type: number, default: 1}
    request:
      method: GET
      path: v1/vendas/pedidos
      query: {codigoEmpresa: "{{fields.codigo_empresa}}", codigoCliente: "{{fields.codigo_cliente}}", dataNegociacaoInicio: "{{fields.inicio}}", dataNegociacaoFinal: "{{fields.fim}}", modifiedSince: "{{fields.changed_since}}", page: "{{fields.page}}"}
    output: {path: registros}

  - name: Get Order
    resource: Order
    description: Reads a sales order with its items and payments.
    fields:
      - {name: codigo_pedido, label: Order code, required: true}
    request: {method: GET, path: "v1/vendas/pedidos/{{fields.codigo_pedido}}"}

  - name: Create Order
    resource: Order
    description: Creates a sales order with its items and payments.
    fields:
      - {name: nota_modelo, label: Model note, type: number, required: true, description: The NUNOTA of the order used as a model in SankhyaOm.}
      - {name: codigo_cliente, label: Client code, type: number, required: true}
      - {name: codigo_vendedor, label: Seller code, type: number}
      - {name: data, label: Date, required: true, description: "Like 31/01/2026"}
      - {name: hora, label: Time, required: true, description: "Like 14:30"}
      - {name: valor_total, label: Total, type: number, required: true}
      - {name: valor_frete, label: Shipping, type: number}
      - {name: observacao, label: Notes, type: textarea}
      - {name: itens, label: Items, type: json, required: true, description: "Like [{\"sequencia\": 1, \"codigoProduto\": 10, \"quantidade\": 2, \"valorUnitario\": 50, \"controle\": \" \", \"codigoLocalEstoque\": 1}]"}
      - {name: financeiros, label: Payments, type: json, required: true, description: "Like [{\"sequencia\": 1, \"tipoPagamento\": 1, \"valorParcela\": 100, \"dataVencimento\": \"31/01/2026\"}]"}
    request:
      method: POST
      path: v1/vendas/pedidos
      body: {notaModelo: "{{fields.nota_modelo}}", codigoCliente: "{{fields.codigo_cliente}}", codigoVendedor: "{{fields.codigo_vendedor}}", data: "{{fields.data}}", hora: "{{fields.hora}}", valorTotal: "{{fields.valor_total}}", valorFrete: "{{fields.valor_frete}}", observacao: "{{fields.observacao}}", itens: "{{fields.itens}}", financeiros: "{{fields.financeiros}}"}

  - name: Cancel Order
    resource: Order
    description: Cancels a sales order.
    fields:
      - {name: codigo_pedido, label: Order code, required: true}
      - {name: motivo, label: Reason}
    request: {method: POST, path: "v1/vendas/pedidos/{{fields.codigo_pedido}}/cancela", body: {motivo: "{{fields.motivo}}"}}

  - name: List Invoices
    resource: Order
    description: Lists NF-e invoices, by company, client or negotiation date, or changed since a moment.
    fields:
      - {name: codigo_empresa, label: Company code}
      - {name: codigo_cliente, label: Client code}
      - {name: inicio, label: Negotiated from, description: "Like 01/01/2026"}
      - {name: fim, label: Negotiated until, description: "Like 31/01/2026"}
      - {name: changed_since, label: Changed since, description: "Like 31/01/2026 08:00"}
      - {name: page, label: Page, type: number, default: 1}
    request:
      method: GET
      path: v1/vendas/nfe
      query: {codigoEmpresa: "{{fields.codigo_empresa}}", codigoCliente: "{{fields.codigo_cliente}}", dataNegociacaoInicio: "{{fields.inicio}}", dataNegociacaoFinal: "{{fields.fim}}", modifiedSince: "{{fields.changed_since}}", page: "{{fields.page}}"}
    output: {path: registros}

  # Finance
  - name: List Receivables
    resource: Finance
    description: Lists receivables, by company, partner, status or due date.
    fields:
      - {name: codigo_empresa, label: Company code}
      - {name: codigo_parceiro, label: Partner code}
      - {name: status, label: Status, type: select, default: "1", options: [{label: Open, value: "1"}, {label: Settled, value: "2"}, {label: All, value: "3"}]}
      - {name: vencimento_inicio, label: Due from, description: "Like 2026-01-01"}
      - {name: vencimento_fim, label: Due until, description: "Like 2026-01-31"}
      - {name: page, label: Page, type: number, default: 1}
    request:
      method: GET
      path: v1/financeiros/receitas
      query: {codigoEmpresa: "{{fields.codigo_empresa}}", codigoParceiro: "{{fields.codigo_parceiro}}", statusFinanceiro: "{{fields.status}}", dataVencimentoInicio: "{{fields.vencimento_inicio}}", dataVencimentoFinal: "{{fields.vencimento_fim}}", page: "{{fields.page}}"}
    output: {path: financeiros}

  - name: List Payables
    resource: Finance
    description: Lists payables, by company, partner, status or due date.
    fields:
      - {name: codigo_empresa, label: Company code}
      - {name: codigo_parceiro, label: Partner code}
      - {name: status, label: Status, type: select, default: "1", options: [{label: Open, value: "1"}, {label: Settled, value: "2"}, {label: All, value: "3"}]}
      - {name: vencimento_inicio, label: Due from, description: "Like 2026-01-01"}
      - {name: vencimento_fim, label: Due until, description: "Like 2026-01-31"}
      - {name: page, label: Page, type: number, default: 1}
    request:
      method: GET
      path: v1/financeiros/despesas
      query: {codigoEmpresa: "{{fields.codigo_empresa}}", codigoParceiro: "{{fields.codigo_parceiro}}", statusFinanceiro: "{{fields.status}}", dataVencimentoInicio: "{{fields.vencimento_inicio}}", dataVencimentoFinal: "{{fields.vencimento_fim}}", page: "{{fields.page}}"}
    output: {path: financeiros}

  - name: Create Receivable
    resource: Finance
    description: Registers a receivable installment.
    fields:
      - {name: codigo_empresa, label: Company code, type: number, required: true}
      - {name: codigo_parceiro, label: Partner code, type: number, required: true}
      - {name: codigo_tipo_operacao, label: Operation type code, type: number, required: true}
      - {name: codigo_natureza, label: Nature code, type: number, required: true}
      - {name: codigo_centro_resultado, label: Cost center code, type: number, required: true}
      - {name: codigo_banco, label: Bank code, type: number, required: true}
      - {name: codigo_conta_bancaria, label: Bank account code, type: number, required: true}
      - {name: codigo_tipo_pagamento, label: Payment type code, type: number, required: true}
      - {name: numero_nota, label: Document number, type: number, required: true}
      - {name: data_negociacao, label: Negotiated on, required: true, description: "Like 2026-01-31"}
      - {name: data_vencimento, label: Due on, required: true, description: "Like 2026-01-31"}
      - {name: numero_parcela, label: Installment, type: number, default: 1, required: true}
      - {name: valor_parcela, label: Amount, type: number, required: true}
    request:
      method: POST
      path: v1/financeiros/receitas
      body: {codigoEmpresa: "{{fields.codigo_empresa}}", codigoParceiro: "{{fields.codigo_parceiro}}", codigoTipoOperacao: "{{fields.codigo_tipo_operacao}}", codigoNatureza: "{{fields.codigo_natureza}}", codigoCentroResultado: "{{fields.codigo_centro_resultado}}", codigoBanco: "{{fields.codigo_banco}}", codigoContaBancaria: "{{fields.codigo_conta_bancaria}}", codigoTipoPagamento: "{{fields.codigo_tipo_pagamento}}", numeroNota: "{{fields.numero_nota}}", dataNegociacao: "{{fields.data_negociacao}}", dataVencimento: "{{fields.data_vencimento}}", numeroParcela: "{{fields.numero_parcela}}", valorParcela: "{{fields.valor_parcela}}"}

  - name: Create Payable
    resource: Finance
    description: Registers a payable installment.
    fields:
      - {name: codigo_empresa, label: Company code, type: number, required: true}
      - {name: codigo_parceiro, label: Partner code, type: number, required: true}
      - {name: codigo_tipo_operacao, label: Operation type code, type: number, required: true}
      - {name: codigo_natureza, label: Nature code, type: number, required: true}
      - {name: codigo_centro_resultado, label: Cost center code, type: number, required: true}
      - {name: codigo_banco, label: Bank code, type: number, required: true}
      - {name: codigo_conta_bancaria, label: Bank account code, type: number, required: true}
      - {name: codigo_tipo_pagamento, label: Payment type code, type: number, required: true}
      - {name: numero_nota, label: Document number, type: number, required: true}
      - {name: data_negociacao, label: Negotiated on, required: true, description: "Like 2026-01-31"}
      - {name: data_vencimento, label: Due on, required: true, description: "Like 2026-01-31"}
      - {name: numero_parcela, label: Installment, type: number, default: 1, required: true}
      - {name: valor_parcela, label: Amount, type: number, required: true}
    request:
      method: POST
      path: v1/financeiros/despesas
      body: {codigoEmpresa: "{{fields.codigo_empresa}}", codigoParceiro: "{{fields.codigo_parceiro}}", codigoTipoOperacao: "{{fields.codigo_tipo_operacao}}", codigoNatureza: "{{fields.codigo_natureza}}", codigoCentroResultado: "{{fields.codigo_centro_resultado}}", codigoBanco: "{{fields.codigo_banco}}", codigoContaBancaria: "{{fields.codigo_conta_bancaria}}", codigoTipoPagamento: "{{fields.codigo_tipo_pagamento}}", numeroNota: "{{fields.numero_nota}}", dataNegociacao: "{{fields.data_negociacao}}", dataVencimento: "{{fields.data_vencimento}}", numeroParcela: "{{fields.numero_parcela}}", valorParcela: "{{fields.valor_parcela}}"}

  - name: Settle Receivable
    resource: Finance
    description: Marks a receivable as received.
    fields:
      - {name: codigo_financeiro, label: Receivable code, required: true}
      - {name: data_baixa, label: Received on, required: true, description: "Like 2026-01-31"}
      - {name: valor_baixa, label: Amount received, type: number}
      - {name: codigo_conta_bancaria, label: Bank account code, type: number}
      - {name: observacao, label: Notes}
    request:
      method: POST
      path: "v1/financeiros/receitas/{{fields.codigo_financeiro}}/baixa"
      body: {dataBaixa: "{{fields.data_baixa}}", valorBaixa: "{{fields.valor_baixa}}", codigoContaBancaria: "{{fields.codigo_conta_bancaria}}", observacao: "{{fields.observacao}}"}

  - name: Settle Payable
    resource: Finance
    description: Marks a payable as paid.
    fields:
      - {name: codigo_financeiro, label: Payable code, required: true}
      - {name: data_baixa, label: Paid on, required: true, description: "Like 2026-01-31"}
      - {name: valor_baixa, label: Amount paid, type: number}
      - {name: codigo_conta_bancaria, label: Bank account code, type: number}
      - {name: observacao, label: Notes}
    request:
      method: POST
      path: "v1/financeiros/despesas/{{fields.codigo_financeiro}}/baixa"
      body: {dataBaixa: "{{fields.data_baixa}}", valorBaixa: "{{fields.valor_baixa}}", codigoContaBancaria: "{{fields.codigo_conta_bancaria}}", observacao: "{{fields.observacao}}"}

  # Lookups
  - name: List Sellers
    resource: Lookup
    description: Lists the sellers.
    fields:
      - {name: page, label: Page, type: number, default: 0, description: Starts at 0.}
    request: {method: GET, path: v1/vendedores, query: {page: "{{fields.page}}"}}
    output: {path: vendedores}

  - name: List Companies
    resource: Lookup
    description: Lists the companies.
    fields:
      - {name: page, label: Page, type: number, default: 0, description: Starts at 0.}
    request: {method: GET, path: v1/empresas, query: {page: "{{fields.page}}"}}
    output: {path: empresas}

  - name: List Operation Types
    resource: Lookup
    description: Lists the operation types (TOPs).
    fields:
      - {name: page, label: Page, type: number, default: 1}
    request: {method: GET, path: v1/tipos-operacao, query: {page: "{{fields.page}}"}}

  - name: List Payment Types
    resource: Lookup
    description: Lists the payment types.
    fields:
      - {name: page, label: Page, type: number, default: 1}
    request: {method: GET, path: v1/financeiros/tipos-pagamento, query: {page: "{{fields.page}}"}}

