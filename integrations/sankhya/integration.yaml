# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Sankhya, the ERP, through its API Gateway. Create an app in Sankhya's Developer Area
# for the client ID and secret, and generate the integration token (X-Token) in
# SankhyaOm. POST /authenticate trades them for a short-lived bearer token. Lists take
# page (from 1, some from 0) and answer up to 50 records; dates in filters go as
# dd/mm/aaaa, and in bodies as aaaa-mm-dd.
id: sankhya
name: Sankhya
version: 1.0.0
homepage: https://developer.sankhya.com.br/reference
description: Manage clients and their contacts, read products, stock and prices, create, read and cancel sales orders, register and settle receivables and payables, and list invoices, sellers and companies, in Sankhya.
icon: hero-building-office
logo: |-
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#FFFFFF"/><svg x="3.00" y="9.97" width="18.00" height="4.06" viewBox="0 0 124 28"><g clip-path="url(#clip0_6519_11716)"> <path d="M4.6832 21.5593L9.60438 16.3777C10.0671 15.8904 10.3268 15.2308 10.3268 14.5356V10.4592C10.3268 8.56357 11.0435 6.74523 12.3189 5.40228L14.2829 3.32843C14.4578 3.15016 14.2998 2.84116 14.0628 2.8887C13.4646 3.0016 12.8663 3.14422 12.2625 3.3106C4.12449 5.61026 -1.25381 12.2537 0.25302 18.1603C0.574702 19.432 1.19549 20.567 2.04767 21.5356C2.74747 22.3378 3.95519 22.3318 4.68885 21.5593" fill="#66CB66"/> <path d="M25.2771 6.44787L21.4 10.5302C20.9372 11.0175 20.6776 11.6771 20.6776 12.3664V16.4428C20.6776 18.3384 19.9609 20.1567 18.6911 21.4997L15.6774 24.6669C15.5081 24.8511 15.6605 25.1542 15.8975 25.1066C16.4957 24.9937 17.0939 24.8511 17.6978 24.6847C25.8358 22.391 31.2141 15.7416 29.7073 9.84091C29.3856 8.56926 28.7648 7.43429 27.9126 6.4657C27.2128 5.66349 26.0051 5.66943 25.2714 6.44193" fill="#66CB66"/> <path d="M21.0955 0.760987L14.5039 7.70156C13.8097 8.43246 13.4203 9.42482 13.4203 10.4588V16.1515C13.4203 16.6685 13.2228 17.1676 12.8785 17.5301L4.21004 26.6574C4.08588 26.7882 4.12539 27.008 4.28341 27.0793C4.95499 27.3943 5.66608 27.6617 6.41102 27.8934C7.28577 28.1608 8.23389 27.9231 8.87725 27.2398L16.513 19.1999C17.2071 18.469 17.5965 17.4766 17.5965 16.4427V10.75C17.5965 10.233 17.7941 9.73382 18.1383 9.37134L25.7627 1.34333C25.8869 1.2126 25.8474 0.992735 25.6894 0.921428C25.0178 0.606487 24.3067 0.339085 23.5618 0.113278C22.687 -0.154124 21.7389 0.0835671 21.0955 0.760987Z" fill="#66CB66"/> <path d="M47.4979 16.1338C47.4979 18.5523 45.3195 19.4615 41.702 19.4615C40.2911 19.4615 38.5134 19.3842 36.8655 19.1584C36.747 19.1406 36.6567 19.0336 36.6567 18.9029V18.0353C36.6567 17.2866 37.2662 16.6983 37.9716 16.7637C39.343 16.8944 40.5395 16.9538 41.6682 16.9538C43.3161 16.9538 44.6762 16.7875 44.6762 15.6703V14.9454C44.6762 1