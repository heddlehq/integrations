#
# AbacatePay, through the API v1. Connect with an API key from the dashboard's
# Integração › API Keys; a key made in dev mode works only with test data. Amounts go
# in cents, like 4990 for R$ 49,90. AbacatePay's webhooks are set in the dashboard, so
# the triggers check for news every 5 minutes.
id: abacatepay
name: AbacatePay
version: 1.0.0
description: Pix charges, payment links, customers, coupons and withdrawals in AbacatePay.
icon: hero-qr-code
