category: payments
author: Heddle
homepage: https://docs.abacatepay.com
base_url: https://api.abacatepay.com/v1/

credential:
  label: AbacatePay
  fields:
    - {name: api_key, label: API key, secret: true, required: true}
  auth:
    type: bearer
    token: "{{credential.api_key}}"

errors:
  message_path: error

triggers:
  - name: New Billing
    description: Starts the flow for each new payment link, checking every 5 minutes.
    request: {method: GET, path: billing/list}
    output: {path: data}
    poll: {every: 5, id: id}


actions:
  # Pix
  - name: Create Pix QR Code
    resource: Pix
    description: Makes a Pix QR code and copy-and-paste code for an amount.
    fields:
      - {name: amount, label: Amount (cents), type: number, required: true}
      - {name: description, label: Description, description: "Up to 37 characters."}
      - {name: expires_in, label: Expires in (seconds), type: number}
      - {name: customer, label: Customer, type: json, description: '{"name": "Ana", "cellphone": "(11) 99999-0000", "email": "ana@acme.com", "taxId": "123.456.789-01"}'}
      - {name: metadata, label: Metadata, type: json}
    request:
      method: POST
      path: pixQrCode/create
      body: {amount: "{{fields.amount}}", description: "{{fields.description}}", expiresIn: "{{fields.expires_in}}", customer: "{{fields.customer}}", metadata: "{{fields.metadata}}"}
    output: {path: data}

  - name: Check Pix QR Code
    resource: Pix
    description: Reads whether a Pix QR code was paid.
    fields:
      - {name: id, label: QR code ID, required: true}
    request: {method: GET, path: pixQrCode/check, query: {id: "{{fields.id}}"}}
    output: {path: data}

  - name: Simulate Pix Payment
    resource: Pix
    description: Pays a Pix QR code in dev mode, to test a flow.
    fields:
      - {name: id, label: QR code ID, required: true}
    request:
      method: POST
      path: pixQrCode/simulate-payment
      query: {id: "{{fields.id}}"}
      body: {metadata: {}}
    output: {path: data}

  # Billing
  - name: Create Billing
    resource: Billing
    description: Makes a payment link for some products, paid by Pix or card.
    fields:
      - {name: products, label: Products, type: json, required: true, description: '[{"externalId": "plan-1", "name": "Plano", "quantity": 1, "price": 4990}]'}
      - {name: methods, label: Methods, type: multiselect, required: true, default: [PIX], options: [{label: Pix, value: PIX}, {label: Card, value: CARD}]}
      - {name: frequency, label: Kind, type: select, default: ONE_TIME, options: [{label: Once, value: ONE_TIME}, {label: Several payments, value: MULTIPLE_PAYMENTS}]}
      - {name: return_url, label: Back URL, required: true, description: "Where the Back button goes."}
      - {name: completion_url, label: Done URL, required: true, description: "Where the buyer goes after paying."}
      - {name: customer_id, label: Customer ID}
      - {name: allow_coupons, label: Take coupons, type: boolean, default: false}
      - {name: coupons, label: Coupons, description: "Like BLACK10, FRETE"}
      - {name: external_id, label: Your ID}
    request:
      method: POST
      path: billing/create
      body:
        frequency: "{{fields.frequency}}"
        methods: "{{fields.methods}}"
        products: "{{fields.products}}"
        returnUrl: "{{fields.return_url}}"
        completionUrl: "{{fields.completion_url}}"
        customerId: "{{fields.customer_id}}"
        allowCoupons: "{{fields.allow_coupons}}"
        coupons: {_each: "{{fields.coupons}}", _value: "{{item}}"}
        externalId: "{{fields.external_id}}"
    output: {path: data}

  - name: Get Billing
    resource: Billing
    description: Reads a payment link, with its status.
    fields:
      - {name: id, label: Billing ID, required: true}
    request: {method: GET, path: billing/get, query: {id: "{{fields.id}}"}}
    output: {path: data}

  - name: List Billings
    resource: Billing
    description: Lists the payment links.
    request: {method: GET, path: billing/list}
    output: {path: data}

  # Customers
  - name: Create Customer
    resource: Customer
    description: Creates a customer.
    fields:
      - {name: name, label: Name, required: true}
      - {name: cellphone, label: Mobile, required: true}
      - {name: email, label: Email, required: true}
      - {name: tax_id, label: CPF or CNPJ, required: true}
    request:
      method: POST
      path: customer/create
      body: {name: "{{fields.name}}", cellphone: "{{fields.cellphone}}", email: "{{fields.email}}", taxId: "{{fields.tax_id}}"}
    output: {path: data}

  - name: List Customers
    resource: Customer
    description: Lists the customers.
    request: {method: GET, path: customer/list}
    output: {path: data}

  # Coupons
  - name: Create Coupon
    resource: Coupon
    description: Creates a discount coupon.
    fields:
      - {name: code, label: Code, required: true}
      - {name: discount_kind, label: Discount, type: select, default: PERCENTAGE, options: [{label: Percent, value: PERCENTAGE}, {label: Fixed (cents), value: FIXED}]}
      - {name: discount, label: Amount, type: number, required: true}
      - {name: notes, label: Notes}
      - {name: max_redeems, label: Uses, type: number, default: -1, description: "-1 for no limit."}
    request:
      method: POST
      path: coupon/create
      body: {data: {code: "{{fields.code}}", discountKind: "{{fields.discount_kind}}", discount: "{{fields.discount}}", notes: "{{fields.notes}}", maxRedeems: "{{fields.max_redeems}}"}}
    output: {path: data}

  - name: List Coupons
    resource: Coupon
    description: Lists the coupons.
    request: {method: GET, path: coupon/list}
    output: {path: data}

  # Withdrawals
  - name: Create Withdrawal
    resource: Withdrawal
    description: Sends money from the balance to a Pix key.
    fields:
      - {name: amount, label: Amount (cents), type: number, required: true}
      - {name: pix_type, label: Key type, type: select, required: true, default: CPF, options: [{label: CPF, value: CPF}, {label: CNPJ, value: CNPJ}, {label: Email, value: EMAIL}, {label: Phone, value: PHONE}, {label: Random key, value: RANDOM}]}
      - {name: pix_key, label: Pix key, required: true}
      - {name: external_id, label: Your ID, required: true, description: "The same ID won't send twice."}
      - {name: description, label: Description}
    request:
      method: POST
      path: withdraw/create
      body: {amount: "{{fields.amount}}", method: PIX, pix: {type: "{{fields.pix_type}}", key: "{{fields.pix_key}}"}, externalId: "{{fields.external_id}}", description: "{{fields.description}}"}
    output: {path: data}

  - name: List Withdrawals
    resource: Withdrawal
    description: Lists the withdrawals.
    request: {method: GET, path: withdraw/list}
    output: {path: data}

  - name: Get Store
    resource: Withdrawal
    description: Reads the store, with its balance.
    request: {method: GET, path: store/get}
    output: {path: data}

i18n:
  pt-BR:
    description: "Cobranças Pix, links de pagamento, clientes, cupons e saques na AbacatePay."
    triggers:
      New Billing: {name: "Nova cobrança", description: "Inicia o fluxo para cada link de pagamento novo, olhando a cada 5 minutos."}
    actions:
      Create Pix QR Code: {name: "Criar QR Code Pix", description: "Cria um QR Code e um copia-e-cola Pix de um valor.", fields: {amount: "Valor (centavos)", description: "Descrição", expires_in: "Expira em (segundos)", customer: "Cliente", metadata: "Metadados"}}
      Check Pix QR Code: {name: "Conferir QR Code Pix", description: "Lê se um QR Code Pix foi pago.", fields: {id: "ID"}}
      Simulate Pix Payment: {name: "Simular pagamento Pix", description: "Paga um QR Code Pix no modo dev, para testar um fluxo.", fields: {id: "ID"}}
      Create Billing: {name: "Criar cobrança", description: "Cria um link de pagamento de produtos, pago por Pix ou cartão.", fields: {products: "Produtos", methods: "Formas", frequency: "Tipo", return_url: "URL de voltar", completion_url: "URL de concluído", customer_id: "ID do cliente", allow_coupons: "Aceitar cupons", coupons: "Cupons", external_id: "Seu ID"}}
      Get Billing: {name: "Ler cobrança", description: "Lê um link de pagamento, com o status.", fields: {id: "ID"}}
      List Billings: {name: "Listar cobranças", description: "Lista os links de pagamento."}
      Create Customer: {name: "Criar cliente", description: "Cria um cliente.", fields: {name: "Nome", cellphone: "Celular", email: "E-mail", tax_id: "CPF ou CNPJ"}}
      List Customers: {name: "Listar clientes", description: "Lista os clientes."}
      Create Coupon: {name: "Criar cupom", description: "Cria um cupom de desconto.", fields: {code: "Código", discount_kind: "Desconto", discount: "Valor", notes: "Observações", max_redeems: "Usos"}}
      List Coupons: {name: "Listar cupons", description: "Lista os cupons."}
      Create Withdrawal: {name: "Sacar", description: "Envia dinheiro do saldo para uma chave Pix.", fields: {amount: "Valor (centavos)", pix_type: "Tipo de chave", pix_key: "Chave Pix", external_id: "Seu ID", description: "Descrição"}}
      List Withdrawals: {name: "Listar saques", description: "Lista os saques."}
      Get Store: {name: "Ler loja", description: "Lê a loja, com o saldo."}
