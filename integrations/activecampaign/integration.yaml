# ActiveCampaign's API v3. The URL and key are in ActiveCampaign, under Settings >
# Developer.
id: activecampaign
name: ActiveCampaign
version: 1.0.0
description: Contacts, lists, tags, accounts, deals and e-commerce data in ActiveCampaign.
icon: hero-megaphone
