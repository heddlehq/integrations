# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# VHSYS, the management system. Connect with the access token and the secret access
# token from VHSYS' panel, under Configurações › API / Integrações. Answers come as
# {"code", "status", "data"}; lists take limit and offset, and order by a column with
# sort ASC or DESC. Dates go as 2026-01-31.
id: vhsys
name: VHSYS
version: 1.0.0
description: Manage clients, products and stock, sales orders and their items, and accounts receivable and payable, and receive record changes, in VHSYS.
icon: hero-building-office
logo: |-
