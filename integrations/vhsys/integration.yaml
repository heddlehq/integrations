C65.9665 21.5081 68.3655 21.1571 69.7944 21.1571C70.6173 21.116 71.4394 21.2544 72.2034 21.5628C72.9673 21.8713 73.6548 22.3422 74.2179 22.943C74.2882 23.0204 74.3743 23.0818 74.4704 23.1231C74.5666 23.1643 74.6704 23.1844 74.775 23.1821C74.9844 23.1792 75.1844 23.0953 75.3329 22.9479C75.4814 22.8005 75.5667 22.6012 75.5708 22.3921C75.5701 22.1782 75.4896 21.9722 75.3449 21.8144C74.0147 20.322 72.1476 19.5681 69.7932 19.5681C66.3619 19.5681 64.2303 21.2189 64.2303 23.8803C64.2303 27.0656 67.2557 28.1313 69.9235 29.0728C72.2259 29.8835 74.4016 30.6533 74.4016 32.5877C74.4016 35.3262 71.6021 35.7358 69.9327 35.7358C67.6303 35.7358 66.0901 35.1091 64.7623 33.6308C64.6908 33.5552 64.6046 33.495 64.5091 33.4537C64.4135 33.4124 64.3106 33.3909 64.2065 33.3905C63.9972 33.3949 63.7979 33.4802 63.6504 33.6285C63.5028 33.7767 63.4187 33.9763 63.4155 34.1853C63.4149 34.3876 63.488 34.5832 63.6212 34.7356C64.5603 36.0238 66.8774 37.3236 69.9388 37.3236C73.8231 37.3236 76.1426 35.5505 76.1426 32.5828C76.1408 29.4195 73.1467 28.3832 70.5008 27.4691Z" fill="#0E2A3E"></path><path d="M61.649 19.7798C61.4708 19.7792 61.2969 19.8342 61.1514 19.9369C61.0059 20.0397 60.8961 20.1853 60.8373 20.3533L57.755 27.9816L55.1784 34.2001L49.5862 20.3637C49.5289 20.1933 49.4193 20.0453 49.2731 19.9406C49.1268 19.836 48.9513 19.7799 48.7714 19.7804C48.5421 19.7836 48.3232 19.8759 48.1611 20.0378C47.999 20.1997 47.9065 20.4184 47.9033 20.6474C47.9091 20.7895 47.9417 20.9294 47.9994 21.0594L54.2913 36.3302L51.449 43.1778C51.3856 43.314 51.3494 43.4613 51.3425 43.6113C51.3457 43.8402 51.4381 44.0589 51.6002 44.2208C51.7624 44.3827 51.9813 44.4751 52.2106 44.4782C52.3886 44.4789 52.5625 44.4241 52.7079 44.3216C52.8534 44.219 52.9633 44.0738 53.0223 43.906L56.1034 36.2733L62.4124 21.0802C62.4758 20.944 62.512 20.7968 62.5189 20.6467C62.5161 20.4174 62.4234 20.1983 62.2609 20.0362C62.0983 19.8742 61.8787 19.7822 61.649 19.7798V19.7798Z" fill="#0E2A3E"></path><path d="M111.01 50.1953C106.695 50.1924 102.442 49.1606 98.6056 47.1856C94.7695 45.2107 91.4609 42.3498 88.9547 38.8406C86.4486 35.3315 84.8174 31.2755 84.1968 27.01C83.5762 22.7445 83.9841 18.3927 85.3866 14.3163C85.5218 13.8841 85.7423 13.4833 86.0353 13.1376C86.3282 12.792 86.6876 12.5086 87.0922 12.3041C87.4967 12.0996 87.9382 11.9783 88.3906 11.9472C88.8429 11.9161 89.2969 11.9759 89.7257 12.1232C90.1544 12.2704 90.5493 12.502 90.8869 12.8043C91.2245 13.1066 91.4979 13.4734 91.6911 13.8831C91.8842 14.2928 91.9932 14.737 92.0114 15.1895C92.0297 15.6419 91.9568 16.0934 91.7973 16.5173C90.2523 20.9969 90.3255 25.8751 92.004 30.3065C93.6826 34.7378 96.8608 38.4429 100.988 40.7795C105.114 43.1161 109.93 43.9368 114.599 43.0995C119.268 42.2622 123.497 39.8195 126.552 36.195C126.837 35.8492 127.188 35.5634 127.585 35.354C127.981 35.1447 128.416 35.016 128.862 34.9754C129.309 34.9348 129.759 34.9831 130.187 35.1175C130.615 35.252 131.012 35.4698 131.355 35.7585C131.698 36.0472 131.98 36.401 132.185 36.7994C132.39 37.1978 132.514 37.6329 132.55 38.0794C132.585 38.526 132.532 38.9751 132.392 39.4009C132.253 39.8266 132.03 40.2205 131.737 40.5598C129.196 43.5796 126.024 46.007 122.443 47.6716C118.862 49.3363 114.96 50.1977 111.01 50.1953V50.1953Z" fill="#0E2A3E"></path></svg></svg>
category: erp
author: Heddle
homepage: https://developers.vhsys.com.br/api/
base_url: https://api.vhsys.com/v2/
headers:
  User-Agent: Heddle/1.0
  secret-access-token: "{{credential.secret_access_token}}"

credential:
  label: VHSYS
  fields:
    - {name: access_token, label: Access token, secret: true, required: true}
    - {name: secret_access_token, label: Secret access token, secret: true, required: true}
  auth:
    type: header
    name: access-token
    value: "{{credential.access_token}}"

errors:
  message_path: data

triggers:
  - name: Record Changed
    description: Starts the flow when VHSYS creates or changes a client, product, counter sale, service order or receivable.
    fields:
      - name: entidade
        label: Records
        type: select
        required: true
        default: todos
        options:
          - {label: All, value: todos}
          - {label: Clients, value: clientes}
          - {label: Products, value: produtos}
          - {label: Counter sales, value: vendas_balcao}
          - {label: Service orders, value: servico}
          - {label: Receivables, value: contas_receber}
    webhook:
      register:
        request:
          method: POST
          path: webhook
          body: {url: "{{webhook.url}}", user: heddle, password: "{{webhook.secret}}", entidade: "{{fields.entidade}}"}
        id_path: data.id_webhook
      unregister:
        request: {method: DELETE, path: "webhook/{{webhook.id}}"}
      signature: {basic: {username: heddle, password: "{{webhook.secret}}"}}

actions:
  # Clients
  - name: Create Client
    resource: Client
    description: Creates a client or a supplier.
    fields:
      - {name: razao_cliente, label: Name, required: true, description: "Legal name, or the person's name."}
      - name: tipo_pessoa
        label: Kind
        type: select
        default: PF
        options: [{label: Person, value: PF}, {label: Company, value: PJ}]
      - name: tipo_cadastro
        label: Registered as
        type: select
        default: Cliente
        options: [{label: Client, value: Cliente}, {label: Supplier, value: Fornecedor}, {label: Both, value: Ambos}]
      - {name: cnpj_cliente, label: CPF or CNPJ}
      - {name: fantasia_cliente, label: Trade name}
      - {name: email_cliente, label: Email}
      - {name: fone_cliente, label: Phone}
      - {name: celular_cliente, label: Mobile}
      - {name: cep_cliente, label: CEP}
      - {name: endereco_cliente, label: Street}
      - {name: numero_cliente, label: Number}
      - {name: bairro_cliente, label: District}
      - {name: cidade_cliente, label: City}
      - {name: uf_cliente, label: State, description: "Like SP"}
      - {name: observacoes_cliente, label: Notes, type: textarea}
    request:
      method: POST
      path: clientes
      body:
        razao_cliente: "{{fields.razao_cliente}}"
        tipo_pessoa: "{{fields.tipo_pessoa}}"
        tipo_cadastro: "{{fields.tipo_cadastro}}"
        cnpj_cliente: "{{fields.cnpj_cliente}}"
        fantasia_cliente: "{{fields.fantasia_cliente}}"
        email_cliente: "{{fields.email_cliente}}"
        fone_cliente: "{{fields.fone_cliente}}"
        celular_cliente: "{{fields.celular_cliente}}"
        cep_cliente: "{{fields.cep_cliente}}"
        endereco_cliente: "{{fields.endereco_cliente}}"
        numero_cliente: "{{fields.numero_cliente}}"
        bairro_cliente: "{{fields.bairro_cliente}}"
        cidade_cliente: "{{fields.cidade_cliente}}"
        uf_cliente: "{{fields.uf_cliente}}"
        observacoes_cliente: "{{fields.observacoes_cliente}}"
    output: {path: data}

  - name: Get Client
    resource: Client
    description: Reads a client or a supplier.
    fields:
      - {name: id_cliente, label: Client ID, required: true}
    request: {method: GET, path: "clientes/{{fields.id_cliente}}"}
    output: {path: data}

  - name: List Clients
    resource: Client
    description: Lists clients and suppliers by name, CPF or CNPJ, or changed since a date.
    fields:
      - {name: razao_cliente, label: Name}
      - {name: cnpj_cliente, label: CPF or CNPJ}
      - {name: data_modificacao, label: Changed since, description: "Like 2026-01-31"}
      - {name: limit, label: Limit, type: number, default: 50}
      - {name: offset, label: Offset, type: number}
    request:
      method: GET
      path: clientes
      query: {razao_cliente: "{{fields.razao_cliente}}", cnpj_cliente: "{{fields.cnpj_cliente}}", data_modificacao: "{{fields.data_modificacao}}", limit: "{{fields.limit}}", offset: "{{fields.offset}}", order: data_mod_cliente, sort: DESC}
    output: {path: data}

  - name: Update Client
    resource: Client
    description: Changes a client or a supplier. Send the attributes to change.
    fields:
      - {name: id_cliente, label: Client ID, required: true}
      - {name: cliente, label: Attributes, type: json, required: true, description: 'Like {"email_cliente": "maria@acme.com", "situacao_cliente": "Ativo"}'}
    request: {method: PUT, path: "clientes/{{fields.id_cliente}}", body: "{{fields.cliente}}"}
    output: {path: data}

  # Products
  - name: Create Product
    resource: Product
    description: Creates a product or a service.
    fields:
      - {name: desc_produto, label: Name, required: true}
      - {name: cod_produto, label: Code}
      - {name: valor_produto, label: Price, type: number}
      - {name: valor_custo_produto, label: Cost, type: number}
      - {name: unidade_produto, label: Unit, default: UN}
      - {name: estoque_produto, label: Initial stock, type: number}
      - {name: marca_produto, label: Brand}
      - {name: ncm_produto, label: NCM}
      - {name: codigo_barra_produto, label: Barcode}
      - {name: peso_produto, label: Weight (kg), type: number}
      - name: tipo_produto
        label: Type
        type: select
        default: Produto
        options: [{label: Product, value: Produto}, {label: Service, value: Servico}, {label: Both, value: Ambos}]
      - {name: extra, label: More attributes, type: json, description: 'Any other attribute of a product, like {"id_categoria": 3, "minimo_produto": 5}'}
    request:
      method: POST
      path: produtos
      body:
        _merge: "{{fields.extra}}"
        desc_produto: "{{fields.desc_produto}}"
        cod_produto: "{{fields.cod_produto}}"
        valor_produto: "{{fields.valor_produto}}"
        valor_custo_produto: "{{fields.valor_custo_produto}}"
        unidade_produto: "{{fields.unidade_produto}}"
        estoque_produto: "{{fields.estoque_produto}}"
        marca_produto: "{{fields.marca_produto}}"
        ncm_produto: "{{fields.ncm_produto}}"
        codigo_barra_produto: "{{fields.codigo_barra_produto}}"
        peso_produto: "{{fields.peso_produto}}"
        tipo_produto: "{{fields.tipo_produto}}"
    output: {path: data}

  - name: Get Product
    resource: Product
    description: Reads a product, with its price lists if you like.
    fields:
      - {name: id_prod, label: Product ID, required: true}
      - {name: lista_preco, label: With price lists, type: boolean}
    request: {method: GET, path: "produtos/{{fields.id_prod}}", query: {lista_preco: "{{fields.lista_preco}}"}}
    output: {path: data}

  - name: List Products
    resource: Product
    description: Lists products by name, code or brand, or changed since a date.
    fields:
      - {name: desc_produto, label: Name}
      - {name: cod_produto, label: Code}
      - {name: marca_produto, label: Brand}
      - {name: data_modificacao, label: Changed since, description: "Like 2026-01-31"}
      - {name: limit, label: Limit, type: number, default: 50}
      - {name: offset, label: Offset, type: number}
    request:
      method: GET
      path: produtos
      query: {desc_produto: "{{fields.desc_produto}}", cod_produto: "{{fields.cod_produto}}", marca_produto: "{{fields.marca_produto}}", data_modificacao: "{{fields.data_modificacao}}", limit: "{{fields.limit}}", offset: "{{fields.offset}}", order: data_mod_produto, sort: DESC}
    output: {path: data}

  - name: Update Product
    resource: Product
    description: Changes a product. Send the attributes to change.
    fields:
      - {name: id_prod, label: Product ID, required: true}
      - {name: produto, label: Attributes, type: json, required: true, description: 'Like {"valor_produto": 59.9, "status_produto": "Ativo"}'}
    request: {method: PUT, path: "produtos/{{fields.id_prod}}", body: "{{fields.produto}}"}
    output: {path: data}

  - name: Post Stock Movement
    resource: Product
    description: Records a stock entry or exit for a product.
    fields:
      - {name: id_prod, label: Product ID, required: true}
      - name: tipo_estoque
        label: Movement
        type: select
        required: true
        default: Entrada
        options: [{label: Entry, value: Entrada}, {label: Exit, value: Saida}]
      - {name: qtde_estoque, label: Quantity, type: number, required: true}
      - {name: valor_estoque, label: Unit value, type: number}
      - {name: obs_estoque, label: Notes}
    request:
      method: POST
      path: "produtos/{{fields.id_prod}}/estoque"
      body: {tipo_estoque: "{{fields.tipo_estoque}}", qtde_estoque: "{{fields.qtde_estoque}}", valor_estoque: "{{fields.valor_estoque}}", obs_estoque: "{{fields.obs_estoque}}"}
    output: {path: data}

  - name: Get Stock Movements
    resource: Product
    description: Lists a product's stock movements, since a date if you like.
    fields:
      - {name: id_prod, label: Product ID, required: true}
      - {name: data_cad_estoque, label: Since, description: "Like 2026-01-31"}
    request: {method: GET, path: "produtos/{{fields.id_prod}}/estoque", query: {data_cad_estoque: "{{fields.data_cad_estoque}}"}}
    output: {path: data}

  # Orders
  - name: Create Order
    resource: Order
    description: Creates a sales order, to add products to next.
    fields:
      - {name: nome_cliente, label: Client name, required: true}
      - {name: id_cliente, label: Client ID}
      - name: status_pedido
        label: Status
        type: select
        required: true
        default: Em Aberto
        options: [{label: Open, value: Em Aberto}, {label: In progress, value: Em Andamento}, {label: Fulfilled, value: Atendido}, {label: Cancelled, value: Cancelado}]
      - {name: data_pedido, label: Date, description: "Like 2026-01-31"}
      - {name: vendedor_pedido_id, label: Seller ID}
      - {name: frete_pedido, label: Shipping, type: number}
      - {name: desconto_pedido, label: Discount, type: number}
      - {name: referencia_pedido, label: Reference}
      - {name: obs_pedido, label: Notes, type: textarea}
      - {name: estoque_pedido, label: Post stock, type: boolean}
      - {name: contas_pedido, label: Post receivables, type: boolean}
    request:
      method: POST
      path: pedidos
      body:
        nome_cliente: "{{fields.nome_cliente}}"
        id_cliente: "{{fields.id_cliente}}"
        status_pedido: "{{fields.status_pedido}}"
        data_pedido: "{{fields.data_pedido}}"
        vendedor_pedido_id: "{{fields.vendedor_pedido_id}}"
        frete_pedido: "{{fields.frete_pedido}}"
        desconto_pedido: "{{fields.desconto_pedido}}"
        referencia_pedido: "{{fields.referencia_pedido}}"
        obs_pedido: "{{fields.obs_pedido}}"
        estoque_pedido: {_if: "{{fields.estoque_pedido}}", _value: 1}
        contas_pedido: {_if: "{{fields.contas_pedido}}", _value: 1}
    output: {path: data}

  - name: Add Order Product
    resource: Order
    description: Adds a product to a sales order.
    fields:
      - {name: id_ped, label: Order ID, required: true}
      - {name: id_produto, label: Product ID}
      - {name: desc_produto, label: Description, required: true}
      - {name: qtde_produto, label: Quantity, type: number, required: true}
      - {name: valor_unit_produto, label: Unit price, type: number, required: true}
      - {name: desconto_produto, label: Discount, type: number}
    request:
      method: POST
      path: "pedidos/{{fields.id_ped}}/produtos"
      body: {id_produto: "{{fields.id_produto}}", desc_produto: "{{fields.desc_produto}}", qtde_produto: "{{fields.qtde_produto}}", valor_unit_produto: "{{fields.valor_unit_produto}}", desconto_produto: "{{fields.desconto_produto}}"}
    output: {path: data}

  - name: Get Order
    resource: Order
    description: Reads a sales order.
    fields:
      - {name: id_ped, label: Order ID, required: true}
    request: {method: GET, path: "pedidos/{{fields.id_ped}}"}
    output: {path: data}

  - name: List Order Products
    resource: Order
    description: Lists the products of a sales order.
    fields:
      - {name: id_ped, label: Order ID, required: true}
    request: {method: GET, path: "pedidos/{{fields.id_ped}}/produtos"}
    output: {path: data}

  - name: List Orders
    resource: Order
    description: Lists sales orders by client, seller or status, or changed since a date.
    fields:
      - {name: nome_cliente, label: Client name}
      - {name: vendedor, label: Seller name}
      - name: status
        label: Status
        type: select
        options: [{label: Open, value: Em Aberto}, {label: In progress, value: Em Andamento}, {label: Fulfilled, value: Atendido}, {label: Cancelled, value: Cancelado}]
      - {name: data_modificacao, label: Changed since, description: "Like 2026-01-31"}
      - {name: limit, label: Limit, type: number, default: 50}
      - {name: offset, label: Offset, type: number}
    request:
      method: GET
      path: pedidos
      query: {nome_cliente: "{{fields.nome_cliente}}", vendedor: "{{fields.vendedor}}", status: "{{fields.status}}", data_modificacao: "{{fields.data_modificacao}}", limit: "{{fields.limit}}", offset: "{{fields.offset}}", order: data_mod_pedido, sort: DESC}
    output: {path: data}

  - name: Update Order
    resource: Order
    description: Changes a sales order, like its status. Send the attributes to change.
    fields:
      - {name: id_ped, label: Order ID, required: true}
      - {name: pedido, label: Attributes, type: json, required: true, description: 'Like {"status_pedido": "Atendido"}'}
    request: {method: PUT, path: "pedidos/{{fields.id_ped}}", body: "{{fields.pedido}}"}
    output: {path: data}

  # Finance
  - name: Create Receivable
    resource: Finance
    description: Creates an account receivable.
    fields:
      - {name: nome_conta, label: Description, required: true}
      - {name: id_banco, label: Bank account ID, required: true, description: "From List Bank Accounts."}
      - {name: valor_rec, label: Amount, type: number, required: true}
      - {name: vencimento_rec, label: Due on, required: true, description: "Like 2026-01-31"}
      - {name: data_emissao, label: Issued on, required: true, description: "Like 2026-01-31"}
      - {name: id_cliente, label: Client ID}
      - {name: nome_cliente, label: Client name}
      - {name: forma_pagamento, label: Payment method, description: "Like PIX, Boleto or Cartão de Crédito"}
      - {name: n_documento_rec, label: Document number}
      - {name: observacoes_rec, label: Notes}
    request:
      method: POST
      path: contas-receber
      body: {nome_conta: "{{fields.nome_conta}}", id_banco: "{{fields.id_banco}}", valor_rec: "{{fields.valor_rec}}", vencimento_rec: "{{fields.vencimento_rec}}", data_emissao: "{{fields.data_emissao}}", id_cliente: "{{fields.id_cliente}}", nome_cliente: "{{fields.nome_cliente}}", forma_pagamento: "{{fields.forma_pagamento}}", n_documento_rec: "{{fields.n_documento_rec}}", observacoes_rec: "{{fields.observacoes_rec}}"}
    output: {path: data}

  - name: Settle Receivable
    resource: Finance
    description: Marks an account receivable as received.
    fields:
      - {name: id_receita, label: Receivable ID, required: true}
      - {name: valor_rec, label: Amount received, type: number, required: true}
      - {name: data_pagamento, label: Received on, required: true, description: "Like 2026-01-31"}
    request:
      method: PUT
      path: "contas-receber/{{fields.id_receita}}"
      body: {liquidado_rec: Sim, valor_rec: "{{fields.valor_rec}}", data_pagamento: "{{fields.data_pagamento}}"}
    output: {path: data}

  - name: List Receivables
    resource: Finance
    description: Lists accounts receivable by due date, payment or name.
    fields:
      - {name: nome_conta, label: Description}
      - {name: data_vencimento, label: Due on, description: "Like 2026-01-31"}
      - {name: liquidado, label: Settled, type: select, options: [{label: "Yes", value: Sim}, {label: "No", value: Nao}]}
      - {name: limit, label: Limit, type: number, default: 50}
      - {name: offset, label: Offset, type: number}
    request:
      method: GET
      path: contas-receber
      query: {nome_conta: "{{fields.nome_conta}}", data_vencimento: "{{fields.data_vencimento}}", liquidado: "{{fields.liquidado}}", limit: "{{fields.limit}}", offset: "{{fields.offset}}"}
    output: {path: data}

  - name: Create Payable
    resource: Finance
    description: Creates an account payable.
    fields:
      - {name: nome_conta, label: Description, required: true}
      - {name: id_banco, label: Bank account ID, required: true}
      - {name: valor_pag, label: Amount, type: number, required: true}
      - {name: vencimento_pag, label: Due on, required: true, description: "Like 2026-01-31"}
      - {name: data_emissao, label: Issued on, required: true, description: "Like 2026-01-31"}
      - {name: id_fornecedor, label: Supplier ID}
      - {name: nome_fornecedor, label: Supplier name}
      - {name: forma_pagamento, label: Payment method, description: "Like PIX, Boleto or Transferência"}
      - {name: n_documento_pag, label: Document number}
      - {name: observacoes_pag, label: Notes}
    request:
      method: POST
      path: contas-pagar
      body: {nome_conta: "{{fields.nome_conta}}", id_banco: "{{fields.id_banco}}", valor_pag: "{{fields.valor_pag}}", vencimento_pag: "{{fields.vencimento_pag}}", data_emissao: "{{fields.data_emissao}}", id_fornecedor: "{{fields.id_fornecedor}}", nome_fornecedor: "{{fields.nome_fornecedor}}", forma_pagamento: "{{fields.forma_pagamento}}", n_documento_pag: "{{fields.n_documento_pag}}", observacoes_pag: "{{fields.observacoes_pag}}"}
    output: {path: data}

  - name: Settle Payable
    resource: Finance
    description: Marks an account payable as paid.
    fields:
      - {name: id_despesa, label: Payable ID, required: true}
      - {name: valor, label: Amount paid, type: number, required: true}
      - {name: data_pagamento, label: Paid on, required: true, description: "Like 2026-01-31"}
    request:
      method: PUT
      path: "contas-pagar/{{fields.id_despesa}}"
      body: {liquidado_rec: Sim, valor_rec: "{{fields.valor}}", data_pagamento: "{{fields.data_pagamento}}"}
    output: {path: data}

  - name: List Payables
    resource: Finance
    description: Lists accounts payable by due date, payment or name.
    fields:
      - {name: nome_conta, label: Description}
      - {name: data_vencimento, label: Due on, description: "Like 2026-01-31"}
      - {name: liquidado, label: Settled, type: select, options: [{label: "Yes", value: Sim}, {label: "No", value: Nao}]}
      - {name: limit, label: Limit, type: number, default: 50}
      - {name: offset, label: Offset, type: number}
    request:
      method: GET
      path: contas-pagar
      query: {nome_conta: "{{fields.nome_conta}}", data_vencimento: "{{fields.data_vencimento}}", liquidado: "{{fields.liquidado}}", limit: "{{fields.limit}}", offset: "{{fields.offset}}"}
    output: {path: data}

  - name: List Bank Accounts
    resource: Finance
    description: Lists the bank accounts, to post receivables and payables to.
    request: {method: GET, path: contas-bancarias, query: {limit: 100}}
    output: {path: data}

  - name: List Sellers
    resource: Finance
    description: Lists the sellers.
    fields:
      - {name: razao_vendedor, label: Name}
    request: {method: GET, path: vendedores, query: {razao_vendedor: "{{fields.razao_vendedor}}", limit: 100}}
    output: {path: data}

