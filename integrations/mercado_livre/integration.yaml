# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Mercado Livre, the marketplace. Create an app at developers.mercadolivre.com.br with
# Heddle's redirect address and the offline_access, read and write scopes, then paste
# its client ID and secret. Many calls need the seller's user ID: Get My Account
# returns it. Searches answer {"paging", "results"}, page with offset and limit (up
# to 50), and questions answer {"questions"}.
id: mercado_livre
name: Mercado Livre
version: 1.0.0
homepage: https://developers.mercadolivre.com.br/pt_br/api-docs-pt-br
description: Manage listings, their price, stock and description, read orders and shipments, answer buyers' questions and post-sale messages, and start flows on new orders and questions, in Mercado Livre.
icon: hero-shopping-cart
