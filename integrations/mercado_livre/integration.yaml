category: ecommerce
base_url: https://api.mercadolibre.com/
headers:
  User-Agent: Heddle/1.0

credential:
  label: Mercado Livre
  auth:
    type: oauth2
    authorize_url: https://auth.mercadolivre.com.br/authorization
    token_url: https://api.mercadolibre.com/oauth/token
    token_auth: body
    scopes: [offline_access, read, write]

errors:
  message_path: message

triggers:
  - name: New Order
    description: Starts the flow for each new sale, checking every 5 minutes.
    fields:
      - {name: seller_id, label: Seller ID, required: true, description: "Your user ID, from Get My Account."}
    request:
      method: GET
      path: orders/search
      query: {seller: "{{fields.seller_id}}", sort: date_desc, limit: 50}
    output: {path: results}
    poll: {every: 5, id: id}

  - name: New Question
    description: Starts the flow for each new unanswered question on your listings, checking every 5 minutes.
    fields:
      - {name: seller_id, label: Seller ID, required: true, description: "Your user ID, from Get My Account."}
    request:
      method: GET
      path: questions/search
      query: {seller_id: "{{fields.seller_id}}", status: UNANSWERED, sort_fields: date_created, sort_types: DESC, api_version: 4, limit: 50}
    output: {path: questions}
    poll: {every: 5, id: id}

actions:
  # Account
  - name: Get My Account
    resource: Account
    description: Reads the connected account, with its user ID.
    request: {method: GET, path: users/me}

  # Listings
  - name: List My Listings
    resource: Listing
    description: Lists the IDs of your listings, by status or SKU.
    fields:
      - {name: seller_id, label: Seller ID, required: true, description: "Your user ID, from Get My Account."}
      - {name: status, label: Status, type: select, options: [{label: Active, value: active}, {label: Paused, value: paused}, {label: Closed, value: closed}]}
      - {name: seller_sku, label: SKU}
      - {name: offset, label: Offset, type: number}
      - {name: limit, label: Limit, type: number, default: 50}
    request:
      method: GET
      path: "users/{{fields.seller_id}}/items/search"
      query: {status: "{{fields.status}}", seller_sku: "{{fields.seller_sku}}", offset: "{{fields.offset}}", limit: "{{fields.limit}}"}

  - name: Get Listing
    resource: Listing
    description: Reads a listing.
    fields:
      - {name: item_id, label: Listing ID, required: true, description: "Like MLB1234567890"}
    request: {method: GET, path: "items/{{fields.item_id}}"}

  - name: Create Listing
    resource: Listing
    description: Publishes a listing.
    fields:
      - {name: title, label: Title, required: true}
      - {name: category_id, label: Category ID, required: true, description: From Predict Category.}
      - {name: price, label: Price, type: number, required: true}
      - {name: available_quantity, label: Stock, type: number, required: true}
      - {name: listing_type_id, label: Listing type, type: select, default: gold_special, options: [{label: Classic, value: gold_special}, {label: Premium, value: gold_pro}, {label: Free, value: free}]}
      - {name: condition, label: Condition, type: select, default: new, options: [{label: New, value: new}, {label: Used, value: used}]}
      - {name: pictures, label: Picture addresses, type: json, description: "Like [{\"source\": \"https://example.com/a.jpg\"}]"}
      - {name: attributes, label: Attributes, type: json, description: "The category's attributes, like [{\"id\": \"BRAND\", \"value_name\": \"Acme\"}]"}
      - {name: extra, label: More fields, type: json, description: "Like {\"shipping\": {\"mode\": \"me2\"}}"}
    request:
      method: POST
      path: items
      body:
        title: "{{fields.title}}"
        category_id: "{{fields.category_id}}"
        price: "{{fields.price}}"
        currency_id: BRL
        available_quantity: "{{fields.available_quantity}}"
        buying_mode: buy_it_now
        listing_type_id: "{{fields.listing_type_id}}"
        condition: "{{fields.condition}}"
        pictures: "{{fields.pictures}}"
        attributes: "{{fields.attributes}}"
        _merge: "{{fields.extra}}"

  - name: Update Listing
    resource: Listing
    description: Changes a listing. Send the fields to change.
    fields:
      - {name: item_id, label: Listing ID, required: true}
      - {name: item, label: Fields, type: json, required: true, description: "Like {\"title\": \"New title\"}"}
    request: {method: PUT, path: "items/{{fields.item_id}}", body: "{{fields.item}}"}

  - name: Update Price and Stock
    resource: Listing
    description: Sets a listing's price, stock or both.
    fields:
      - {name: item_id, label: Listing ID, required: true}
      - {name: price, label: Price, type: number}
      - {name: available_quantity, label: Stock, type: number}
    request: {method: PUT, path: "items/{{fields.item_id}}", body: {price: "{{fields.price}}", available_quantity: "{{fields.available_quantity}}"}}

  - name: Change Listing Status
    resource: Listing
    description: Pauses, activates or closes a listing.
    fields:
      - {name: item_id, label: Listing ID, required: true}
      - {name: status, label: Status, type: select, required: true, options: [{label: Active, value: active}, {label: Paused, value: paused}, {label: Closed, value: closed}]}
    request: {method: PUT, path: "items/{{fields.item_id}}", body: {status: "{{fields.status}}"}}

  - name: Get Listing Description
    resource: Listing
    description: Reads a listing's description.
    fields:
      - {name: item_id, label: Listing ID, required: true}
    request: {method: GET, path: "items/{{fields.item_id}}/description"}

  - name: Update Listing Description
    resource: Listing
    description: Replaces a listing's description, as plain text.
    fields:
      - {name: item_id, label: Listing ID, required: true}
      - {name: plain_text, label: Description, type: textarea, required: true}
    request: {method: PUT, path: "items/{{fields.item_id}}/description", query: {api_version: 2}, body: {plain_text: "{{fields.plain_text}}"}}

  - name: Predict Category
    resource: Listing
    description: Suggests the category for a product title.
    fields:
      - {name: q, label: Title, required: true}
    request: {method: GET, path: sites/MLB/domain_discovery/search, query: {q: "{{fields.q}}", limit: 3}}

  - name: Get Category Attributes
    resource: Listing
    description: Lists the attributes a category takes, and which are required.
    fields:
      - {name: category_id, label: Category ID, required: true}
    request: {method: GET, path: "categories/{{fields.category_id}}/attributes"}

  # Orders
  - name: Search Orders
    resource: Order
    description: Lists your sales, by status or date, newest first.
    fields:
      - {name: seller_id, label: Seller ID, required: true, description: "Your user ID, from Get My Account."}
      - {name: status, label: Status, type: select, options: [{label: Paid, value: paid}, {label: Confirmed, value: confirmed}, {label: Cancelled, value: cancelled}]}
      - {name: date_from, label: Created from, type: datetime}
      - {name: date_to, label: Created until, type: datetime}
      - {name: offset, label: Offset, type: number}
      - {name: limit, label: Limit, type: number, default: 50}
    request:
      method: GET
      path: orders/search
      query: {seller: "{{fields.seller_id}}", order.status: "{{fields.status}}", order.date_created.from: "{{fields.date_from}}", order.date_created.to: "{{fields.date_to}}", sort: date_desc, offset: "{{fields.offset}}", limit: "{{fields.limit}}"}
    output: {path: results}

  - name: Get Order
    resource: Order
    description: Reads an order with its items, buyer and payments.
    fields:
      - {name: order_id, label: Order ID, required: true}
    request: {method: GET, path: "orders/{{fields.order_id}}"}

  - name: Get Shipment
    resource: Order
    description: Reads a shipment, with its status and tracking.
    fields:
      - {name: shipment_id, label: Shipment ID, required: true, description: "The order's shipping.id."}
    request: {method: GET, path: "shipments/{{fields.shipment_id}}", headers: {x-format-new: "true"}}

  # Questions and messages
  - name: List Questions
    resource: Question
    description: Lists the questions on your listings, unanswered first.
    fields:
      - {name: seller_id, label: Seller ID, required: true, description: "Your user ID, from Get My Account."}
      - {name: status, label: Status, type: select, default: UNANSWERED, options: [{label: Unanswered, value: UNANSWERED}, {label: Answered, value: ANSWERED}]}
      - {name: item, label: Listing ID}
      - {name: offset, label: Offset, type: number}
      - {name: limit, label: Limit, type: number, default: 50}
    request:
      method: GET
      path: questions/search
      query: {seller_id: "{{fields.seller_id}}", status: "{{fields.status}}", item: "{{fields.item}}", api_version: 4, offset: "{{fields.offset}}", limit: "{{fields.limit}}"}
    output: {path: questions}

  - name: Answer Question
    resource: Question
    description: Answers a buyer's question.
    fields:
      - {name: question_id, label: Question ID, type: number, required: true}
      - {name: text, label: Answer, type: textarea, required: true}
    request: {method: POST, path: answers, body: {question_id: "{{fields.question_id}}", text: "{{fields.text}}"}}

  - name: Get Messages
    resource: Question
    description: Reads the post-sale messages of an order.
    fields:
      - {name: pack_id, label: Pack or order ID, required: true, description: "The order's pack_id, or its ID when it has none."}
      - {name: seller_id, label: Seller ID, required: true}
    request: {method: GET, path: "messages/packs/{{fields.pack_id}}/sellers/{{fields.seller_id}}", query: {tag: post_sale, mark_as_read: "false"}}

  - name: Send Message
    resource: Question
    description: Sends a post-sale message to the buyer of an order.
    fields:
      - {name: pack_id, label: Pack or order ID, required: true}
      - {name: seller_id, label: Seller ID, required: true}
      - {name: buyer_id, label: Buyer ID, required: true, description: "The order's buyer.id."}
      - {name: text, label: Message, type: textarea, required: true}
    request:
      method: POST
      path: "messages/packs/{{fields.pack_id}}/sellers/{{fields.seller_id}}"
      query: {tag: post_sale}
      body: {from: {user_id: "{{fields.seller_id}}"}, to: {user_id: "{{fields.buyer_id}}"}, text: "{{fields.text}}"}

i18n:
  pt-BR:
    description: "Gerencie anúncios, preço, estoque e descrição, consulte pedidos e envios, responda perguntas e mensagens pós-venda, e inicie fluxos com novos pedidos e perguntas, no Mercado Livre."
    triggers:
      New Order: {name: "Nova venda", description: "Inicia o fluxo a cada nova venda, verificando a cada 5 minutos.", fields: {seller_id: "ID do vendedor"}}
      New Question: {name: "Nova pergunta", description: "Inicia o fluxo a cada nova pergunta sem resposta nos seus anúncios, verificando a cada 5 minutos.", fields: {seller_id: "ID do vendedor"}}
    actions:
      Get My Account: {name: "Buscar minha conta", description: "Lê a conta conectada, com o ID de usuário."}
      List My Listings: {name: "Listar meus anúncios", description: "Lista os IDs dos seus anúncios, por status ou SKU.", fields: {seller_id: "ID do vendedor", status: "Status", seller_sku: "SKU", offset: "Deslocamento", limit: "Limite"}}
      Get Listing: {name: "Buscar anúncio", description: "Lê um anúncio.", fields: {item_id: "ID do anúncio"}}
      Create Listing: {name: "Criar anúncio", description: "Publica um anúncio.", fields: {title: "Título", category_id: "ID da categoria", price: "Preço", available_quantity: "Estoque", listing_type_id: "Tipo de anúncio", condition: "Condição", pictures: "Endereços das fotos", attributes: "Atributos", extra: "Mais campos"}}
