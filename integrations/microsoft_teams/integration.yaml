# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Microsoft Teams, through Microsoft Graph v1.0: channels, chats, messages, Planner
# tasks and online meetings. Connect with an app registered in Microsoft Entra ID
# (Azure), with the delegated permissions in the scopes below.
id: microsoft_teams
name: Microsoft Teams
version: 1.0.0
description: Channels, chats, messages, members, Planner tasks and online meetings in Microsoft Teams.
icon: hero-chat-bubble-left-right
logo: |
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><defs><linearGradient id="a" x1="5.822" y1="11.568" x2="20.178" y2="36.432" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5a62c3"/><stop offset=".5" stop-color="#4d55bd"/><stop offset="1" stop-color="#3940ab"/></linearGradient></defs><path d="M31.993 19H43.1a1.9 1.9 0 0 1 1.9 1.9v10.117A6.983 6.983 0 0 1 38.017 38h-.033A6.983 6.983 0 0 1 31 31.017V19.993a.993.993 0 0 1 .993-.993z" fill="#5059c9"/><circle cx="39.5" cy="12.5" r="4.5" fill="#5059c9"/><circle cx="25.5" cy="10.5" r="6.5" fill="#7b83eb"/><path d="M34.167 19H15.833A1.88 1.88 0 0 0 14 20.923v11.539A11.279 11.279 0 0 0 25 44a11.279 11.279 0 0 0 11-11.538V20.923A1.88 1.88 0 0 0 34.167 19z" fill="#7b83eb"/><path fill="none" d="M0 0h48v48H0z"/><path d="M26 19v16.17a1.841 1.841 0 0 1-1.14 1.69 1.772 1.772 0 0 1-.69.14h-9.29c-.13-.33-.25-.66-.35-1a12.179 12.179 0 0 1-.53-3.54V20.92A1.877 1.877 0 0 1 15.83 19z" opacity=".1"/><path d="M25 19v17.17a1.772 1.772 0 0 1-.14.69A1.841 1.841 0 0 1 23.17 38h-7.82c-.17-.33-.33-.66-.47-1s-.25-.66-.35-1a12.179 12.179 0 0 1-.53-3.54V20.92A1.877 1.877 0 0 1 15.83 19z" opacity=".2"/><path d="M25 19v15.17A1.844 1.844 0 0 1 23.17 36h-8.64a12.179 12.179 0 0 1-.53-3.54V20.92A1.877 1.877 0 0 1 15.83 19z" opacity=".2"/><path d="M24 19v15.17A1.844 1.844 0 0 1 22.17 36h-7.64a12.179 12.179 0 0 1-.53-3.54V20.92A1.877 1.877 0 0 1 15.83 19z" opacity=".2"/><path d="M26 13.83v3.15c-.17.01-.33.02-.5.02s-.33-.01-.5-.02a5.489 5.489 0 0 1-1-.16A6.5 6.5 0 0 1 19.5 13a5.556 5.556 0 0 1-.32-1h4.99A1.837 1.837 0 0 1 26 13.83z" opacity=".1"/><path d="M25 14.83v2.15a5.489 5.489 0 0 1-1-.16A6.5 6.5 0 0 1 19.5 13h3.67A1.837 1.837 0 0 1 25 14.83z" opacity=".2"/><path d="M25 14.83v2.15a5.489 5.489 0 0 1-1-.16A6.5 6.5 0 0 1 19.5 13h3.67A1.837 1.837 0 0 1 25 14.83z" opacity=".2"/><path d="M24 14.83v1.99A6.5 6.5 0 0 1 19.5 13h2.67A1.837 1.837 0 0 1 24 14.83z" opacity=".2"/><rect x="2" y="13" width="22" height="22" rx="1.833" fill="url(#a)"/><path d="M17.824 19.978h-3.665v9.98h-2.335v-9.98H8.176v-1.936h9.648z" fill="#fff"/></svg>
category: communication
author: Heddle
homepage: https://learn.microsoft.com/graph/api/resources/teams-api-overview
base_url: https://graph.microsoft.com/v1.0/

credential:
  label: Microsoft Teams
  auth:
    type: oauth2
    authorize_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
    token_auth: body
    scopes: [offline_access, User.Read, User.ReadBasic.All, Team.ReadBasic.All, TeamMember.Read.All, Channel.Create, Channel.ReadBasic.All, ChannelSettings.ReadWrite.All, Channel.Delete.All, ChannelMessage.Send, ChannelMessage.Read.All, ChannelMessage.ReadWrite, Chat.Create, Chat.ReadWrite, ChatMember.ReadWrite, Tasks.ReadWrite, OnlineMeetings.ReadWrite, TeamsActivity.Send]

errors:
  message_path: error.message

triggers:
  - name: New Channel Message
    description: Starts the flow for each new message in a channel, checking every 5 minutes.
    fields:
      - {name: team, label: Team, type: select, required: true, options_from: {request: {method: GET, path: me/joinedTeams}, path: value, label: displayName, value: id}}
      - {name: channel, label: Channel, type: select, required: true, options_from: {request: {method: GET, path: "teams/{{fields.team}}/channels"}, path: value, label: displayName, value: id}}
    request: {method: GET, path: "teams/{{fields.team}}/channels/{{fields.channel}}/messages", query: {$top: 50}}
    output:
      path: value
    poll:
      every: 5
      id: id

  - name: New Chat Message
    description: Starts the flow for each new message in a chat, checking every 5 minutes.
    fields:
      - {name: chat, label: Chat, type: select, required: true, options_from: {request: {method: GET, path: me/chats, query: {$top: 50}}, path: value, label: topic, value: id}}
    request: {method: GET, path: "chats/{{fields.chat}}/messages", query: {$top: 50, $orderby: createdDateTime desc}}
    output:
      path: value
    poll:
      every: 5
      id: id

  - name: New Channel
    description: Starts the flow for each new channel in a team, checking every 5 minutes.
    fields:
      - {name: team, label: Team, type: select, required: true, options_from: {request: {method: GET, path: me/joinedTeams}, path: value, label: displayName, value: id}}
    request: {method: GET, path: "teams/{{fields.team}}/channels"}
    output:
      path: value
    poll:
      every: 5
      id: id

  - name: New Chat
    description: Starts the flow for each new chat you are in, checking every 5 minutes.
    request: {method: GET, path: me/chats, query: {$top: 50, $orderby: lastMessagePreview/createdDateTime desc}}
    output:
      path: value
    poll:
      every: 5
      id: id

  - name: New Team Member
    description: Starts the flow for each new member of a team, checking every 5 minutes.
    fields:
      - {name: team, label: Team, type: select, required: true, options_from: {request: {method: GET, path: me/joinedTeams}, path: value, label: displayName, value: id}}
    request: {method: GET, path: "teams/{{fields.team}}/members"}
    output:
      path: value
    poll:
      every: 5
      id: id

actions:
  # Channels
  - name: Create Channel
    resource: Channel
    description: Creates a channel in a team.
    fields:
      - {name: team, label: Team, type: select, required: true, options_from: {request: {method: GET, path: me/joinedTeams}, path: value, label: displayName, value: id}}
      - {name: name, label: Name, required: true}
      - {name: description, label: Description, type: textarea}
      - {name: type, label: Type, type: select, default: standard, options: [{label: Standard, value: standard}, {label: Private, value: private}, {label: Shared, value: shared}]}
    request:
      method: POST
      path: "teams/{{fields.team}}/channels"
      body: {displayName: "{{fields.name}}", description: "{{fields.description}}", membershipType: "{{fields.type}}"}

  - name: Get Channel
    resource: Channel
    description: Gets a channel.
    fields:
      - {name: team, label: Team, type: select, required: true, options_from: {request: {method: GET, path: me/joinedTeams}, path: value, label: displayName, value: id}}
      - {name: channel, label: Channel, type: select, required: true, options_from: {request: {method: GET, path: "teams/{{fields.team}}/channels"}, path: value, label: displayName, value: id}}
    request: {method: GET, path: "teams/{{fields.team}}/channels/{{fields.channel}}"}

  - name: Get Channels
    resource: Channel
    description: Lists the channels of a team.
    fields:
      - {name: team, label: Team, type: select, required: true, options_from: {request: {method: GET, path: me/joinedTeams}, path: value, label: displayName, value: id}}
    request: {method: GET, path: "teams/{{fields.team}}/channels"}
    output:
      path: value

  - name: Update Channel
    resource: Channel
    description: Renames a channel or changes its description.
    fields:
      - {name: team, label: Team, type: select, required: true, options_from: {request: {method: GET, path: me/joinedTeams}, path: value, label: displayName, value: id}}
      - {name: channel, label: Channel, type: select, required: true, options_from: {request: {method: GET, path: "teams/{{fields.team}}/channels"}, path: value, label: displayName, value: id}}
      - {name: name, label: Name}
      - {name: description, label: Description, type: textarea}
    request:
      method: PATCH
      path: "teams/{{fields.team}}/channels/{{fields.channel}}"
      body: {displayName: "{{fields.name}}", description: "{{fields.description}}"}
    output:
      value: {updated: true}

  - name: Delete Channel
    resource: Channel
    description: Deletes a channel.
    fields:
      - {name: team, label: Team, type: select, required: true, options_from: {request: {method: GET, path: me/joinedTeams}, path: value, label: displayName, value: id}}
      - {name: channel, label: Channel, type: select, required: true, options_from: {request: {method: GET, path: "teams/{{fields.team}}/channels"}, path: value, label: displayName, value: id}}
    request: {method: DELETE, path: "teams/{{fields.team}}/channels/{{fields.channel}}"}
    output:
      value: {deleted: true}

  # Channel messages
  - name: Send Channel Message
    resource: Channel Message
    description: Posts a message in a channel.
    fields:
      - {name: team, label: Team, type: select, required: true, options_from: {request: {method: GET, path: me/joinedTeams}, path: value, label: displayName, value: id}}
      - {name: channel, label: Channel, type: select, required: true, options_from: {request: {method: GET, path: "teams/{{fields.team}}/channels"}, path: value, label: displayName, value: id}}
      - {name: content, label: Message, type: textarea, required: true}
      - {name: content_type, label: Message type, type: select, default: text, options: [{label: Text, value: text}, {label: HTML, value: html}]}
      - {name: subject, label: Subject}
      - {name: importance, label: Importance, type: select, options: [{label: Normal, value: normal}, {label: High, value: high}, {label: Urgent, value: urgent}]}
    request:
      method: POST
      path: "teams/{{fields.team}}/channels/{{fields.channel}}/messages"
      body: {body: {contentType: "{{fields.content_type}}", content: "{{fields.content}}"}, subject: "{{fields.subject}}", importance: "{{fields.importance}}"}

  - name: Reply to Channel Message
    resource: Channel Message
    description: Replies to a message in a channel.
    fields:
      - {name: team, label: Team, type: select, required: true, options_from: {request: {method: GET, path: me/joinedTeams}, path: value, label: displayName, value: id}}
      - {name: channel, label: Channel, type: select, required: true, options_from: {request: {method: GET, path: "teams/{{fields.team}}/channels"}, path: value, label: displayName, value: id}}
      - {name: message, label: Message ID, required: true}
      - {name: content, label: Reply, type: textarea, required: true}
      - {name: content_type, label: Message type, type: select, default: text, options: [{label: Text, value: text}, {label: HTML, value: html}]}
    request:
      method: POST
      path: "teams/{{fields.team}}/channels/{{fields.channel}}/messages/{{fields.message}}/replies"
      body: {body: {contentType: "{{fields.content_type}}", content: "{{fields.content}}"}}

  - name: Get Channel Message
    resource: Channel Message
    description: Gets a message of a channel.
    fields:
      - {name: team, label: Team, type: select, required: true, options_from: {request: {method: GET, path: me/joinedTeams}, path: value, label: displayName, value: id}}
      - {name: channel, label: Channel, type: select, required: true, options_from: {request: {method: GET, path: "teams/{{fields.team}}/channels"}, path: value, label: displayName, value: id}}
      - {name: message, label: Message ID, required: true}
    request: {method: GET, path: "teams/{{fields.team}}/channels/{{fields.channel}}/messages/{{fields.message}}"}

  - name: Get Channel Messages
    resource: Channel Message
    description: Lists the messages of a channel, newest first.
    fields:
      - {name: team, label: Team, type: select, required: true, options_from: {request: {method: GET, path: me/joinedTeams}, path: value, label: displayName, value: id}}
      - {name: channel, label: Channel, type: select, required: true, options_from: {request: {method: GET, path: "teams/{{fields.team}}/channels"}, path: value, label: displayName, value: id}}
    request: {method: GET, path: "teams/{{fields.team}}/channels/{{fields.channel}}/messages", query: {$top: 50}}
    pagination: {type: link, items_path: value, next_path: "@odata.nextLink"}

  - name: Get Channel Message Replies
    resource: Channel Message
    description: Lists the replies to a message of a channel.
    fields:
      - {name: team, label: Team, type: select, required: true, options_from: {request: {method: GET, path: me/joinedTeams}, path: value, label: displayName, value: id}}
      - {name: channel, label: Channel, type: select, required: true, options_from: {request: {method: GET, path: "teams/{{fields.team}}/channels"}, path: value, label: displayName, value: id}}
      - {name: message, label: Message ID, required: true}
    request: {method: GET, path: "teams/{{fields.team}}/channels/{{fields.channel}}/messages/{{fields.message}}/replies", query: {$top: 50}}
    pagination: {type: link, items_path: value, next_path: "@odata.nextLink"}

  - name: Delete Channel Message
    resource: Channel Message
    description: Deletes a message of a channel. It can be brought back.
    fields:
      - {name: team, label: Team, type: select, required: true, options_from: {request: {method: GET, path: me/joinedTeams}, path: value, label: displayName, value: id}}
      - {name: channel, label: Channel, type: select, required: true, options_from: {request: {method: GET, path: "teams/{{fields.team}}/channels"}, path: value, label: displayName, value: id}}
      - {name: message, label: Message ID, required: true}
    request: {method: POST, path: "teams/{{fields.team}}/channels/{{fields.channel}}/messages/{{fields.message}}/softDelete"}
    output:
      value: {deleted: true}

  - name: Restore Channel Message
    resource: Channel Message
    description: Brings back a deleted message of a channel.
    fields:
      - {name: team, label: Team, type: select, required: true, options_from: {request: {method: GET, path: me/joinedTeams}, path: value, label: displayName, value: id}}
      - {name: channel, label: Channel, type: select, required: true, options_from: {request: {method: GET, path: "teams/{{fields.team}}/channels"}, path: value, label: displayName, value: id}}
      - {name: message, label: Message ID, required: true}
    request: {method: POST, path: "teams/{{fields.team}}/channels/{{fields.channel}}/messages/{{fields.message}}/undoSoftDelete"}
    output:
      value: {restored: true}

  # Chats
  - name: Create Chat
    resource: Chat
    description: Starts a chat, one-on-one or in a group.
    fields:
      - {name: type, label: Type, type: select, required: true, default: oneOnOne, options: [{label: One on one, value: oneOnOne}, {label: Group, value: group}]}
      - {name: members, label: Members, required: true, description: "IDs or emails of the people, you included, separated by commas."}
      - {name: topic, label: Topic, description: Only for a group.}
    request:
      method: POST
      path: chats
      body:
        chatType: "{{fields.type}}"
        topic: "{{fields.topic}}"
        members: {_each: "{{fields.members}}", "@odata.type": "#microsoft.graph.aadUserConversationMember", roles: [owner], "user@odata.bind": "https://graph.microsoft.com/v1.0/users('{{item}}')"}

  - name: Get Chat
    resource: Chat
    description: Gets a chat.
    fields:
      - {name: chat, label: Chat, type: select, required: true, options_from: {request: {method: GET, path: me/chats, query: {$top: 50}}, path: value, label: topic, value: id}}
    request: {method: GET, path: "chats/{{fields.chat}}"}

  - name: Get Chats
    resource: Chat
    description: Lists the chats you are in.
    request: {method: GET, path: me/chats, query: {$top: 50}}
    pagination: {type: link, items_path: value, next_path: "@odata.nextLink"}

  # Chat messages
  - name: Send Chat Message
    resource: Chat Message
    description: Sends a message in a chat.
    fields:
      - {name: chat, label: Chat, type: select, required: true, options_from: {request: {method: GET, path: me/chats, query: {$top: 50}}, path: value, label: topic, value: id}}
      - {name: content, label: Message, type: textarea, required: true}
      - {name: content_type, label: Message type, type: select, default: text, options: [{label: Text, value: text}, {label: HTML, value: html}]}
    request:
      method: POST
      path: "chats/{{fields.chat}}/messages"
      body: {body: {contentType: "{{fields.content_type}}", content: "{{fields.content}}"}}

  - name: Get Chat Message
    resource: Chat Message
    description: Gets a message of a chat.
    fields:
      - {name: chat, label: Chat, type: select, required: true, options_from: {request: {method: GET, path: me/chats, query: {$top: 50}}, path: value, label: topic, value: id}}
      - {name: message, label: Message ID, required: true}
    request: {method: GET, path: "chats/{{fields.chat}}/messages/{{fields.message}}"}

  - name: Get Chat Messages
    resource: Chat Message
    description: Lists the messages of a chat, newest first.
    fields:
      - {name: chat, label: Chat, type: select, required: true, options_from: {request: {method: GET, path: me/chats, query: {$top: 50}}, path: value, label: topic, value: id}}
    request: {method: GET, path: "chats/{{fields.chat}}/messages", query: {$top: 50, $orderby: createdDateTime desc}}
    pagination: {type: link, items_path: value, next_path: "@odata.nextLink"}

  - name: Delete Chat Message
    resource: Chat Message
    description: Deletes a message you sent in a chat. It can be brought back.
    fields:
      - {name: chat, label: Chat, type: select, required: true, options_from: {request: {method: GET, path: me/chats, query: {$top: 50}}, path: value, label: topic, value: id}}
      - {name: message, label: Message ID, required: true}
    request: {method: POST, path: "me/chats/{{fields.chat}}/messages/{{fields.message}}/softDelete"}
    output:
      value: {deleted: true}

  - name: Restore Chat Message
    resource: Chat Message
    description: Brings back a message you deleted in a chat.
    fields:
      - {name: chat, label: Chat, type: select, required: true, options_from: {request: {method: GET, path: me/chats, query: {$top: 50}}, path: value, label: topic, value: id}}
      - {name: message, label: Message ID, required: true}
    request: {method: POST, path: "me/chats/{{fields.chat}}/messages/{{fields.message}}/undoSoftDelete"}
    output:
      value: {restored: true}

  # Chat members
  - name: Add Chat Member
    resource: Chat Member
    description: Adds a person to a group chat.
    fields:
      - {name: chat, label: Chat, type: select, required: true, options_from: {request: {method: GET, path: me/chats, query: {$top: 50}}, path: value, label: topic, value: id}}
      - {name: user, label: User, required: true, description: The person's ID or email.}
      - {name: role, label: Role, type: select, default: owner, options: [{label: Owner, value: owner}, {label: Guest, value: guest}]}
      - {name: history, label: Share history since, type: datetime, description: "What they get to see of the chat. Nothing before they join when empty."}
    request:
      method: POST
      path: "chats/{{fields.chat}}/members"
      body: {"@odata.type": "#microsoft.graph.aadUserConversationMember", "user@odata.bind": "https://graph.microsoft.com/v1.0/users('{{fields.user}}')", roles: ["{{fields.role}}"], visibleHistoryStartDateTime: "{{fields.history}}"}

  - name: Get Chat Members
    resource: Chat Member
    description: Lists the members of a chat.
    fields:
      - {name: chat, label: Chat, type: select, required: true, options_from: {request: {method: GET, path: me/chats, query: {$top: 50}}, path: value, label: topic, value: id}}
    request: {method: GET, path: "chats/{{fields.chat}}/members"}
    output:
      path: value

  - name: Remove Chat Member
    resource: Chat Member
    description: Removes a person from a group chat.
    fields:
      - {name: chat, label: Chat, type: select, required: true, options_from: {request: {method: GET, path: me/chats, query: {$top: 50}}, path: value, label: topic, value: id}}
      - {name: membership, label: Membership ID, required: true, description: "The id Get Chat Members gives for the person."}
    request: {method: DELETE, path: "chats/{{fields.chat}}/members/{{fields.membership}}"}
    output:
      value: {removed: true}

  # Planner tasks
  - name: Create Task
    resource: Task
    description: Creates a Planner task in a plan.
    fields:
      - {name: plan, label: Plan, type: select, required: true, options_from: {request: {method: GET, path: me/planner/plans}, path: value, label: title, value: id}}
      - {name: bucket, label: Bucket, type: select, options_from: {request: {method: GET, path: "planner/plans/{{fields.plan}}/buckets"}, path: value, label: name, value: id}}
      - {name: title, label: Title, required: true}
      - {name: due, label: Due, type: datetime}
      - {name: start, label: Start, type: datetime}
      - {name: percent, label: Percent complete, type: select, options: [{label: Not started, value: 0}, {label: In progress, value: 50}, {label: Completed, value: 100}]}
      - {name: priority, label: Priority, type: select, options: [{label: Urgent, value: 1}, {label: Important, value: 3}, {label: Medium, value: 5}, {label: Low, value: 9}]}
      - {name: extra, label: Other fields, type: json, description: "Other properties of the task, as JSON, like {\"assignments\": {...}}."}
    request:
      method: POST
      path: planner/tasks
      body: {planId: "{{fields.plan}}", bucketId: "{{fields.bucket}}", title: "{{fields.title}}", dueDateTime: "{{fields.due}}", startDateTime: "{{fields.start}}", percentComplete: "{{fields.percent}}", priority: "{{fields.priority}}", _merge: "{{fields.extra}}"}

  - name: Get Task
    resource: Task
    description: Gets a Planner task.
    fields:
      - {name: task, label: Task ID, required: true}
    request: {method: GET, path: "planner/tasks/{{fields.task}}"}

  - name: Get Tasks
    resource: Task
    description: Lists the Planner tasks of a plan.
    fields:
      - {name: plan, label: Plan, type: select, required: true, options_from: {request: {method: GET, path: me/planner/plans}, path: value, label: title, value: id}}
    request: {method: GET, path: "planner/plans/{{fields.plan}}/tasks"}
    pagination: {type: link, items_path: value, next_path: "@odata.nextLink"}

  - name: Get My Tasks
    resource: Task
    description: Lists the Planner tasks assigned to you.
    request: {method: GET, path: me/planner/tasks}
    pagination: {type: link, items_path: value, next_path: "@odata.nextLink"}

  - name: Update Task
    resource: Task
    description: Changes a Planner task. Empty fields stay as they are.
    fields:
      - {name: task, label: Task ID, required: true}
      - {name: etag, label: ETag, required: true, description: "The task's @odata.etag, from Get Task. Planner refuses a change to a task that changed since."}
      - {name: title, label: Title}
      - {name: bucket, label: Bucket ID}
      - {name: due, label: Due, type: datetime}
      - {name: start, label: Start, type: datetime}
      - {name: percent, label: Percent complete, type: select, options: [{label: Not started, value: 0}, {label: In progress, value: 50}, {label: Completed, value: 100}]}
      - {name: priority, label: Priority, type: select, options: [{label: Urgent, value: 1}, {label: Important, value: 3}, {label: Medium, value: 5}, {label: Low, value: 9}]}
      - {name: extra, label: Other fields, type: json}
    request:
      method: PATCH
      path: "planner/tasks/{{fields.task}}"
      headers: {If-Match: "{{fields.etag}}", Prefer: return=representation}
      body: {title: "{{fields.title}}", bucketId: "{{fields.bucket}}", dueDateTime: "{{fields.due}}", startDateTime: "{{fields.start}}", percentComplete: "{{fields.percent}}", priority: "{{fields.priority}}", _merge: "{{fields.extra}}"}

  - name: Delete Task
    resource: Task
    description: Deletes a Planner task.
    fields:
      - {name: task, label: Task ID, required: true}
      - {name: etag, label: ETag, required: true, description: "The task's @odata.etag, from Get Task."}
    request: {method: DELETE, path: "planner/tasks/{{fields.task}}", headers: {If-Match: "{{fields.etag}}"}}
    output:
      value: {deleted: true}

  # Online meetings
  - name: Create Meeting
    resource: Meeting
    description: Creates a Teams meeting and its link.
    fields:
      - {name: subject, label: Subject, required: true}
      - {name: start, label: Start, type: datetime, required: true}
      - {name: end, label: End, type: datetime, required: true}
      - {name: lobby, label: Who skips the lobby, type: select, options: [{label: Everyone, value: everyone}, {label: People in your organization, value: organization}, {label: Only the organizer, value: organizer}, {label: Invited people, value: invitedUsers}]}
    request:
      method: POST
      path: me/onlineMeetings
      body: {subject: "{{fields.subject}}", startDateTime: "{{fields.start}}", endDateTime: "{{fields.end}}", lobbyBypassSettings: {scope: "{{fields.lobby}}", _if: "{{fields.lobby}}"}}

  - name: Create or Get Meeting
    resource: Meeting
    description: Gets the meeting with an ID of yours, creating it the first time.
    fields:
      - {name: external_id, label: Your ID, required: true, description: "Any text that names the meeting, like an order number."}
      - {name: subject, label: Subject}
      - {name: start, label: Start, type: datetime}
      - {name: end, label: End, type: datetime}
    request:
      method: POST
      path: me/onlineMeetings/createOrGet
      body: {externalId: "{{fields.external_id}}", subject: "{{fields.subject}}", startDateTime: "{{fields.start}}", endDateTime: "{{fields.end}}"}

  - name: Get Meeting
    resource: Meeting
    description: Gets a meeting.
    fields:
      - {name: meeting, label: Meeting ID, required: true}
    request: {method: GET, path: "me/onlineMeetings/{{fields.meeting}}"}

  - name: Update Meeting
    resource: Meeting
    description: Changes a meeting. Empty fields stay as they are.
    fields:
      - {name: meeting, label: Meeting ID, required: true}
      - {name: subject, label: Subject}
      - {name: start, label: Start, type: datetime}
      - {name: end, label: End, type: datetime}
    request:
      method: PATCH
      path: "me/onlineMeetings/{{fields.meeting}}"
      body: {subject: "{{fields.subject}}", startDateTime: "{{fields.start}}", endDateTime: "{{fields.end}}"}

  - name: Delete Meeting
    resource: Meeting
    description: Deletes a meeting.
    fields:
      - {name: meeting, label: Meeting ID, required: true}
    request: {method: DELETE, path: "me/onlineMeetings/{{fields.meeting}}"}
    output:
      value: {deleted: true}

  # Activity
  - name: Send Activity Notification
    resource: Activity
    description: Shows a notification in a person's Teams activity feed.
    fields:
      - {name: user, label: User, required: true, description: The person's ID or email.}
      - {name: text, label: Text, required: true}
      - {name: topic, label: Topic, required: true, description: What the notification is about.}
      - {name: url, label: Link, required: true, description: "A Teams link the notification opens."}
    request:
      method: POST
      path: "users/{{fields.user}}/teamwork/sendActivityNotification"
      body:
        topic: {source: text, value: "{{fields.topic}}", webUrl: "{{fields.url}}"}
        activityType: systemDefault
        previewText: {content: "{{fields.text}}"}
        templateParameters: [{name: systemDefaultText, value: "{{fields.text}}"}]
    output:
      value: {sent: true}

