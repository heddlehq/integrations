      Search Payables: {name: "Pesquisar contas a pagar", description: "Pesquisa contas a pagar por fornecedor, vencimento ou situação, 100 por página.", fields: {nome_cliente: "Nome do fornecedor", data_ini_vencimento: "Vencimento inicial", data_fim_vencimento: "Vencimento final", situacao: "Situação", pagina: "Página"}}
      Create Payable: {name: "Criar conta a pagar", description: "Cria uma conta a pagar.", fields: {conta: "Conta"}}
      Search Sellers: {name: "Pesquisar vendedores", description: "Lista os vendedores, por nome.", fields: {pesquisa: "Pesquisa"}}
