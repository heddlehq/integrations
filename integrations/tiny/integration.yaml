# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Tiny ERP (Olist Tiny), through its API 2.0. Connect with the API token from
# Configurações › Outras configurações › Token da API. Every call answers with
# HTTP 200 and a "retorno" whose "status" says "OK" or "Erro", with the reasons in
# "erros". Records to create go as JSON objects in Tiny's format, and dates as
# 31/01/2026.
id: tiny
name: Tiny ERP
version: 1.0.0
description: Search and create products, contacts, orders, invoices and bills, update stock and order status, and issue invoices, in Tiny ERP.
icon: hero-building-storefront
logo: |-
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#FFFFFF"/><svg x="6.00" y="3.00" width="12.00" height="18.00" viewBox="8.9 6.4 8 12"><path d="M12.8515 14.1709C10.8023 14.1709 9.14014 12.4937 9.14014 10.4259V14.3785C9.14014 16.4463 10.8023 18.1235 12.8515 18.1235C14.9007 18.1235 16.5628 16.4463 16.5628 14.3785V10.4259C16.5628 12.4937 14.9007 14.1709 12.8515 14.1709Z" fill="url(#paint0_linear_7608_120937)"/> <path d="M16.6245 10.7628C16.8182 8.69826 15.3016 6.86758 13.237 6.67387C11.1725 6.48017 9.3418 7.9968 9.14809 10.0614C8.95439 12.1259 10.471 13.9566 12.5356 14.1503C14.6001 14.344 16.4308 12.8274 16.6245 10.7628Z" fill="url(#paint1_linear_7608_120937)"/> <defs> <linearGradient id="paint0_linear_7608_120937" x1="12.3025" y1="17.732" x2="13.677" y2="9.62203" gradientUnits="userSpaceOnUse"> <stop stop-color="#E64E36"/> <stop offset="1" stop-color="#F0A028"/> </linearGradient> <linearGradient id="paint1_linear_7608_120937" x1="13.8833" y1="11.409" x2="16.9073" y2="6.87295" gradientUnits="userSpaceOnUse"> <stop stop-color="#0A4EE4"/> <stop offset="1" stop-color="#8DD7D7"/> </linearGradient> </defs></svg></svg>
category: erp
author: Heddle
homepage: https://tiny.com.br/api-docs
base_url: https://api.tiny.com.br/api2/
headers:
  User-Agent: Heddle

credential:
  label: Tiny ERP
  fields:
    - {name: token, label: API token, secret: true, required: true, description: "From Configurações › Outras configurações › Token da API."}
  auth:
    type: query
    name: token
    value: "{{credential.token}}"

triggers:
  - name: New Order
    description: Starts the flow for each new sales order, checking every 5 minutes.
    request:
      method: GET
      path: pedidos.pesquisa.php
      query: {formato: json, sort: DESC}
    output: {path: retorno.pedidos}
    poll: {every: 5, id: pedido.id}

actions:
  # Products
  - name: Search Products
    resource: Product
    description: Searches products by name or code, 100 per page.
    fields:
      - {name: pesquisa, label: Search, description: "Name or code. Leave empty for all."}
      - name: situacao
        label: Status
        type: select
        options: [{label: Active, value: A}, {label: Inactive, value: I}, {label: Deleted, value: E}]
      - {name: pagina, label: Page, type: number}
    request:
      method: GET
      path: produtos.pesquisa.php
      query: {formato: json, pesquisa: "{{fields.pesquisa}}", situacao: "{{fields.situacao}}", pagina: "{{fields.pagina}}"}
    output: {path: retorno.produtos}

  - name: Get Product
    resource: Product
    description: Reads a product, with prices, stock settings, variations and images.
    fields:
      - {name: id, label: Product ID, required: true}
    request: {method: GET, path: produto.obter.php, query: {formato: json, id: "{{fields.id}}"}}
    output: {path: retorno.produto}

  - name: Create Product
    resource: Product
    description: Creates a product.
    fields:
      - {name: produto, label: Product, type: json, required: true, description: 'Like {"sequencia": 1, "nome": "Camiseta", "codigo": "CAM-01", "unidade": "UN", "preco": 49.9, "origem": "0", "situacao": "A", "tipo": "P"}'}
    request:
      method: POST
      path: produto.incluir.php
      query: {formato: json}
      body_type: form
      body: {produto: '{"produtos": [{"produto": {{fields.produto}}}]}'}
    output: {path: retorno.registros}

  - name: Update Product
    resource: Product
    description: Changes a product. Send its id and the attributes to change.
    fields:
      - {name: produto, label: Product, type: json, required: true, description: 'Like {"sequencia": 1, "id": "123", "nome": "Camiseta", "preco": 59.9}'}
    request:
      method: POST
      path: produto.alterar.php
      query: {formato: json}
      body_type: form
      body: {produto: '{"produtos": [{"produto": {{fields.produto}}}]}'}
    output: {path: retorno.registros}

  - name: Get Product Stock
    resource: Product
    description: Reads a product's balance, in total and per warehouse.
    fields:
      - {name: id, label: Product ID, required: true}
    request: {method: GET, path: produto.obter.estoque.php, query: {formato: json, id: "{{fields.id}}"}}
    output: {path: retorno.produto}

  - name: Update Stock
    resource: Product
    description: Records a stock entry, exit or balance for a product.
    fields:
      - {name: estoque, label: Stock movement, type: json, required: true, description: 'Like {"idProduto": "123", "tipo": "E", "quantidade": 10, "observacoes": "Compra"}. Tipo is E (entry), S (exit) or B (balance).'}
    request:
      method: POST
      path: produto.atualizar.estoque.php
      query: {formato: json}
      body_type: form
      body: {estoque: '{"estoque": {{fields.estoque}}}'}
    output: {path: retorno.registros}

  - name: Get Product Categories
    resource: Product
    description: Reads the tree of product categories.
    request: {method: GET, path: produtos.categorias.arvore.php, query: {formato: json}}
    output: {path: retorno}

  # Contacts
  - name: Search Contacts
    resource: Contact
    description: Searches customers and suppliers by name, code or CPF/CNPJ, 100 per page.
    fields:
      - {name: pesquisa, label: Search, description: "Name or code."}
      - {name: cpf_cnpj, label: CPF or CNPJ}
      - name: situacao
        label: Status
        type: select
        options: [{label: Active, value: Ativo}, {label: Inactive, value: Inativo}, {label: Deleted, value: Excluido}]
      - {name: pagina, label: Page, type: number}
    request:
      method: GET
      path: contatos.pesquisa.php
      query: {formato: json, pesquisa: "{{fields.pesquisa}}", cpf_cnpj: "{{fields.cpf_cnpj}}", situacao: "{{fields.situacao}}", pagina: "{{fields.pagina}}"}
    output: {path: retorno.contatos}

  - name: Get Contact
    resource: Contact
    description: Reads a contact, with address and contact details.
    fields:
      - {name: id, label: Contact ID, required: true}
    request: {method: GET, path: contato.obter.php, query: {formato: json, id: "{{fields.id}}"}}
    output: {path: retorno.contato}

  - name: Create Contact
    resource: Contact
    description: Creates a customer or supplier.
    fields:
      - {name: contato, label: Contact, type: json, required: true, description: 'Like {"sequencia": 1, "nome": "Maria Souza", "tipo_pessoa": "F", "cpf_cnpj": "12345678909", "email": "maria@acme.com", "cep": "01310-100", "cidade": "São Paulo", "uf": "SP", "situacao": "A"}'}
    request:
      method: POST
      path: contato.incluir.php
      query: {formato: json}
      body_type: form
      body: {contato: '{"contatos": [{"contato": {{fields.contato}}}]}'}
    output: {path: retorno.registros}

  - name: Update Contact
    resource: Contact
    description: Changes a contact. Send its id and the attributes to change.
    fields:
      - {name: contato, label: Contact, type: json, required: true, description: 'Like {"sequencia": 1, "id": "123", "email": "maria@acme.com"}'}
    request:
      method: POST
      path: contato.alterar.php
      query: {formato: json}
      body_type: form
      body: {contato: '{"contatos": [{"contato": {{fields.contato}}}]}'}
    output: {path: retorno.registros}

  # Orders
  - name: Search Orders
    resource: Order
    description: Searches sales orders by number, customer, dates or status, 100 per page.
    fields:
      - {name: numero, label: Order number}
      - {name: cliente, label: Customer name}
      - {name: cpf_cnpj, label: Customer CPF or CNPJ}
      - {name: dataInicial, label: Placed since, description: "Like 01/01/2026"}
      - {name: dataFinal, label: Placed until, description: "Like 31/01/2026"}
      - name: situacao
        label: Status
        type: select
        options: [{label: Open, value: aberto}, {label: Approved, value: aprovado}, {label: Preparing shipment, value: preparando_envio}, {label: Invoiced, value: faturado}, {label: Ready to ship, value: pronto_envio}, {label: Shipped, value: enviado}, {label: Delivered, value: entregue}, {label: Not delivered, value: nao_entregue}, {label: Cancelled, value: cancelado}]
      - {name: numeroEcommerce, label: Store order number}
      - {name: pagina, label: Page, type: number}
    request:
      method: GET
      path: pedidos.pesquisa.php
      query: {formato: json, numero: "{{fields.numero}}", cliente: "{{fields.cliente}}", cpf_cnpj: "{{fields.cpf_cnpj}}", dataInicial: "{{fields.dataInicial}}", dataFinal: "{{fields.dataFinal}}", situacao: "{{fields.situacao}}", numeroEcommerce: "{{fields.numeroEcommerce}}", pagina: "{{fields.pagina}}"}
    output: {path: retorno.pedidos}

  - name: Get Order
    resource: Order
    description: Reads a sales order, with customer, items, installments and shipping.
    fields:
      - {name: id, label: Order ID, required: true}
    request: {method: GET, path: pedido.obter.php, query: {formato: json, id: "{{fields.id}}"}}
    output: {path: retorno.pedido}

  - name: Create Order
    resource: Order
    description: Creates a sales order.
    fields:
      - {name: pedido, label: Order, type: json, required: true, description: 'Like {"cliente": {"nome": "Maria Souza", "cpf_cnpj": "12345678909"}, "itens": [{"item": {"codigo": "CAM-01", "descricao": "Camiseta", "unidade": "UN", "quantidade": 2, "valor_unitario": 49.9}}], "situacao": "aberto"}'}
    request:
      method: POST
      path: pedido.incluir.php
      query: {formato: json}
      body_type: form
      body: {pedido: '{"pedido": {{fields.pedido}}}'}
    output: {path: retorno.registros}

  - name: Update Order Status
    resource: Order
    description: Moves a sales order to another status.
    fields:
      - {name: id, label: Order ID, required: true}
      - {name: situacao, label: Status, type: select, required: true, options: [{label: Open, value: aberto}, {label: Approved, value: aprovado}, {label: Preparing shipment, value: preparando_envio}, {label: Invoiced, value: faturado}, {label: Ready to ship, value: pronto_envio}, {label: Shipped, value: enviado}, {label: Delivered, value: entregue}, {label: Not delivered, value: nao_entregue}, {label: Cancelled, value: cancelado}]}
    request:
      method: POST
      path: pedido.alterar.situacao.php
      query: {formato: json}
      body_type: form
      body: {id: "{{fields.id}}", situacao: "{{fields.situacao}}"}
    output: {path: retorno}

  - name: Generate Order Invoice
    resource: Order
    description: Creates the invoice of a sales order, to issue next.
    fields:
      - {name: id, label: Order ID, required: true}
      - name: modelo
        label: Model
        type: select
        options: [{label: NF-e, value: NFe}, {label: NFC-e, value: NFCe}]
    request:
      method: POST
      path: gerar.nota.fiscal.pedido.php
      query: {formato: json}
      body_type: form
      body: {id: "{{fields.id}}", modelo: "{{fields.modelo}}"}
    output: {path: retorno.registros}

  # Invoices
  - name: Search Invoices
    resource: Invoice
    description: Searches invoices by type, number, customer, dates or status, 100 per page.
    fields:
      - name: tipoNota
        label: Type
        type: select
        options: [{label: Outgoing, value: S}, {label: Incoming, value: E}]
      - {name: numero, label: Number}
      - {name: cliente, label: Customer name}
      - {name: dataInicial, label: Issued since, description: "Like 01/01/2026"}
      - {name: dataFinal, label: Issued until, description: "Like 31/01/2026"}
      - {name: pagina, label: Page, type: number}
    request:
      method: GET
      path: notas.fiscais.pesquisa.php
      query: {formato: json, tipoNota: "{{fields.tipoNota}}", numero: "{{fields.numero}}", cliente: "{{fields.cliente}}", dataInicial: "{{fields.dataInicial}}", dataFinal: "{{fields.dataFinal}}", pagina: "{{fields.pagina}}"}
    output: {path: retorno.notas_fiscais}

  - name: Get Invoice
    resource: Invoice
    description: Reads an invoice, with items, taxes and its key.
    fields:
      - {name: id, label: Invoice ID, required: true}
    request: {method: GET, path: nota.fiscal.obter.php, query: {formato: json, id: "{{fields.id}}"}}
    output: {path: retorno.nota_fiscal}

  - name: Issue Invoice
    resource: Invoice
    description: Sends an invoice to SEFAZ for authorization.
    fields:
      - {name: id, label: Invoice ID, required: true}
    request:
      method: POST
      path: nota.fiscal.emitir.php
      query: {formato: json}
      body_type: form
      body: {id: "{{fields.id}}"}
    output: {path: retorno}

  - name: Get Invoice Link
    resource: Invoice
    description: Reads the link to an invoice's DANFE.
    fields:
      - {name: id, label: Invoice ID, required: true}
    request: {method: GET, path: nota.fiscal.obter.link.php, query: {formato: json, id: "{{fields.id}}"}}
    output: {path: retorno}

  # Bills
  - name: Search Receivables
    resource: Bill
    description: Searches accounts receivable by customer, due dates or status, 100 per page.
    fields:
      - {name: nome_cliente, label: Customer name}
      - {name: data_ini_vencimento, label: Due since, description: "Like 01/01/2026"}
      - {name: data_fim_vencimento, label: Due until, description: "Like 31/01/2026"}
      - name: situacao
        label: Status
        type: select
        options: [{label: Open, value: aberto}, {label: Paid, value: pago}, {label: Partially paid, value: parcial}, {label: Cancelled, value: cancelada}]
      - {name: pagina, label: Page, type: number}
    request:
      method: GET
      path: contas.receber.pesquisa.php
      query: {formato: json, nome_cliente: "{{fields.nome_cliente}}", data_ini_vencimento: "{{fields.data_ini_vencimento}}", data_fim_vencimento: "{{fields.data_fim_vencimento}}", situacao: "{{fields.situacao}}", pagina: "{{fields.pagina}}"}
    output: {path: retorno.contas}

  - name: Create Receivable
    resource: Bill
    description: Creates an account receivable.
    fields:
      - {name: conta, label: Receivable, type: json, required: true, description: 'Like {"cliente": {"nome": "Maria Souza"}, "vencimento": "31/01/2026", "valor": 150, "historico": "Pedido 123"}'}
    request:
      method: POST
      path: conta.receber.incluir.php
      query: {formato: json}
      body_type: form
      body: {conta: '{"conta": {{fields.conta}}}'}
    output: {path: retorno.registros}

  - name: Search Payables
    resource: Bill
    description: Searches accounts payable by supplier, due dates or status, 100 per page.
    fields:
      - {name: nome_cliente, label: Supplier name}
      - {name: data_ini_vencimento, label: Due since, description: "Like 01/01/2026"}
      - {name: data_fim_vencimento, label: Due until, description: "Like 31/01/2026"}
      - name: situacao
        label: Status
        type: select
        options: [{label: Open, value: aberto}, {label: Paid, value: pago}, {label: Partially paid, value: parcial}, {label: Cancelled, value: cancelada}]
      - {name: pagina, label: Page, type: number}
    request:
      method: GET
      path: contas.pagar.pesquisa.php
      query: {formato: json, nome_cliente: "{{fields.nome_cliente}}", data_ini_vencimento: "{{fields.data_ini_vencimento}}", data_fim_vencimento: "{{fields.data_fim_vencimento}}", situacao: "{{fields.situacao}}", pagina: "{{fields.pagina}}"}
    output: {path: retorno.contas}

  - name: Create Payable
    resource: Bill
    description: Creates an account payable.
    fields:
      - {name: conta, label: Payable, type: json, required: true, description: 'Like {"cliente": {"nome": "Fornecedor Ltda"}, "vencimento": "31/01/2026", "valor": 300, "historico": "Compra 45"}'}
    request:
      method: POST
      path: conta.pagar.incluir.php
      query: {formato: json}
      body_type: form
      body: {conta: '{"conta": {{fields.conta}}}'}
    output: {path: retorno.registros}

  # Account
  - name: Search Sellers
    resource: Account
    description: Lists the sellers, by name.
    fields:
      - {name: pesquisa, label: Search}
    request: {method: GET, path: vendedores.pesquisa.php, query: {formato: json, pesquisa: "{{fields.pesquisa}}"}}
    output: {path: retorno.vendedores}

  - name: Get Account Info
    resource: Account
    description: Reads the company's registration of the account.
    request: {method: GET, path: info.php, query: {formato: json}}
    output: {path: retorno.conta}

i18n:
