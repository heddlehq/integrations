      Generate Order Invoice: {name: "Gerar nota do pedido", description: "Gera a nota fiscal de um pedido de venda, para emitir em seguida.", fields: {id: "ID", modelo: "Modelo"}}
      Search Invoices: {name: "Pesquisar notas fiscais", description: "Pesquisa notas por tipo, número, cliente, datas ou situação, 100 por página.", fields: {tipoNota: "Tipo", numero: "Número", cliente: "Nome do cliente", dataInicial: "Data inicial", dataFinal: "Data final", pagina: "Página"}}
      Get Invoice: {name: "Obter nota fiscal", description: "Lê uma nota fiscal, com itens, impostos e chave.", fields: {id: "ID"}}
