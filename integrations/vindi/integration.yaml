#
# Vindi, through the API v1. Connect with the private API key from the panel's
# Configurações › Chaves de acesso. Use https://sandbox-app.vindi.com.br for the
# sandbox. Vindi's webhooks are set in the panel, so the triggers check for news
# every 5 minutes.
id: vindi
name: Vindi
version: 1.0.0
description: Subscriptions, bills, charges, customers and plans in Vindi.
icon: hero-arrow-path
