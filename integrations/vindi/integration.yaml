category: payments
author: Heddle
homepage: https://vindi.github.io/api-docs/dist/
base_url: "{{credential.url}}/api/v1/"

credential:
  label: Vindi
  fields:
    - {name: api_key, label: API key, secret: true, required: true}
    - {name: url, label: Address, default: "https://app.vindi.com.br", description: "https://sandbox-app.vindi.com.br for the sandbox."}
  auth:
    type: basic
    username: "{{credential.api_key}}"
    password: ""

errors:
  message_path: errors.0.message

triggers:
  - name: New Bill
    description: Starts the flow for each new bill, checking every 5 minutes.
    request: {method: GET, path: bills, query: {sort_by: created_at, sort_order: desc, per_page: 50}}
    output: {path: bills}
    poll: {every: 5, id: id}

  - name: Bill Paid
    description: Starts the flow each time a bill is paid, checking every 5 minutes.
    request: {method: GET, path: bills, query: {query: "status:paid", sort_by: updated_at, sort_order: desc, per_page: 50}}
    output: {path: bills}
    poll: {every: 5, id: id}

  - name: New Subscription
    description: Starts the flow for each new subscription, checking every 5 minutes.
    request: {method: GET, path: subscriptions, query: {sort_by: created_at, sort_order: desc, per_page: 50}}
    output: {path: subscriptions}
    poll: {every: 5, id: id}

actions:
  # Customers
  - name: Create Customer
    resource: Customer
    description: Creates a customer.
    fields:
      - {name: name, label: Name, required: true}
      - {name: email, label: Email}
      - {name: registry_code, label: CPF or CNPJ}
      - {name: code, label: Your ID}
      - {name: phones, label: Phones, type: json, description: '[{"phone_type": "mobile", "number": "5511999990000"}]'}
      - {name: address, label: Address, type: json}
      - {name: notes, label: Notes}
      - {name: metadata, label: Metadata, type: json}
    request:
      method: POST
      path: customers
      body: {name: "{{fields.name}}", email: "{{fields.email}}", registry_code: "{{fields.registry_code}}", code: "{{fields.code}}", phones: "{{fields.phones}}", address: "{{fields.address}}", notes: "{{fields.notes}}", metadata: "{{fields.metadata}}"}
    output: {path: customer}

  - name: Get Customer
    resource: Customer
    description: Reads a customer.
    fields:
      - {name: customer, label: Customer ID, required: true}
    request: {method: GET, path: "customers/{{fields.customer}}"}
    output: {path: customer}

  - name: List Customers
    resource: Customer
    description: Lists the customers.
    fields:
      - {name: query, label: Filter, description: "In Vindi's query syntax, like status:active or email:ana@acme.com"}
    request: {method: GET, path: customers, query: {query: "{{fields.query}}"}}
    pagination: {type: page, items_path: customers, page_param: page, limit_param: per_page, page_size: 50}

  - name: Update Customer
    resource: Customer
    description: Changes a customer. Empty fields stay as they are.
    fields:
      - {name: customer, label: Customer ID, required: true}
      - {name: name, label: Name}
      - {name: email, label: Email}
      - {name: registry_code, label: CPF or CNPJ}
      - {name: extra, label: More fields, type: json}
    request:
      method: PUT
      path: "customers/{{fields.customer}}"
      body: {name: "{{fields.name}}", email: "{{fields.email}}", registry_code: "{{fields.registry_code}}", _merge: "{{fields.extra}}"}
    output: {path: customer}

  - name: Archive Customer
    resource: Customer
    description: Archives a customer.
    fields:
      - {name: customer, label: Customer ID, required: true}
    request: {method: DELETE, path: "customers/{{fields.customer}}"}
    output: {path: customer}

  # Subscriptions
  - name: Create Subscription
    resource: Subscription
    description: Subscribes a customer to a plan.
    fields:
      - {name: customer, label: Customer ID, required: true}
      - {name: plan, label: Plan ID, required: true}
      - {name: payment_method, label: Method code, required: true, default: credit_card, description: "Like credit_card, bank_slip or pix"}
      - {name: start_at, label: Starts at, type: datetime}
      - {name: code, label: Your ID}
      - {name: product_items, label: Items, type: json, description: '[{"product_id": 1, "pricing_schema": {"price": 49.9}}] to change the plan''s.'}
      - {name: extra, label: More fields, type: json}
    request:
      method: POST
      path: subscriptions
      body: {customer_id: "{{fields.customer}}", plan_id: "{{fields.plan}}", payment_method_code: "{{fields.payment_method}}", start_at: "{{fields.start_at}}", code: "{{fields.code}}", product_items: "{{fields.product_items}}", _merge: "{{fields.extra}}"}

  - name: Get Subscription
    resource: Subscription
    description: Reads a subscription.
    fields:
      - {name: subscription, label: Subscription ID, required: true}
    request: {method: GET, path: "subscriptions/{{fields.subscription}}"}
    output: {path: subscription}

  - name: List Subscriptions
    resource: Subscription
    description: Lists the subscriptions.
    fields:
      - {name: query, label: Filter, description: "In Vindi's query syntax, like status:active or email:ana@acme.com"}
    request: {method: GET, path: subscriptions, query: {query: "{{fields.query}}"}}
    pagination: {type: page, items_path: subscriptions, page_param: page, limit_param: per_page, page_size: 50}

  - name: Cancel Subscription
    resource: Subscription
    description: Cancels a subscription, optionally canceling its open bills.
    fields:
      - {name: subscription, label: Subscription ID, required: true}
      - {name: cancel_bills, label: Cancel open bills, type: boolean, default: true}
    request: {method: DELETE, path: "subscriptions/{{fields.subscription}}", query: {cancel_bills: "{{fields.cancel_bills}}"}}
    output: {path: subscription}

  - name: Reactivate Subscription
    resource: Subscription
    description: Reactivates a canceled subscription.
    fields:
      - {name: subscription, label: Subscription ID, required: true}
    request: {method: POST, path: "subscriptions/{{fields.subscription}}/reactivate"}
    output: {path: subscription}

  # Bills
  - name: Create Bill
    resource: Bill
    description: Bills a customer once, outside a subscription.
    fields:
      - {name: customer, label: Customer ID, required: true}
      - {name: payment_method, label: Method code, required: true, default: pix}
      - {name: bill_items, label: Items, type: json, required: true, description: '[{"product_id": 1, "amount": 99.9}]'}
      - {name: due_at, label: Due at, type: datetime}
      - {name: installments, label: Installments, type: number}
      - {name: code, label: Your ID}
    request:
      method: POST
      path: bills
      body: {customer_id: "{{fields.customer}}", payment_method_code: "{{fields.payment_method}}", bill_items: "{{fields.bill_items}}", due_at: "{{fields.due_at}}", installments: "{{fields.installments}}", code: "{{fields.code}}"}
    output: {path: bill}

  - name: Get Bill
    resource: Bill
    description: Reads a bill, with its charges and payment links.
    fields:
      - {name: bill, label: Bill ID, required: true}
    request: {method: GET, path: "bills/{{fields.bill}}"}
    output: {path: bill}

  - name: List Bills
    resource: Bill
    description: Lists the bills.
    fields:
      - {name: query, label: Filter, description: "In Vindi's query syntax, like status:active or email:ana@acme.com"}
    request: {method: GET, path: bills, query: {query: "{{fields.query}}", sort_by: created_at, sort_order: desc}}
    pagination: {type: page, items_path: bills, page_param: page, limit_param: per_page, page_size: 50}

  - name: Cancel Bill
    resource: Bill
    description: Cancels an open bill.
    fields:
      - {name: bill, label: Bill ID, required: true}
    request: {method: DELETE, path: "bills/{{fields.bill}}"}
    output: {path: bill}

  # Charges
  - name: Charge Again
    resource: Charge
    description: Tries a pending charge again.
    fields:
      - {name: charge, label: Charge ID, required: true}
    request: {method: POST, path: "charges/{{fields.charge}}/charge", body: {}}
    output: {path: charge}

  - name: Refund Charge
    resource: Charge
    description: Refunds a paid charge, in full or in part.
    fields:
      - {name: charge, label: Charge ID, required: true}
      - {name: amount, label: Amount, type: number, description: "All when empty."}
      - {name: cancel_bill, label: Cancel the bill, type: boolean, default: true}
    request:
      method: POST
      path: "charges/{{fields.charge}}/refund"
      body: {amount: "{{fields.amount}}", cancel_bill: "{{fields.cancel_bill}}"}
    output: {path: charge}

  - name: Mark Charge Paid
    resource: Charge
    description: Marks a charge as paid outside Vindi.
    fields:
      - {name: charge, label: Charge ID, required: true}
      - {name: paid_at, label: Paid at, type: datetime}
      - {name: amount, label: Amount, type: number}
    request:
      method: POST
      path: "charges/{{fields.charge}}/pay"
      body: {paid_at: "{{fields.paid_at}}", amount: "{{fields.amount}}"}
    output: {path: charge}

  # Catalog
  - name: List Plans
    resource: Plan
    description: Lists the plans.
    fields:
      - {name: query, label: Filter, description: "In Vindi's query syntax, like status:active or email:ana@acme.com"}
    request: {method: GET, path: plans, query: {query: "{{fields.query}}"}}
    pagination: {type: page, items_path: plans, page_param: page, limit_param: per_page, page_size: 50}

  - name: List Products
    resource: Plan
    description: Lists the products.
    fields:
      - {name: query, label: Filter, description: "In Vindi's query syntax, like status:active or email:ana@acme.com"}
    request: {method: GET, path: products, query: {query: "{{fields.query}}"}}
    pagination: {type: page, items_path: products, page_param: page, limit_param: per_page, page_size: 50}

  - name: List Payment Methods
    resource: Plan
    description: Lists the payment methods on, with their codes.
    request: {method: GET, path: payment_methods}
    pagination: {type: page, items_path: payment_methods, page_param: page, limit_param: per_page, page_size: 50}

