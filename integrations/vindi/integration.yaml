      New Subscription: {name: "Nova assinatura", description: "Inicia o fluxo para cada assinatura nova, olhando a cada 5 minutos."}
    actions:
      Create Customer: {name: "Criar cliente", description: "Cria um cliente.", fields: {name: "Nome", email: "E-mail", registry_code: "CPF ou CNPJ", code: "Seu ID", phones: "Telefones", address: "Endereço", notes: "Observações", metadata: "Metadados"}}
