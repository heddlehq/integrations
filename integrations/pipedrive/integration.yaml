# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Pipedrive's API: version 2 for deals, people, organizations, products and activities,
# version 1 for leads, notes, files and webhooks, which have no version 2 yet. The API
# token is in Pipedrive, under your name > Personal preferences > API.
id: pipedrive
name: Pipedrive
version: 1.0.0
description: Deals and their products, people, organizations, leads, activities, notes, products and files in Pipedrive.
icon: hero-funnel
logo: |
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#017737"/><path fill="#fff" transform="translate(27.93 4.64) scale(0.6494)" d="M44.137599,23.6490765 C33.8495827,23.6490765 27.8999812,28.2657157 25.0297111,31.4550794 C24.6886111,28.7074166 22.8762226,25.1423714 15.8027202,25.1423714 L0.442216706,25.1423714 L0.442216706,41.2196565 L6.73763387,41.2196565 C7.8033749,41.2196565 8.14604679,41.5591846 8.14604679,42.6233537 L8.14604679,116.035306 L26.4554149,116.035306 L26.4554149,88.4816559 C26.4554149,87.7381522 26.4412679,87.0433771 26.4224052,86.4209089 C29.2816721,89.0475361 34.7439878,92.6644537 43.2762036,92.6644537 C61.1721648,92.6644537 73.6844046,78.4781516 73.6844046,58.1599089 C73.6844046,37.5194288 61.8040643,23.6490765 44.137599,23.6490765 M40.4185087,76.7160636 C30.56119,76.7160636 26.0828771,67.2784394 26.0828771,58.5340185 C26.0828771,44.7611234 33.6153712,39.8521127 40.6621515,39.8521127 C49.3059715,39.8521127 55.1188186,47.3044405 55.1188186,58.4051236 C55.1188186,71.0635492 47.7293664,76.7160636 40.4185087,76.7160636"/></svg>
category: crm
author: Heddle
homepage: https://developers.pipedrive.com/docs/api/v1
base_url: https://api.pipedrive.com/

credential:
  label: Pipedrive
  fields:
    - {name: api_token, label: API token, secret: true, required: true}
  auth:
    type: header
    name: x-api-token
    value: "{{credential.api_token}}"

errors:
  message_path: error

triggers:
  - name: Event
    description: Starts the flow when deals, people, activities or other things you choose are added, changed or deleted.
    fields:
      - {name: object, label: What, type: select, required: true, default: "*", options: [{label: Everything, value: "*"}, {label: Deals, value: deal}, {label: People, value: person}, {label: Organizations, value: organization}, {label: Leads, value: lead}, {label: Activities, value: activity}, {label: Activity types, value: activityType}, {label: Notes, value: note}, {label: Products, value: product}, {label: Pipelines, value: pipeline}, {label: Stages, value: stage}, {label: Users, value: user}]}
      - {name: action, label: When, type: select, required: true, default: "*", options: [{label: Anything happens, value: "*"}, {label: Added, value: create}, {label: Changed, value: change}, {label: Deleted, value: delete}]}
    webhook:
      register:
        request:
          method: POST
          path: api/v1/webhooks
          body:
            subscription_url: "{{webhook.url}}"
            event_object: "{{fields.object}}"
            event_action: "{{fields.action}}"
            http_auth_user: heddle
            http_auth_password: "{{webhook.secret}}"
            version: "2.0"
        id_path: data.id
      unregister:
        request: {method: DELETE, path: "api/v1/webhooks/{{webhook.id}}"}
      signature:
        basic: {username: heddle, password: "{{webhook.secret}}"}

actions:
  # Deals
  - name: Create Deal
    resource: Deal
    description: Creates a deal.
    fields:
      - {name: title, label: Title, required: true}
      - {name: value, label: Value, type: number}
      - {name: currency, label: Currency, description: "Like BRL or USD"}
      - {name: person_id, label: Person ID, type: number}
      - {name: org_id, label: Organization ID, type: number}
      - {name: pipeline_id, label: Pipeline, type: select, options_from: {request: {method: GET, path: api/v2/pipelines}, path: data}}
      - {name: stage_id, label: Stage, type: select, options_from: {request: {method: GET, path: api/v2/stages, query: {pipeline_id: "{{fields.pipeline_id}}"}}, path: data}}
      - {name: status, label: Status, type: select, options: [{label: Open, value: open}, {label: Won, value: won}, {label: Lost, value: lost}]}
      - {name: owner_id, label: Owner, type: select, options_from: {request: {method: GET, path: api/v1/users}, path: data}}
      - {name: expected_close_date, label: Expected close date, type: datetime}
      - {name: probability, label: Probability (%), type: number}
      - {name: lost_reason, label: Lost reason}
      - {name: visible_to, label: Visible to, type: select, options: [{label: Owner only, value: 1}, {label: Owner's group, value: 3}, {label: Owner's group and subgroups, value: 5}, {label: Everyone, value: 7}]}
      - {name: label_ids, label: Label IDs, type: json, description: "Like [1, 2]"}
      - {name: custom_fields, label: Custom fields, type: json, description: "By field key, like {\"8f4b27fbd...\": \"x\"}"}
    request:
      method: POST
      path: api/v2/deals
      body:
        title: "{{fields.title}}"
        value: "{{fields.value}}"
        currency: "{{fields.currency}}"
        person_id: "{{fields.person_id}}"
        org_id: "{{fields.org_id}}"
        pipeline_id: "{{fields.pipeline_id}}"
        stage_id: "{{fields.stage_id}}"
        status: "{{fields.status}}"
        owner_id: "{{fields.owner_id}}"
        expected_close_date: "{{fields.expected_close_date}}"
        probability: "{{fields.probability}}"
        lost_reason: "{{fields.lost_reason}}"
        visible_to: "{{fields.visible_to}}"
        label_ids: "{{fields.label_ids}}"
        custom_fields: "{{fields.custom_fields}}"
    output: {path: data}

  - name: Get Deal
    resource: Deal
    description: Reads a deal.
    fields:
      - {name: id, label: Deal ID, required: true}
      - {name: include_fields, label: Also include, description: "Comma separated, like next_activity_id,email_messages_count"}
    request:
      method: GET
      path: "api/v2/deals/{{fields.id}}"
      query: {include_fields: "{{fields.include_fields}}"}
    output: {path: data}

  - name: Get Deals
    resource: Deal
    description: Lists deals, all of them or those that match.
    fields:
      - {name: filter_id, label: Saved filter ID, type: number}
      - {name: owner_id, label: Owner ID, type: number}
      - {name: person_id, label: Person ID, type: number}
      - {name: org_id, label: Organization ID, type: number}
      - {name: pipeline_id, label: Pipeline ID, type: number}
      - {name: stage_id, label: Stage ID, type: number}
      - {name: status, label: Status, type: select, options: [{label: Open, value: open}, {label: Won, value: won}, {label: Lost, value: lost}, {label: Deleted, value: deleted}]}
      - {name: updated_since, label: Updated since, type: datetime}
      - {name: sort_by, label: Sort by, type: select, options: [{label: ID, value: id}, {label: Updated, value: update_time}, {label: Added, value: add_time}]}
      - {name: sort_direction, label: Direction, type: select, options: [{label: Ascending, value: asc}, {label: Descending, value: desc}]}
    request:
      method: GET
      path: api/v2/deals
      query:
        filter_id: "{{fields.filter_id}}"
        owner_id: "{{fields.owner_id}}"
        person_id: "{{fields.person_id}}"
        org_id: "{{fields.org_id}}"
        pipeline_id: "{{fields.pipeline_id}}"
        stage_id: "{{fields.stage_id}}"
        status: "{{fields.status}}"
        updated_since: "{{fields.updated_since}}"
        sort_by: "{{fields.sort_by}}"
        sort_direction: "{{fields.sort_direction}}"
    pagination: {type: cursor, items_path: data, cursor_param: cursor, next_path: additional_data.next_cursor, limit_param: limit, page_size: 500}

  - name: Search Deals
    resource: Deal
    description: Finds deals by title, notes or custom fields.
    fields:
      - {name: term, label: Text, required: true, description: At least 2 characters.}
      - {name: fields, label: In, type: multiselect, options: [{label: Title, value: title}, {label: Notes, value: notes}, {label: Custom fields, value: custom_fields}]}
      - {name: exact_match, label: Exact match, type: boolean}
      - {name: person_id, label: Person ID, type: number}
      - {name: organization_id, label: Organization ID, type: number}
      - {name: status, label: Status, type: select, options: [{label: Open, value: open}, {label: Won, value: won}, {label: Lost, value: lost}]}
    request:
      method: GET
      path: api/v2/deals/search
      query:
        term: "{{fields.term}}"
        fields: "{{fields.fields}}"
        exact_match: "{{fields.exact_match}}"
        person_id: "{{fields.person_id}}"
        organization_id: "{{fields.organization_id}}"
        status: "{{fields.status}}"
    pagination: {type: cursor, items_path: data.items, cursor_param: cursor, next_path: additional_data.next_cursor, limit_param: limit, page_size: 500}

  - name: Update Deal
    resource: Deal
    description: Changes a deal. Empty fields stay as they are.
    fields:
      - {name: id, label: Deal ID, required: true}
      - {name: title, label: Title}
      - {name: value, label: Value, type: number}
      - {name: currency, label: Currency}
      - {name: person_id, label: Person ID, type: number}
      - {name: org_id, label: Organization ID, type: number}
      - {name: pipeline_id, label: Pipeline ID, type: number}
      - {name: stage_id, label: Stage ID, type: number}
      - {name: status, label: Status, type: select, options: [{label: Open, value: open}, {label: Won, value: won}, {label: Lost, value: lost}]}
      - {name: owner_id, label: Owner ID, type: number}
      - {name: expected_close_date, label: Expected close date, type: datetime}
      - {name: probability, label: Probability (%), type: number}
      - {name: lost_reason, label: Lost reason}
      - {name: visible_to, label: Visible to, type: select, options: [{label: Owner only, value: 1}, {label: Owner's group, value: 3}, {label: Owner's group and subgroups, value: 5}, {label: Everyone, value: 7}]}
      - {name: label_ids, label: Label IDs, type: json, description: "Like [1, 2]"}
      - {name: custom_fields, label: Custom fields, type: json, description: "By field key, like {\"8f4b27fbd...\": \"x\"}"}
    request:
      method: PATCH
      path: "api/v2/deals/{{fields.id}}"
      body:
        title: "{{fields.title}}"
        value: "{{fields.value}}"
        currency: "{{fields.currency}}"
        person_id: "{{fields.person_id}}"
        org_id: "{{fields.org_id}}"
        pipeline_id: "{{fields.pipeline_id}}"
        stage_id: "{{fields.stage_id}}"
        status: "{{fields.status}}"
        owner_id: "{{fields.owner_id}}"
        expected_close_date: "{{fields.expected_close_date}}"
        probability: "{{fields.probability}}"
        lost_reason: "{{fields.lost_reason}}"
        visible_to: "{{fields.visible_to}}"
        label_ids: "{{fields.label_ids}}"
        custom_fields: "{{fields.custom_fields}}"
    output: {path: data}

  - name: Duplicate Deal
    resource: Deal
    description: Copies a deal.
    fields:
      - {name: id, label: Deal ID, required: true}
    request:
      method: POST
      path: "api/v1/deals/{{fields.id}}/duplicate"
    output: {path: data}

  - name: Delete Deal
    resource: Deal
    description: Deletes a deal. Pipedrive keeps it for 30 days.
    fields:
      - {name: id, label: Deal ID, required: true}
    request:
      method: DELETE
      path: "api/v2/deals/{{fields.id}}"
    output: {path: data}

  # Deal products
  - name: Add Product to Deal
    resource: Deal Product
    description: Adds a product to a deal.
    fields:
      - {name: deal_id, label: Deal ID, required: true}
      - {name: product_id, label: Product ID, type: number, required: true}
      - {name: item_price, label: Price, type: number, required: true}
      - {name: quantity, label: Quantity, type: number, required: true, default: 1}
      - {name: discount, label: Discount, type: number}
      - {name: discount_type, label: Discount is, type: select, options: [{label: A percentage, value: percentage}, {label: An amount, value: amount}]}
      - {name: tax, label: Tax (%), type: number}
      - {name: tax_method, label: Tax, type: select, options: [{label: Exclusive, value: exclusive}, {label: Inclusive, value: inclusive}, {label: None, value: none}]}
      - {name: comments, label: Comments}
      - {name: product_variation_id, label: Variation ID, type: number}
      - {name: is_enabled, label: Enabled, type: boolean, default: true}
    request:
      method: POST
      path: "api/v2/deals/{{fields.deal_id}}/products"
      body:
        product_id: "{{fields.product_id}}"
        item_price: "{{fields.item_price}}"
        quantity: "{{fields.quantity}}"
        discount: "{{fields.discount}}"
        discount_type: "{{fields.discount_type}}"
        tax: "{{fields.tax}}"
        tax_method: "{{fields.tax_method}}"
        comments: "{{fields.comments}}"
        product_variation_id: "{{fields.product_variation_id}}"
        is_enabled: "{{fields.is_enabled}}"
    output: {path: data}

  - name: Get Deal Products
    resource: Deal Product
    description: Lists the products of a deal.
    fields:
      - {name: deal_id, label: Deal ID, required: true}
    request:
      method: GET
      path: "api/v2/deals/{{fields.deal_id}}/products"
    pagination: {type: cursor, items_path: data, cursor_param: cursor, next_path: additional_data.next_cursor, limit_param: limit, page_size: 500}

  - name: Update Deal Product
    resource: Deal Product
    description: Changes a product of a deal. Empty fields stay as they are.
    fields:
      - {name: deal_id, label: Deal ID, required: true}
      - {name: attachment_id, label: Deal product ID, required: true}
      - {name: product_id, label: Product ID, type: number}
      - {name: item_price, label: Price, type: number}
      - {name: quantity, label: Quantity, type: number}
      - {name: discount, label: Discount, type: number}
      - {name: discount_type, label: Discount is, type: select, options: [{label: A percentage, value: percentage}, {label: An amount, value: amount}]}
      - {name: tax, label: Tax (%), type: number}
      - {name: comments, label: Comments}
      - {name: is_enabled, label: Enabled, type: boolean}
    request:
      method: PATCH
      path: "api/v2/deals/{{fields.deal_id}}/products/{{fields.attachment_id}}"
      body:
        product_id: "{{fields.product_id}}"
        item_price: "{{fields.item_price}}"
        quantity: "{{fields.quantity}}"
        discount: "{{fields.discount}}"
        discount_type: "{{fields.discount_type}}"
        tax: "{{fields.tax}}"
        comments: "{{fields.comments}}"
        is_enabled: "{{fields.is_enabled}}"
    output: {path: data}

  - name: Remove Product from Deal
    resource: Deal Product
    description: Takes a product off a deal.
    fields:
      - {name: deal_id, label: Deal ID, required: true}
      - {name: attachment_id, label: Deal product ID, required: true}
    request:
      method: DELETE
      path: "api/v2/deals/{{fields.deal_id}}/products/{{fields.attachment_id}}"
    output: {path: data}

  # People
  - name: Create Person
    resource: Person
    description: Creates a person.
    fields:
      - {name: name, label: Name, required: true}
      - {name: emails, label: Emails, type: json, description: "Like [{\"value\": \"ana@acme.test\", \"primary\": true, \"label\": \"work\"}]"}
      - {name: phones, label: Phones, type: json, description: "Like [{\"value\": \"+5511999990000\", \"primary\": true, \"label\": \"mobile\"}]"}
      - {name: org_id, label: Organization ID, type: number}
      - {name: owner_id, label: Owner, type: select, options_from: {request: {method: GET, path: api/v1/users}, path: data}}
      - {name: visible_to, label: Visible to, type: select, options: [{label: Owner only, value: 1}, {label: Owner's group, value: 3}, {label: Owner's group and subgroups, value: 5}, {label: Everyone, value: 7}]}
      - {name: label_ids, label: Label IDs, type: json, description: "Like [1, 2]"}
      - {name: marketing_status, label: Marketing status, type: select, options: [{label: No consent, value: no_consent}, {label: Unsubscribed, value: unsubscribed}, {label: Subscribed, value: subscribed}, {label: Archived, value: archived}]}
      - {name: custom_fields, label: Custom fields, type: json, description: "By field key"}
    request:
      method: POST
      path: api/v2/persons
      body:
        name: "{{fields.name}}"
        emails: "{{fields.emails}}"
        phones: "{{fields.phones}}"
        org_id: "{{fields.org_id}}"
        owner_id: "{{fields.owner_id}}"
        visible_to: "{{fields.visible_to}}"
        label_ids: "{{fields.label_ids}}"
        marketing_status: "{{fields.marketing_status}}"
        custom_fields: "{{fields.custom_fields}}"
    output: {path: data}

  - name: Get Person
    resource: Person
    description: Reads a person.
    fields:
      - {name: id, label: Person ID, required: true}
      - {name: include_fields, label: Also include, description: "Comma separated, like open_deals_count,email_messages_count"}
    request:
      method: GET
      path: "api/v2/persons/{{fields.id}}"
      query: {include_fields: "{{fields.include_fields}}"}
    output: {path: data}

  - name: Get People
    resource: Person
    description: Lists people, all of them or those that match.
    fields:
      - {name: filter_id, label: Saved filter ID, type: number}
      - {name: owner_id, label: Owner ID, type: number}
      - {name: org_id, label: Organization ID, type: number}
      - {name: updated_since, label: Updated since, type: datetime}
      - {name: sort_by, label: Sort by, type: select, options: [{label: ID, value: id}, {label: Updated, value: update_time}, {label: Added, value: add_time}]}
      - {name: sort_direction, label: Direction, type: select, options: [{label: Ascending, value: asc}, {label: Descending, value: desc}]}
    request:
      method: GET
      path: api/v2/persons
      query:
        filter_id: "{{fields.filter_id}}"
        owner_id: "{{fields.owner_id}}"
        org_id: "{{fields.org_id}}"
        updated_since: "{{fields.updated_since}}"
        sort_by: "{{fields.sort_by}}"
        sort_direction: "{{fields.sort_direction}}"
    pagination: {type: cursor, items_path: data, cursor_param: cursor, next_path: additional_data.next_cursor, limit_param: limit, page_size: 500}

  - name: Search People
    resource: Person
    description: Finds people by name, email, phone, notes or custom fields.
    fields:
      - {name: term, label: Text, required: true, description: At least 2 characters.}
      - {name: fields, label: In, type: multiselect, options: [{label: Name, value: name}, {label: Email, value: email}, {label: Phone, value: phone}, {label: Notes, value: notes}, {label: Custom fields, value: custom_fields}]}
      - {name: exact_match, label: Exact match, type: boolean}
      - {name: organization_id, label: Organization ID, type: number}
    request:
      method: GET
      path: api/v2/persons/search
      query:
        term: "{{fields.term}}"
        fields: "{{fields.fields}}"
        exact_match: "{{fields.exact_match}}"
        organization_id: "{{fields.organization_id}}"
    pagination: {type: cursor, items_path: data.items, cursor_param: cursor, next_path: additional_data.next_cursor, limit_param: limit, page_size: 500}

  - name: Update Person
    resource: Person
    description: Changes a person. Empty fields stay as they are.
    fields:
      - {name: id, label: Person ID, required: true}
      - {name: name, label: Name}
      - {name: emails, label: Emails, type: json, description: "Replaces them, like [{\"value\": \"ana@acme.test\", \"primary\": true}]"}
      - {name: phones, label: Phones, type: json, description: "Replaces them, like [{\"value\": \"+5511999990000\", \"primary\": true}]"}
      - {name: org_id, label: Organization ID, type: number}
      - {name: owner_id, label: Owner ID, type: number}
      - {name: visible_to, label: Visible to, type: select, options: [{label: Owner only, value: 1}, {label: Owner's group, value: 3}, {label: Owner's group and subgroups, value: 5}, {label: Everyone, value: 7}]}
      - {name: label_ids, label: Label IDs, type: json}
      - {name: marketing_status, label: Marketing status, type: select, options: [{label: No consent, value: no_consent}, {label: Unsubscribed, value: unsubscribed}, {label: Subscribed, value: subscribed}, {label: Archived, value: archived}]}
      - {name: custom_fields, label: Custom fields, type: json, description: "By field key"}
    request:
      method: PATCH
      path: "api/v2/persons/{{fields.id}}"
      body:
        name: "{{fields.name}}"
        emails: "{{fields.emails}}"
        phones: "{{fields.phones}}"
        org_id: "{{fields.org_id}}"
        owner_id: "{{fields.owner_id}}"
        visible_to: "{{fields.visible_to}}"
        label_ids: "{{fields.label_ids}}"
        marketing_status: "{{fields.marketing_status}}"
        custom_fields: "{{fields.custom_fields}}"
    output: {path: data}

  - name: Delete Person
    resource: Person
    description: Deletes a person. Pipedrive keeps it for 30 days.
    fields:
      - {name: id, label: Person ID, required: true}
    request:
      method: DELETE
      path: "api/v2/persons/{{fields.id}}"
    output: {path: data}

  # Organizations
  - name: Create Organization
    resource: Organization
    description: Creates an organization.
    fields:
      - {name: name, label: Name, required: true}
      - {name: address, label: Address}
      - {name: owner_id, label: Owner, type: select, options_from: {request: {method: GET, path: api/v1/users}, path: data}}
      - {name: visible_to, label: Visible to, type: select, options: [{label: Owner only, value: 1}, {label: Owner's group, value: 3}, {label: Owner's group and subgroups, value: 5}, {label: Everyone, value: 7}]}
      - {name: label_ids, label: Label IDs, type: json, description: "Like [1, 2]"}
      - {name: custom_fields, label: Custom fields, type: json, description: "By field key"}
    request:
      method: POST
      path: api/v2/organizations
      body:
        name: "{{fields.name}}"
        address: {value: "{{fields.address}}"}
        owner_id: "{{fields.owner_id}}"
        visible_to: "{{fields.visible_to}}"
        label_ids: "{{fields.label_ids}}"
        custom_fields: "{{fields.custom_fields}}"
    output: {path: data}

  - name: Get Organization
    resource: Organization
    description: Reads an organization.
    fields:
      - {name: id, label: Organization ID, required: true}
      - {name: include_fields, label: Also include, description: "Comma separated, like open_deals_count,people_count"}
    request:
      method: GET
      path: "api/v2/organizations/{{fields.id}}"
      query: {include_fields: "{{fields.include_fields}}"}
    output: {path: data}

  - name: Get Organizations
    resource: Organization
    description: Lists organizations, all of them or those that match.
    fields:
      - {name: filter_id, label: Saved filter ID, type: number}
      - {name: owner_id, label: Owner ID, type: number}
      - {name: updated_since, label: Updated since, type: datetime}
      - {name: sort_by, label: Sort by, type: select, options: [{label: ID, value: id}, {label: Updated, value: update_time}, {label: Added, value: add_time}]}
      - {name: sort_direction, label: Direction, type: select, options: [{label: Ascending, value: asc}, {label: Descending, value: desc}]}
    request:
      method: GET
      path: api/v2/organizations
      query:
        filter_id: "{{fields.filter_id}}"
        owner_id: "{{fields.owner_id}}"
