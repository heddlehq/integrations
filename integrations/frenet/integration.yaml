# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Frenet, the shipping gateway: quotes across Correios and the carriers the account
# has, tracking and CEP lookup. Connect with the token from Frenet's panel, under
# Dados da conta › Chave de acesso. Frenet sends tracking updates to an address that
# its support sets up: give them the trigger's address and ask them to send the
# webhook token below in the X-Heddle-Token header.
id: frenet
name: Frenet
version: 1.0.0
description: Quote shipping across carriers, track shipments, look up addresses by CEP and receive tracking updates, through Frenet.
icon: hero-truck
logo: |-
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#FFFFFF"/><svg x="3.00" y="3.26" width="18.00" height="17.48" viewBox="0 0 103 100"><path d="M74.5395 67.2523C74.0205 67.5374 73.4382 67.6859 72.8487 67.6859C72.3273 67.6859 71.7986 67.569 71.3016 67.3253C71.2967 67.3229 71.2894 67.3204 71.2845 67.3156C71.2187 67.2839 71.1554 67.2496 71.092 67.2132L44.9225 52.1052C44.8664 52.0758 44.8104 52.0443 44.7568 52.01C44.7178 51.9856 44.6812 51.9613 44.6447 51.937C44.6349 51.9322 44.6275 51.9273 44.6203 51.92C44.1793 51.6253 43.8114 51.2305 43.5435 50.7699L43.541 50.7626C43.2925 50.3339 43.1317 49.849 43.0854 49.3299C43.0757 49.2229 43.0708 49.1156 43.0708 49.006V18.6775C43.0708 18.5679 43.0758 18.4607 43.0854 18.3536C43.1317 17.8345 43.2925 17.3498 43.541 16.9209C43.6945 16.6528 43.8821 16.4093 44.0989 16.1924C44.2938 15.9975 44.5107 15.8269 44.747 15.6808C44.7519 15.6784 44.7568 15.6735 44.7617 15.6711L44.9321 15.5735L56.3832 8.96113L45.6289 2.75316C44.8273 2.2903 43.9526 2.07099 43.0903 2.07099H43.0707C42.1984 2.07343 41.3384 2.30249 40.5807 2.73123C40.5319 2.75803 40.4856 2.78727 40.4369 2.81421L2.66056 24.6248C2.58989 24.6638 2.51936 24.7052 2.44856 24.7466C2.1001 24.9586 1.77858 25.2119 1.49104 25.4994C1.17669 25.8138 0.903775 26.167 0.682164 26.5544C0.248416 27.3024 0 28.1697 0 29.0956V72.9754C0 73.9012 0.248416 74.7686 0.682164 75.5165C1.10846 76.2572 1.71766 76.8809 2.44856 77.3244C2.51923 77.3658 2.58989 77.4072 2.66056 77.4462L40.542 99.3178C41.3435 99.7807 42.2206 100.002 43.0856 100C43.9505 100 44.8057 99.7784 45.5609 99.3568C45.6194 99.3251 45.6779 99.2934 45.7339 99.2569L83.5106 77.4462C83.5812 77.4072 83.6519 77.3658 83.7225 77.3244C84.0709 77.1124 84.3925 76.8591 84.6799 76.5715C84.992 76.2596 85.2648 75.9063 85.4841 75.5239C85.4889 75.5214 85.4889 75.5165 85.4889 75.5165C85.9226 74.7686 86.1711 73.9012 86.1711 72.9754V60.5375L74.6445 67.1939L74.5395 67.2523Z" fill="url(#paint0_linear_4016_316)"></path><pa