category: logistics
author: Heddle
homepage: https://docs.frenet.com.br
base_url: https://api.frenet.com.br/
headers:
  User-Agent: Heddle
  Accept: application/json

credential:
  label: Frenet
  fields:
    - {name: token, label: Token, secret: true, required: true, description: "From Dados da conta › Chave de acesso."}
    - {name: webhook_token, label: Webhook token, secret: true, description: "Any secret text, for the Tracking Update trigger. Frenet's support sets it as the X-Heddle-Token header."}
  auth:
    type: header
    name: token
    value: "{{credential.token}}"

triggers:
  - name: Tracking Update
    description: Starts the flow when a shipment has a new tracking event, like posted, out for delivery or delivered. Frenet's support sets the address up.
    webhook:
      signature: {header: X-Heddle-Token, token: "{{credential.webhook_token}}"}

actions:
  - name: Quote Shipping
    resource: Shipping
    description: Quotes a shipment across the account's carriers, with price and days for each service.
    fields:
      - {name: SellerCEP, label: From CEP, required: true}
      - {name: RecipientCEP, label: To CEP, required: true}
      - {name: ShipmentInvoiceValue, label: Order value, type: number, required: true}
      - {name: items, label: Items, type: json, required: true, description: 'Like [{"Weight": 0.5, "Height": 10, "Length": 20, "Width": 15, "Quantity": 1, "SKU": "CAM-01"}]. Weight in kg, sizes in cm.'}
      - {name: ShippingServiceCode, label: Service code, description: "Only this service. From List Shipping Services."}
      - {name: RecipientCountry, label: Country, default: BR}
      - {name: Coupom, label: Coupon}
    request:
      method: POST
      path: shipping/quote
      body:
        SellerCEP: "{{fields.SellerCEP}}"
        RecipientCEP: "{{fields.RecipientCEP}}"
        ShipmentInvoiceValue: "{{fields.ShipmentInvoiceValue}}"
        ShippingItemArray: "{{fields.items}}"
        ShippingServiceCode: "{{fields.ShippingServiceCode}}"
        RecipientCountry: "{{fields.RecipientCountry}}"
        Coupom: "{{fields.Coupom}}"
    output: {path: ShippingSevicesArray}

  - name: List Shipping Services
    resource: Shipping
    description: Lists the shipping services the account can quote.
    request: {method: GET, path: shipping/info}
    output: {path: ShippingSeviceAvailableArray}

  - name: Track Shipment
    resource: Tracking
    description: Reads a shipment's tracking events, by tracking number.
    fields:
      - {name: ShippingServiceCode, label: Service code, required: true}
      - {name: TrackingNumber, label: Tracking number, required: true}
      - {name: InvoiceNumber, label: Invoice number}
      - {name: InvoiceSerie, label: Invoice series}
      - {name: RecipientDocument, label: Recipient CPF or CNPJ}
      - {name: OrderNumber, label: Order number}
    request:
      method: POST
      path: tracking/trackinginfo
      body:
        ShippingServiceCode: "{{fields.ShippingServiceCode}}"
        TrackingNumber: "{{fields.TrackingNumber}}"
        InvoiceNumber: "{{fields.InvoiceNumber}}"
        InvoiceSerie: "{{fields.InvoiceSerie}}"
        RecipientDocument: "{{fields.RecipientDocument}}"
        OrderNumber: "{{fields.OrderNumber}}"

  - name: Get Address
    resource: CEP
    description: Reads the street, district, city and state of a CEP.
    fields:
      - {name: cep, label: CEP, required: true}
    request: {method: GET, path: "CEP/Address/{{fields.cep}}"}

i18n:
  pt-BR:
    description: "Cote frete entre transportadoras, rastreie envios, consulte endereços por CEP e receba atualizações de rastreio pela Frenet."
    triggers:
      Tracking Update: {name: "Atualização de rastreio", description: "Inicia o fluxo quando um envio tem um novo evento de rastreio, como postado, saiu para entrega ou entregue. O suporte da Frenet configura o endereço."}
    actions:
      Quote Shipping: {name: "Cotar frete", description: "Cota um envio entre as transportadoras da conta, com preço e prazo de cada serviço.", fields: {SellerCEP: "CEP de origem", RecipientCEP: "CEP de destino", ShipmentInvoiceValue: "Valor do pedido", items: "Itens", ShippingServiceCode: "Código do serviço", RecipientCountry: "País", Coupom: "Cupom"}}
      List Shipping Services: {name: "Listar serviços de frete", description: "Lista os serviços de frete que a conta pode cotar."}
      Track Shipment: {name: "Rastrear envio", description: "Lê os eventos de rastreio de um envio, pelo código de rastreio.", fields: {ShippingServiceCode: "Código do serviço", TrackingNumber: "Código de rastreio", InvoiceNumber: "Número da nota", InvoiceSerie: "Série da nota", RecipientDocument: "CPF ou CNPJ do destinatário", OrderNumber: "Número do pedido"}}
      Get Address: {name: "Consultar CEP", description: "Lê rua, bairro, cidade e estado de um CEP.", fields: {cep: "CEP"}}
