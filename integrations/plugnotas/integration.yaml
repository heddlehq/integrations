#
# PlugNotas, TecnoSpeed's invoice API. Connect with the API key from PlugNotas'
# panel; use https://api.sandbox.plugnotas.com.br with the sandbox key. Invoices go
# in PlugNotas' format, as a list, and are named by the ID PlugNotas returns.
# Issuing is asynchronous: read the summary to see an invoice authorized.
id: plugnotas
name: PlugNotas
version: 1.0.0
description: Issue, read, download and cancel NF-e, NFC-e and NFS-e, and register companies, through TecnoSpeed's PlugNotas.
icon: hero-document-text
