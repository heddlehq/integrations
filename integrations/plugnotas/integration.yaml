category: fiscal
author: Heddle
homepage: https://docs.plugnotas.com.br
base_url: "{{credential.url}}/"
headers:
  User-Agent: Heddle

credential:
  label: PlugNotas
  fields:
    - {name: api_key, label: API key, secret: true, required: true}
    - {name: url, label: API address, default: "https://api.plugnotas.com.br", description: "https://api.sandbox.plugnotas.com.br for the sandbox."}
  auth:
    type: header
    name: x-api-key
    value: "{{credential.api_key}}"

errors:
  message_path: error.message

actions:
  # NF-e
  - name: Issue NF-e
    resource: NF-e
    description: Sends one or more NF-e for authorization.
    fields:
      - {name: notas, label: Invoices, type: json, required: true, description: 'A list, like [{"idIntegracao": "pedido-123", "emitente": {...}, "destinatario": {...}, "itens": [...]}]'}
    request:
      method: POST
      path: nfe
      body: "{{fields.notas}}"

  - name: Get NF-e Summary
    resource: NF-e
    description: Reads an NF-e's status, number and key.
    fields:
      - {name: id, label: Invoice ID, required: true}
    request: {method: GET, path: "nfe/{{fields.id}}/resumo"}

  - name: Download NF-e PDF
    resource: NF-e
    description: Downloads an NF-e's DANFE as a PDF.
    fields:
      - {name: id, label: Invoice ID, required: true}
    request: {method: GET, path: "nfe/{{fields.id}}/pdf"}
    output:
      file: {name: "nfe-{{fields.id}}.pdf"}

  - name: Download NF-e XML
    resource: NF-e
    description: Downloads an NF-e's XML.
    fields:
      - {name: id, label: Invoice ID, required: true}
    request: {method: GET, path: "nfe/{{fields.id}}/xml"}
    output:
      file: {name: "nfe-{{fields.id}}.xml"}

  - name: Cancel NF-e
    resource: NF-e
    description: Asks to cancel an authorized NF-e.
    fields:
      - {name: id, label: Invoice ID, required: true}
      - {name: justificativa, label: Reason, required: true, description: 15 to 255 characters.}
    request:
      method: POST
      path: "nfe/{{fields.id}}/cancelamento"
      body: {justificativa: "{{fields.justificativa}}"}

  - name: Correct NF-e
    resource: NF-e
    description: Sends a correction letter (CC-e) for an NF-e.
    fields:
      - {name: id, label: Invoice ID, required: true}
      - {name: correcao, label: Correction, type: textarea, required: true}
    request:
      method: POST
      path: "nfe/{{fields.id}}/cce"
      body: {correcao: "{{fields.correcao}}"}

  # NFC-e
  - name: Issue NFC-e
    resource: NFC-e
    description: Sends one or more consumer invoices (NFC-e).
    fields:
      - {name: notas, label: Invoices, type: json, required: true}
    request:
      method: POST
      path: nfce
      body: "{{fields.notas}}"

  - name: Get NFC-e Summary
    resource: NFC-e
    description: Reads an NFC-e's status.
    fields:
      - {name: id, label: Invoice ID, required: true}
    request: {method: GET, path: "nfce/{{fields.id}}/resumo"}

  - name: Download NFC-e PDF
    resource: NFC-e
    description: Downloads an NFC-e's DANFCE as a PDF.
    fields:
      - {name: id, label: Invoice ID, required: true}
    request: {method: GET, path: "nfce/{{fields.id}}/pdf"}
    output:
      file: {name: "nfce-{{fields.id}}.pdf"}

  - name: Cancel NFC-e
    resource: NFC-e
    description: Asks to cancel an NFC-e.
    fields:
      - {name: id, label: Invoice ID, required: true}
      - {name: justificativa, label: Reason, required: true}
    request:
      method: POST
      path: "nfce/{{fields.id}}/cancelamento"
      body: {justificativa: "{{fields.justificativa}}"}

  # NFS-e
  - name: Issue NFS-e
    resource: NFS-e
    description: Sends one or more service invoices (NFS-e) to the city hall.
    fields:
      - {name: notas, label: Invoices, type: json, required: true, description: 'A list, like [{"idIntegracao": "os-1", "prestador": {...}, "tomador": {...}, "servico": {...}}]'}
    request:
      method: POST
      path: nfse
      body: "{{fields.notas}}"

  - name: Get NFS-e
    resource: NFS-e
    description: Reads an NFS-e, with its status and number.
    fields:
      - {name: id, label: Invoice ID, required: true}
    request: {method: GET, path: "nfse/{{fields.id}}"}

  - name: Download NFS-e PDF
    resource: NFS-e
    description: Downloads an NFS-e as a PDF.
    fields:
      - {name: id, label: Invoice ID, required: true}
    request: {method: GET, path: "nfse/pdf/{{fields.id}}"}
    output:
      file: {name: "nfse-{{fields.id}}.pdf"}

  - name: Cancel NFS-e
    resource: NFS-e
    description: Asks to cancel an NFS-e.
    fields:
      - {name: id, label: Invoice ID, required: true}
      - {name: motivo, label: Reason}
    request:
      method: POST
      path: "nfse/cancelar/{{fields.id}}"
      body: {motivo: "{{fields.motivo}}"}

  # Companies
  - name: Register Company
    resource: Company
    description: Registers a company that issues invoices, with its certificate ID and settings.
    fields:
      - {name: empresa, label: Company, type: json, required: true, description: 'Like {"cpfCnpj": "...", "razaoSocial": "...", "certificado": "...", "nfe": {"ativo": true, ...}}'}
    request:
      method: POST
      path: empresa
      body: {_merge: "{{fields.empresa}}"}

  - name: Get Company
    resource: Company
    description: Reads a registered company.
    fields:
      - {name: cnpj, label: CNPJ, required: true, description: Only digits.}
    request: {method: GET, path: "empresa/{{fields.cnpj}}"}

  - name: Update Company
    resource: Company
    description: Changes a registered company. Fields left out stay as they are.
    fields:
      - {name: cnpj, label: CNPJ, required: true}
      - {name: empresa, label: Changes, type: json, required: true}
    request:
      method: PATCH
      path: "empresa/{{fields.cnpj}}"
      body: {_merge: "{{fields.empresa}}"}

  - name: Upload Certificate
    resource: Company
    description: Uploads a company's A1 certificate (.pfx) from an earlier node.
    fields:
      - {name: arquivo, label: Certificate file, type: file, required: true, default: "{{result}}"}
      - {name: senha, label: Certificate password, required: true}
      - {name: email, label: Email for expiry warnings}
    request:
      method: POST
      path: certificado
      body_type: multipart
      body: {arquivo: "{{fields.arquivo}}", senha: "{{fields.senha}}", email: "{{fields.email}}"}

