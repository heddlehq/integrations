      Download Labels: {name: "Baixar etiquetas", description: "Lê as etiquetas pedidas, como PDF em base64, quando ficam prontas.", fields: {receipt_id: "ID do recibo"}}
      Get Content Declaration: {name: "Emitir declaração de conteúdo", description: "Lê a declaração de conteúdo de pré-postagens, como PDF em base64.", fields: {ids: "IDs das pré-postagens"}}
