category: logistics
base_url: "https://{{credential.host}}/"

credential:
  label: Correios
  fields:
    - {name: user, label: User, required: true, description: Your Meu Correios user.}
    - {name: access_code, label: Access code, secret: true, required: true, description: Made in cws.correios.com.br › Gestão de acesso a API's.}
    - {name: card, label: Posting card, required: true, description: The number of the contract's posting card.}
    - {name: host, label: Environment, type: select, required: true, default: api.correios.com.br, options: [{label: Production, value: api.correios.com.br}, {label: Sandbox, value: apihom.correios.com.br}]}
  auth:
    type: login
    request:
      method: POST
      path: token/v1/autentica/cartaopostagem
      basic: {username: "{{credential.user}}", password: "{{credential.access_code}}"}
      body: {numero: "{{credential.card}}"}
    token_path: token
    expires_in: 3600
    apply: {type: bearer, token: "{{auth.token}}"}

errors:
  message_path: msgs.0

triggers:
  - name: Tracking Update
    description: Starts the flow for each new tracking event of an object, checking every hour.
    fields:
      - {name: code, label: Object code, required: true, description: "13 characters, like AA123456789BR"}
    request:
      method: GET
      path: "srorastro/v1/objetos/{{fields.code}}"
      query: {resultado: T}
    output: {path: objetos.0.eventos}
    poll: {every: 60, id: dtHrCriado}

actions:
  # Addresses
  - name: Look Up CEP
    resource: Address
    description: Reads the address of a CEP.
    fields:
      - {name: cep, label: CEP, required: true, description: 8 digits.}
    request: {method: GET, path: "cep/v2/enderecos/{{fields.cep}}"}

  - name: Search Addresses
    resource: Address
    description: Finds the CEPs of a street, district or city.
    fields:
      - {name: state, label: State, required: true, description: "Two letters, like SP"}
      - {name: city, label: City, required: true}
      - {name: street, label: Street}
      - {name: district, label: District}
      - {name: page, label: Page, type: number, default: 0}
      - {name: size, label: Per page, type: number, default: 50, description: Up to 2000.}
    request:
      method: GET
      path: cep/v2/enderecos
      query: {uf: "{{fields.state}}", localidade: "{{fields.city}}", logradouro: "{{fields.street}}", bairro: "{{fields.district}}", page: "{{fields.page}}", size: "{{fields.size}}"}
    output: {path: itens}

  - name: List Cities
    resource: Address
    description: Lists the cities and towns of a state, with their CEP ranges.
    fields:
      - {name: state, label: State, required: true, description: "Two letters, like SP"}
      - {name: page, label: Page, type: number, default: 0}
      - {name: size, label: Per page, type: number, default: 100}
    request:
      method: GET
      path: "cep/v1/localidades/{{fields.state}}"
      query: {page: "{{fields.page}}", size: "{{fields.size}}"}
    output: {path: itens}

  # Price and time
  - name: Get Price
    resource: Shipping
    description: Quotes the price of sending an object with a product of the contract.
    fields:
      - {name: product, label: Product code, required: true, default: "03220", description: "Like 03220 (SEDEX) or 03298 (PAC)."}
      - {name: from_cep, label: From CEP, required: true}
      - {name: to_cep, label: To CEP, required: true}
      - {name: weight, label: Weight, type: number, required: true, description: In grams.}
      - {name: format, label: Format, type: select, required: true, default: "2", options: [{label: Envelope, value: "1"}, {label: Box or package, value: "2"}, {label: Roll, value: "3"}]}
      - {name: length, label: Length, type: number, description: In cm. For a box or a roll.}
      - {name: width, label: Width, type: number, description: In cm. For a box.}
      - {name: height, label: Height, type: number, description: In cm. For a box.}
      - {name: diameter, label: Diameter, type: number, description: In cm. For a roll.}
      - {name: declared_value, label: Declared value, type: number, description: In reais.}
      - {name: services, label: Additional services, description: "Codes, like 019 (declared value)."}
    request:
      method: GET
      path: "preco/v1/nacional/{{fields.product}}"
      query: {cepOrigem: "{{fields.from_cep}}", cepDestino: "{{fields.to_cep}}", psObjeto: "{{fields.weight}}", tpObjeto: "{{fields.format}}", comprimento: "{{fields.length}}", largura: "{{fields.width}}", altura: "{{fields.height}}", diametro: "{{fields.diameter}}", vlDeclarado: "{{fields.declared_value}}", servicosAdicionais: "{{fields.services}}"}

  - name: Get Delivery Time
    resource: Shipping
    description: Reads how many days a product takes between two CEPs, and the expected delivery date.
    fields:
      - {name: product, label: Product code, required: true, default: "03220", description: "Like 03220 (SEDEX) or 03298 (PAC)."}
      - {name: from_cep, label: From CEP, required: true}
      - {name: to_cep, label: To CEP, required: true}
      - {name: date, label: Posting date, description: "DD-MM-YYYY. Empty for today."}
    request:
      method: GET
      path: "prazo/v1/nacional/{{fields.product}}"
      query: {cepOrigem: "{{fields.from_cep}}", cepDestino: "{{fields.to_cep}}", dtEvento: "{{fields.date}}"}

  - name: Get Expected Delivery Date
    resource: Shipping
    description: Works out the delivery date from a posting date and a number of days, with the holidays of the destination.
    fields:
      - {name: from_cep, label: From CEP, required: true}
      - {name: to_cep, label: To CEP, required: true}
      - {name: days, label: Days, type: number, required: true}
      - {name: posting_date, label: Posting date, required: true, description: "DD-MM-YYYY"}
    request:
      method: GET
      path: prazo/v1/data-prevista
      query: {cepOrigem: "{{fields.from_cep}}", cepDestino: "{{fields.to_cep}}", prazo: "{{fields.days}}", dtPostagem: "{{fields.posting_date}}"}

  - name: Get Pickup Time
    resource: Shipping
    description: Reads how long a pickup takes at a CEP.
    fields:
      - {name: cep, label: CEP, required: true}
    request: {method: GET, path: "prazo/v1/coleta/{{fields.cep}}"}

  # Tracking
  - name: Track Object
    resource: Tracking
    description: Reads the tracking events of an object.
    fields:
      - {name: code, label: Object code, required: true, description: "13 characters, like AA123456789BR"}
      - {name: result, label: Events, type: select, default: T, options: [{label: All, value: T}, {label: Last only, value: U}, {label: First only, value: P}]}
    request:
      method: GET
      path: "srorastro/v1/objetos/{{fields.code}}"
      query: {resultado: "{{fields.result}}"}
    output: {path: objetos.0}

  # Pre-posting
  - name: Create Pre-Posting
    resource: Pre-Posting
    description: Registers an object before posting it, with sender, recipient and content. The answer has its id and codigoObjeto.
    fields:
      - {name: product, label: Product code, required: true, default: "03220", description: "Like 03220 (SEDEX) or 03298 (PAC)."}
      - {name: sender_name, label: Sender name, required: true}
      - {name: sender_document, label: Sender CPF or CNPJ, required: true}
      - {name: sender_cep, label: Sender CEP, required: true}
      - {name: sender_street, label: Sender street, required: true}
      - {name: sender_number, label: Sender number, required: true}
      - {name: sender_complement, label: Sender complement}
      - {name: sender_district, label: Sender district, required: true}
      - {name: sender_city, label: Sender city, required: true}
      - {name: sender_state, label: Sender state, required: true}
      - {name: recipient_name, label: Recipient name, required: true}
      - {name: recipient_document, label: Recipient CPF or CNPJ}
      - {name: recipient_email, label: Recipient email}
      - {name: recipient_cep, label: Recipient CEP, required: true}
      - {name: recipient_street, label: Recipient street, required: true}
      - {name: recipient_number, label: Recipient number, required: true}
      - {name: recipient_complement, label: Recipient complement}
      - {name: recipient_district, label: Recipient district, required: true}
      - {name: recipient_city, label: Recipient city, required: true}
      - {name: recipient_state, label: Recipient state, required: true}
      - {name: weight, label: Weight, type: number, required: true, description: In grams.}
      - {name: format, label: Format, type: select, required: true, default: "2", options: [{label: Envelope, value: "1"}, {label: Box or package, value: "2"}, {label: Roll, value: "3"}]}
      - {name: length, label: Length, type: number, description: In cm. For a box or a roll.}
      - {name: width, label: Width, type: number, description: In cm. For a box.}
      - {name: height, label: Height, type: number, description: In cm. For a box.}
      - {name: diameter, label: Diameter, type: number, description: In cm. For a roll.}
      - {name: invoice_key, label: NF-e key, description: Or the content below.}
      - {name: content, label: Content, type: json, description: "Without an NF-e, the items, like [{\"conteudo\": \"Book\", \"quantidade\": \"1\", \"valor\": \"50.00\"}]"}
      - {name: notes, label: Notes, description: Up to 50 characters.}
    request:
      method: POST
      path: prepostagem/v1/prepostagens
      body:
        codigoServico: "{{fields.product}}"
        remetente:
          nome: "{{fields.sender_name}}"
          cpfCnpj: "{{fields.sender_document}}"
          endereco: {cep: "{{fields.sender_cep}}", logradouro: "{{fields.sender_street}}", numero: "{{fields.sender_number}}", complemento: "{{fields.sender_complement}}", bairro: "{{fields.sender_district}}", cidade: "{{fields.sender_city}}", uf: "{{fields.sender_state}}"}
        destinatario:
          nome: "{{fields.recipient_name}}"
          cpfCnpj: "{{fields.recipient_document}}"
          email: "{{fields.recipient_email}}"
          endereco: {cep: "{{fields.recipient_cep}}", logradouro: "{{fields.recipient_street}}", numero: "{{fields.recipient_number}}", complemento: "{{fields.recipient_complement}}", bairro: "{{fields.recipient_district}}", cidade: "{{fields.recipient_city}}", uf: "{{fields.recipient_state}}"}
        pesoInformado: "{{fields.weight}}"
        codigoFormatoObjetoInformado: "{{fields.format}}"
        comprimentoInformado: "{{fields.length}}"
        larguraInformada: "{{fields.width}}"
        alturaInformada: "{{fields.height}}"
        diametroInformado: "{{fields.diameter}}"
        chaveNFe: "{{fields.invoice_key}}"
        itensDeclaracaoConteudo: "{{fields.content}}"
        observacao: "{{fields.notes}}"
        cienteObjetoNaoProibido: "1"

  - name: List Pre-Postings
    resource: Pre-Posting
    description: Lists the pre-postings, newest first, by status or object code.
    fields:
      - {name: code, label: Object code}
      - {name: status, label: Status, type: select, default: PREPOSTADO, description: Needed without an object code., options: [{label: Pre-posted, value: PREPOSTADO}, {label: Posted, value: POSTADO}, {label: Pending, value: PENDENTE}, {label: Canceled, value: CANCELADO}, {label: Expired, value: EXPIRADO}, {label: Reversed, value: ESTORNADO}]}
      - {name: page, label: Page, type: number, default: 0}
      - {name: size, label: Per page, type: number, default: 50}
    request:
      method: GET
      path: prepostagem/v2/prepostagens
      query: {codigoObjeto: "{{fields.code}}", status: "{{fields.status}}", page: "{{fields.page}}", size: "{{fields.size}}"}
    output: {path: itens}

  - name: Get Posted Object
    resource: Pre-Posting
    description: Reads a pre-posting after it was posted, with the measures taken at the counter.
    fields:
      - {name: code, label: Object code, required: true}
    request:
      method: GET
      path: prepostagem/v1/prepostagens/postada
      query: {codigoObjeto: "{{fields.code}}"}

  - name: Cancel Pre-Posting
    resource: Pre-Posting
    description: Cancels a pre-posting that wasn't posted yet, by its object code.
    fields:
      - {name: code, label: Object code, required: true}
    request: {method: DELETE, path: "prepostagem/v1/prepostagens/objeto/{{fields.code}}"}

  - name: Request Labels
    resource: Label
    description: Asks for the PDF labels of pre-postings. The answer has idRecibo, for Download Labels.
    fields:
      - {name: codes, label: Object codes, type: json, required: true, description: "A list, like [\"AA123456789BR\"]"}
      - {name: size, label: Label, type: select, default: P, options: [{label: Standard, value: P}, {label: Reduced, value: R}]}
      - {name: format, label: Format, type: select, default: ET, options: [{label: Label, value: ET}, {label: Envelope, value: EV}]}
      - {name: layout, label: Layout, type: select, default: PADRAO, options: [{label: Standard, value: PADRAO}, {label: Thermal 100x150, value: LINEAR_100_150}, {label: Thermal 100x80, value: LINEAR_100_80}, {label: A4, value: LINEAR_A4}]}
    request:
      method: POST
      path: prepostagem/v1/prepostagens/rotulo/assincrono/pdf
      body: {codigosObjeto: "{{fields.codes}}", tipoRotulo: "{{fields.size}}", formatoRotulo: "{{fields.format}}", layoutImpressao: "{{fields.layout}}"}

  - name: Download Labels
    resource: Label
    description: Reads the labels asked for, as a PDF in base64, once they are ready.
    fields:
      - {name: receipt_id, label: Receipt ID, required: true, description: "idRecibo, from Request Labels."}
    request: {method: GET, path: "prepostagem/v1/prepostagens/rotulo/download/assincrono/{{fields.receipt_id}}"}

  - name: Get Content Declaration
    resource: Label
    description: Reads the content declaration of pre-postings, as a PDF in base64.
    fields:
      - {name: ids, label: Pre-posting IDs, required: true, description: "Separated by commas."}
    request: {method: GET, path: "prepostagem/v1/prepostagens/declaracaoconteudo/{{fields.ids}}"}

