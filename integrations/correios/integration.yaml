# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Correios' APIs for contract customers: CEP, price and delivery time, tracking and
# pre-posting with labels. The token comes from the posting card, with the Meu Correios
# user and the access code made at cws.correios.com.br as Basic auth. Product codes are
# the contract's, like 03220 (SEDEX) or 03298 (PAC).
id: correios
name: Correios
version: 1.0.0
homepage: https://cws.correios.com.br
description: Look up CEPs, quote price and delivery time, track objects, and create pre-postings with their labels, with the Correios contract APIs.
icon: hero-truck
