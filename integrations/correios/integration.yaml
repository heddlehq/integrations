      List Pre-Postings: {name: "Listar pré-postagens", description: "Lista as pré-postagens, das mais novas para as mais antigas, por situação ou código do objeto.", fields: {code: "Código do objeto", status: "Situação", page: "Página", size: "Por página"}}
      Get Posted Object: {name: "Consultar objeto postado", description: "Lê uma pré-postagem depois de postada, com as medidas aferidas no balcão.", fields: {code: "Código do objeto"}}
      Cancel Pre-Posting: {name: "Cancelar pré-postagem", description: "Cancela uma pré-postagem ainda não postada, pelo código do objeto.", fields: {code: "Código do objeto"}}
