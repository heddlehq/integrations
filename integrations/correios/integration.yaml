    actions:
      Look Up CEP: {name: "Consultar CEP", description: "Lê o endereço de um CEP.", fields: {cep: "CEP"}}
      Search Addresses: {name: "Buscar endereços", description: "Encontra os CEPs de uma rua, bairro ou cidade.", fields: {state: "UF", city: "Cidade", street: "Logradouro", district: "Bairro", page: "Página", size: "Por página"}}
      List Cities: {name: "Listar localidades", description: "Lista as cidades e localidades de uma UF, com as faixas de CEP.", fields: {state: "UF", page: "Página", size: "Por página"}}
      Get Price: {name: "Calcular preço", description: "Calcula o preço de envio de um objeto com um produto do contrato.", fields: {product: "Código do produto", from_cep: "CEP de origem", to_cep: "CEP de destino", weight: "Peso", format: "Formato", length: "Comprimento", width: "Largura", height: "Altura", diameter: "Diâmetro", declared_value: "Valor declarado", services: "Serviços adicionais"}}
      Get Delivery Time: {name: "Calcular prazo", description: "Lê quantos dias um produto leva entre dois CEPs e a data prevista de entrega.", fields: {product: "Código do produto", from_cep: "CEP de origem", to_cep: "CEP de destino", date: "Data de postagem"}}
      Get Expected Delivery Date: {name: "Calcular data prevista", description: "Calcula a data de entrega a partir da data de postagem e de um número de dias, com os feriados do destino.", fields: {from_cep: "CEP de origem", to_cep: "CEP de destino", days: "Dias", posting_date: "Data de postagem"}}
      Get Pickup Time: {name: "Consultar prazo de coleta", description: "Lê quanto tempo leva uma coleta em um CEP.", fields: {cep: "CEP"}}
