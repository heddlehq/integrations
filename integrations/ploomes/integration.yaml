      Delete Contact: {name: "Excluir contato", description: "Exclui um contato.", fields: {id: "ID do contato"}}
      List Deals: {name: "Listar negócios", description: "Lista negócios, filtrando e ordenando com OData se quiser.", fields: {filter: "Filtro", orderby: "Ordenar por", expand: "Expandir", top: "Limite", skip: "Pular"}}
