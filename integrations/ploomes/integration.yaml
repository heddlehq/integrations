    triggers:
      New Contact: {name: "Novo contato", description: "Inicia o fluxo a cada novo contato, verificando a cada 5 minutos."}
      New Deal: {name: "Novo negócio", description: "Inicia o fluxo a cada novo negócio, verificando a cada 5 minutos."}
    actions:
      List Contacts: {name: "Listar contatos", description: "Lista contatos, filtrando e ordenando com OData se quiser.", fields: {filter: "Filtro", orderby: "Ordenar por", expand: "Expandir", top: "Limite", skip: "Pular"}}
