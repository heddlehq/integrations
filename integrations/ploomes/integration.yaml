# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Ploomes, the CRM. Copy the integration user's key (User-Key) in Ploomes under
# Administração › Usuários de integração. The API speaks OData: lists answer
# {"value": [...]}, filter with $filter (like Name eq 'Ana'), sort with $orderby,
# page with $top and $skip, and bring related records with $expand. Custom fields go
# in OtherProperties as [{"FieldKey": "...", "StringValue": "..."}].
id: ploomes
name: Ploomes
version: 1.0.0
homepage: https://developers.ploomes.com/
description: Manage contacts, deals and their stages, tasks, interaction records, orders and products, win or lose deals, and start flows on new contacts and deals, in Ploomes.
icon: hero-briefcase
logo: |-
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#FFFFFF"/><svg x="3.00" y="9.58" width="18.00" height="4.84" viewBox="0 0 509 137"><path d="M283.147 92.1106C273.259 92.1106 266.113 84.6917 266.113 74.2516C266.113 63.8116 273.259 56.3926 283.147 56.3926C293.035 56.3926 300.181 63.8116 300.181 74.2516C300.181 84.6917 293.035 92.1106 283.147 92.1106ZM283.147 102.319C298.228 102.319 310.445 89.7473 310.445 74.2516C310.445 58.756 298.216 46.184 283.147 46.184C268.078 46.184 255.848 58.756 255.848 74.2516C255.848 89.7473 268.078 102.319 283.147 102.319ZM448.83 91.002C444.22 97.9215 436.685 102.319 427.586 102.319C412.408 102.319 401.501 90.0396 401.501 74.2516C401.501 58.4636 412.408 46.184 427.586 46.184C441.927 46.184 453.671 58.4636 452.3 78.8321H441.502C443.298 63.5192 436.54 56.0028 427.137 56.0028C417.734 56.0028 410.976 63.5192 410.976 74.2516C410.976 84.9841 417.734 92.5004 427.137 92.5004C432.985 92.5004 437.814 89.6011 440.616 84.8257L448.854 91.0142H448.818L448.83 91.002ZM407.713 70.597H448.551V78.8443H407.713V70.597ZM224.558 92.1106C214.67 92.1106 207.524 84.6917 207.524 74.2516C207.524 63.8116 214.67 56.3926 224.558 56.3926C234.447 56.3926 241.593 63.8116 241.593 74.2516C241.593 84.6917 234.447 92.1106 224.558 92.1106ZM224.558 102.319C239.639 102.319 251.857 89.7473 251.857 74.2516C251.857 58.756 239.627 46.184 224.558 46.184C209.49 46.184 197.26 58.756 197.26 74.2516C197.26 89.7473 209.49 102.319 224.558 102.319ZM454.156 90.1858L461.217 85.0937C463.583 90.0275 468.885 92.671 476.068 92.671C484.051 92.671 487.582 89.8325 487.582 84.9475C487.582 74.7998 454.654 84.9841 454.654 61.4117C454.654 52.1898 463.498 45.9769 475.364 45.9769C484.706 45.9769 494.133 50.862 495.711 59.9011L486.72 62.4472C486.029 56.8921 481.006 54.6384 475.522 54.6384C468.339 54.6384 464.02 57.1845 464.02 61.6066C464.02 74.812 497.737 64.5425 497.737 84.6673C497.737 95.0343 489.814 101.722 476.068 101.722C465.901 101.722 457.396 97.5