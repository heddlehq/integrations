category: crm
base_url: https://public-api2.ploomes.com/
headers:
  User-Agent: Heddle/1.0

credential:
  label: Ploomes
  fields:
    - {name: user_key, label: User key, secret: true, required: true, description: "The integration user's key, from Administração › Usuários de integração."}
  auth:
    type: header
    name: User-Key
    value: "{{credential.user_key}}"

errors:
  message_path: error.message

triggers:
  - name: New Contact
    description: Starts the flow for each new contact, checking every 5 minutes.
    request:
      method: GET
      path: Contacts
      query: {"$orderby": "Id desc", "$top": 50}
    output: {path: value}
    poll: {every: 5, id: Id}

  - name: New Deal
    description: Starts the flow for each new deal, checking every 5 minutes.
    request:
      method: GET
      path: Deals
      query: {"$orderby": "Id desc", "$top": 50}
    output: {path: value}
    poll: {every: 5, id: Id}

actions:
  # Contacts
  - name: List Contacts
    resource: Contact
    description: Lists contacts, filtered and sorted with OData if you like.
    fields:
      - {name: filter, label: Filter, description: "OData, like Name eq 'Ana' or contains(Email,'@acme.com')"}
      - {name: orderby, label: Order by, default: Id desc}
      - {name: expand, label: Expand, description: "Related records, like Phones,OtherProperties"}
      - {name: top, label: Limit, type: number, default: 50}
      - {name: skip, label: Skip, type: number}
    request:
      method: GET
      path: Contacts
      query: {"$filter": "{{fields.filter}}", "$orderby": "{{fields.orderby}}", "$expand": "{{fields.expand}}", "$top": "{{fields.top}}", "$skip": "{{fields.skip}}"}
    output: {path: value}

  - name: Get Contact
    resource: Contact
    description: Reads a contact, with its phones and custom fields.
    fields:
      - {name: id, label: Contact ID, type: number, required: true}
    request: {method: GET, path: Contacts, query: {"$filter": "Id eq {{fields.id}}", "$expand": "Phones,OtherProperties"}}
    output: {path: value.0}

  - name: Create Contact
    resource: Contact
    description: Creates a person or a company.
    fields:
      - {name: Name, label: Name, required: true}
      - {name: TypeId, label: Kind, type: select, default: 2, options: [{label: Person, value: 2}, {label: Company, value: 1}]}
      - {name: Email, label: Email}
      - {name: Register, label: CPF or CNPJ}
      - {name: phone, label: Phone}
      - {name: CompanyId, label: Company ID, type: number, description: The company a person works at.}
      - {name: ZipCode, label: CEP, type: number}
      - {name: StreetAddressNumber, label: Number}
      - {name: Note, label: Notes, type: textarea}
      - {name: other_properties, label: Custom fields, type: json, description: "Like [{\"FieldKey\": \"contact_...\", \"StringValue\": \"x\"}]"}
    request:
      method: POST
      path: Contacts
      body:
        Name: "{{fields.Name}}"
        TypeId: "{{fields.TypeId}}"
        Email: "{{fields.Email}}"
        Register: "{{fields.Register}}"
        CompanyId: "{{fields.CompanyId}}"
        ZipCode: "{{fields.ZipCode}}"
        StreetAddressNumber: "{{fields.StreetAddressNumber}}"
        Note: "{{fields.Note}}"
        Phones: [{_if: "{{fields.phone}}", PhoneNumber: "{{fields.phone}}"}]
        OtherProperties: "{{fields.other_properties}}"
    output: {path: value.0}

  - name: Update Contact
    resource: Contact
    description: Changes a contact. Send the attributes to change.
    fields:
      - {name: id, label: Contact ID, type: number, required: true}
      - {name: contact, label: Attributes, type: json, required: true, description: "Like {\"Email\": \"ana@acme.com\"}"}
    request: {method: PATCH, path: "Contacts({{fields.id}})", body: "{{fields.contact}}"}
    output: {path: value.0}

  - name: Delete Contact
    resource: Contact
    description: Deletes a contact.
    fields:
      - {name: id, label: Contact ID, type: number, required: true}
    request: {method: DELETE, path: "Contacts({{fields.id}})"}

  # Deals
  - name: List Deals
    resource: Deal
    description: Lists deals, filtered and sorted with OData if you like.
    fields:
      - {name: filter, label: Filter, description: "OData, like StageId eq 12 or StatusId eq 1"}
      - {name: orderby, label: Order by, default: Id desc}
      - {name: expand, label: Expand, description: "Related records, like Contact,OtherProperties"}
      - {name: top, label: Limit, type: number, default: 50}
      - {name: skip, label: Skip, type: number}
    request:
      method: GET
      path: Deals
      query: {"$filter": "{{fields.filter}}", "$orderby": "{{fields.orderby}}", "$expand": "{{fields.expand}}", "$top": "{{fields.top}}", "$skip": "{{fields.skip}}"}
    output: {path: value}

  - name: Get Deal
    resource: Deal
    description: Reads a deal, with its contact and custom fields.
    fields:
      - {name: id, label: Deal ID, type: number, required: true}
    request: {method: GET, path: Deals, query: {"$filter": "Id eq {{fields.id}}", "$expand": "Contact,OtherProperties"}}
    output: {path: value.0}

  - name: Create Deal
    resource: Deal
    description: Creates a deal for a contact.
    fields:
      - {name: Title, label: Title, required: true}
      - {name: ContactId, label: Contact ID, type: number, required: true}
      - {name: StageId, label: Stage ID, type: number, description: From List Stages.}
      - {name: Amount, label: Amount, type: number}
      - {name: OwnerId, label: Owner ID, type: number, description: From List Users.}
      - {name: other_properties, label: Custom fields, type: json, description: "Like [{\"FieldKey\": \"deal_...\", \"StringValue\": \"x\"}]"}
    request:
      method: POST
      path: Deals
      body: {Title: "{{fields.Title}}", ContactId: "{{fields.ContactId}}", StageId: "{{fields.StageId}}", Amount: "{{fields.Amount}}", OwnerId: "{{fields.OwnerId}}", OtherProperties: "{{fields.other_properties}}"}
    output: {path: value.0}

  - name: Update Deal
    resource: Deal
    description: Changes a deal, like its stage or amount. Send the attributes to change.
    fields:
      - {name: id, label: Deal ID, type: number, required: true}
      - {name: deal, label: Attributes, type: json, required: true, description: "Like {\"StageId\": 12, \"Amount\": 5000}"}
    request: {method: PATCH, path: "Deals({{fields.id}})", body: "{{fields.deal}}"}
    output: {path: value.0}

  - name: Win Deal
    resource: Deal
    description: Marks a deal as won.
    fields:
      - {name: id, label: Deal ID, type: number, required: true}
    request: {method: POST, path: "Deals({{fields.id}})/Win", body: {}}

  - name: Lose Deal
    resource: Deal
    description: Marks a deal as lost, with the reason.
    fields:
      - {name: id, label: Deal ID, type: number, required: true}
      - {name: LossReasonId, label: Loss reason ID, type: number, required: true, description: From List Loss Reasons.}
    request: {method: POST, path: "Deals({{fields.id}})/Lose", body: {LossReasonId: "{{fields.LossReasonId}}"}}

  - name: Reopen Deal
    resource: Deal
    description: Opens a won or lost deal again.
    fields:
      - {name: id, label: Deal ID, type: number, required: true}
    request: {method: POST, path: "Deals({{fields.id}})/Reopen", body: {}}

  - name: Delete Deal
    resource: Deal
    description: Deletes a deal.
    fields:
      - {name: id, label: Deal ID, type: number, required: true}
    request: {method: DELETE, path: "Deals({{fields.id}})"}

  - name: List Pipelines
    resource: Deal
    description: Lists the deal pipelines.
    request: {method: GET, path: "Deals@Pipelines"}
    output: {path: value}

  - name: List Stages
    resource: Deal
    description: Lists the stages of the pipelines.
    fields:
      - {name: pipeline_id, label: Pipeline ID, type: number, required: true, description: From List Pipelines.}
    request: {method: GET, path: "Deals@Stages", query: {"$filter": "PipelineId eq {{fields.pipeline_id}}"}}
    output: {path: value}

  - name: List Loss Reasons
    resource: Deal
    description: Lists the reasons a deal can be lost for.
    request: {method: GET, path: "Deals@LossReasons"}
    output: {path: value}

  # Tasks and records
  - name: Create Task
    resource: Task
    description: Creates a task, for a contact or deal if you like.
    fields:
      - {name: Title, label: Title, required: true}
      - {name: Description, label: Description, type: textarea}
      - {name: DateTime, label: Due, type: datetime, required: true}
      - {name: ContactId, label: Contact ID, type: number}
      - {name: DealId, label: Deal ID, type: number}
      - {name: OwnerId, label: Owner ID, type: number}
    request:
      method: POST
      path: Tasks
      body: {Title: "{{fields.Title}}", Description: "{{fields.Description}}", DateTime: "{{fields.DateTime}}", ContactId: "{{fields.ContactId}}", DealId: "{{fields.DealId}}", OwnerId: "{{fields.OwnerId}}"}
    output: {path: value.0}

  - name: List Tasks
    resource: Task
    description: Lists tasks, filtered with OData if you like.
    fields:
      - {name: filter, label: Filter, description: "OData, like Finished eq false"}
      - {name: top, label: Limit, type: number, default: 50}
      - {name: skip, label: Skip, type: number}
    request: {method: GET, path: Tasks, query: {"$filter": "{{fields.filter}}", "$orderby": "DateTime desc", "$top": "{{fields.top}}", "$skip": "{{fields.skip}}"}}
    output: {path: value}

  - name: Finish Task
    resource: Task
    description: Marks a task as done.
    fields:
      - {name: id, label: Task ID, type: number, required: true}
    request: {method: POST, path: "Tasks({{fields.id}})/Finish", body: {Finished: true}}

  - name: Create Interaction Record
    resource: Task
    description: Records an interaction, like a call or meeting note, on a contact or deal.
    fields:
      - {name: ContactId, label: Contact ID, type: number, required: true}
      - {name: DealId, label: Deal ID, type: number}
      - {name: Content, label: Content, type: textarea, required: true}
      - {name: Date, label: Date, type: datetime}
    request: {method: POST, path: InteractionRecords, body: {ContactId: "{{fields.ContactId}}", DealId: "{{fields.DealId}}", Content: "{{fields.Content}}", Date: "{{fields.Date}}"}}
    output: {path: value.0}

  # Sales
  - name: List Orders
    resource: Sales
    description: Lists orders, filtered with OData if you like.
    fields:
      - {name: filter, label: Filter, description: "OData, like ContactId eq 10"}
      - {name: top, label: Limit, type: number, default: 50}
      - {name: skip, label: Skip, type: number}
    request: {method: GET, path: Orders, query: {"$filter": "{{fields.filter}}", "$orderby": "Id desc", "$top": "{{fields.top}}", "$skip": "{{fields.skip}}"}}
    output: {path: value}

  - name: List Products
    resource: Sales
    description: Lists products, filtered with OData if you like.
    fields:
      - {name: filter, label: Filter, description: "OData, like contains(Name,'kit')"}
      - {name: top, label: Limit, type: number, default: 50}
      - {name: skip, label: Skip, type: number}
    request: {method: GET, path: Products, query: {"$filter": "{{fields.filter}}", "$top": "{{fields.top}}", "$skip": "{{fields.skip}}"}}
    output: {path: value}

  - name: Create Product
    resource: Sales
    description: Creates a product.
    fields:
      - {name: Name, label: Name, required: true}
      - {name: Code, label: Code}
      - {name: UnitPrice, label: Price, type: number}
    request: {method: POST, path: Products, body: {Name: "{{fields.Name}}", Code: "{{fields.Code}}", UnitPrice: "{{fields.UnitPrice}}"}}
    output: {path: value.0}

  - name: List Users
    resource: Sales
    description: Lists the account's users, to own deals and tasks.
    request: {method: GET, path: Users}
    output: {path: value}

