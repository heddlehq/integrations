# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Zenvia, through the API v2. Connect with an API token from Zenvia's
# Integrações › Tokens e Webhooks. The sender is the WhatsApp number, SMS keyword or
# other channel account set up in Zenvia; phone numbers are like 5511999990000.
id: zenvia
name: Zenvia
version: 1.0.0
description: Send WhatsApp, SMS, RCS, email and other channel messages and get the replies through Zenvia.
icon: hero-chat-bubble-left-right
