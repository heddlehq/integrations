form="translate(0 0)" style="fill:#fff"></path></g></g></g></svg></svg>
category: messaging
author: Heddle
homepage: https://zenvia.github.io/zenvia-openapi-spec/v2/
base_url: https://api.zenvia.com/v2/
headers:
  User-Agent: Heddle

credential:
  label: Zenvia
  fields:
    - {name: token, label: API token, secret: true, required: true}
  auth:
    type: header
    name: X-API-TOKEN
    value: "{{credential.token}}"

errors:
  message_path: message

triggers:
  - name: Message Event
    description: Starts the flow when a message arrives or a sent message changes status.
    fields:
      - name: event
        label: Event
        type: select
        required: true
        default: MESSAGE
        options:
          - {label: Message received, value: MESSAGE}
          - {label: Message status changed, value: MESSAGE_STATUS}
      - name: channel
        label: Channel
        type: select
        required: true
        default: whatsapp
        options: &channels
          - {label: WhatsApp, value: whatsapp}
          - {label: SMS, value: sms}
          - {label: RCS, value: rcs}
          - {label: Facebook, value: facebook}
          - {label: Instagram, value: instagram}
          - {label: Telegram, value: telegram}
          - {label: Email, value: email}
    webhook:
      register:
        request:
          method: POST
          path: subscriptions
          body: {eventType: "{{fields.event}}", criteria: {channel: "{{fields.channel}}"}, webhook: {url: "{{webhook.url}}", headers: {X-Heddle-Token: "{{webhook.secret}}"}}}
        id_path: id
      unregister:
        request: {method: DELETE, path: "subscriptions/{{webhook.id}}"}
      signature: {header: X-Heddle-Token, token: "{{webhook.secret}}"}

actions:
  - name: Send Text
    resource: Message
    description: Sends a text message on a channel.
    fields:
      - {name: channel, label: Channel, type: select, required: true, default: whatsapp, options: [{label: WhatsApp, value: whatsapp}, {label: SMS, value: sms}, {label: RCS, value: rcs}, {label: Facebook, value: facebook}, {label: Instagram, value: instagram}, {label: Telegram, value: telegram}, {label: Email, value: email}]}
      - {name: from, label: Sender, required: true, description: "The number or account set up in Zenvia."}
      - {name: to, label: To, required: true, description: "Like 5511999990000"}
      - {name: text, label: Text, type: textarea, required: true}
      - {name: external_id, label: Your ID}
    request:
      method: POST
      path: "channels/{{fields.channel}}/messages"
      body: {from: "{{fields.from}}", to: "{{fields.to}}", externalId: "{{fields.external_id}}", contents: [{type: text, text: "{{fields.text}}"}]}

  - name: Send File
    resource: Message
    description: Sends an image, video, audio or document from a link.
    fields:
      - {name: channel, label: Channel, type: select, required: true, default: whatsapp, options: [{label: WhatsApp, value: whatsapp}, {label: SMS, value: sms}, {label: RCS, value: rcs}, {label: Facebook, value: facebook}, {label: Instagram, value: instagram}, {label: Telegram, value: telegram}, {label: Email, value: email}]}
      - {name: from, label: Sender, required: true}
      - {name: to, label: To, required: true}
      - {name: file_url, label: File address, required: true}
      - {name: file_mime_type, label: File type, required: true, description: "Like image/png or application/pdf"}
      - {name: file_caption, label: Caption}
    request:
      method: POST
      path: "channels/{{fields.channel}}/messages"
      body: {from: "{{fields.from}}", to: "{{fields.to}}", contents: [{type: file, fileUrl: "{{fields.file_url}}", fileMimeType: "{{fields.file_mime_type}}", fileCaption: "{{fields.file_caption}}"}]}

  - name: Send WhatsApp Template
    resource: Message
    description: Sends an approved WhatsApp template, needed to start a conversation.
    fields:
      - {name: from, label: Sender, required: true}
      - {name: to, label: To, required: true}
      - {name: template_id, label: Template ID, required: true}
      - {name: fields, label: Template fields, type: json, description: 'Like {"name": "Ana", "order": "123"}'}
    request:
      method: POST
      path: channels/whatsapp/messages
      body: {from: "{{fields.from}}", to: "{{fields.to}}", contents: [{type: template, templateId: "{{fields.template_id}}", fields: "{{fields.fields}}"}]}

  - name: Send Email
    resource: Message
    description: Sends an email through Zenvia.
    fields:
      - {name: from, label: Sender, required: true}
      - {name: to, label: To, required: true}
      - {name: subject, label: Subject, required: true}
      - {name: html, label: Body (HTML), type: textarea, required: true}
    request:
      method: POST
      path: channels/email/messages
      body: {from: "{{fields.from}}", to: "{{fields.to}}", contents: [{type: email, subject: "{{fields.subject}}", html: "{{fields.html}}"}]}

  - name: List Templates
    resource: Template
    description: Lists the message templates.
    fields:
      - {name: channel, label: Channel, type: select, options: [{label: WhatsApp, value: whatsapp}, {label: SMS, value: sms}, {label: RCS, value: rcs}, {label: Facebook, value: facebook}, {label: Instagram, value: instagram}, {label: Telegram, value: telegram}, {label: Email, value: email}]}
      - name: status
        label: Status
        type: select
        options:
          - {label: Approved, value: APPROVED}
          - {label: Waiting approval, value: WAITING_APPROVAL}
          - {label: Refused, value: REFUSED}
    request:
      method: GET
      path: templates
      query: {channel: "{{fields.channel}}", status: "{{fields.status}}"}

  - name: Get Template
    resource: Template
    description: Reads a template.
    fields:
      - {name: template, label: Template ID, required: true}
    request: {method: GET, path: "templates/{{fields.template}}"}

  - name: List Subscriptions
    resource: Webhook
    description: Lists the webhooks Zenvia calls.
    request: {method: GET, path: subscriptions}

  - name: Get Report
    resource: Report
    description: Counts the messages sent per channel between two dates.
    fields:
      - {name: start_date, label: From, required: true, description: "Like 2026-02-01"}
      - {name: end_date, label: To, required: true, description: "Like 2026-02-28"}
      - {name: channel, label: Channel, type: select, options: [{label: WhatsApp, value: whatsapp}, {label: SMS, value: sms}, {label: RCS, value: rcs}, {label: Facebook, value: facebook}, {label: Instagram, value: instagram}, {label: Telegram, value: telegram}, {label: Email, value: email}]}
    request:
      method: GET
      path: reports/message-entries
      query: {startDate: "{{fields.start_date}}", endDate: "{{fields.end_date}}", channels: "{{fields.channel}}"}

i18n:
  pt-BR:
    description: "Envie mensagens de WhatsApp, SMS, RCS, e-mail e outros canais e receba as respostas pela Zenvia."
    triggers:
      Message Event: {name: "Evento de mensagem", description: "Inicia o fluxo quando chega uma mensagem ou uma mensagem enviada muda de status.", fields: {event: "Evento", channel: "Canal"}}
    actions:
      Send Text: {name: "Enviar texto", description: "Envia uma mensagem de texto em um canal.", fields: {channel: "Canal", from: "Remetente", to: "Para", text: "Texto", external_id: "Seu ID"}}
      Send File: {name: "Enviar arquivo", description: "Envia imagem, vídeo, áudio ou documento a partir de um link.", fields: {channel: "Canal", from: "Remetente", to: "Para", file_url: "Endereço do arquivo", file_mime_type: "Tipo do arquivo", file_caption: "Legenda"}}
      Send WhatsApp Template: {name: "Enviar modelo de WhatsApp", description: "Envia um modelo aprovado do WhatsApp, preciso para iniciar uma conversa.", fields: {from: "Remetente", to: "Para", template_id: "ID do modelo", fields: "Campos do modelo"}}
      Send Email: {name: "Enviar e-mail", description: "Envia um e-mail pela Zenvia.", fields: {from: "Remetente", to: "Para", subject: "Assunto", html: "Corpo (HTML)"}}
      List Templates: {name: "Listar modelos", description: "Lista os modelos de mensagem.", fields: {channel: "Canal", status: "Status"}}
      Get Template: {name: "Ler modelo", description: "Lê um modelo.", fields: {template: "ID do modelo"}}
      List Subscriptions: {name: "Listar webhooks", description: "Lista os webhooks que a Zenvia chama."}
      Get Report: {name: "Ler relatório", description: "Conta as mensagens enviadas por canal entre duas datas.", fields: {start_date: "De", end_date: "Até", channel: "Canal"}}
