# Iugu, through the API v1. Connect with an API token from Iugu's Administração ›
# Configurações de conta › Integração via API. Amounts are in cents, like 4990.
id: iugu
name: Iugu
version: 1.0.0
description: Invoices by Pix, boleto and card, customers, plans and subscriptions in Iugu.
icon: hero-banknotes
