category: payments
author: Heddle
homepage: https://dev.iugu.com/reference
base_url: https://api.iugu.com/v1/
headers:
  User-Agent: Heddle

credential:
  label: Iugu
  fields:
    - {name: api_token, label: API token, secret: true, required: true}
  auth:
    type: basic
    username: "{{credential.api_token}}"
    password: ""

errors:
  message_path: errors

triggers:
  - name: Iugu Event
    description: Starts the flow when an invoice changes status or a subscription is created, renewed or suspended.
    fields:
      - name: event
        label: Event
        type: select
        required: true
        default: invoice.status_changed
        options:
          - {label: Invoice status changed, value: invoice.status_changed}
          - {label: Invoice created, value: invoice.created}
          - {label: Invoice refunded, value: invoice.refund}
          - {label: Invoice due soon, value: invoice.due}
          - {label: Invoice payment failed, value: invoice.payment_failed}
          - {label: Subscription created, value: subscription.created}
          - {label: Subscription renewed, value: subscription.renewed}
          - {label: Subscription activated, value: subscription.activated}
          - {label: Subscription suspended, value: subscription.suspended}
          - {label: Subscription expired, value: subscription.expired}
          - {label: Withdrawal status changed, value: withdraw_request.status_changed}
          - {label: All events, value: all}
    webhook:
      register:
        request:
          method: POST
          path: web_hooks
          body: {event: "{{fields.event}}", url: "{{webhook.url}}", authorization: "{{webhook.secret}}"}
        id_path: id
      unregister:
        request: {method: DELETE, path: "web_hooks/{{webhook.id}}"}
      signature: {header: Authorization, token: "{{webhook.secret}}"}

actions:
  - name: Create Customer
    resource: Customer
    description: Creates a customer.
    fields:
      - {name: email, label: Email, required: true}
      - {name: name, label: Name, required: true}
      - {name: cpf_cnpj, label: CPF or CNPJ}
      - {name: phone_prefix, label: Area code, description: "Like 11"}
      - {name: phone, label: Phone}
      - {name: zip_code, label: CEP}
      - {name: number, label: Number}
      - {name: notes, label: Notes}
      - {name: extra, label: More fields, type: json}
    request:
      method: POST
      path: customers
      body: {email: "{{fields.email}}", name: "{{fields.name}}", cpf_cnpj: "{{fields.cpf_cnpj}}", phone_prefix: "{{fields.phone_prefix}}", phone: "{{fields.phone}}", zip_code: "{{fields.zip_code}}", number: "{{fields.number}}", notes: "{{fields.notes}}", _merge: "{{fields.extra}}"}

  - name: Get Customer
    resource: Customer
    description: Reads a customer.
    fields:
      - {name: customer, label: Customer ID, required: true}
    request: {method: GET, path: "customers/{{fields.customer}}"}

  - name: List Customers
    resource: Customer
    description: Lists the customers, optionally matching a search.
    fields:
      - {name: query, label: Search, description: "Name, email or notes."}
    request:
      method: GET
      path: customers
      query: {query: "{{fields.query}}"}
    pagination: {type: offset, items_path: items, offset_param: start, limit_param: limit, page_size: 100}

  - name: Update Customer
    resource: Customer
    description: Changes a customer. Empty fields stay as they are.
    fields:
      - {name: customer, label: Customer ID, required: true}
      - {name: email, label: Email}
      - {name: name, label: Name}
      - {name: cpf_cnpj, label: CPF or CNPJ}
      - {name: extra, label: More fields, type: json}
    request:
      method: PUT
      path: "customers/{{fields.customer}}"
      body: {email: "{{fields.email}}", name: "{{fields.name}}", cpf_cnpj: "{{fields.cpf_cnpj}}", _merge: "{{fields.extra}}"}

  - name: Delete Customer
    resource: Customer
    description: Deletes a customer.
    fields:
      - {name: customer, label: Customer ID, required: true}
    request: {method: DELETE, path: "customers/{{fields.customer}}"}

  - name: Create Invoice
    resource: Invoice
    description: Charges someone by Pix, boleto or card with an invoice.
    fields:
      - {name: email, label: Payer email, required: true}
      - {name: due_date, label: Due date, required: true, description: "Like 2026-02-10"}
      - {name: items, label: Items, type: json, required: true, description: 'Like [{"description": "Plano", "quantity": 1, "price_cents": 4990}]'}
      - {name: customer, label: Customer ID}
      - name: methods
        label: Payment methods
        type: multiselect
        default: [all]
        options:
          - {label: All, value: all}
          - {label: Pix, value: pix}
          - {label: Boleto, value: bank_slip}
          - {label: Card, value: credit_card}
      - {name: order_id, label: Your ID}
      - {name: payer, label: Payer, type: json, description: 'Like {"cpf_cnpj": "...", "name": "...", "address": {...}}, needed for boleto.'}
      - {name: extra, label: More fields, type: json}
    request:
      method: POST
      path: invoices
      body: {email: "{{fields.email}}", due_date: "{{fields.due_date}}", items: "{{fields.items}}", customer_id: "{{fields.customer}}", payable_with: "{{fields.methods}}", order_id: "{{fields.order_id}}", payer: "{{fields.payer}}", _merge: "{{fields.extra}}"}

  - name: Get Invoice
    resource: Invoice
    description: Reads an invoice, with its status, Pix code and boleto line.
    fields:
      - {name: invoice, label: Invoice ID, required: true}
    request: {method: GET, path: "invoices/{{fields.invoice}}"}

  - name: List Invoices
    resource: Invoice
    description: Lists the invoices, by customer, status or dates.
    fields:
      - {name: customer, label: Customer ID}
      - name: status
        label: Status
        type: select
        options:
          - {label: Pending, value: pending}
          - {label: Paid, value: paid}
          - {label: Canceled, value: canceled}
          - {label: Expired, value: expired}
          - {label: Refunded, value: refunded}
      - {name: query, label: Search}
      - {name: created_from, label: Created from, description: "Like 2026-02-10"}
      - {name: created_to, label: Created to, description: "Like 2026-02-10"}
    request:
      method: GET
      path: invoices
      query: {customer_id: "{{fields.customer}}", status_filter: "{{fields.status}}", query: "{{fields.query}}", created_at_from: "{{fields.created_from}}", created_at_to: "{{fields.created_to}}"}
    pagination: {type: offset, items_path: items, offset_param: start, limit_param: limit, page_size: 100}

  - name: Cancel Invoice
    resource: Invoice
    description: Cancels a pending invoice.
    fields:
      - {name: invoice, label: Invoice ID, required: true}
    request: {method: PUT, path: "invoices/{{fields.invoice}}/cancel"}

  - name: Refund Invoice
    resource: Invoice
    description: Refunds a paid invoice, whole or in part.
    fields:
      - {name: invoice, label: Invoice ID, required: true}
      - {name: partial_value_refund_cents, label: Amount in cents, type: number, description: Empty refunds it all.}
    request:
      method: POST
      path: "invoices/{{fields.invoice}}/refund"
      body: {partial_value_refund_cents: "{{fields.partial_value_refund_cents}}"}

  - name: Duplicate Invoice
    resource: Invoice
    description: Makes a new invoice from an expired one, with a new due date.
    fields:
      - {name: invoice, label: Invoice ID, required: true}
      - {name: due_date, label: New due date, required: true, description: "Like 2026-02-10"}
      - {name: apply_fines, label: Add fine and interest, type: boolean, default: true}
    request:
      method: POST
      path: "invoices/{{fields.invoice}}/duplicate"
      body: {due_date: "{{fields.due_date}}", ignore_due_email: false, ignore_canceled_email: true, current_fines_option: "{{fields.apply_fines}}"}

  - name: Create Plan
    resource: Plan
    description: Creates a plan that subscriptions follow.
    fields:
      - {name: name, label: Name, required: true}
      - {name: identifier, label: Identifier, required: true, description: "Like plano_mensal"}
      - {name: interval, label: Every, type: number, required: true, default: 1}
      - name: interval_type
        label: Period
        type: select
        required: true
        default: months
        options:
          - {label: Weeks, value: weeks}
          - {label: Months, value: months}
      - {name: value_cents, label: Price in cents, type: number, required: true}
      - {name: extra, label: More fields, type: json}
    request:
      method: POST
      path: plans
      body: {name: "{{fields.name}}", identifier: "{{fields.identifier}}", interval: "{{fields.interval}}", interval_type: "{{fields.interval_type}}", value_cents: "{{fields.value_cents}}", _merge: "{{fields.extra}}"}

  - name: List Plans
    resource: Plan
    description: Lists the plans.
    fields:
      - {name: query, label: Search}
    request:
      method: GET
      path: plans
      query: {query: "{{fields.query}}"}
    pagination: {type: offset, items_path: items, offset_param: start, limit_param: limit, page_size: 100}

  - name: Create Subscription
    resource: Subscription
    description: Subscribes a customer to a plan.
    fields:
      - {name: customer, label: Customer ID, required: true}
      - {name: plan, label: Plan identifier, required: true}
      - {name: expires_at, label: First charge on, description: "Like 2026-02-10"}
      - {name: only_on_charge_success, label: Only start once paid, type: boolean, default: false}
      - {name: extra, label: More fields, type: json}
    request:
      method: POST
      path: subscriptions
      body: {customer_id: "{{fields.customer}}", plan_identifier: "{{fields.plan}}", expires_at: "{{fields.expires_at}}", only_on_charge_success: "{{fields.only_on_charge_success}}", _merge: "{{fields.extra}}"}

  - name: Get Subscription
    resource: Subscription
    description: Reads a subscription.
    fields:
      - {name: subscription, label: Subscription ID, required: true}
    request: {method: GET, path: "subscriptions/{{fields.subscription}}"}

  - name: List Subscriptions
    resource: Subscription
    description: Lists the subscriptions, by customer if you like.
    fields:
      - {name: customer, label: Customer ID}
      - {name: query, label: Search}
    request:
      method: GET
      path: subscriptions
      query: {customer_id: "{{fields.customer}}", query: "{{fields.query}}"}
    pagination: {type: offset, items_path: items, offset_param: start, limit_param: limit, page_size: 100}

  - name: Suspend Subscription
    resource: Subscription
    description: Pauses a subscription.
    fields:
      - {name: subscription, label: Subscription ID, required: true}
    request: {method: POST, path: "subscriptions/{{fields.subscription}}/suspend"}

  - name: Activate Subscription
    resource: Subscription
    description: Resumes a suspended subscription.
    fields:
      - {name: subscription, label: Subscription ID, required: true}
    request: {method: POST, path: "subscriptions/{{fields.subscription}}/activate"}

  - name: Delete Subscription
    resource: Subscription
    description: Deletes a subscription.
    fields:
      - {name: subscription, label: Subscription ID, required: true}
    request: {method: DELETE, path: "subscriptions/{{fields.subscription}}"}

  - name: Get Account
    resource: Account
    description: Reads the account, with its balance.
    fields:
      - {name: account, label: Account ID, required: true}
    request: {method: GET, path: "accounts/{{fields.account}}"}

