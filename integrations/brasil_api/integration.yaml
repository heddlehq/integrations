category: data
base_url: https://brasilapi.com.br/api/
headers:
  User-Agent: Heddle/1.0

credential:
  label: BrasilAPI
  fields: []
  auth: {type: none}

errors:
  message_path: message

actions:
  # Companies and addresses
  - name: Look Up CEP
    resource: Address
    description: Finds the address of a CEP, with its coordinates when known.
    fields:
      - {name: cep, label: CEP, required: true, description: "8 digits, like 01001000"}
    request: {method: GET, path: "cep/v2/{{fields.cep}}"}

  - name: Look Up CNPJ
    resource: Company
    description: Reads a company's public registry by its CNPJ.
    fields:
      - {name: cnpj, label: CNPJ, required: true, description: 14 digits.}
    request: {method: GET, path: "cnpj/v1/{{fields.cnpj}}"}

  - name: Look Up Area Code
    resource: Address
    description: Lists the state and cities of a DDD.
    fields:
      - {name: ddd, label: DDD, required: true, description: "Like 11"}
    request: {method: GET, path: "ddd/v1/{{fields.ddd}}"}

  - name: Look Up Domain
    resource: Company
    description: Reads the status of a .br domain at Registro.br.
    fields:
      - {name: domain, label: Domain, required: true, description: "Like example.com.br"}
    request: {method: GET, path: "registrobr/v1/{{fields.domain}}"}

  # Banks and money
  - name: List Banks
    resource: Finance
    description: Lists the Brazilian banks with their codes and ISPB.
    request: {method: GET, path: banks/v1}

  - name: Get Bank
    resource: Finance
    description: Reads a bank by its code.
    fields:
      - {name: code, label: Bank code, required: true, description: "Like 341"}
    request: {method: GET, path: "banks/v1/{{fields.code}}"}

  - name: List Pix Participants
    resource: Finance
    description: Lists the institutions that take part in Pix.
    request: {method: GET, path: pix/v1/participants}

  - name: List Rates
    resource: Finance
    description: Lists the official rates, like Selic, CDI and IPCA.
    request: {method: GET, path: taxas/v1}

  - name: Get Rate
    resource: Finance
    description: Reads one official rate.
    fields:
      - {name: sigla, label: Rate, type: select, required: true, options: [{label: Selic, value: SELIC}, {label: CDI, value: CDI}, {label: IPCA, value: IPCA}]}
    request: {method: GET, path: "taxas/v1/{{fields.sigla}}"}

  - name: List Currencies
    resource: Finance
    description: Lists the currencies with exchange rates.
    request: {method: GET, path: cambio/v1/moedas}

  - name: Get Exchange Rate
    resource: Finance
    description: Reads a currency's exchange rates against the real on a day.
    fields:
      - {name: moeda, label: Currency, required: true, description: "Like USD"}
      - {name: data, label: Date, required: true, description: "Like 2026-01-30"}
    request: {method: GET, path: "cambio/v1/cotacao/{{fields.moeda}}/{{fields.data}}"}

  - name: List Brokers
    resource: Finance
    description: Lists the brokers registered with CVM.
    request: {method: GET, path: cvm/corretoras/v1}

  # Calendar
  - name: List Holidays
    resource: Calendar
    description: Lists the national holidays of a year.
    fields:
      - {name: ano, label: Year, type: number, required: true}
    request: {method: GET, path: "feriados/v1/{{fields.ano}}"}

  # Vehicles
  - name: List FIPE Brands
    resource: Vehicle
    description: Lists the vehicle brands in the FIPE table.
    fields:
      - {name: tipo, label: Vehicle, type: select, required: true, default: carros, options: [{label: Cars, value: carros}, {label: Motorcycles, value: motos}, {label: Trucks, value: caminhoes}]}
    request: {method: GET, path: "fipe/marcas/v1/{{fields.tipo}}"}

  - name: Get FIPE Price
    resource: Vehicle
    description: Reads the FIPE prices of a vehicle code.
    fields:
      - {name: codigo, label: FIPE code, required: true, description: "Like 001004-9"}
    request: {method: GET, path: "fipe/preco/v1/{{fields.codigo}}"}

  # IBGE
  - name: List States
    resource: IBGE
    description: Lists the Brazilian states.
    request: {method: GET, path: ibge/uf/v1}

  - name: List Cities
    resource: IBGE
    description: Lists the cities of a state, with their IBGE codes.
    fields:
      - {name: uf, label: State, required: true, description: "Like SP"}
    request: {method: GET, path: "ibge/municipios/v1/{{fields.uf}}"}

  # Products
  - name: Look Up ISBN
    resource: Product
    description: Reads a book by its ISBN.
    fields:
      - {name: isbn, label: ISBN, required: true}
    request: {method: GET, path: "isbn/v1/{{fields.isbn}}"}

  - name: Search NCM
    resource: Product
    description: Searches NCM codes by code or description.
    fields:
      - {name: search, label: Search, required: true}
    request: {method: GET, path: ncm/v1, query: {search: "{{fields.search}}"}}

  - name: Get NCM
    resource: Product
    description: Reads an NCM code.
    fields:
      - {name: code, label: NCM, required: true}
    request: {method: GET, path: "ncm/v1/{{fields.code}}"}

  # Weather
  - name: Find Weather City
    resource: Weather
    description: Finds the CPTEC code of a city, to ask for its forecast.
    fields:
      - {name: nome, label: City, required: true}
    request: {method: GET, path: "cptec/v1/cidade/{{fields.nome}}"}

  - name: Get Weather Forecast
    resource: Weather
    description: Reads a city's weather forecast for up to 6 days.
    fields:
      - {name: codigo, label: CPTEC city code, required: true, description: From Find Weather City.}
      - {name: dias, label: Days, type: number, default: 3}
    request: {method: GET, path: "cptec/v1/clima/previsao/{{fields.codigo}}/{{fields.dias}}"}


i18n:
  pt-BR:
    description: "Consulte CEPs, CNPJs, bancos, feriados, DDDs, preços FIPE, estados e municípios do IBGE, ISBNs, NCMs, participantes do Pix, domínios .br, taxas de juros, câmbio e previsão do tempo, com a BrasilAPI."
    actions:
      Look Up CEP: {name: "Consultar CEP", description: "Encontra o endereço de um CEP, com as coordenadas quando houver.", fields: {cep: "CEP"}}
