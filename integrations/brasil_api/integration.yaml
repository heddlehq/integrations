# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# BrasilAPI, the free public API for Brazilian data: CEP, CNPJ, banks, holidays, area
# codes, FIPE, IBGE, ISBN, NCM, Pix participants, .br domains, rates, exchange and
# weather. No key; it answers JSON and 404 when nothing is found.
id: brasil_api
name: BrasilAPI
version: 1.0.0
homepage: https://brasilapi.com.br/docs
description: Look up CEPs, CNPJs, banks, holidays, area codes, FIPE prices, IBGE states and cities, ISBNs, NCMs, Pix participants, .br domains, interest rates, exchange rates and the weather, with BrasilAPI.
icon: hero-magnifying-glass
