# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Pagar.me, through the Core API v5. Connect with the secret key (sk_…) from the
# dashboard's Desenvolvimento › Chaves. Amounts go in cents, like 4990 for R$ 49,90.
# Pagar.me's webhooks are set in the dashboard, so the triggers check for news every
# 5 minutes.
id: pagarme
name: Pagar.me
version: 1.0.0
description: Orders and charges by Pix, boleto and card, customers and subscriptions in Pagar.me.
icon: hero-credit-card
logo: |
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#FFFFFF"/><svg x="3.00" y="9.56" width="18.00" height="4.88" viewBox="0 0 1129.27 306.1"><defs> <style> .st0 { fill: #00461e; } .st1 { fill: #00da00; } </style> </defs> <g id="Camada_1"> <g> <path id="hat" class="st1" d="M1066.99,209.96h62.09c.1-2.54.19-5.09.19-7.66-.12-103.79-84.17-187.94-187.97-188.17v62.02c69.59.11,125.95,56.56,125.94,126.15.01,2.55-.09,5.12-.24,7.66h-.01Z"/> <path id="pagarme" class="st0" d="M309.47,304.1c-5.06-1.11-9.99-2.72-14.74-4.8-3.61-1.65-7.12-3.53-10.51-5.62-2.42-1.45-4.72-3.09-6.86-4.92l-2.04-2.04,12.35-18.29,1.72,1.74c1.53,1.35,3.12,2.61,4.8,3.76,2.53,1.85,5.21,3.5,8.01,4.92,7.61,3.61,15.92,5.52,24.35,5.6,9.78.91,19.51-2.09,27.09-8.33,5.94-6.57,8.95-15.28,8.36-24.12v-9.82c-.44.62-.91,1.23-1.39,1.81-1.35,1.51-2.8,2.92-4.34,4.22-2.27,2.06-4.76,3.86-7.43,5.39-3.47,1.82-7.16,3.19-10.98,4.08-4.83,1.25-9.8,1.86-14.78,1.81-15.2.58-30.02-4.84-41.27-15.09-11.29-11.45-17.14-27.17-16.11-43.21-.64-15.87,5.31-31.31,16.45-42.64,10.67-10.77,25.3-16.68,40.46-16.34,7.6-.12,15.14,1.32,22.17,4.22,5.02,1.82,9.62,4.67,13.48,8.35l3.67,4.08v-14.85h24.73v103.8c0,38.86-19.67,58.28-59,58.29h-.25c-6.03.02-12.04-.65-17.93-1.99h-.01ZM299.84,173.89c-6.51,7.49-9.91,17.19-9.47,27.11-.4,9.88,3.08,19.52,9.7,26.86,6.67,7.01,16.05,10.8,25.72,10.4,9.94.45,19.63-3.24,26.76-10.19,6.89-7.29,10.53-17.07,10.05-27.08.4-10.06-3.31-19.85-10.29-27.11-7.09-7.02-16.78-10.79-26.76-10.4-9.68-.45-19.08,3.36-25.71,10.43v-.02ZM0,303.61v-159.6h24.69v15.32c.31-.46.81-1.1,1.49-1.95,1.41-1.53,2.94-2.95,4.57-4.24,2.41-2.02,5.01-3.78,7.79-5.26,3.64-1.81,7.47-3.22,11.42-4.2,4.87-1.31,9.9-1.97,14.94-1.95,15.17-.53,29.85,5.42,40.36,16.36,10.74,11.7,16.39,27.21,15.67,43.08.93,16.22-4.72,32.14-15.67,44.15-10.92,10.87-25.88,16.67-41.27,16.01-4.93.03-9.85-.59-14.62-1.83-3.93-.95-7.7-2.45-11.21-4.45-2.61-1.56-5.13-3.28-7.54-5.15-1.7-1.25-3.24-2.71-4.57-4.34l-1.36-1.83v59.9L0,303.65v-.04h0ZM34.07,173.75c-6.88,7.62-10.51,17.63-10.07,27.89-.57,10.35,3.06,20.48,10.07,28.11,7.22,7.08,17.07,10.81,27.17,10.3,9.62.44,18.93-3.47,25.37-10.63,6.46-7.69,9.81-17.52,9.38-27.55.42-10.23-3.05-20.25-9.72-28.02-6.53-7.26-15.94-11.24-25.7-10.87-9.98-.38-19.63,3.55-26.49,10.8v-.05.02h0ZM608.14,255.98c-3.95-3.84-6.17-9.11-6.17-14.62s2.22-10.79,6.17-14.64c4.03-3.92,9.46-6.07,15.09-5.94,5.62-.11,11.06,2.03,15.1,5.94,3.94,3.85,6.16,9.13,6.15,14.64,0,5.5-2.22,10.77-6.15,14.62-4.09,3.82-9.49,5.95-15.1,5.94-5.6,0-10.99-2.11-15.09-5.92v-.02h0ZM457.23,261.54c-15.24.57-30.09-4.93-41.27-15.31-11.33-11.7-17.17-27.64-16.09-43.89-.72-16.12,5.23-31.83,16.45-43.43,10.63-10.84,25.28-16.79,40.46-16.45,7.6-.12,15.14,1.32,22.17,4.22,5.02,1.83,9.61,4.67,13.49,8.33l3.66,4.13v-14.64h24.68v115.24h-24.7v-15.79c-.31.46-.75,1.1-1.36,1.93-1.31,1.55-2.77,2.96-4.34,4.24-2.29,1.99-4.79,3.75-7.43,5.25-3.48,1.84-7.16,3.26-10.98,4.22-4.67,1.29-9.49,1.95-14.34,1.95h-.4ZM434.04,174.22c-6.57,7.67-9.98,17.56-9.51,27.65-.42,10.13,3.06,20.03,9.72,27.67,6.57,7.21,15.98,11.14,25.72,10.74,10,.51,19.75-3.23,26.85-10.28,6.94-7.67,10.53-17.8,9.96-28.13.45-10.23-3.26-20.21-10.3-27.65-7.04-7.09-16.75-10.91-26.74-10.51-9.7-.46-19.11,3.4-25.7,10.53v-.02ZM188.86,261.54c-15.24.58-30.08-4.93-41.25-15.31-11.33-11.7-17.18-27.64-16.12-43.89-.72-16.12,5.23-31.83,16.45-43.43,10.64-10.83,25.28-16.79,40.46-16.45,7.61-.12,15.15,1.32,22.19,4.22,5.01,1.84,9.6,4.67,13.48,8.33l3.65,4.13v-14.64h24.69v115.24h-24.69v-15.79c-.44.65-.9,1.3-1.36,1.93-1.31,1.55-2.77,2.96-4.34,4.24-2.29,1.99-4.79,3.75-7.43,5.25-3.48,1.84-7.16,3.26-10.98,4.22-4.67,1.29-9.5,1.95-14.35,1.95h-.4ZM165.65,174.22c-6.57,7.67-9.96,17.56-9.47,27.65-.42,10.12,3.05,20.03,9.7,27.67,6.56,7.21,15.98,11.15,25.72,10.74,10,.5,19.74-3.23,26.85-10.28,6.94-7.67,10.53-17.8,9.94-28.13.46-10.23-3.26-20.21-10.29-27.65-7.04-7.1-16.75-10.91-26.74-10.51-9.71-.46-19.12,3.39-25.71,10.53v-.02ZM540.24,259.72v-115.46h24.69v20.8c.26-.87.6-1.71,1.02-2.51,1.11-1.97,2.33-3.88,3.67-5.71,1.8-2.63,3.95-5.01