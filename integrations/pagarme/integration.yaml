3v54.81c0,15.18,9.73,23.74,24.78,23.74h10.76v-15.18l-14.18-.08c-1.82,0-3.29-1.47-3.29-3.29l-.04-31.78h17.51v-15.05h0Z"/> <g> <g> <path class="st1" d="M719.78,67.21l-19.01-19.01c-1.27-1.27-1.28-3.32-.04-4.62l-14-4.44c-.63,3.11-.83,6.38-.54,9.74,1.45,16.48,14.91,29.6,31.42,30.64,9.33.59,17.91-2.63,24.34-8.24.29-.25-.02-.71-.36-.53-2.14,1.15-5.1,2.11-9,2.11-7.49,0-12.8-5.65-12.8-5.65"/> <path class="st1" d="M719.78,12.14c-8.5,0-16.25,3.14-22.18,8.33-.29.25.03.71.36.52,2.14-1.16,5.1-2.12,9.02-2.12,7.86,0,12.8,5.65,12.8,5.65l19.01,19.01c1.29,1.29,1.29,3.37,0,4.66l13.87,5.14c.54-2.4.84-4.9.84-7.46,0-18.63-15.1-33.72-33.72-33.72h0Z"/> </g> <path class="st1" d="M738.8,48.19s2.27-3.1,4.46-2.56c9.92,2.43,10.22-1.28,10.22-1.28,0,0,1.4,24.76-17.13,24.76-7.86,0-12.8-5.65-12.8-5.65l15.26-15.27h-.01Z"/> <path class="st1" d="M700.76,43.55s-2.27,3.1-4.46,2.56c-9.92-2.43-10.22,1.28-10.22,1.28,0,0-1.4-24.76,17.13-24.76,7.86,0,12.8,5.65,12.8,5.65l-15.26,15.27h.01Z"/> </g> </g></svg></svg>
category: payments
author: Heddle
homepage: https://docs.pagar.me/reference
base_url: https://api.pagar.me/core/v5/

credential:
  label: Pagar.me
  fields:
    - {name: secret_key, label: Secret key, secret: true, required: true}
  auth:
    type: basic
    username: "{{credential.secret_key}}"
    password: ""

errors:
  message_path: message

triggers:
  - name: New Order
    description: Starts the flow for each new order, checking every 5 minutes.
    fields:
      - {name: status, label: Status, type: select, options: [{label: Paid, value: paid}, {label: Pending, value: pending}, {label: Canceled, value: canceled}, {label: Failed, value: failed}]}
    request:
      method: GET
      path: orders
      query: {status: "{{fields.status}}", size: 100}
    output: {path: data}
    poll: {every: 5, id: id}

  - name: Charge Paid
    description: Starts the flow each time a charge is paid, checking every 5 minutes.
    request:
      method: GET
      path: charges
      query: {status: paid, size: 100}
    output: {path: data}
    poll: {every: 5, id: id}

actions:
  # Customers
  - name: Create Customer
    resource: Customer
    description: Creates a customer.
    fields:
      - {name: name, label: Name, required: true}
      - {name: email, label: Email}
      - {name: document, label: CPF or CNPJ, description: "Numbers only."}
      - {name: type, label: Kind, type: select, default: individual, options: [{label: Person, value: individual}, {label: Company, value: company}]}
      - {name: phone, label: Mobile, type: json, description: '{"country_code": "55", "area_code": "11", "number": "999990000"}'}
      - {name: code, label: Your ID}
      - {name: address, label: Address, type: json}
    request:
      method: POST
      path: customers
      body: {name: "{{fields.name}}", email: "{{fields.email}}", document: "{{fields.document}}", type: "{{fields.type}}", phones: {mobile_phone: "{{fields.phone}}"}, code: "{{fields.code}}", address: "{{fields.address}}"}

  - name: Get Customer
    resource: Customer
    description: Reads a customer.
    fields:
      - {name: customer, label: Customer ID, required: true}
    request: {method: GET, path: "customers/{{fields.customer}}"}

  - name: List Customers
    resource: Customer
    description: Lists the customers, optionally by email or document.
    fields:
      - {name: email, label: Email}
      - {name: document, label: CPF or CNPJ}
      - {name: code, label: Your ID}
    request: {method: GET, path: customers, query: {email: "{{fields.email}}", document: "{{fields.document}}", code: "{{fields.code}}"}}
    pagination: {type: page, items_path: data, page_param: page, limit_param: size, page_size: 100}

  - name: Update Customer
    resource: Customer
    description: Changes a customer.
    fields:
      - {name: customer, label: Customer ID, required: true}
      - {name: name, label: Name, required: true}
      - {name: email, label: Email}
      - {name: document, label: CPF or CNPJ}
      - {name: type, label: Kind, type: select, options: [{label: Person, value: individual}, {label: Company, value: company}]}
      - {name: extra, label: More fields, type: json}
    request:
      method: PUT
      path: "customers/{{fields.customer}}"
      body: {name: "{{fields.name}}", email: "{{fields.email}}", document: "{{fields.document}}", type: "{{fields.type}}", _merge: "{{fields.extra}}"}

  # Orders
  - name: Create Pix Order
    resource: Order
    description: Creates an order paid by Pix; the charge has the QR code.
    fields:
      - {name: customer, label: Customer ID, required: true}
      - {name: amount, label: Amount (cents), type: number, required: true}
      - {name: description, label: Description, required: true}
      - {name: expires_in, label: Expires in (seconds), type: number, default: 3600}
      - {name: code, label: Your ID}
    request:
      method: POST
      path: orders
      body:
        customer_id: "{{fields.customer}}"
        code: "{{fields.code}}"
        items: [{amount: "{{fields.amount}}", description: "{{fields.description}}", quantity: 1, code: item}]
        payments: [{payment_method: pix, pix: {expires_in: "{{fields.expires_in}}"}}]

  - name: Create Boleto Order
    resource: Order
    description: Creates an order paid by boleto; the charge has its link and line.
    fields:
      - {name: customer, label: Customer ID, required: true, description: "The customer needs a document and an address."}
      - {name: amount, label: Amount (cents), type: number, required: true}
      - {name: description, label: Description, required: true}
      - {name: due_at, label: Due at, type: datetime}
      - {name: instructions, label: Instructions}
      - {name: code, label: Your ID}
    request:
      method: POST
      path: orders
      body:
        customer_id: "{{fields.customer}}"
        code: "{{fields.code}}"
        items: [{amount: "{{fields.amount}}", description: "{{fields.description}}", quantity: 1, code: item}]
        payments: [{payment_method: boleto, boleto: {due_at: "{{fields.due_at}}", instructions: "{{fields.instructions}}"}}]

  - name: Create Order
    resource: Order
    description: Creates an order with any items and payments, like a card or a split.
    fields:
      - {name: customer, label: Customer ID}
      - {name: items, label: Items, type: json, required: true, description: '[{"amount": 4990, "description": "Plan", "quantity": 1, "code": "plan"}]'}
      - {name: payments, label: Payments, type: json, required: true, description: '[{"payment_method": "credit_card", "credit_card": {"installments": 1, "card_token": "..."}}]'}
      - {name: closed, label: Closed, type: boolean, default: true}
      - {name: code, label: Your ID}
      - {name: extra, label: More fields, type: json}
    request:
      method: POST
      path: orders
      body: {customer_id: "{{fields.customer}}", items: "{{fields.items}}", payments: "{{fields.payments}}", closed: "{{fields.closed}}", code: "{{fields.code}}", _merge: "{{fields.extra}}"}

  - name: Get Order
    resource: Order
    description: Reads an order, with its charges.
    fields:
      - {name: order, label: Order ID, required: true}
    request: {method: GET, path: "orders/{{fields.order}}"}

  - name: List Orders
    resource: Order
    description: Lists the orders, by status, customer or date.
    fields:
      - {name: status, label: Status, type: select, options: [{label: Paid, value: paid}, {label: Pending, value: pending}, {label: Canceled, value: canceled}, {label: Failed, value: failed}]}
      - {name: customer, label: Customer ID}
      - {name: code, label: Your ID}
      - {name: since, label: Created since, type: datetime}
      - {name: until, label: Created until, type: datetime}
    request: {method: GET, path: orders, query: {status: "{{fields.status}}", customer_id: "{{fields.customer}}", code: "{{fields.code}}", created_since: "{{fields.since}}", created_until: "{{fields.until}}"}}
    pagination: {type: page, items_path: data, page_param: page, limit_param: size, page_size: 100}

  - name: Close Order
    resource: Order
    description: Closes an open order, as paid, canceled or failed.
    fields:
      - {name: order, label: Order ID, required: true}
      - {name: status, label: As, type: select, default: paid, options: [{label: Paid, value: paid}, {label: Canceled, value: canceled}, {label: Failed, value: failed}]}
    request:
      method: PATCH
      path: "orders/{{fields.order}}/closed"
      body: {status: "{{fields.status}}"}

  # Charges
  - name: Get Charge
    resource: Charge
    description: Reads a charge.
    fields:
      - {name: charge, label: Charge ID, required: true}
    request: {method: GET, path: "charges/{{fields.charge}}"}

  - name: List Charges
    resource: Charge
    description: Lists the charges.
    fields:
      - {name: status, label: Status, type: select, options: [{label: Paid, value: paid}, {label: Pending, value: pending}, {label: Canceled, value: canceled}, {label: Processing, value: processing}, {label: Failed, value: failed}, {label: Overpaid, value: overpaid}, {label: Underpaid, value: underpaid}]}
      - {name: payment_method, label: Method, type: select, options: [{label: Pix, value: pix}, {label: Boleto, value: boleto}, {label: Credit card, value: credit_card}, {label: Debit card, value: debit_card}]}
      - {name: customer, label: Customer ID}
      - {name: order, label: Order ID}
      - {name: since, label: Created since, type: datetime}
    request: {method: GET, path: charges, query: {status: "{{fields.status}}", payment_method: "{{fields.payment_method}}", customer_id: "{{fields.customer}}", order_id: "{{fields.order}}", created_since: "{{fields.since}}"}}
    pagination: {type: page, items_path: data, page_param: page, limit_param: size, page_size: 100}

  - name: Capture Charge
    resource: Charge
    description: Captures a card charge that was only authorized.
    fields:
      - {name: charge, label: Charge ID, required: true}
      - {name: amount, label: Amount (cents), type: number, description: "All when empty."}
    request:
      method: POST
      path: "charges/{{fields.charge}}/capture"
      body: {amount: "{{fields.amount}}"}

  - name: Cancel Charge
    resource: Charge
    description: Cancels a charge, refunding it when it was paid, in full or in part.
    fields:
      - {name: charge, label: Charge ID, required: true}
      - {name: amount, label: Amount (cents), type: number, description: "All when empty."}
    request:
      method: DELETE
      path: "charges/{{fields.charge}}"
      body: {amount: "{{fields.amount}}"}

  - name: Retry Charge
    resource: Charge
    description: Tries a failed card charge again.
    fields:
      - {name: charge, label: Charge ID, required: true}
    request: {method: POST, path: "charges/{{fields.charge}}/retry"}

  # Subscriptions
  - name: Create Subscription
    resource: Subscription
    description: Charges a customer's card every period, from a plan or with its own items.
    fields:
      - {name: customer, label: Customer ID, required: true}
      - {name: plan, label: Plan ID, description: "Or give the items."}
      - {name: card_token, label: Card token}
      - {name: card_id, label: Saved card ID}
      - {name: payment_method, label: Method, type: select, default: credit_card, options: [{label: Credit card, value: credit_card}, {label: Boleto, value: boleto}]}
      - {name: extra, label: More fields, type: json, description: 'Like {"interval": "month", "items": [...]} without a plan.'}
    request:
      method: POST
      path: subscriptions
      body: {customer_id: "{{fields.customer}}", plan_id: "{{fields.plan}}", card_token: "{{fields.card_token}}", card_id: "{{fields.card_id}}", payment_method: "{{fields.payment_method}}", _merge: "{{fields.extra}}"}

  - name: Get Subscription
    resource: Subscription
    description: Reads a subscription.
    fields:
      - {name: subscription, label: Subscription ID, required: true}
    request: {method: GET, path: "subscriptions/{{fields.subscription}}"}

  - name: List Subscriptions
    resource: Subscription
    description: Lists the subscriptions.
    fields:
      - {name: status, label: Status, type: select, options: [{label: Active, value: active}, {label: Canceled, value: canceled}, {label: Future, value: future}]}
      - {name: customer, label: Customer ID}
      - {name: plan, label: Plan ID}
    request: {method: GET, path: subscriptions, query: {status: "{{fields.status}}", customer_id: "{{fields.customer}}", plan_id: "{{fields.plan}}"}}
    pagination: {type: page, items_path: data, page_param: page, limit_param: size, page_size: 100}

  - name: Cancel Subscription
    resource: Subscription
    description: Cancels a subscription.
    fields:
      - {name: subscription, label: Subscription ID, required: true}
      - {name: cancel_pending, label: Cancel open invoices too, type: boolean, default: true}
    request:
      method: DELETE
      path: "subscriptions/{{fields.subscription}}"
      body: {cancel_pending_invoices: "{{fields.cancel_pending}}"}

  - name: List Plans
    resource: Subscription
    description: Lists the plans.
    request: {method: GET, path: plans}
    pagination: {type: page, items_path: data, page_param: page, limit_param: size, page_size: 100}

  # Balance
  - name: Get Balance
    resource: Balance
    description: Reads a recipient's balance, available and to come.
    fields:
      - {name: recipient, label: Recipient ID, required: true, description: "rp_…, from the dashboard."}
    request: {method: GET, path: "recipients/{{fields.recipient}}/balance"}

