      Get Checkout Link: {name: "Ler link de checkout", description: "Lê uma preferência de checkout.", fields: {preference: "ID da preferência"}}
      Create Customer: {name: "Criar cliente", description: "Salva um cliente, para guardar os cartões dele.", fields: {email: "E-mail", first_name: "Nome", last_name: "Sobrenome", cpf: "CPF", phone: "Telefone"}}
      Search Customers: {name: "Buscar clientes", description: "Encontra clientes por e-mail.", fields: {email: "E-mail"}}
