# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Focus NFe, through the API v2. Connect with the company's token from Focus NFe's
# panel, the production or the homologation one with its address. Each invoice is
# named by a reference of yours, like pedido-123, used to read, cancel or email it.
# Issuing is asynchronous: read the invoice, or use the trigger, to see it authorized.
id: focus_nfe
name: Focus NFe
version: 1.0.0
description: Issue, read, cancel and email NF-e, NFC-e and NFS-e through Focus NFe, and look up CNPJ, CEP and NCM.
icon: hero-document-text
