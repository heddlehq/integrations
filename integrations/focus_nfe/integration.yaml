    triggers:
      Invoice Event: {name: "Evento de nota", description: "Inicia o fluxo quando uma nota de uma empresa é autorizada, negada ou cancelada.", fields: {cnpj: "CNPJ da empresa", event: "Tipo de nota"}}
    actions:
      Issue NF-e: {name: "Emitir NF-e", description: "Envia uma NF-e para autorização, no formato da Focus NFe.", fields: {ref: "Sua referência", nfe: "Nota"}}
