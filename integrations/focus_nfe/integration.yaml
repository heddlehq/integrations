category: fiscal
author: Heddle
homepage: https://focusnfe.com.br/doc/
base_url: "{{credential.url}}/v2/"
headers:
  User-Agent: Heddle

credential:
  label: Focus NFe
  fields:
    - {name: token, label: Token, secret: true, required: true}
    - {name: url, label: API address, default: "https://api.focusnfe.com.br", description: "https://homologacao.focusnfe.com.br for homologation."}
  auth:
    type: basic
    username: "{{credential.token}}"
    password: ""

errors:
  message_path: mensagem

triggers:
  - name: Invoice Event
    description: Starts the flow when an invoice of a company is authorized, denied or canceled.
    fields:
      - {name: cnpj, label: Company CNPJ, required: true, description: Only digits.}
      - name: event
        label: Invoice type
        type: select
        required: true
        default: nfe
        options:
          - {label: NF-e, value: nfe}
          - {label: NFC-e, value: nfce}
          - {label: NFS-e, value: nfse}
          - {label: NFS-e Nacional, value: nfsen}
          - {label: CT-e, value: cte}
          - {label: MDF-e, value: mdfe}
          - {label: NF-e received, value: nfe_recebida}
    webhook:
      register:
        request:
          method: POST
          path: hooks
          body: {cnpj: "{{fields.cnpj}}", event: "{{fields.event}}", url: "{{webhook.url}}", authorization: "{{webhook.secret}}", authorization_header: X-Heddle-Token}
        id_path: id
      unregister:
        request: {method: DELETE, path: "hooks/{{webhook.id}}"}
      signature: {header: X-Heddle-Token, token: "{{webhook.secret}}"}

actions:
  # NF-e
  - name: Issue NF-e
    resource: NF-e
    description: Sends an NF-e for authorization, in Focus NFe's format.
    fields:
      - {name: ref, label: Your reference, required: true, description: "Like pedido-123"}
      - {name: nfe, label: Invoice, type: json, required: true, description: 'Like {"natureza_operacao": "Venda", "cnpj_emitente": "...", "nome_destinatario": "...", "items": [...]}'}
    request:
      method: POST
      path: nfe
      query: {ref: "{{fields.ref}}"}
      body: {_merge: "{{fields.nfe}}"}

  - name: Get NF-e
    resource: NF-e
    description: Reads an NF-e, with its status, key and links to the XML and DANFE.
    fields:
      - {name: ref, label: Your reference, required: true}
      - {name: completa, label: With the whole invoice, type: boolean, default: false}
    request:
      method: GET
      path: "nfe/{{fields.ref}}"
      query: {completa: "{{fields.completa}}"}

  - name: Cancel NF-e
    resource: NF-e
    description: Cancels an authorized NF-e, within the deadline.
    fields:
      - {name: ref, label: Your reference, required: true}
      - {name: justificativa, label: Reason, required: true, description: 15 to 255 characters.}
    request:
      method: DELETE
      path: "nfe/{{fields.ref}}"
      body: {justificativa: "{{fields.justificativa}}"}

  - name: Correct NF-e
    resource: NF-e
    description: Sends a correction letter (CC-e) for an NF-e.
    fields:
      - {name: ref, label: Your reference, required: true}
      - {name: correcao, label: Correction, type: textarea, required: true, description: 15 to 1000 characters.}
    request:
      method: POST
      path: "nfe/{{fields.ref}}/carta_correcao"
      body: {correcao: "{{fields.correcao}}"}

  - name: Email NF-e
    resource: NF-e
    description: Emails an NF-e's XML and DANFE.
    fields:
      - {name: ref, label: Your reference, required: true}
      - {name: emails, label: Emails, type: json, required: true, description: 'Like ["ana@x.com"]'}
    request:
      method: POST
      path: "nfe/{{fields.ref}}/email"
      body: {emails: "{{fields.emails}}"}

  - name: Void Numbers
    resource: NF-e
    description: Voids (inutiliza) a range of NF-e numbers that weren't used.
    fields:
      - {name: cnpj, label: Company CNPJ, required: true}
      - {name: serie, label: Series, required: true}
      - {name: numero_inicial, label: From number, required: true}
      - {name: numero_final, label: To number, required: true}
      - {name: justificativa, label: Reason, required: true}
    request:
      method: POST
      path: nfe/inutilizacao
      body: {cnpj: "{{fields.cnpj}}", serie: "{{fields.serie}}", numero_inicial: "{{fields.numero_inicial}}", numero_final: "{{fields.numero_final}}", justificativa: "{{fields.justificativa}}"}

  # NFC-e
  - name: Issue NFC-e
    resource: NFC-e
    description: Issues a consumer invoice (NFC-e), in Focus NFe's format. It's authorized right away.
    fields:
      - {name: ref, label: Your reference, required: true}
      - {name: nfce, label: Invoice, type: json, required: true}
    request:
      method: POST
      path: nfce
      query: {ref: "{{fields.ref}}"}
      body: {_merge: "{{fields.nfce}}"}

  - name: Get NFC-e
    resource: NFC-e
    description: Reads an NFC-e.
    fields:
      - {name: ref, label: Your reference, required: true}
    request: {method: GET, path: "nfce/{{fields.ref}}"}

  - name: Cancel NFC-e
    resource: NFC-e
    description: Cancels an NFC-e.
    fields:
      - {name: ref, label: Your reference, required: true}
      - {name: justificativa, label: Reason, required: true}
    request:
      method: DELETE
      path: "nfce/{{fields.ref}}"
      body: {justificativa: "{{fields.justificativa}}"}

  # NFS-e
  - name: Issue NFS-e
    resource: NFS-e
    description: Sends a service invoice (NFS-e) to the city hall, in Focus NFe's format.
    fields:
      - {name: ref, label: Your reference, required: true}
      - {name: nfse, label: Invoice, type: json, required: true, description: 'Like {"data_emissao": "...", "prestador": {...}, "tomador": {...}, "servico": {...}}'}
    request:
      method: POST
      path: nfse
      query: {ref: "{{fields.ref}}"}
      body: {_merge: "{{fields.nfse}}"}

  - name: Get NFS-e
    resource: NFS-e
    description: Reads an NFS-e, with its status and links.
    fields:
      - {name: ref, label: Your reference, required: true}
    request: {method: GET, path: "nfse/{{fields.ref}}"}

  - name: Cancel NFS-e
    resource: NFS-e
    description: Cancels an NFS-e.
    fields:
      - {name: ref, label: Your reference, required: true}
      - {name: justificativa, label: Reason, required: true}
    request:
      method: DELETE
      path: "nfse/{{fields.ref}}"
      body: {justificativa: "{{fields.justificativa}}"}

  - name: Email NFS-e
    resource: NFS-e
    description: Emails an NFS-e.
    fields:
      - {name: ref, label: Your reference, required: true}
      - {name: emails, label: Emails, type: json, required: true}
    request:
      method: POST
      path: "nfse/{{fields.ref}}/email"
      body: {emails: "{{fields.emails}}"}

  - name: Issue NFS-e Nacional
    resource: NFS-e
    description: Sends a service invoice through the national standard (NFS-e Nacional).
    fields:
      - {name: ref, label: Your reference, required: true}
      - {name: nfsen, label: Invoice, type: json, required: true}
    request:
      method: POST
      path: nfsen
      query: {ref: "{{fields.ref}}"}
      body: {_merge: "{{fields.nfsen}}"}

  - name: Get NFS-e Nacional
    resource: NFS-e
    description: Reads an NFS-e Nacional.
    fields:
      - {name: ref, label: Your reference, required: true}
    request: {method: GET, path: "nfsen/{{fields.ref}}"}

  # Lookups
  - name: Look Up CNPJ
    resource: Lookup
    description: Reads a company's registration by CNPJ.
    fields:
      - {name: cnpj, label: CNPJ, required: true, description: Only digits.}
    request: {method: GET, path: "cnpjs/{{fields.cnpj}}"}

  - name: Look Up CEP
    resource: Lookup
    description: Reads an address by CEP.
    fields:
      - {name: cep, label: CEP, required: true, description: Only digits.}
    request: {method: GET, path: "ceps/{{fields.cep}}"}

  - name: Look Up NCM
    resource: Lookup
    description: Finds NCM codes by code or description.
    fields:
      - {name: codigo, label: Code}
      - {name: descricao, label: Description}
    request:
      method: GET
      path: ncms
      query: {codigo: "{{fields.codigo}}", descricao: "{{fields.descricao}}"}

  - name: Look Up CFOP
    resource: Lookup
    description: Finds CFOP codes by code or description.
    fields:
      - {name: codigo, label: Code}
      - {name: descricao, label: Description}
    request:
      method: GET
      path: cfops
      query: {codigo: "{{fields.codigo}}", descricao: "{{fields.descricao}}"}

i18n:
  pt-BR:
