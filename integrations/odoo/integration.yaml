# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Odoo 19 or later, through its JSON-2 API. Connect with an API key made in the
# user's Preferences › Account Security › New API Key; the nodes act as that user.
# Records are read and changed by model, like res.partner for contacts, with
# Odoo's domain filters, like [["is_company", "=", true]].
id: odoo
name: Odoo
version: 1.0.0
description: Contacts, leads, sales orders and any other record in Odoo.
icon: hero-building-office-2
logo: |
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#714B67" d="M21.1 15.796a2.9 2.9 0 1 1 0-5.8a2.9 2.9 0 0 1 0 5.8m0-1.2a1.7 1.7 0 1 0 .002-3.4H21.1a1.7 1.7 0 0 0 0 3.4m-6.065 1.2a2.9 2.9 0 1 1 0-5.8a2.9 2.9 0 0 1 0 5.8m0-1.2a1.7 1.7 0 1 0 .002-3.4h-.002a1.7 1.7 0 0 0 0 3.4m-3.17-1.738c0 1.62-1.298 2.938-2.898 2.938s-2.9-1.314-2.9-2.936S7.248 10 8.968 10c.636 0 1.224.134 1.7.484v-1.68a.6.6 0 0 1 1.2 0v4.054zm-2.898 1.74a1.7 1.7 0 0 0 .002-3.4h-.002a1.7 1.7 0 0 0 0 3.4M2.9 15.796a2.9 2.9 0 1 1 0-5.8a2.9 2.9 0 0 1 0 5.8m0-1.2a1.7 1.7 0 1 0 .002-3.4H2.9a1.7 1.7 0 0 0 0 3.4"/></svg>
category: erp
author: Heddle
homepage: https://www.odoo.com/documentation/19.0/developer/reference/external_api.html
base_url: "{{credential.url}}/json/2/"
headers:
  X-Odoo-Database: "{{credential.database}}"

credential:
  label: Odoo
  fields:
    - {name: url, label: Odoo URL, required: true, description: "Like https://acme.odoo.com"}
    - {name: database, label: Database, description: "Needed when the server holds more than one."}
    - {name: api_key, label: API key, secret: true, required: true}
  auth:
    type: bearer
    token: "{{credential.api_key}}"

errors:
  message_path: message

triggers:
  - name: New Record
    description: Starts the flow for each new record of a model, checking every 5 minutes.
    fields:
      - {name: model, label: Model, required: true, default: res.partner, description: "Like res.partner, crm.lead, sale.order or product.product"}
      - {name: domain, label: Filter, type: json, description: 'Like [["type", "=", "opportunity"]]'}
      - {name: fields, label: Fields, type: json, description: 'Like ["name", "email"]. The usual ones when empty.'}
    request:
      method: POST
      path: "{{fields.model}}/search_read"
      body: {domain: "{{fields.domain}}", fields: "{{fields.fields}}", order: "id desc", limit: 100}
    poll: {every: 5, id: id}

actions:
  # Any model
  - name: Search Records
    resource: Record
    description: Finds records of a model and reads their fields.
    fields:
      - {name: model, label: Model, required: true, default: res.partner, description: "Like res.partner, crm.lead, sale.order or product.product"}
      - {name: domain, label: Filter, type: json, description: 'Like [["is_company", "=", true], ["country_id.code", "=", "BR"]]'}
      - {name: fields, label: Fields, type: json, description: 'Like ["name", "email", "phone"]'}
      - {name: order, label: Order, description: "Like name asc, id desc"}
      - {name: limit, label: Up to, type: number, default: 100}
      - {name: offset, label: Skip, type: number}
    request:
      method: POST
      path: "{{fields.model}}/search_read"
      body: {domain: "{{fields.domain}}", fields: "{{fields.fields}}", order: "{{fields.order}}", limit: "{{fields.limit}}", offset: "{{fields.offset}}"}

  - name: Count Records
    resource: Record
    description: Counts the records of a model that match a filter.
    fields:
      - {name: model, label: Model, required: true, default: res.partner, description: "Like res.partner, crm.lead, sale.order or product.product"}
      - {name: domain, label: Filter, type: json}
    request:
      method: POST
      path: "{{fields.model}}/search_count"
      body: {domain: "{{fields.domain}}"}

  - name: Get Records
    resource: Record
    description: Reads some records by ID.
    fields:
      - {name: model, label: Model, required: true, default: res.partner, description: "Like res.partner, crm.lead, sale.order or product.product"}
      - {name: ids, label: IDs, required: true, description: "Like 7, 12"}
      - {name: fields, label: Fields, type: json}
    request:
      method: POST
      path: "{{fields.model}}/read"
      body: {ids: {_each: "{{fields.ids}}", _value: "{{item}}"}, fields: "{{fields.fields}}"}

  - name: Create Record
    resource: Record
    description: Creates a record of a model.
    fields:
      - {name: model, label: Model, required: true, default: res.partner, description: "Like res.partner, crm.lead, sale.order or product.product"}
      - {name: values, label: Values, type: json, required: true, description: 'Like {"name": "Acme", "email": "contato@acme.com"}'}
    request:
      method: POST
      path: "{{fields.model}}/create"
      body: {vals_list: ["{{fields.values}}"]}

  - name: Update Records
    resource: Record
    description: Changes some records by ID.
    fields:
      - {name: model, label: Model, required: true, default: res.partner, description: "Like res.partner, crm.lead, sale.order or product.product"}
      - {name: ids, label: IDs, required: true}
      - {name: values, label: Values, type: json, required: true}
    request:
      method: POST
      path: "{{fields.model}}/write"
      body: {ids: {_each: "{{fields.ids}}", _value: "{{item}}"}, vals: "{{fields.values}}"}

  - name: Delete Records
    resource: Record
    description: Deletes some records by ID.
    fields:
      - {name: model, label: Model, required: true, default: res.partner, description: "Like res.partner, crm.lead, sale.order or product.product"}
      - {name: ids, label: IDs, required: true}
    request:
      method: POST
      path: "{{fields.model}}/unlink"
      body: {ids: {_each: "{{fields.ids}}", _value: "{{item}}"}}

  - name: Call Method
    resource: Record
    description: Calls any public method of a model, like action_confirm on sale.order.
    fields:
      - {name: model, label: Model, required: true, default: res.partner, description: "Like res.partner, crm.lead, sale.order or product.product"}
      - {name: method, label: Method, required: true}
      - {name: args, label: Arguments, type: json, description: 'By name, like {"ids": [7]}'}
    request:
      method: POST
      path: "{{fields.model}}/{{fields.method}}"
      body: "{{fields.args}}"

  - name: List Fields
    resource: Record
    description: Lists a model's fields, with their types and labels.
    fields:
      - {name: model, label: Model, required: true, default: res.partner, description: "Like res.partner, crm.lead, sale.order or product.product"}
    request:
      method: POST
      path: "{{fields.model}}/fields_get"
      body: {attributes: [string, type, required, selection, relation]}

  # Contacts
  - name: Create Contact
    resource: Contact
    description: Creates a contact or a company.
    fields:
      - {name: name, label: Name, required: true}
      - {name: is_company, label: Company, type: boolean, default: false}
      - {name: email, label: Email}
      - {name: phone, label: Phone}
      - {name: vat, label: Tax ID, description: "Like the CNPJ or CPF."}
      - {name: street, label: Street}
      - {name: city, label: City}
      - {name: zip, label: ZIP}
      - {name: parent_id, label: Company ID, type: number, description: "For a person who works at a company."}
      - {name: extra, label: More values, type: json}
    request:
      method: POST
      path: res.partner/create
      body:
        vals_list:
          - {name: "{{fields.name}}", is_company: "{{fields.is_company}}", email: "{{fields.email}}", phone: "{{fields.phone}}", vat: "{{fields.vat}}", street: "{{fields.street}}", city: "{{fields.city}}", zip: "{{fields.zip}}", parent_id: "{{fields.parent_id}}", _merge: "{{fields.extra}}"}

  # CRM
  - name: Create Lead
    resource: Lead
    description: Creates a lead or an opportunity in the CRM.
    fields:
      - {name: name, label: Title, required: true}
      - {name: type, label: Kind, type: select, default: lead, options: [{label: Lead, value: lead}, {label: Opportunity, value: opportunity}]}
      - {name: contact_name, label: Contact name}
      - {name: email, label: Email}
      - {name: phone, label: Phone}
      - {name: partner_name, label: Company name}
      - {name: expected_revenue, label: Expected revenue, type: number}
      - {name: description, label: Notes, type: textarea}
      - {name: extra, label: More values, type: json}
    request:
      method: POST
      path: crm.lead/create
      body:
        vals_list:
          - {name: "{{fields.name}}", type: "{{fields.type}}", contact_name: "{{fields.contact_name}}", email_from: "{{fields.email}}", phone: "{{fields.phone}}", partner_name: "{{fields.partner_name}}", expected_revenue: "{{fields.expected_revenue}}", description: "{{fields.description}}", _merge: "{{fields.extra}}"}

  # Notes
  - name: Post Message
    resource: Message
    description: Writes a message or an internal note in a record's chatter.
    fields:
      - {name: model, label: Model, required: true, default: res.partner, description: "Like res.partner, crm.lead, sale.order or product.product"}
      - {name: id, label: Record ID, type: number, required: true}
      - {name: body, label: Message, type: textarea, required: true}
      - {name: subtype, label: As, type: select, default: mail.mt_note, options: [{label: Internal note, value: mail.mt_note}, {label: Message to followers, value: mail.mt_comment}]}
    request:
      method: POST
      path: "{{fields.model}}/message_post"
      body: {ids: ["{{fields.id}}"], body: "{{fields.body}}", message_type: comment, subtype_xmlid: "{{fields.subtype}}"}

i18n:
  pt-BR:
    description: "Contatos, leads, pedidos de venda e qualquer outro registro no Odoo."
    triggers:
      New Record: {name: "Novo registro", description: "Inicia o fluxo para cada registro novo de um modelo, olhando a cada 5 minutos.", fields: {model: "Modelo", domain: "Filtro", fields: "Campos"}}
    actions:
      Search Records: {name: "Buscar registros", description: "Encontra registros de um modelo e lê os campos.", fields: {model: "Modelo", domain: "Filtro", fields: "Campos", order: "Ordem", limit: "Até", offset: "Pular"}}
      Count Records: {name: "Contar registros", description: "Conta os registros de um modelo que batem com um filtro.", fields: {model: "Modelo", domain: "Filtro"}}
      Get Records: {name: "Ler registros", description: "Lê registros pelo ID.", fields: {model: "Modelo", ids: "IDs", fields: "Campos"}}
      Create Record: {name: "Criar registro", description: "Cria um registro de um modelo.", fields: {model: "Modelo", values: "Valores"}}
      Update Records: {name: "Atualizar registros", description: "Altera registros pelo ID.", fields: {model: "Modelo", ids: "IDs", values: "Valores"}}
      Delete Records: {name: "Excluir registros", description: "Exclui registros pelo ID.", fields: {model: "Modelo", ids: "IDs"}}
      Call Method: {name: "Chamar método", description: "Chama qualquer método público de um modelo, como action_confirm em sale.order.", fields: {model: "Modelo", method: "Método", args: "Argumentos"}}
      List Fields: {name: "Listar campos", description: "Lista os campos de um modelo, com tipos e rótulos.", fields: {model: "Modelo"}}
      Create Contact: {name: "Criar contato", description: "Cria um contato ou empresa.", fields: {name: "Nome", is_company: "Empresa", email: "E-mail", phone: "Telefone", vat: "CNPJ/CPF", street: "Rua", city: "Cidade", zip: "CEP", parent_id: "ID da empresa", extra: "Mais valores"}}
      Create Lead: {name: "Criar lead", description: "Cria um lead ou oportunidade no CRM.", fields: {name: "Título", type: "Tipo", contact_name: "Nome do contato", email: "E-mail", phone: "Telefone", partner_name: "Nome da empresa", expected_revenue: "Receita esperada", description: "Notas", extra: "Mais valores"}}
      Post Message: {name: "Escrever mensagem", description: "Escreve uma mensagem ou nota interna no histórico de um registro.", fields: {model: "Modelo", id: "ID do registro", body: "Mensagem", subtype: "Como"}}
