    actions:
      Create Event: {name: "Criar evento", description: "Adiciona um evento, com horário ou de dia inteiro, e convida pessoas.", fields: {calendar_id: "Agenda", summary: "Título", start: "Início", end: "Fim", start_date: "Data de início", end_date: "Data de fim", time_zone: "Fuso horário", description: "Descrição", location: "Local", attendees: "Convidados", send_updates: "Avisar convidados", color_id: "Cor", visibility: "Visibilidade", transparency: "Mostrar como"}}
