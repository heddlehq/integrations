      Update Event: {name: "Atualizar evento", description: "Muda os campos preenchidos de um evento; os outros ficam.", fields: {calendar_id: "Agenda", event_id: "ID do evento", summary: "Título", start: "Início", end: "Fim", start_date: "Data de início", end_date: "Data de fim", time_zone: "Fuso horário", description: "Descrição", location: "Local", attendees: "Convidados", send_updates: "Avisar convidados"}}
      Delete Event: {name: "Excluir evento", description: "Exclui um evento e avisa os convidados quando pedido.", fields: {calendar_id: "Agenda", event_id: "ID do evento", send_updates: "Avisar convidados"}}
