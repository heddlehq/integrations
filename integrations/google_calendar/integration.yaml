#
# Google Calendar API v3 with Google OAuth. The triggers poll the events changed in
# the last day (updatedMin), so a flow sees each new or changed event once.
id: google_calendar
name: Google Calendar
version: 1.0.0
homepage: https://developers.google.com/workspace/calendar/api/v3/reference
description: Create, update and find Google Calendar events, check when people are free, manage calendars, and start flows on new or changed events.
icon: hero-calendar-days
