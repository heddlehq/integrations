# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Banco Central do Brasil open data: the SGS time series (Selic, CDI, IPCA, IGP-M and
# thousands more), the PTAX exchange rates, the Focus market expectations and the
# interest rates banks charge. Public, no key. SGS answers at api.bcb.gov.br; PTAX,
# Focus and the bank rates are OData services at olinda.bcb.gov.br.
id: bcb
name: Banco Central
version: 1.0.0
homepage: https://dadosabertos.bcb.gov.br
description: Read Selic, CDI, IPCA and any SGS time series, PTAX exchange rates, the Focus market expectations and the interest rates of each bank, from Banco Central do Brasil.
icon: hero-building-library
logo: |-
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#FFFFFF"/><svg x="3.00" y="3.00" width="18.00" height="18.00" viewBox="172 -2 156 156"><path d="m304.44 214.52h10.432l-0.3793-28.832h0.1896l14.795 28.832h13.847v-42.299h-10.243l0.1897 28.642h-0.1897l-14.226-28.642h-14.416zm54.439 0h11.191v-33.953h10.432v-8.346h-32.056v8.346h10.432zm26.745 0h11.191v-16.692h2.2761c4.173 0 5.6905 1.8968 7.9666 9.1047l2.4659 7.5873h11.76l-4.1729-11.571c-2.0865-5.1214-2.2762-8.346-6.0698-9.2944v-0.18968c5.5007-1.3278 8.1563-5.1214 8.1563-10.622 0-7.2079-6.0699-10.622-13.657-10.622h-20.106zm11.191-34.332h3.0349c4.3626 0 8.1563 0.75872 8.1563 4.742 0 4.742-4.5524 4.9317-8.1563 4.9317h-3.0349zm-361.34 34.332h11.381l3.4143-9.1047h15.933l3.2246 9.1047h12.14l-16.313-42.299h-13.847c0.18968 0-15.933 42.299-15.933 42.299zm28.073-17.071h-10.622l5.5008-16.502h0.18968zm-63.543 17.071h17.83c7.5872 0 16.502-2.0865 16.502-12.14 0-5.1214-2.8452-8.1563-8.5357-9.2944v-0.18968c4.742-1.5175 7.3976-4.5524 7.3976-9.8634 0-7.2079-5.8801-10.812-13.657-10.812h-19.537zm11.191-18.02h3.4143c3.7936 0 8.346 0.37936 8.346 5.1214 0 4.3627-4.3627 4.9317-8.346 4.9317h-3.4143zm0-16.313h3.2246c3.7936 0 7.3976 0.37936 7.3976 4.173 0 3.6039-3.7936 4.5524-7.5872 4.5524h-3.0349zm73.027 34.332h10.432l-0.37937-28.832h0.18969l14.795 28.832h14.036v-42.299h-10.243l0.18968 28.642h-0.18968l-14.416-28.642h-14.416zm80.235-9.8634c-3.4142 1.3278-7.0182 2.0865-10.622 2.2762-8.1563 0-14.036-5.1214-14.036-13.278 0-7.9666 5.3111-13.657 13.278-13.657 3.7937 0 7.5873 0.94841 11.002 3.0349l0.9484-9.1047c-3.9833-1.3278-8.346-2.0865-12.519-2.2762-13.847 0-24.279 7.3976-24.279 22.003 0 15.933 13.088 21.624 24.279 21.624 4.173 0 8.5357-0.56904 12.519-1.7071zm1.7071-11.381c0 13.467 7.3976 21.813 21.244 21.813 13.847 0 21.244-8.346 21.244-21.813 0-13.467-7.2079-21.813-21.244-21.813-14.036 0-21.244 8.346-21.244 21.813zm11.571 0c0-7.3976 2.6555-13.467 9.4841-13.467 6.8285 0 9.484 6.2595 9.484 13.467 0 7.0182-2.6555 13.467-9.484 13.467-6.8286 0-9.4841-6.4492-9.4841-13.467zm84.788 11.381c-3.4143 1.3278-7.0182 2.0865-10.622 2.2762-8.1563 0-14.036-5.1214-14.036-13.278 0-7.9666 5.3111-13.657 13.278-13.657 3.7936 0 7.5872 0.94841 11.002 3.0349l0.9484-9.1047c-4.173-1.3278-8.346-2.0865-12.709-2.2762-13.847 0-24.279 7.3976-24.279 22.003 0 15.933 13.088 21.624 24.279 21.624 4.173 0 8.5356-0.56904 12.519-1.7071zm5.6904 9.8634h30.539v-7.9666h-19.158v-9.4841h17.451v-7.9666h-17.451v-8.7253h18.589v-7.9666h-29.78zm154.4 0h11.381l3.4143-9.1047h15.933l3.2246 9.1047h12.329l-16.313-42.299h-13.847zm27.883-17.071h-10.622l5.5008-16.502h0.1897zm20.865 17.071h28.642v-8.346h-17.451v-33.953h-11.191zm-249.05-63.543h42.299l13.278-13.278h-42.299v-23.71h7.9666l13.278-13.278h-31.866v-31.677l-13.278 13.278v7.9666h-23.71v-42.299l-13.278 13.278v42.299h23.9v23.71h23.9v23.71zm47.61-95.03v-31.677l13.278-13.278v31.866h31.677l-13.278 13.278zm-34.332-44.954h-10.622v31.677h31.677l-13.278 13.278h-31.677v-7.9666h-13.278v-10.622l37.178-36.988zm79.287 89.909v-10.622h10.622l-37.178 36.988h-10.622v-13.278h-7.9666v-31.677l13.278-13.278v31.866zm-221.17 176.97h15.364c14.416 0 25.038-5.5008 25.038-21.244 0-16.313-10.243-21.055-25.038-21.055h-15.364zm11.191-33.953h4.3627c8.1562 0 13.088 4.3627 13.088 12.709 0 8.346-4.7421 12.709-13.088 12.709h-4.3627v-25.417zm31.677 12.898c0 13.467 7.3975 21.813 21.244 21.813 13.847 0 21.244-8.346 21.244-21.813 0-13.467-7.2079-21.813-21.244-21.813s-21.244 8.1563-21.244 21.813zm11.57 0c0-7.3976 2.6556-13.467 9.4841-13.467s9.4841 6.2595 9.4841 13.467c0 7.0182-2.6556 13.467-9.4841 13.467s-9.4841-6.6388-9.4841-13.467zm50.266 21.055h17.83c7.5873 0 16.502-2.0865 16.502-12.14 0-5.1214-2.8452-8.1563-8.5357-9.2944v-0.18968c4.7421-1.5174 7.3976-4.5524 7.3976-9.8634 0-7.2079-5.8801-10.812-13.657-10.812h-19.537zm11.381-18.02h3.4142c3.7936 0 8.346 0.37936 8.346 4.9317 0 4.3627-4.3627 4.9317-8.346 4.9317h-3.4142zm0-16.313h3.2245c3.7937 0 7.3976 0.37936 7.3976 4.173 0 3.604-3.7936 4.5524-7.5872 4.5524h-3.2246zm28.073 34.332h11.191v-16.692h2.2762c4.173 0 5.6904 1.8968 7.9666 9.1047l2.4658 7.5872h11.76l-4.173-11.571c-2.0865-5.1214-2.2762-8.346-6.0698-9.2944v-0.18968c5.5008-1.3278 8.1563-4.9317 8.1563-10.622 0-7.2079-6.0698-10.622-13.657-10.622h-20.106zm11.381-34.332h3.0349c4.3626 0 8.1563 0.75873 8.1563 4.742 0 4.742-4.5524 4.9317-8.1563 4.9317h-3.0349zm25.607 34.332h11.381l3.4143-9.1047h15.744l3.2246 9.1047h12.329l-16.313-42.299h-13.847zm28.073-17.071h-10.622l5.5008-16.502h0.1897zm55.956 17.071h11.191v-42.299h-11.191zm18.968 0h28.642v-8.346h-17.451v-33.953h-11.191zm-55.197-1.1381c4.1729 1.3278 8.3459 1.8968 12.519 1.8968 9.4841 0 18.589-3.0349 18.589-14.036 0-15.175-19.916-10.622-19.916-17.451 0-3.604 4.742-3.9833 7.5872-3.9833 3.2246 0 6.4492 0.56904 9.4841 1.8968l0.7587-8.7253c-3.6039-1.1381-7.2079-1.7071-11.002-1.5174-8.5357 0-18.399 2.8452-18.399 12.898 0 15.364 19.916 10.432 19.916 18.209 0 3.4143-3.4142 4.173-7.0182 4.173-3.9833 0-7.9666-0.94841-11.57-2.8452z" fill="#025c75"/></svg></svg>
category: data
base_url: https://olinda.bcb.gov.br/olinda/servico/
headers:
  Accept: application/json

credential:
  label: Banco Central
  fields: []
  auth: {type: none}

errors:
  message_path: mensagem

triggers:
  - name: New Series Value
    description: Starts the flow when an SGS series publishes a new value, checking every hour.
    fields:
      - {name: series, label: Series code, type: number, required: true, description: "SGS code, like 432 for the Selic target or 433 for IPCA."}
    request:
      method: GET
      base_url: https://api.bcb.gov.br/
      path: "dados/serie/bcdata.sgs.{{fields.series}}/dados/ultimos/5"
      query: {formato: json}
    poll: {every: 60, id: data}

actions:
  # SGS time series
  - name: Get Series Values
    resource: Series
    description: Reads the values of an SGS series between two dates. Daily series take at most 10 years per call.
    fields:
      - {name: series, label: Series code, type: number, required: true, description: "SGS code, like 432 for the Selic target, 12 for CDI or 433 for IPCA."}
      - {name: start, label: From, required: true, description: "DD/MM/YYYY, like 01/01/2026"}
      - {name: end, label: To, required: true, description: "DD/MM/YYYY, like 31/12/2026"}
    request:
      method: GET
      base_url: https://api.bcb.gov.br/
      path: "dados/serie/bcdata.sgs.{{fields.series}}/dados"
      query: {formato: json, dataInicial: "{{fields.start}}", dataFinal: "{{fields.end}}"}

  - name: Get Latest Series Values
    resource: Series
    description: Reads the last values of an SGS series.
    fields:
      - {name: series, label: Series code, type: number, required: true, description: "SGS code, like 432 for the Selic target, 12 for CDI or 433 for IPCA."}
      - {name: count, label: How many, type: number, required: true, default: 1, description: Up to 20.}
    request:
      method: GET
      base_url: https://api.bcb.gov.br/
      path: "dados/serie/bcdata.sgs.{{fields.series}}/dados/ultimos/{{fields.count}}"
      query: {formato: json}

  - name: Get Selic Target
    resource: Series
    description: Reads the Selic target rate set by Copom, in percent a year (SGS 432).
    fields:
      - {name: count, label: How many, type: number, required: true, default: 1, description: "Last values to read, up to 20."}
    request:
      method: GET
      base_url: https://api.bcb.gov.br/
      path: "dados/serie/bcdata.sgs.432/dados/ultimos/{{fields.count}}"
      query: {formato: json}

  - name: Get Daily Selic
    resource: Series
    description: Reads the effective daily Selic rate, in percent a day (SGS 11).
    fields:
      - {name: count, label: How many, type: number, required: true, default: 1, description: "Last values to read, up to 20."}
    request:
      method: GET
      base_url: https://api.bcb.gov.br/
      path: "dados/serie/bcdata.sgs.11/dados/ultimos/{{fields.count}}"
      query: {formato: json}

  - name: Get CDI
    resource: Series
    description: Reads the daily CDI rate, in percent a day (SGS 12).
    fields:
      - {name: count, label: How many, type: number, required: true, default: 1, description: "Last values to read, up to 20."}
    request:
      method: GET
      base_url: https://api.bcb.gov.br/
      path: "dados/serie/bcdata.sgs.12/dados/ultimos/{{fields.count}}"
      query: {formato: json}

  - name: Get IPCA
    resource: Series
    description: Reads the monthly IPCA inflation, in percent (SGS 433).
    fields:
      - {name: count, label: How many, type: number, required: true, default: 1, description: "Last months to read, up to 20."}
    request:
      method: GET
      base_url: https://api.bcb.gov.br/
      path: "dados/serie/bcdata.sgs.433/dados/ultimos/{{fields.count}}"
      query: {formato: json}

  - name: Get IGP-M
    resource: Series
    description: Reads the monthly IGP-M inflation, in percent (SGS 189).
    fields:
      - {name: count, label: How many, type: number, required: true, default: 1, description: "Last months to read, up to 20."}
    request:
      method: GET
      base_url: https://api.bcb.gov.br/
      path: "dados/serie/bcdata.sgs.189/dados/ultimos/{{fields.count}}"
      query: {formato: json}

  # PTAX exchange rates
  - name: List Currencies
    resource: Exchange
    description: Lists the currencies PTAX quotes, with their symbols.
    fields: []
    request:
      method: GET
      path: PTAX/versao/v1/odata/Moedas
      query: {"$format": json}
    output: {path: value}

  - name: Get Dollar Rate
    resource: Exchange
    description: Reads the PTAX buy and sell rates of the US dollar on a day.
    fields:
      - {name: date, label: Date, required: true, description: "MM-DD-YYYY, like 11-27-2026"}
    request:
      method: GET
      path: "PTAX/versao/v1/odata/CotacaoDolarDia(dataCotacao=@dataCotacao)"
      query: {"@dataCotacao": "'{{fields.date}}'", "$format": json}
    output: {path: value}

  - name: Get Dollar Rates for Period
    resource: Exchange
    description: Reads the PTAX rates of the US dollar for each day between two dates.
    fields:
      - {name: start, label: From, required: true, description: "MM-DD-YYYY, like 11-01-2026"}
      - {name: end, label: To, required: true, description: "MM-DD-YYYY, like 11-27-2026"}
    request:
      method: GET
      path: "PTAX/versao/v1/odata/CotacaoDolarPeriodo(dataInicial=@dataInicial,dataFinalCotacao=@dataFinalCotacao)"
      query: {"@dataInicial": "'{{fields.start}}'", "@dataFinalCotacao": "'{{fields.end}}'", "$format": json}
    output: {path: value}

  - name: Get Currency Rate
    resource: Exchange
    description: Reads the PTAX bulletins of a currency on a day, with its rate in reais and its parity to the dollar.
    fields:
      - {name: currency, label: Currency, required: true, description: "Symbol, like EUR. From List Currencies."}
      - {name: date, label: Date, required: true, description: "MM-DD-YYYY, like 11-27-2026"}
    request:
      method: GET
      path: "PTAX/versao/v1/odata/CotacaoMoedaDia(moeda=@moeda,dataCotacao=@dataCotacao)"
      query: {"@moeda": "'{{fields.currency}}'", "@dataCotacao": "'{{fields.date}}'", "$format": json}
    output: {path: value}

  - name: Get Currency Rates for Period
    resource: Exchange
    description: Reads the PTAX bulletins of a currency for each day between two dates.
    fields:
      - {name: currency, label: Currency, required: true, description: "Symbol, like EUR. From List Currencies."}
      - {name: start, label: From, required: true, description: "MM-DD-YYYY, like 11-01-2026"}
      - {name: end, label: To, required: true, description: "MM-DD-YYYY, like 11-27-2026"}
    request:
      method: GET
      path: "PTAX/versao/v1/odata/CotacaoMoedaPeriodo(moeda=@moeda,dataInicial=@dataInicial,dataFinalCotacao=@dataFinalCotacao)"
      query: {"@moeda": "'{{fields.currency}}'", "@dataInicial": "'{{fields.start}}'", "@dataFinalCotacao": "'{{fields.end}}'", "$format": json}
    output: {path: value}

  # Focus market expectations
  - name: Get Annual Expectations
    resource: Expectations
    description: Reads the Focus survey expectations of an indicator for each year, newest survey first.
    fields:
      - {name: indicator, label: Indicator, type: select, required: true, default: IPCA, options: [{label: IPCA, value: IPCA}, {label: IGP-M, value: IGP-M}, {label: GDP, value: PIB Total}, {label: Selic, value: Selic}, {label: Exchange rate, value: Câmbio}, {label: Trade balance, value: Balança comercial}, {label: Current account, value: Conta corrente}, {label: Net public debt, value: Dívida líquida do setor público}]}
      - {name: year, label: Year, description: "Year the forecast is for, like 2027. Empty for every year."}
      - {name: top, label: Limit, type: number, default: 50}
    request:
      method: GET
      path: Expectativas/versao/v1/odata/ExpectativasMercadoAnuais
      query:
        "$filter": "Indicador eq '{{fields.indicator}}' and startswith(DataReferencia,'{{fields.year}}')"
        "$orderby": Data desc
        "$top": "{{fields.top}}"
        "$format": json
    output: {path: value}

  - name: Get Monthly Expectations
    resource: Expectations
    description: Reads the Focus survey expectations of an indicator for each month, newest survey first.
    fields:
      - {name: indicator, label: Indicator, type: select, required: true, default: IPCA, options: [{label: IPCA, value: IPCA}, {label: IGP-M, value: IGP-M}, {label: Exchange rate, value: Câmbio}]}
      - {name: top, label: Limit, type: number, default: 50}
    request:
      method: GET
      path: Expectativas/versao/v1/odata/ExpectativaMercadoMensais
      query: {"$filter": "Indicador eq '{{fields.indicator}}'", "$orderby": Data desc, "$top": "{{fields.top}}", "$format": json}
    output: {path: value}

  - name: Get Selic Expectations
    resource: Expectations
    description: Reads the Focus survey expectations of the Selic target for each Copom meeting, newest survey first.
    fields:
      - {name: meeting, label: Meeting, description: "Like R1/2027. Empty for every meeting."}
      - {name: top, label: Limit, type: number, default: 50}
    request:
      method: GET
      path: Expectativas/versao/v1/odata/ExpectativasMercadoSelic
      query:
        "$filter": "startswith(Reuniao,'{{fields.meeting}}')"
        "$orderby": Data desc
        "$top": "{{fields.top}}"
        "$format": json
    output: {path: value}

  - name: Get 12-Month Inflation Expectations
    resource: Expectations
    description: Reads the Focus survey expectations of inflation for the next 12 months, newest survey first.
    fields:
      - {name: indicator, label: Indicator, type: select, required: true, default: IPCA, options: [{label: IPCA, value: IPCA}, {label: IGP-M, value: IGP-M}, {label: IGP-DI, value: IGP-DI}, {label: IPC-Fipe, value: IPC-Fipe}]}
      - {name: top, label: Limit, type: number, default: 50}
    request:
      method: GET
      path: Expectativas/versao/v1/odata/ExpectativasMercadoInflacao12Meses
      query: {"$filter": "Indicador eq '{{fields.indicator}}'", "$orderby": Data desc, "$top": "{{fields.top}}", "$format": json}
    output: {path: value}

  # Bank interest rates
  - name: Get Monthly Bank Rates
    resource: Interest Rates
    description: Reads the average rate each bank charged for home loans in a month, cheapest first.
    fields:
      - {name: month, label: Month, required: true, description: "YYYY-MM, like 2026-10"}
      - {name: kind, label: Kind of loan, type: select, description: Empty for every kind., options: [{label: "Market rate, fixed", value: "Financiamento imobiliário com taxas de mercado - Prefixado"}, {label: "Market rate, IPCA", value: "Financiamento imobiliário com taxas de mercado - Pós-fixado referenciado em IPCA"}, {label: "Market rate, TR", value: "Financiamento imobiliário com taxas de mercado - Pós-fixado referenciado em TR"}, {label: "Regulated rate, fixed", value: "Financiamento imobiliário com taxas reguladas - Prefixado"}, {label: "Regulated rate, IPCA", value: "Financiamento imobiliário com taxas reguladas - Pós-fixado referenciado em IPCA"}, {label: "Regulated rate, TR", value: "Financiamento imobiliário com taxas reguladas - Pós-fixado referenciado em TR"}]}
      - {name: top, label: Limit, type: number, default: 100}
    request:
      method: GET
      path: taxaJuros/versao/v2/odata/TaxasJurosMensalPorMes
      query:
        "$filter": "anoMes eq '{{fields.month}}' and startswith(Modalidade,'{{fields.kind}}')"
        "$orderby": Posicao
        "$top": "{{fields.top}}"
        "$format": json
    output: {path: value}

  - name: Get Daily Bank Rates
    resource: Interest Rates
    description: Reads the interest rate each bank charged in a five-day window, by kind of credit, cheapest first.
    fields:
      - {name: start, label: Window start, required: true, description: "YYYY-MM-DD, the first day of a window, like 2026-11-06"}
      - {name: kind, label: Kind of credit, type: select, description: Empty for every kind., options: [{label: "Overdraft", value: "Cheque especial - Prefixado"}, {label: "Personal loan", value: "Crédito pessoal não consignado - Prefixado"}, {label: "Payroll loan, INSS", value: "Crédito pessoal consignado INSS - Prefixado"}, {label: "Payroll loan, public", value: "Crédito pessoal consignado público - Prefixado"}, {label: "Payroll loan, private", value: "Crédito pessoal consignado privado - Prefixado"}, {label: "Credit card, revolving", value: "Cartão de crédito - rotativo total - Prefixado"}, {label: "Credit card, installments", value: "Cartão de crédito - parcelado - Prefixado"}, {label: "Vehicles", value: "Aquisição de veículos - Prefixado"}, {label: "Other goods", value: "Aquisição de outros bens - Prefixado"}, {label: "Working capital up to 365 days", value: "Capital de giro com prazo até 365 dias - Prefixado"}, {label: "Working capital over 365 days", value: "Capital de giro com prazo superior a 365 dias - Prefixado"}, {label: "Secured account", value: "Conta garantida - Prefixado"}, {label: "Check discounting", value: "Desconto de cheques - Prefixado"}, {label: "Trade bill discounting", value: "Desconto de duplicatas - Prefixado"}, {label: "Card receivables advance", value: "Antecipação de faturas de cartão de crédito - Prefixado"}, {label: "Vendor", value: "Vendor - Prefixado"}, {label: "Export advance (ACC)", value: "Adiantamento sobre contratos de câmbio (ACC) - Pós-fixado referenciado em moeda estrangeira"}]}
      - {name: top, label: Limit, type: number, default: 100}
    request:
      method: GET
      path: taxaJuros/versao/v2/odata/TaxasJurosDiariaPorInicioPeriodo
      query:
        "$filter": "InicioPeriodo eq '{{fields.start}}' and startswith(Modalidade,'{{fields.kind}}')"
        "$orderby": Posicao
        "$top": "{{fields.top}}"
        "$format": json
    output: {path: value}

i18n:
  pt-BR:
    description: "Leia Selic, CDI, IPCA e qualquer série do SGS, as cotações PTAX, as expectativas do Focus e os juros cobrados por cada banco, do Banco Central do Brasil."
    triggers:
      New Series Value: {name: "Novo valor de série", description: "Inicia o fluxo quando uma série do SGS publica um valor novo, verificando a cada hora.", fields: {series: "Código da série"}}
    actions:
      Get Series Values: {name: "Ler valores da série", description: "Lê os valores de uma série do SGS entre duas datas. Séries diárias aceitam no máximo 10 anos por chamada.", fields: {series: "Código da série", start: "De", end: "Até"}}
