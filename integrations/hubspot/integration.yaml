      value: {id: "{{fields.id}}", deleted: true}

  # Engagements: notes, calls, emails, meetings and tasks
  - name: Create Note
    resource: Engagement
    description: Adds a note to a contact, company, deal or ticket.
    fields:
      - {name: body, label: Note, type: textarea, required: true, description: HTML is fine.}
      - {name: timestamp, label: When, type: datetime, description: Now when empty.}
      - {name: owner, label: Owner, type: select, options_from: {request: {method: GET, path: crm/v3/owners, query: {limit: 500}}, path: results, label: email, value: id}}
      - {name: associations, label: Associations, type: json, required: true, description: "Like [{\"to\": {\"id\": \"123\"}, \"types\": [{\"associationCategory\": \"HUBSPOT_DEFINED\", \"associationTypeId\": 202}]}], 202 for a contact"}
    request:
      method: POST
      path: crm/v3/objects/notes
      body:
        properties: {hs_note_body: "{{fields.body}}", hs_timestamp: "{{fields.timestamp}}", hubspot_owner_id: "{{fields.owner}}"}
        associations: "{{fields.associations}}"

  - name: Create Task
    resource: Engagement
    description: Creates a task, tied to records if you want.
    fields:
      - {name: subject, label: Subject, required: true}
      - {name: body, label: Notes, type: textarea}
      - {name: due, label: Due, type: datetime, required: true}
      - {name: status, label: Status, type: select, default: NOT_STARTED, options: [{label: Not started, value: NOT_STARTED}, {label: In progress, value: IN_PROGRESS}, {label: Waiting, value: WAITING}, {label: Completed, value: COMPLETED}, {label: Deferred, value: DEFERRED}]}
      - {name: priority, label: Priority, type: select, options: [{label: Low, value: LOW}, {label: Medium, value: MEDIUM}, {label: High, value: HIGH}]}
      - {name: type, label: Type, type: select, default: TODO, options: [{label: To do, value: TODO}, {label: Call, value: CALL}, {label: Email, value: EMAIL}]}
      - {name: owner, label: Owner, type: select, options_from: {request: {method: GET, path: crm/v3/owners, query: {limit: 500}}, path: results, label: email, value: id}}
      - {name: associations, label: Associations, type: json, description: "Like [{\"to\": {\"id\": \"123\"}, \"types\": [{\"associationCategory\": \"HUBSPOT_DEFINED\", \"associationTypeId\": 204}]}], 204 for a contact"}
    request:
      method: POST
      path: crm/v3/objects/tasks
      body:
        properties:
          hs_task_subject: "{{fields.subject}}"
          hs_task_body: "{{fields.body}}"
          hs_timestamp: "{{fields.due}}"
          hs_task_status: "{{fields.status}}"
          hs_task_priority: "{{fields.priority}}"
          hs_task_type: "{{fields.type}}"
          hubspot_owner_id: "{{fields.owner}}"
        associations: "{{fields.associations}}"

  - name: Create Engagement
    resource: Engagement
    description: Creates a note, call, email, meeting or task from its properties.
    fields:
      - {name: type, label: Type, type: select, required: true, default: notes, options: [{label: Note, value: notes}, {label: Call, value: calls}, {label: Email, value: emails}, {label: Meeting, value: meetings}, {label: Task, value: tasks}]}
      - {name: properties, label: Properties, type: json, required: true, description: "Like {\"hs_timestamp\": \"2026-12-01T10:00:00Z\", \"hs_call_title\": \"Kickoff\"}"}
      - {name: associations, label: Associations, type: json, description: "Like [{\"to\": {\"id\": \"123\"}, \"types\": [{\"associationCategory\": \"HUBSPOT_DEFINED\", \"associationTypeId\": 194}]}]"}
    request:
      method: POST
      path: "crm/v3/objects/{{fields.type}}"
      body: {properties: "{{fields.properties}}", associations: "{{fields.associations}}"}

  - name: Get Engagement
    resource: Engagement
    description: Reads a note, call, email, meeting or task.
    fields:
      - {name: type, label: Type, type: select, required: true, default: notes, options: [{label: Note, value: notes}, {label: Call, value: calls}, {label: Email, value: emails}, {label: Meeting, value: meetings}, {label: Task, value: tasks}]}
      - {name: id, label: ID, required: true}
      - {name: properties, label: Properties, description: Comma separated.}
      - {name: associations, label: Associated, description: "Object types, like contacts,deals"}
    request:
      method: GET
      path: "crm/v3/objects/{{fields.type}}/{{fields.id}}"
      query: {properties: "{{fields.properties}}", associations: "{{fields.associations}}"}

  - name: Get Engagements
    resource: Engagement
    description: Lists every note, call, email, meeting or task.
    fields:
      - {name: type, label: Type, type: select, required: true, default: notes, options: [{label: Note, value: notes}, {label: Call, value: calls}, {label: Email, value: emails}, {label: Meeting, value: meetings}, {label: Task, value: tasks}]}
      - {name: properties, label: Properties, description: Comma separated.}
      - {name: associations, label: Associated, description: "Object types, like contacts,deals"}
    request:
      method: GET
      path: "crm/v3/objects/{{fields.type}}"
      query: {properties: "{{fields.properties}}", associations: "{{fields.associations}}"}
    pagination: {type: cursor, items_path: results, cursor_param: after, next_path: paging.next.after, limit_param: limit, page_size: 100}

  - name: Delete Engagement
    resource: Engagement
    description: Archives a note, call, email, meeting or task.
    fields:
      - {name: type, label: Type, type: select, required: true, default: notes, options: [{label: Note, value: notes}, {label: Call, value: calls}, {label: Email, value: emails}, {label: Meeting, value: meetings}, {label: Task, value: tasks}]}
      - {name: id, label: ID, required: true}
    request:
      method: DELETE
      path: "crm/v3/objects/{{fields.type}}/{{fields.id}}"
    output:
      value: {id: "{{fields.id}}", deleted: true}

  # Associations
  - name: Associate Records
    resource: Association
    description: Ties two records together with their default association.
    fields:
      - {name: from_type, label: From type, required: true, default: contacts, description: "contacts, companies, deals, tickets or a custom object"}
      - {name: from_id, label: From ID, required: true}
      - {name: to_type, label: To type, required: true, default: companies}
      - {name: to_id, label: To ID, required: true}
    request:
      method: PUT
      path: "crm/v4/objects/{{fields.from_type}}/{{fields.from_id}}/associations/default/{{fields.to_type}}/{{fields.to_id}}"
    output: {path: results}

  - name: Get Associations
    resource: Association
    description: Lists the records of a type tied to a record.
    fields:
      - {name: from_type, label: From type, required: true, default: contacts}
      - {name: from_id, label: From ID, required: true}
      - {name: to_type, label: To type, required: true, default: companies}
    request:
      method: GET
      path: "crm/v4/objects/{{fields.from_type}}/{{fields.from_id}}/associations/{{fields.to_type}}"
    pagination: {type: cursor, items_path: results, cursor_param: after, next_path: paging.next.after, limit_param: limit, page_size: 500}

  - name: Remove Association
    resource: Association
    description: Unties two records.
    fields:
      - {name: from_type, label: From type, required: true, default: contacts}
      - {name: from_id, label: From ID, required: true}
      - {name: to_type, label: To type, required: true, default: companies}
      - {name: to_id, label: To ID, required: true}
    request:
      method: DELETE
      path: "crm/v4/objects/{{fields.from_type}}/{{fields.from_id}}/associations/{{fields.to_type}}/{{fields.to_id}}"
    output:
      value: {from_id: "{{fields.from_id}}", to_id: "{{fields.to_id}}", removed: true}

  # Lists
  - name: Get Lists
    resource: List
    description: Finds lists by name.
    fields:
      - {name: query, label: Name contains}
    request:
      method: POST
      path: crm/v3/lists/search
      body: {query: "{{fields.query}}", count: 500}
    output: {path: lists}

  - name: Add to List
    resource: List
    description: Adds records to a manual list.
    fields:
      - {name: list, label: List ID, required: true}
      - {name: record_ids, label: Record IDs, type: json, required: true, description: "Like [\"123\", \"456\"]"}
    request:
      method: PUT
      path: "crm/v3/lists/{{fields.list}}/memberships/add"
      body: "{{fields.record_ids}}"

  - name: Remove from List
    resource: List
    description: Takes records out of a manual list.
    fields:
      - {name: list, label: List ID, required: true}
      - {name: record_ids, label: Record IDs, type: json, required: true, description: "Like [\"123\", \"456\"]"}
    request:
      method: PUT
      path: "crm/v3/lists/{{fields.list}}/memberships/remove"
      body: "{{fields.record_ids}}"

  # Forms
  - name: Get Forms
    resource: Form
    description: Lists the marketing forms.
    request:
      method: GET
      path: marketing/v3/forms
    pagination: {type: cursor, items_path: results, cursor_param: after, next_path: paging.next.after, limit_param: limit, page_size: 100}

  - name: Get Form
    resource: Form
    description: Reads a form with its fields.
    fields:
      - {name: form, label: Form ID, required: true}
    request:
      method: GET
      path: "marketing/v3/forms/{{fields.form}}"

  # Owners and pipelines
  - name: Get Owners
    resource: Owner
    description: Lists the users who can own records.
    fields:
      - {name: email, label: Email}
    request:
      method: GET
      path: crm/v3/owners
      query: {email: "{{fields.email}}"}
    pagination: {type: cursor, items_path: results, cursor_param: after, next_path: paging.next.after, limit_param: limit, page_size: 500}

  - name: Get Pipelines
    resource: Pipeline
    description: Lists the pipelines of deals or tickets, with their stages.
    fields:
      - {name: type, label: Of, type: select, required: true, default: deals, options: [{label: Deals, value: deals}, {label: Tickets, value: tickets}]}
    request:
      method: GET
      path: "crm/v3/pipelines/{{fields.type}}"
    output: {path: results}

