    resource: Ticket
    description: Creates a ticket.
    fields:
      - {name: subject, label: "Subject"}
      - {name: content, label: "Description", type: textarea}
      - {name: hs_pipeline, label: "Pipeline ID"}
      - {name: hs_pipeline_stage, label: "Stage ID"}
      - {name: hs_ticket_priority, label: "Priority", type: select, options: [{label: "Low", value: "LOW"}, {label: "Medium", value: "MEDIUM"}, {label: "High", value: "HIGH"}]}
      - {name: hs_ticket_category, label: "Category"}
      - {name: source_type, label: "Source", type: select, options: [{label: "Chat", value: "CHAT"}, {label: "Email", value: "EMAIL"}, {label: "Form", value: "FORM"}, {label: "Phone", value: "PHONE"}]}
      - {name: hubspot_owner_id, label: "Owner", type: select, options_from: {request: {method: GET, path: crm/v3/owners, query: {limit: 500}}, path: results, label: email, value: id}}
      - {name: custom_properties, label: Other properties, type: json, description: "By internal name, like {\"my_field\": \"x\"}"}
      - {name: associations, label: Associations, type: json, description: "Like [{\"to\": {\"id\": \"123\"}, \"types\": [{\"associationCategory\": \"HUBSPOT_DEFINED\", \"associationTypeId\": 1}]}]"}
    request:
      method: POST
      path: crm/v3/objects/tickets
      body:
        properties:
          subject: "{{fields.subject}}"
          content: "{{fields.content}}"
          hs_pipeline: "{{fields.hs_pipeline}}"
          hs_pipeline_stage: "{{fields.hs_pipeline_stage}}"
          hs_ticket_priority: "{{fields.hs_ticket_priority}}"
          hs_ticket_category: "{{fields.hs_ticket_category}}"
          source_type: "{{fields.source_type}}"
          hubspot_owner_id: "{{fields.hubspot_owner_id}}"
          _merge: "{{fields.custom_properties}}"
        associations: "{{fields.associations}}"

  - name: Get Ticket
    resource: Ticket
    description: Reads a ticket by its ID.
    fields:
      - {name: id, label: "Ticket ID", required: true}
      - {name: properties, label: Properties, description: "Comma separated, besides the default ones"}
      - {name: properties_with_history, label: Properties with history, description: Comma separated.}
      - {name: associations, label: Associated, description: "Object types, like contacts,deals"}
      - {name: archived, label: Archived, type: boolean}
    request:
      method: GET
      path: "crm/v3/objects/tickets/{{fields.id}}"
      query:
        properties: "{{fields.properties}}"
        propertiesWithHistory: "{{fields.properties_with_history}}"
        associations: "{{fields.associations}}"
        archived: "{{fields.archived}}"

  - name: Get Tickets
    resource: Ticket
    description: Lists every ticket.
    fields:
      - {name: properties, label: Properties, description: "Comma separated, besides the default ones"}
      - {name: associations, label: Associated, description: "Object types, like contacts,deals"}
      - {name: archived, label: Archived, type: boolean}
    request:
      method: GET
      path: crm/v3/objects/tickets
      query: {properties: "{{fields.properties}}", associations: "{{fields.associations}}", archived: "{{fields.archived}}"}
    pagination: {type: cursor, items_path: results, cursor_param: after, next_path: paging.next.after, limit_param: limit, page_size: 100}

  - name: Search Tickets
    resource: Ticket
    description: Finds tickets by filters, by text, or the most recently changed.
    fields:
      - {name: query, label: Text, description: Searches the default text properties.}
      - {name: filter_groups, label: Filters, type: json, description: "Like [{\"filters\": [{\"propertyName\": \"createdate\", \"operator\": \"GTE\", \"value\": \"2026-01-01\"}]}]"}
      - {name: sort_by, label: Sort by property, default: lastmodifieddate}
      - {name: direction, label: Direction, type: select, default: DESCENDING, options: [{label: Descending, value: DESCENDING}, {label: Ascending, value: ASCENDING}]}
      - {name: properties, label: Properties, type: json, description: "Like [\"email\", \"firstname\"]"}
    request:
      method: POST
      path: crm/v3/objects/tickets/search
      body:
        query: "{{fields.query}}"
        filterGroups: "{{fields.filter_groups}}"
        sorts: [{propertyName: "{{fields.sort_by}}", direction: "{{fields.direction}}"}]
        properties: "{{fields.properties}}"
    pagination: {type: cursor, in: body, items_path: results, cursor_param: after, next_path: paging.next.after, limit_param: limit, page_size: 100}

  - name: Update Ticket
    resource: Ticket
    description: Changes a ticket. Empty fields stay as they are.
    fields:
      - {name: id, label: "Ticket ID", required: true}
      - {name: subject, label: "Subject"}
      - {name: content, label: "Description", type: textarea}
      - {name: hs_pipeline, label: "Pipeline ID"}
      - {name: hs_pipeline_stage, label: "Stage ID"}
      - {name: hs_ticket_priority, label: "Priority", type: select, options: [{label: "Low", value: "LOW"}, {label: "Medium", value: "MEDIUM"}, {label: "High", value: "HIGH"}]}
      - {name: hs_ticket_category, label: "Category"}
      - {name: source_type, label: "Source", type: select, options: [{label: "Chat", value: "CHAT"}, {label: "Email", value: "EMAIL"}, {label: "Form", value: "FORM"}, {label: "Phone", value: "PHONE"}]}
      - {name: hubspot_owner_id, label: "Owner", type: select, options_from: {request: {method: GET, path: crm/v3/owners, query: {limit: 500}}, path: results, label: email, value: id}}
      - {name: custom_properties, label: Other properties, type: json, description: "By internal name, like {\"my_field\": \"x\"}"}
    request:
