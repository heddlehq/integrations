# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# HubSpot's CRM API v3, with a private app's token. Make the app in HubSpot, under
# Settings > Integrations > Private Apps, with the CRM scopes you need.
id: hubspot
name: HubSpot
version: 1.0.0
description: Contacts, companies, deals, tickets, engagements, lists, associations and forms in HubSpot.
icon: hero-user-group
logo: |
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#FF7A59" d="M18.164 7.93V5.084a2.198 2.198 0 001.267-1.978v-.067A2.2 2.2 0 0017.238.845h-.067a2.2 2.2 0 00-2.193 2.193v.067a2.196 2.196 0 001.252 1.973l.013.006v2.852a6.22 6.22 0 00-2.969 1.31l.012-.01-7.828-6.095A2.497 2.497 0 104.3 4.656l-.012.006 7.697 5.991a6.176 6.176 0 00-1.038 3.446c0 1.343.425 2.588 1.147 3.607l-.013-.02-2.342 2.343a1.968 1.968 0 00-.58-.095h-.002a2.033 2.033 0 102.033 2.033 1.978 1.978 0 00-.1-.595l.005.014 2.317-2.317a6.247 6.247 0 104.782-11.134l-.036-.005zm-.964 9.378a3.206 3.206 0 113.215-3.207v.002a3.206 3.206 0 01-3.207 3.207z"/></svg>
category: crm
author: Heddle
homepage: https://developers.hubspot.com/docs/api/crm/understanding-the-crm
base_url: https://api.hubapi.com/

credential:
  label: HubSpot
  fields:
    - {name: token, label: Private app token, secret: true, required: true, description: "Starts with pat-"}
  auth:
    type: bearer
    token: "{{credential.token}}"

errors:
  message_path: message

triggers:
  - name: New Contact
    description: Starts the flow for each new contact, checking every 5 minutes.
    fields:
      - {name: properties, label: Properties, description: "Comma separated, besides the default ones"}
    request:
      method: POST
      path: crm/v3/objects/contacts/search
      body:
        sorts: [{propertyName: createdate, direction: DESCENDING}]
        properties: "{{fields.properties}}"
        limit: 100
    output: {path: results}
    poll:
      every: 5
      id: id

  - name: New Company
    description: Starts the flow for each new company, checking every 5 minutes.
    fields:
      - {name: properties, label: Properties, description: "Comma separated, besides the default ones"}
    request:
      method: POST
      path: crm/v3/objects/companies/search
      body:
        sorts: [{propertyName: createdate, direction: DESCENDING}]
        properties: "{{fields.properties}}"
        limit: 100
    output: {path: results}
    poll:
      every: 5
      id: id

  - name: New Deal
    description: Starts the flow for each new deal, checking every 5 minutes.
    fields:
      - {name: properties, label: Properties, description: "Comma separated, besides the default ones"}
    request:
      method: POST
      path: crm/v3/objects/deals/search
      body:
        sorts: [{propertyName: createdate, direction: DESCENDING}]
        properties: "{{fields.properties}}"
        limit: 100
    output: {path: results}
    poll:
      every: 5
      id: id

  - name: New Ticket
    description: Starts the flow for each new ticket, checking every 5 minutes.
    fields:
      - {name: properties, label: Properties, description: "Comma separated, besides the default ones"}
    request:
      method: POST
      path: crm/v3/objects/tickets/search
      body:
        sorts: [{propertyName: createdate, direction: DESCENDING}]
        properties: "{{fields.properties}}"
        limit: 100
    output: {path: results}
    poll:
      every: 5
      id: id

actions:
  # Contacts
  - name: Create Contact
    resource: Contact
    description: Creates a contact.
    fields:
      - {name: email, label: "Email"}
      - {name: firstname, label: "First name"}
      - {name: lastname, label: "Last name"}
      - {name: phone, label: "Phone"}
      - {name: mobilephone, label: "Mobile phone"}
      - {name: company, label: "Company name"}
      - {name: jobtitle, label: "Job title"}
      - {name: website, label: "Website"}
      - {name: address, label: "Street address"}
      - {name: city, label: "City"}
      - {name: state, label: "State"}
      - {name: zip, label: "Postal code"}
      - {name: country, label: "Country"}
      - {name: lifecyclestage, label: "Lifecycle stage", type: select, options: [{label: "Subscriber", value: "subscriber"}, {label: "Lead", value: "lead"}, {label: "Marketing qualified lead", value: "marketingqualifiedlead"}, {label: "Sales qualified lead", value: "salesqualifiedlead"}, {label: "Opportunity", value: "opportunity"}, {label: "Customer", value: "customer"}, {label: "Evangelist", value: "evangelist"}, {label: "Other", value: "other"}]}
      - {name: hs_lead_status, label: "Lead status", type: select, options: [{label: "New", value: "NEW"}, {label: "Open", value: "OPEN"}, {label: "In progress", value: "IN_PROGRESS"}, {label: "Open deal", value: "OPEN_DEAL"}, {label: "Unqualified", value: "UNQUALIFIED"}, {label: "Attempted to contact", value: "ATTEMPTED_TO_CONTACT"}, {label: "Connected", value: "CONNECTED"}, {label: "Bad timing", value: "BAD_TIMING"}]}
      - {name: hubspot_owner_id, label: "Owner", type: select, options_from: {request: {method: GET, path: crm/v3/owners, query: {limit: 500}}, path: results, label: email, value: id}}
      - {name: custom_properties, label: Other properties, type: json, description: "By internal name, like {\"my_field\": \"x\"}"}
      - {name: associations, label: Associations, type: json, description: "Like [{\"to\": {\"id\": \"123\"}, \"types\": [{\"associationCategory\": \"HUBSPOT_DEFINED\", \"associationTypeId\": 1}]}]"}
    request:
      method: POST
      path: crm/v3/objects/contacts
      body:
        properties:
          email: "{{fields.email}}"
          firstname: "{{fields.firstname}}"
          lastname: "{{fields.lastname}}"
          phone: "{{fields.phone}}"
          mobilephone: "{{fields.mobilephone}}"
          company: "{{fields.company}}"
          jobtitle: "{{fields.jobtitle}}"
          website: "{{fields.website}}"
          address: "{{fields.address}}"
          city: "{{fields.city}}"
          state: "{{fields.state}}"
          zip: "{{fields.zip}}"
          country: "{{fields.country}}"
          lifecyclestage: "{{fields.lifecyclestage}}"
          hs_lead_status: "{{fields.hs_lead_status}}"
          hubspot_owner_id: "{{fields.hubspot_owner_id}}"
          _merge: "{{fields.custom_properties}}"
        associations: "{{fields.associations}}"

  - name: Create or Update Contact
    resource: Contact
    description: Creates a contact, or updates the one with the same email.
    fields:
      - {name: email, label: "Email", required: true}
      - {name: firstname, label: "First name"}
      - {name: lastname, label: "Last name"}
      - {name: phone, label: "Phone"}
      - {name: mobilephone, label: "Mobile phone"}
      - {name: company, label: "Company name"}
      - {name: jobtitle, label: "Job title"}
      - {name: website, label: "Website"}
      - {name: address, label: "Street address"}
      - {name: city, label: "City"}
      - {name: state, label: "State"}
      - {name: zip, label: "Postal code"}
      - {name: country, label: "Country"}
      - {name: lifecyclestage, label: "Lifecycle stage", type: select, options: [{label: "Subscriber", value: "subscriber"}, {label: "Lead", value: "lead"}, {label: "Marketing qualified lead", value: "marketingqualifiedlead"}, {label: "Sales qualified lead", value: "salesqualifiedlead"}, {label: "Opportunity", value: "opportunity"}, {label: "Customer", value: "customer"}, {label: "Evangelist", value: "evangelist"}, {label: "Other", value: "other"}]}
      - {name: hs_lead_status, label: "Lead status", type: select, options: [{label: "New", value: "NEW"}, {label: "Open", value: "OPEN"}, {label: "In progress", value: "IN_PROGRESS"}, {label: "Open deal", value: "OPEN_DEAL"}, {label: "Unqualified", value: "UNQUALIFIED"}, {label: "Attempted to contact", value: "ATTEMPTED_TO_CONTACT"}, {label: "Connected", value: "CONNECTED"}, {label: "Bad timing", value: "BAD_TIMING"}]}
      - {name: hubspot_owner_id, label: "Owner", type: select, options_from: {request: {method: GET, path: crm/v3/owners, query: {limit: 500}}, path: results, label: email, value: id}}
      - {name: custom_properties, label: Other properties, type: json, description: "By internal name, like {\"my_field\": \"x\"}"}
    request:
      method: POST
      path: crm/v3/objects/contacts/batch/upsert
      body:
        inputs:
          - idProperty: email
            id: "{{fields.email}}"
            properties:
              firstname: "{{fields.firstname}}"
              lastname: "{{fields.lastname}}"
              phone: "{{fields.phone}}"
              mobilephone: "{{fields.mobilephone}}"
              company: "{{fields.company}}"
              jobtitle: "{{fields.jobtitle}}"
              website: "{{fields.website}}"
              address: "{{fields.address}}"
              city: "{{fields.city}}"
              state: "{{fields.state}}"
              zip: "{{fields.zip}}"
              country: "{{fields.country}}"
              lifecyclestage: "{{fields.lifecyclestage}}"
              hs_lead_status: "{{fields.hs_lead_status}}"
              hubspot_owner_id: "{{fields.hubspot_owner_id}}"
              _merge: "{{fields.custom_properties}}"
    output: {path: results.0}

  - name: Get Contact
    resource: Contact
    description: Reads a contact by its ID, or by email.
    fields:
      - {name: id, label: "Contact ID or email", required: true}
      - {name: id_property, label: The ID is, type: select, default: hs_object_id, options: [{label: The record ID, value: hs_object_id}, {label: An email, value: email}]}
      - {name: properties, label: Properties, description: "Comma separated, besides the default ones"}
      - {name: properties_with_history, label: Properties with history, description: Comma separated.}
      - {name: associations, label: Associated, description: "Object types, like contacts,deals"}
      - {name: archived, label: Archived, type: boolean}
    request:
      method: GET
      path: "crm/v3/objects/contacts/{{fields.id}}"
      query:
        properties: "{{fields.properties}}"
        propertiesWithHistory: "{{fields.properties_with_history}}"
        associations: "{{fields.associations}}"
        archived: "{{fields.archived}}"
        idProperty: "{{fields.id_property}}"

  - name: Get Contacts
    resource: Contact
    description: Lists every contact.
    fields:
      - {name: properties, label: Properties, description: "Comma separated, besides the default ones"}
      - {name: associations, label: Associated, description: "Object types, like contacts,deals"}
      - {name: archived, label: Archived, type: boolean}
    request:
      method: GET
      path: crm/v3/objects/contacts
      query: {properties: "{{fields.properties}}", associations: "{{fields.associations}}", archived: "{{fields.archived}}"}
    pagination: {type: cursor, items_path: results, cursor_param: after, next_path: paging.next.after, limit_param: limit, page_size: 100}

  - name: Search Contacts
    resource: Contact
    description: Finds contacts by filters, by text, or the most recently changed.
    fields:
      - {name: query, label: Text, description: Searches the default text properties.}
      - {name: filter_groups, label: Filters, type: json, description: "Like [{\"filters\": [{\"propertyName\": \"createdate\", \"operator\": \"GTE\", \"value\": \"2026-01-01\"}]}]"}
      - {name: sort_by, label: Sort by property, default: lastmodifieddate}
      - {name: direction, label: Direction, type: select, default: DESCENDING, options: [{label: Descending, value: DESCENDING}, {label: Ascending, value: ASCENDING}]}
      - {name: properties, label: Properties, type: json, description: "Like [\"email\", \"firstname\"]"}
    request:
      method: POST
      path: crm/v3/objects/contacts/search
      body:
        query: "{{fields.query}}"
        filterGroups: "{{fields.filter_groups}}"
        sorts: [{propertyName: "{{fields.sort_by}}", direction: "{{fields.direction}}"}]
        properties: "{{fields.properties}}"
    pagination: {type: cursor, in: body, items_path: results, cursor_param: after, next_path: paging.next.after, limit_param: limit, page_size: 100}

  - name: Update Contact
    resource: Contact
    description: Changes a contact. Empty fields stay as they are.
    fields:
      - {name: id, label: "Contact ID", required: true}
      - {name: email, label: "Email"}
      - {name: firstname, label: "First name"}
      - {name: lastname, label: "Last name"}
      - {name: phone, label: "Phone"}
      - {name: mobilephone, label: "Mobile phone"}
      - {name: company, label: "Company name"}
      - {name: jobtitle, label: "Job title"}
      - {name: website, label: "Website"}
      - {name: address, label: "Street address"}
      - {name: city, label: "City"}
      - {name: state, label: "State"}
      - {name: zip, label: "Postal code"}
      - {name: country, label: "Country"}
      - {name: lifecyclestage, label: "Lifecycle stage", type: select, options: [{label: "Subscriber", value: "subscriber"}, {label: "Lead", value: "lead"}, {label: "Marketing qualified lead", value: "marketingqualifiedlead"}, {label: "Sales qualified lead", value: "salesqualifiedlead"}, {label: "Opportunity", value: "opportunity"}, {label: "Customer", value: "customer"}, {label: "Evangelist", value: "evangelist"}, {label: "Other", value: "other"}]}
      - {name: hs_lead_status, label: "Lead status", type: select, options: [{label: "New", value: "NEW"}, {label: "Open", value: "OPEN"}, {label: "In progress", value: "IN_PROGRESS"}, {label: "Open deal", value: "OPEN_DEAL"}, {label: "Unqualified", value: "UNQUALIFIED"}, {label: "Attempted to contact", value: "ATTEMPTED_TO_CONTACT"}, {label: "Connected", value: "CONNECTED"}, {label: "Bad timing", value: "BAD_TIMING"}]}
      - {name: hubspot_owner_id, label: "Owner", type: select, options_from: {request: {method: GET, path: crm/v3/owners, query: {limit: 500}}, path: results, label: email, value: id}}
      - {name: custom_properties, label: Other properties, type: json, description: "By internal name, like {\"my_field\": \"x\"}"}
    request:
      method: PATCH
      path: "crm/v3/objects/contacts/{{fields.id}}"
      body:
        properties:
          email: "{{fields.email}}"
          firstname: "{{fields.firstname}}"
          lastname: "{{fields.lastname}}"
          phone: "{{fields.phone}}"
          mobilephone: "{{fields.mobilephone}}"
          company: "{{fields.company}}"
          jobtitle: "{{fields.jobtitle}}"
          website: "{{fields.website}}"
          address: "{{fields.address}}"
          city: "{{fields.city}}"
          state: "{{fields.state}}"
          zip: "{{fields.zip}}"
          country: "{{fields.country}}"
          lifecyclestage: "{{fields.lifecyclestage}}"
          hs_lead_status: "{{fields.hs_lead_status}}"
          hubspot_owner_id: "{{fields.hubspot_owner_id}}"
          _merge: "{{fields.custom_properties}}"

  - name: Delete Contact
    resource: Contact
    description: Archives a contact, which HubSpot keeps for 90 days.
    fields:
      - {name: id, label: "Contact ID", required: true}
    request:
      method: DELETE
      path: "crm/v3/objects/contacts/{{fields.id}}"
    output:
      value: {id: "{{fields.id}}", deleted: true}

  # Companies
  - name: Create Company
    resource: Company
    description: Creates a company.
    fields:
      - {name: name, label: "Name"}
      - {name: domain, label: "Domain"}
      - {name: phone, label: "Phone"}
      - {name: industry, label: "Industry"}
      - {name: description, label: "Description", type: textarea}
      - {name: website, label: "Website"}
      - {name: address, label: "Street address"}
      - {name: city, label: "City"}
      - {name: state, label: "State"}
      - {name: zip, label: "Postal code"}
      - {name: country, label: "Country"}
      - {name: numberofemployees, label: "Employees", type: number}
      - {name: annualrevenue, label: "Annual revenue", type: number}
      - {name: lifecyclestage, label: "Lifecycle stage", type: select, options: [{label: "Subscriber", value: "subscriber"}, {label: "Lead", value: "lead"}, {label: "Marketing qualified lead", value: "marketingqualifiedlead"}, {label: "Sales qualified lead", value: "salesqualifiedlead"}, {label: "Opportunity", value: "opportunity"}, {label: "Customer", value: "customer"}, {label: "Evangelist", value: "evangelist"}, {label: "Other", value: "other"}]}
      - {name: hubspot_owner_id, label: "Owner", type: select, options_from: {request: {method: GET, path: crm/v3/owners, query: {limit: 500}}, path: results, label: email, value: id}}
      - {name: custom_properties, label: Other properties, type: json, description: "By internal name, like {\"my_field\": \"x\"}"}
      - {name: associations, label: Associations, type: json, description: "Like [{\"to\": {\"id\": \"123\"}, \"types\": [{\"associationCategory\": \"HUBSPOT_DEFINED\", \"associationTypeId\": 1}]}]"}
    request:
      method: POST
      path: crm/v3/objects/companies
      body:
        properties:
          name: "{{fields.name}}"
          domain: "{{fields.domain}}"
          phone: "{{fields.phone}}"
          industry: "{{fields.industry}}"
          description: "{{fields.description}}"
          website: "{{fields.website}}"
          address: "{{fields.address}}"
          city: "{{fields.city}}"
          state: "{{fields.state}}"
          zip: "{{fields.zip}}"
          country: "{{fields.country}}"
          numberofemployees: "{{fields.numberofemployees}}"
          annualrevenue: "{{fields.annualrevenue}}"
          lifecyclestage: "{{fields.lifecyclestage}}"
          hubspot_owner_id: "{{fields.hubspot_owner_id}}"
          _merge: "{{fields.custom_properties}}"
        associations: "{{fields.associations}}"

  - name: Get Company
    resource: Company
    description: Reads a company by its ID.
    fields:
      - {name: id, label: "Company ID", required: true}
      - {name: properties, label: Properties, description: "Comma separated, besides the default ones"}
      - {name: properties_with_history, label: Properties with history, description: Comma separated.}
      - {name: associations, label: Associated, description: "Object types, like contacts,deals"}
      - {name: archived, label: Archived, type: boolean}
    request:
      method: GET
      path: "crm/v3/objects/companies/{{fields.id}}"
      query:
        properties: "{{fields.properties}}"
        propertiesWithHistory: "{{fields.properties_with_history}}"
        associations: "{{fields.associations}}"
        archived: "{{fields.archived}}"

  - name: Get Companies
    resource: Company
    description: Lists every company.
    fields:
      - {name: properties, label: Properties, description: "Comma separated, besides the default ones"}
      - {name: associations, label: Associated, description: "Object types, like contacts,deals"}
      - {name: archived, label: Archived, type: boolean}
    request:
      method: GET
      path: crm/v3/objects/companies
      query: {properties: "{{fields.properties}}", associations: "{{fields.associations}}", archived: "{{fields.archived}}"}
    pagination: {type: cursor, items_path: results, cursor_param: after, next_path: paging.next.after, limit_param: limit, page_size: 100}

  - name: Search Companies
    resource: Company
    description: Finds companies by filters, by text, or the most recently changed.
    fields:
      - {name: query, label: Text, description: Searches the default text properties.}
      - {name: filter_groups, label: Filters, type: json, description: "Like [{\"filters\": [{\"propertyName\": \"createdate\", \"operator\": \"GTE\", \"value\": \"2026-01-01\"}]}]"}
      - {name: sort_by, label: Sort by property, default: lastmodifieddate}
      - {name: direction, label: Direction, type: select, default: DESCENDING, options: [{label: Descending, value: DESCENDING}, {label: Ascending, value: ASCENDING}]}
      - {name: properties, label: Properties, type: json, description: "Like [\"email\", \"firstname\"]"}
    request:
      method: POST
      path: crm/v3/objects/companies/search
      body:
        query: "{{fields.query}}"
        filterGroups: "{{fields.filter_groups}}"
        sorts: [{propertyName: "{{fields.sort_by}}", direction: "{{fields.direction}}"}]
        properties: "{{fields.properties}}"
    pagination: {type: cursor, in: body, items_path: results, cursor_param: after, next_path: paging.next.after, limit_param: limit, page_size: 100}

  - name: Search Companies by Domain
    resource: Company
    description: Finds the companies with a website domain.
    fields:
      - {name: domain, label: Domain, required: true, description: Like acme.com.}
      - {name: properties, label: Properties, type: json, description: "Like [\"name\", \"domain\"]"}
    request:
      method: POST
      path: crm/v3/objects/companies/search
      body:
        filterGroups: [{filters: [{propertyName: domain, operator: EQ, value: "{{fields.domain}}"}]}]
        properties: "{{fields.properties}}"
    pagination: {type: cursor, in: body, items_path: results, cursor_param: after, next_path: paging.next.after, limit_param: limit, page_size: 100}

  - name: Update Company
    resource: Company
    description: Changes a company. Empty fields stay as they are.
    fields:
      - {name: id, label: "Company ID", required: true}
      - {name: name, label: "Name"}
      - {name: domain, label: "Domain"}
      - {name: phone, label: "Phone"}
      - {name: industry, label: "Industry"}
      - {name: description, label: "Description", type: textarea}
      - {name: website, label: "Website"}
      - {name: address, label: "Street address"}
      - {name: city, label: "City"}
      - {name: state, label: "State"}
      - {name: zip, label: "Postal code"}
      - {name: country, label: "Country"}
      - {name: numberofemployees, label: "Employees", type: number}
      - {name: annualrevenue, label: "Annual revenue", type: number}
      - {name: lifecyclestage, label: "Lifecycle stage", type: select, options: [{label: "Subscriber", value: "subscriber"}, {label: "Lead", value: "lead"}, {label: "Marketing qualified lead", value: "marketingqualifiedlead"}, {label: "Sales qualified lead", value: "salesqualifiedlead"}, {label: "Opportunity", value: "opportunity"}, {label: "Customer", value: "customer"}, {label: "Evangelist", value: "evangelist"}, {label: "Other", value: "other"}]}
      - {name: hubspot_owner_id, label: "Owner", type: select, options_from: {request: {method: GET, path: crm/v3/owners, query: {limit: 500}}, path: results, label: email, value: id}}
      - {name: custom_properties, label: Other properties, type: json, description: "By internal name, like {\"my_field\": \"x\"}"}
    request:
      method: PATCH
      path: "crm/v3/objects/companies/{{fields.id}}"
      body:
        properties:
          name: "{{fields.name}}"
          domain: "{{fields.domain}}"
          phone: "{{fields.phone}}"
          industry: "{{fields.industry}}"
          description: "{{fields.description}}"
          website: "{{fields.website}}"
          address: "{{fields.address}}"
          city: "{{fields.city}}"
          state: "{{fields.state}}"
          zip: "{{fields.zip}}"
          country: "{{fields.country}}"
          numberofemployees: "{{fields.numberofemployees}}"
          annualrevenue: "{{fields.annualrevenue}}"
          lifecyclestage: "{{fields.lifecyclestage}}"
          hubspot_owner_id: "{{fields.hubspot_owner_id}}"
          _merge: "{{fields.custom_properties}}"

  - name: Delete Company
    resource: Company
    description: Archives a company, which HubSpot keeps for 90 days.
    fields:
      - {name: id, label: "Company ID", required: true}
    request:
      method: DELETE
      path: "crm/v3/objects/companies/{{fields.id}}"
    output:
      value: {id: "{{fields.id}}", deleted: true}

  # Deals
  - name: Create Deal
    resource: Deal
    description: Creates a deal.
    fields:
      - {name: dealname, label: "Name"}
      - {name: amount, label: "Amount", type: number}
      - {name: pipeline, label: "Pipeline ID"}
      - {name: dealstage, label: "Stage ID"}
      - {name: closedate, label: "Close date", type: datetime}
      - {name: dealtype, label: "Type", type: select, options: [{label: "New business", value: "newbusiness"}, {label: "Existing business", value: "existingbusiness"}]}
      - {name: description, label: "Description", type: textarea}
      - {name: hubspot_owner_id, label: "Owner", type: select, options_from: {request: {method: GET, path: crm/v3/owners, query: {limit: 500}}, path: results, label: email, value: id}}
      - {name: custom_properties, label: Other properties, type: json, description: "By internal name, like {\"my_field\": \"x\"}"}
      - {name: associations, label: Associations, type: json, description: "Like [{\"to\": {\"id\": \"123\"}, \"types\": [{\"associationCategory\": \"HUBSPOT_DEFINED\", \"associationTypeId\": 1}]}]"}
    request:
      method: POST
      path: crm/v3/objects/deals
      body:
        properties:
          dealname: "{{fields.dealname}}"
          amount: "{{fields.amount}}"
          pipeline: "{{fields.pipeline}}"
          dealstage: "{{fields.dealstage}}"
          closedate: "{{fields.closedate}}"
          dealtype: "{{fields.dealtype}}"
          description: "{{fields.description}}"
          hubspot_owner_id: "{{fields.hubspot_owner_id}}"
          _merge: "{{fields.custom_properties}}"
        associations: "{{fields.associations}}"

  - name: Get Deal
    resource: Deal
    description: Reads a deal by its ID.
    fields:
      - {name: id, label: "Deal ID", required: true}
      - {name: properties, label: Properties, description: "Comma separated, besides the default ones"}
      - {name: properties_with_history, label: Properties with history, description: Comma separated.}
      - {name: associations, label: Associated, description: "Object types, like contacts,deals"}
      - {name: archived, label: Archived, type: boolean}
    request:
      method: GET
      path: "crm/v3/objects/deals/{{fields.id}}"
      query:
        properties: "{{fields.properties}}"
        propertiesWithHistory: "{{fields.properties_with_history}}"
        associations: "{{fields.associations}}"
        archived: "{{fields.archived}}"

  - name: Get Deals
    resource: Deal
    description: Lists every deal.
    fields:
      - {name: properties, label: Properties, description: "Comma separated, besides the default ones"}
      - {name: associations, label: Associated, description: "Object types, like contacts,deals"}
      - {name: archived, label: Archived, type: boolean}
    request:
      method: GET
      path: crm/v3/objects/deals
      query: {properties: "{{fields.properties}}", associations: "{{fields.associations}}", archived: "{{fields.archived}}"}
    pagination: {type: cursor, items_path: results, cursor_param: after, next_path: paging.next.after, limit_param: limit, page_size: 100}

  - name: Search Deals
    resource: Deal
    description: Finds deals by filters, by text, or the most recently changed.
    fields:
      - {name: query, label: Text, description: Searches the default text properties.}
      - {name: filter_groups, label: Filters, type: json, description: "Like [{\"filters\": [{\"propertyName\": \"createdate\", \"operator\": \"GTE\", \"value\": \"2026-01-01\"}]}]"}
      - {name: sort_by, label: Sort by property, default: lastmodifieddate}
      - {name: direction, label: Direction, type: select, default: DESCENDING, options: [{label: Descending, value: DESCENDING}, {label: Ascending, value: ASCENDING}]}
      - {name: properties, label: Properties, type: json, description: "Like [\"email\", \"firstname\"]"}
    request:
      method: POST
      path: crm/v3/objects/deals/search
      body:
        query: "{{fields.query}}"
        filterGroups: "{{fields.filter_groups}}"
        sorts: [{propertyName: "{{fields.sort_by}}", direction: "{{fields.direction}}"}]
        properties: "{{fields.properties}}"
    pagination: {type: cursor, in: body, items_path: results, cursor_param: after, next_path: paging.next.after, limit_param: limit, page_size: 100}

  - name: Update Deal
    resource: Deal
    description: Changes a deal. Empty fields stay as they are.
    fields:
      - {name: id, label: "Deal ID", required: true}
      - {name: dealname, label: "Name"}
      - {name: amount, label: "Amount", type: number}
      - {name: pipeline, label: "Pipeline ID"}
      - {name: dealstage, label: "Stage ID"}
      - {name: closedate, label: "Close date", type: datetime}
      - {name: dealtype, label: "Type", type: select, options: [{label: "New business", value: "newbusiness"}, {label: "Existing business", value: "existingbusiness"}]}
      - {name: description, label: "Description", type: textarea}
      - {name: hubspot_owner_id, label: "Owner", type: select, options_from: {request: {method: GET, path: crm/v3/owners, query: {limit: 500}}, path: results, label: email, value: id}}
      - {name: custom_properties, label: Other properties, type: json, description: "By internal name, like {\"my_field\": \"x\"}"}
    request:
      method: PATCH
      path: "crm/v3/objects/deals/{{fields.id}}"
      body:
        properties:
          dealname: "{{fields.dealname}}"
          amount: "{{fields.amount}}"
          pipeline: "{{fields.pipeline}}"
          dealstage: "{{fields.dealstage}}"
          closedate: "{{fields.closedate}}"
          dealtype: "{{fields.dealtype}}"
          description: "{{fields.description}}"
          hubspot_owner_id: "{{fields.hubspot_owner_id}}"
          _merge: "{{fields.custom_properties}}"

  - name: Delete Deal
    resource: Deal
    description: Archives a deal, which HubSpot keeps for 90 days.
    fields:
      - {name: id, label: "Deal ID", required: true}
    request:
      method: DELETE
      path: "crm/v3/objects/deals/{{fields.id}}"
    output:
      value: {id: "{{fields.id}}", deleted: true}

  # Tickets
