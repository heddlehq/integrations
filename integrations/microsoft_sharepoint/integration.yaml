# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# SharePoint sites, through Microsoft Graph v1.0: lists, their items, and the files
# of a site's documents. Connect with an app registered in Microsoft Entra ID (Azure),
# with the delegated permission Sites.ReadWrite.All.
id: microsoft_sharepoint
name: Microsoft SharePoint
version: 1.0.0
description: Lists, list items and files of SharePoint sites.
icon: hero-building-library
logo: |
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><defs><linearGradient id="a" x1="5.822" y1="11.568" x2="20.178" y2="36.432" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#058f92"/><stop offset=".5" stop-color="#038489"/><stop offset="1" stop-color="#026d71"/></linearGradient></defs><circle cx="24" cy="15" r="12" fill="#036c70"/><circle cx="34" cy="26" r="11" fill="#1a9ba1"/><circle cx="25.5" cy="36.5" r="8.5" fill="#37c6d0"/><path fill="none" d="M0 0h48v48H0z"/><path d="M26 13.83v21.34a1.841 1.841 0 0 1-1.14 1.69 1.772 1.772 0 0 1-.69.14h-7.16c-.01-.17-.01-.33-.01-.5a4.18 4.18 0 0 1 .02-.5 8.473 8.473 0 0 1 5.09-7.29v-1.86A11.986 11.986 0 0 1 12.17 13a8.455 8.455 0 0 1 .21-1h11.79A1.837 1.837 0 0 1 26 13.83z" opacity=".1"/><path d="M23.17 13h-11a11.987 11.987 0 0 0 10.4 13.915c-3.1 1.47-5.359 5.645-5.551 9.085a4.18 4.18 0 0 0-.02.5c0 .17 0 .33.01.5a6.673 6.673 0 0 0 .13 1h6.03a1.841 1.841 0 0 0 1.69-1.14 1.772 1.772 0 0 0 .14-.69V14.83A1.837 1.837 0 0 0 23.17 13z" opacity=".2"/><path d="M23.17 13h-11a11.988 11.988 0 0 0 10.208 13.891c-3 1.576-5.17 5.741-5.358 9.109h6.15A1.844 1.844 0 0 0 25 34.17V14.83A1.837 1.837 0 0 0 23.17 13z" opacity=".2"/><path d="M22.17 13h-10a11.988 11.988 0 0 0 8.87 13.632A16.522 16.522 0 0 0 17.02 36h5.15A1.837 1.837 0 0 0 24 34.17V14.83A1.831 1.831 0 0 0 22.17 13z" opacity=".2"/><rect x="2" y="13" width="22" height="22" rx="1.833" fill="url(#a)"/><path d="M10.187 23.776a3.384 3.384 0 0 1-1.049-1.109 3.018 3.018 0 0 1-.365-1.517 2.919 2.919 0 0 1 .679-1.965 4.011 4.011 0 0 1 1.806-1.178 7.629 7.629 0 0 1 2.467-.382 9.392 9.392 0 0 1 3.25.455v2.3a5.073 5.073 0 0 0-1.47-.6 7.159 7.159 0 0 0-1.719-.206 3.719 3.719 0 0 0-1.767.374 1.159 1.159 0 0 0-.7 1.062 1.076 1.076 0 0 0 .3.752 2.69 2.69 0 0 0 .8.572q.5.249 1.5.662a1.519 1.519 0 0 1 .214.086 12.341 12.341 0 0 1 1.892.933 3.387 3.387 0 0 1 1.118 1.126 3.264 3.264 0 0 1 .4 1.7 3.162 3.162 0 0 1-.636 2.046 3.557 3.557 0 0 1-1.7 1.144 7.71 7.71 0 0 1-2.424.352 12.824 12.824 0 0 1-2.2-.18 7.534 7.534 0 0 1-1.783-.524v-2.425a5.746 5.746 0 0 0 1.8.86 7.042 7.042 0 0 0 1.986.318 3.42 3.42 0 0 0 1.8-.382A1.208 1.208 0 0 0 15 26.971a1.15 1.15 0 0 0-.34-.826 3.425 3.425 0 0 0-.937-.653q-.6-.3-1.767-.791a10.044 10.044 0 0 1-1.769-.925z" fill="#fff"/></svg>
category: files
author: Heddle
homepage: https://learn.microsoft.com/graph/api/resources/sharepoint
base_url: https://graph.microsoft.com/v1.0/

credential:
  label: Microsoft SharePoint
  auth:
    type: oauth2
    authorize_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
    token_auth: body
    scopes: [offline_access, User.Read, Sites.ReadWrite.All]

errors:
  message_path: error.message

triggers:
  - name: New List Item
    description: Starts the flow for each new item of a list, checking every 5 minutes.
    fields:
      - {name: site, label: Site, type: select, required: true, options_from: {request: {method: GET, path: sites, query: {search: "*"}}, path: value, label: displayName, value: id}}
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: "sites/{{fields.site}}/lists"}, path: value, label: displayName, value: id}}
    request: {method: GET, path: "sites/{{fields.site}}/lists/{{fields.list}}/items", query: {expand: fields, $top: 200}}
    output:
      path: value
    poll:
      every: 5
      id: id

  - name: List Item Changed
    description: Starts the flow when an item of a list is created or changed, checking every 5 minutes.
    fields:
      - {name: site, label: Site, type: select, required: true, options_from: {request: {method: GET, path: sites, query: {search: "*"}}, path: value, label: displayName, value: id}}
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: "sites/{{fields.site}}/lists"}, path: value, label: displayName, value: id}}
    request: {method: GET, path: "sites/{{fields.site}}/lists/{{fields.list}}/items", query: {expand: fields, $top: 200}}
    output:
      path: value
    poll:
      every: 5
      id: eTag

actions:
  # Lists
  - name: Get List
    resource: List
    description: Gets a list, with its columns.
    fields:
      - {name: site, label: Site, type: select, required: true, options_from: {request: {method: GET, path: sites, query: {search: "*"}}, path: value, label: displayName, value: id}}
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: "sites/{{fields.site}}/lists"}, path: value, label: displayName, value: id}}
    request: {method: GET, path: "sites/{{fields.site}}/lists/{{fields.list}}", query: {expand: columns}}

  - name: Get Lists
    resource: List
    description: Lists the lists of a site.
    fields:
      - {name: site, label: Site, type: select, required: true, options_from: {request: {method: GET, path: sites, query: {search: "*"}}, path: value, label: displayName, value: id}}
    request: {method: GET, path: "sites/{{fields.site}}/lists"}
    pagination: {type: link, items_path: value, next_path: "@odata.nextLink"}

  # Items
  - name: Create Item
    resource: Item
    description: Creates an item in a list.
    fields:
      - {name: site, label: Site, type: select, required: true, options_from: {request: {method: GET, path: sites, query: {search: "*"}}, path: value, label: displayName, value: id}}
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: "sites/{{fields.site}}/lists"}, path: value, label: displayName, value: id}}
      - {name: fields, label: Columns, type: json, required: true, description: "The item's columns by their internal names, like {\"Title\": \"Ana\", \"Status\": \"New\"}."}
    request:
      method: POST
      path: "sites/{{fields.site}}/lists/{{fields.list}}/items"
      body: {fields: "{{fields.fields}}"}

  - name: Get Item
    resource: Item
    description: Gets an item of a list, with its columns.
    fields:
      - {name: site, label: Site, type: select, required: true, options_from: {request: {method: GET, path: sites, query: {search: "*"}}, path: value, label: displayName, value: id}}
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: "sites/{{fields.site}}/lists"}, path: value, label: displayName, value: id}}
      - {name: item, label: Item ID, required: true}
    request: {method: GET, path: "sites/{{fields.site}}/lists/{{fields.list}}/items/{{fields.item}}", query: {expand: fields}}

  - name: Get Items
    resource: Item
    description: Lists the items of a list, with a filter on their columns if you want one.
    fields:
      - {name: site, label: Site, type: select, required: true, options_from: {request: {method: GET, path: sites, query: {search: "*"}}, path: value, label: displayName, value: id}}
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: "sites/{{fields.site}}/lists"}, path: value, label: displayName, value: id}}
      - {name: filter, label: Filter, description: "An OData filter on the columns, like fields/Status eq 'New'."}
    request:
      method: GET
      path: "sites/{{fields.site}}/lists/{{fields.list}}/items"
      query: {expand: fields, $filter: "{{fields.filter}}"}
      headers: {Prefer: HonorNonIndexedQueriesWarningMayFailRandomly}
    pagination: {type: link, items_path: value, next_path: "@odata.nextLink"}

  - name: Update Item
    resource: Item
    description: Changes the columns of an item. The others stay as they are.
    fields:
      - {name: site, label: Site, type: select, required: true, options_from: {request: {method: GET, path: sites, query: {search: "*"}}, path: value, label: displayName, value: id}}
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: "sites/{{fields.site}}/lists"}, path: value, label: displayName, value: id}}
      - {name: item, label: Item ID, required: true}
      - {name: fields, label: Columns, type: json, required: true, description: "The columns to change, by their internal names, like {\"Status\": \"Done\"}."}
    request:
      method: PATCH
      path: "sites/{{fields.site}}/lists/{{fields.list}}/items/{{fields.item}}/fields"
      body: {_merge: "{{fields.fields}}"}

  - name: Delete Item
    resource: Item
    description: Deletes an item of a list.
    fields:
      - {name: site, label: Site, type: select, required: true, options_from: {request: {method: GET, path: sites, query: {search: "*"}}, path: value, label: displayName, value: id}}
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: "sites/{{fields.site}}/lists"}, path: value, label: displayName, value: id}}
      - {name: item, label: Item ID, required: true}
    request: {method: DELETE, path: "sites/{{fields.site}}/lists/{{fields.list}}/items/{{fields.item}}"}
    output:
      value: {deleted: true}

  # Files
  - name: Upload File
    resource: File
    description: Uploads a file, up to 250 MB, into a folder of the site's documents, with its own name.
    fields:
      - {name: file, label: File, type: file, required: true, default: "{{result}}"}
      - {name: site, label: Site, type: select, required: true, options_from: {request: {method: GET, path: sites, query: {search: "*"}}, path: value, label: displayName, value: id}}
      - {name: folder, label: Folder, type: select, required: true, default: root, description: "The top of the site's documents when left as is.", options_from: {request: {method: GET, path: "sites/{{fields.site}}/drive/root/children", query: {$top: 200, $select: "id,name"}}, path: value, label: name, value: id}}
      - {name: conflict, label: If the name exists, type: select, default: rename, options: [{label: Keep both, value: rename}, {label: Replace, value: replace}, {label: Fail, value: fail}]}
    request:
      method: PUT
      path: "sites/{{fields.site}}/drive/items/{{fields.folder}}:/{{fields.file | name}}:/content"
      query: {"@microsoft.graph.conflictBehavior": "{{fields.conflict}}"}
      body_type: binary
      body: "{{fields.file}}"

  - name: Download File
    resource: File
    description: Downloads a file of the site's documents.
    fields:
      - {name: site, label: Site, type: select, required: true, options_from: {request: {method: GET, path: sites, query: {search: "*"}}, path: value, label: displayName, value: id}}
      - {name: item, label: File ID, required: true}
    request: {method: GET, path: "sites/{{fields.site}}/drive/items/{{fields.item}}/content"}
    output:
      file: true

  - name: Update File
    resource: File
    description: Replaces the content of a file, keeping its name and history.
    fields:
      - {name: site, label: Site, type: select, required: true, options_from: {request: {method: GET, path: sites, query: {search: "*"}}, path: value, label: displayName, value: id}}
      - {name: item, label: File ID, required: true}
      - {name: file, label: New content, type: file, required: true, default: "{{result}}"}
    request:
      method: PUT
      path: "sites/{{fields.site}}/drive/items/{{fields.item}}/content"
      body_type: binary
      body: "{{fields.file}}"

  - name: Rename File
    resource: File
    description: Renames a file or moves it into another folder.
    fields:
      - {name: site, label: Site, type: select, required: true, options_from: {request: {method: GET, path: sites, query: {search: "*"}}, path: value, label: displayName, value: id}}
      - {name: item, label: File ID, required: true}
      - {name: name, label: New name}
      - {name: folder, label: Into folder ID}
    request:
      method: PATCH
      path: "sites/{{fields.site}}/drive/items/{{fields.item}}"
      body: {name: "{{fields.name}}", parentReference: {id: "{{fields.folder}}"}}

  - name: Get Folder Items
    resource: File
    description: Lists the files and folders inside a folder of the site's documents.
    fields:
      - {name: site, label: Site, type: select, required: true, options_from: {request: {method: GET, path: sites, query: {search: "*"}}, path: value, label: displayName, value: id}}
      - {name: folder, label: Folder, type: select, required: true, default: root, description: "The top of the site's documents when left as is.", options_from: {request: {method: GET, path: "sites/{{fields.site}}/drive/root/children", query: {$top: 200, $select: "id,name"}}, path: value, label: name, value: id}}
    request: {method: GET, path: "sites/{{fields.site}}/drive/items/{{fields.folder}}/children", query: {$top: 200}}
    pagination: {type: link, items_path: value, next_path: "@odata.nextLink"}

i18n:
  pt-BR:
    description: Listas, itens de lista e arquivos de sites do SharePoint.
    triggers:
      New List Item: {name: Novo item na lista, description: "Inicia o fluxo para cada item novo de uma lista, olhando a cada 5 minutos.", fields: {site: Site, list: Lista}}
      List Item Changed: {name: Item da lista mudou, description: "Inicia o fluxo quando um item de uma lista é criado ou muda, olhando a cada 5 minutos.", fields: {site: Site, list: Lista}}
    actions:
      Get List: {name: Ler lista, description: "Lê uma lista, com as colunas dela.", fields: {site: Site, list: Lista}}
      Get Lists: {name: Listar listas, description: Lista as listas de um site., fields: {site: Site}}
      Create Item: {name: Criar item, description: Cria um item numa lista., fields: {site: Site, list: Lista, fields: Colunas}}
      Get Item: {name: Ler item, description: "Lê um item de uma lista, com as colunas dele.", fields: {site: Site, list: Lista, item: ID do item}}
      Get Items: {name: Listar itens, description: "Lista os itens de uma lista, com filtro nas colunas se quiser.", fields: {site: Site, list: Lista, filter: Filtro}}
      Update Item: {name: Atualizar item, description: Muda as colunas de um item. As outras ficam como estão., fields: {site: Site, list: Lista, item: ID do item, fields: Colunas}}
      Delete Item: {name: Excluir item, description: Exclui um item de uma lista., fields: {site: Site, list: Lista, item: ID do item}}
      Upload File: {name: Enviar arquivo, description: "Envia um arquivo, de até 250 MB, para uma pasta dos documentos do site, com o nome dele.", fields: {file: Arquivo, site: Site, folder: Pasta, conflict: Se o nome existir}}
      Download File: {name: Baixar arquivo, description: Baixa um arquivo dos documentos do site., fields: {site: Site, item: ID do arquivo}}
      Update File: {name: Atualizar arquivo, description: "Troca o conteúdo de um arquivo, mantendo o nome e o histórico.", fields: {site: Site, item: ID do arquivo, file: Novo conteúdo}}
      Rename File: {name: Renomear arquivo, description: Renomeia um arquivo ou move para outra pasta., fields: {site: Site, item: ID do arquivo, name: Novo nome, folder: ID da pasta de destino}}
      Get Folder Items: {name: Listar itens da pasta, description: Lista os arquivos e pastas dentro de uma pasta dos documentos do site., fields: {site: Site, folder: Pasta}}
