category: email
base_url: https://api.postmarkapp.com/
headers:
  Accept: application/json

credential:
  label: Postmark server
  fields:
    - {name: server_token, label: Server API token, secret: true, required: true, description: Servers › your server › API Tokens.}
  auth:
    type: header
    name: X-Postmark-Server-Token
    value: "{{credential.server_token}}"

errors:
  message_path: Message

triggers:
  - name: Email Event
    description: Starts the flow when Postmark reports a delivery, bounce, open, click, spam complaint or subscription change, by the events you pick.
    fields:
      - {name: message_stream, label: Message stream, default: outbound}
      - {name: delivery, label: Deliveries, type: boolean, default: true}
      - {name: bounce, label: Bounces, type: boolean, default: true}
      - {name: open, label: Opens, type: boolean}
      - {name: click, label: Clicks, type: boolean}
      - {name: spam_complaint, label: Spam complaints, type: boolean}
      - {name: subscription_change, label: Subscription changes, type: boolean}
    webhook:
      register:
        request:
          method: POST
          path: webhooks
          body:
            Url: "{{webhook.url}}"
            MessageStream: "{{fields.message_stream}}"
            HttpAuth: {Username: heddle, Password: "{{webhook.secret}}"}
            Triggers:
              Delivery: {Enabled: "{{fields.delivery}}"}
              Bounce: {Enabled: "{{fields.bounce}}", IncludeContent: false}
              Open: {Enabled: "{{fields.open}}", PostFirstOpenOnly: false}
              Click: {Enabled: "{{fields.click}}"}
              SpamComplaint: {Enabled: "{{fields.spam_complaint}}", IncludeContent: false}
              SubscriptionChange: {Enabled: "{{fields.subscription_change}}"}
        id_path: ID
      unregister:
        request: {method: DELETE, path: "webhooks/{{webhook.id}}"}
      signature:
        basic: {username: heddle, password: "{{webhook.secret}}"}

actions:
  # Email
  - name: Send Email
    resource: Email
    description: Sends an email with text, HTML or both.
    fields:
      - {name: from, label: From, required: true, description: "A confirmed sender signature, like Ana <ana@acme.com>."}
      - {name: to, label: To, required: true, description: Up to 50 addresses separated by commas.}
      - {name: cc, label: Cc}
      - {name: bcc, label: Bcc}
      - {name: reply_to, label: Reply to}
      - {name: subject, label: Subject, required: true}
      - {name: text_body, label: Text, type: textarea}
      - {name: html_body, label: HTML, type: textarea}
      - {name: tag, label: Tag}
      - {name: track_opens, label: Track opens, type: boolean}
      - {name: track_links, label: Track links, type: select, options: [{label: "No", value: None}, {label: HTML and text, value: HtmlAndText}, {label: HTML only, value: HtmlOnly}, {label: Text only, value: TextOnly}]}
      - {name: metadata, label: Metadata, type: json, description: "Your own keys, like {\"order\": \"123\"}."}
      - {name: message_stream, label: Message stream, default: outbound}
    request:
      method: POST
      path: email
      body: {From: "{{fields.from}}", To: "{{fields.to}}", Cc: "{{fields.cc}}", Bcc: "{{fields.bcc}}", ReplyTo: "{{fields.reply_to}}", Subject: "{{fields.subject}}", TextBody: "{{fields.text_body}}", HtmlBody: "{{fields.html_body}}", Tag: "{{fields.tag}}", TrackOpens: "{{fields.track_opens}}", TrackLinks: "{{fields.track_links}}", Metadata: "{{fields.metadata}}", MessageStream: "{{fields.message_stream}}"}

  - name: Send Template Email
    resource: Email
    description: Sends an email from a template, filling it with your data.
    fields:
      - {name: from, label: From, required: true}
      - {name: to, label: To, required: true}
      - {name: template, label: Template, type: select, required: true, options_from: {request: {method: GET, path: templates, query: {count: 500, offset: 0}}, path: Templates, label: Name, value: TemplateId}}
      - {name: model, label: Template data, type: json, description: "The values for the template, like {\"name\": \"Ana\"}."}
      - {name: cc, label: Cc}
      - {name: bcc, label: Bcc}
      - {name: reply_to, label: Reply to}
      - {name: tag, label: Tag}
      - {name: track_opens, label: Track opens, type: boolean}
      - {name: metadata, label: Metadata, type: json}
      - {name: message_stream, label: Message stream, default: outbound}
    request:
      method: POST
      path: email/withTemplate
      body: {From: "{{fields.from}}", To: "{{fields.to}}", TemplateId: "{{fields.template}}", TemplateModel: "{{fields.model}}", Cc: "{{fields.cc}}", Bcc: "{{fields.bcc}}", ReplyTo: "{{fields.reply_to}}", Tag: "{{fields.tag}}", TrackOpens: "{{fields.track_opens}}", Metadata: "{{fields.metadata}}", MessageStream: "{{fields.message_stream}}"}

  - name: Send Batch
    resource: Email
    description: Sends up to 500 emails in one call; the answer has one result per email.
    fields:
      - {name: messages, label: Messages, type: json, required: true, description: "A list of emails, each like Send Email's body: [{\"From\": ..., \"To\": ..., \"Subject\": ..., \"TextBody\": ...}]."}
    request: {method: POST, path: email/batch, body: "{{fields.messages}}"}

  # Messages
  - name: Search Sent Messages
    resource: Message
    description: Lists sent messages, by recipient, tag, status or date.
    fields:
      - {name: recipient, label: Recipient}
      - {name: tag, label: Tag}
      - {name: status, label: Status, type: select, options: [{label: Sent, value: sent}, {label: Queued, value: queued}]}
      - {name: fromdate, label: From, description: As YYYY-MM-DD.}
      - {name: todate, label: To, description: As YYYY-MM-DD.}
      - {name: count, label: Limit, type: number, default: 100}
      - {name: offset, label: Skip, type: number, default: 0}
    request:
      method: GET
      path: messages/outbound
      query: {recipient: "{{fields.recipient}}", tag: "{{fields.tag}}", status: "{{fields.status}}", fromdate: "{{fields.fromdate}}", todate: "{{fields.todate}}", count: "{{fields.count}}", offset: "{{fields.offset}}"}
    output: {path: Messages}

  - name: Get Sent Message
    resource: Message
    description: Reads a sent message, with its body and delivery events.
    fields:
      - {name: message_id, label: Message ID, required: true}
    request: {method: GET, path: "messages/outbound/{{fields.message_id | path}}/details"}

  # Templates
  - name: List Templates
    resource: Template
    description: Lists the server's templates.
    fields:
      - {name: count, label: Limit, type: number, default: 100}
      - {name: offset, label: Skip, type: number, default: 0}
    request: {method: GET, path: templates, query: {count: "{{fields.count}}", offset: "{{fields.offset}}"}}
    output: {path: Templates}

  - name: Get Template
    resource: Template
    description: Reads a template by its ID or alias.
    fields:
      - {name: template, label: Template ID or alias, required: true}
    request: {method: GET, path: "templates/{{fields.template | path}}"}

  # Bounces
  - name: List Bounces
    resource: Bounce
    description: Lists bounces, by type, email or date.
    fields:
      - {name: type, label: Type, type: select, options: [{label: Hard bounce, value: HardBounce}, {label: Soft bounce, value: SoftBounce}, {label: Spam complaint, value: SpamComplaint}, {label: Transient, value: Transient}, {label: Unsubscribe, value: Unsubscribe}, {label: Blocked, value: Blocked}]}
      - {name: email_filter, label: Email}
      - {name: tag, label: Tag}
      - {name: fromdate, label: From, description: As YYYY-MM-DD.}
      - {name: todate, label: To, description: As YYYY-MM-DD.}
      - {name: count, label: Limit, type: number, default: 100}
      - {name: offset, label: Skip, type: number, default: 0}
    request:
      method: GET
      path: bounces
      query: {type: "{{fields.type}}", emailFilter: "{{fields.email_filter}}", tag: "{{fields.tag}}", fromdate: "{{fields.fromdate}}", todate: "{{fields.todate}}", count: "{{fields.count}}", offset: "{{fields.offset}}"}
    output: {path: Bounces}

  - name: Get Bounce
    resource: Bounce
    description: Reads a bounce, with its reason.
    fields:
      - {name: bounce_id, label: Bounce ID, required: true}
    request: {method: GET, path: "bounces/{{fields.bounce_id | path}}"}

  - name: Activate Bounce
    resource: Bounce
    description: Reactivates an address that bounced, so mail goes to it again.
    fields:
      - {name: bounce_id, label: Bounce ID, required: true}
    request: {method: PUT, path: "bounces/{{fields.bounce_id | path}}/activate"}

  # Suppressions
  - name: List Suppressions
    resource: Suppression
    description: Lists the addresses a message stream won't send to.
    fields:
      - {name: message_stream, label: Message stream, required: true, default: outbound}
      - {name: email_address, label: Email}
    request: {method: GET, path: "message-streams/{{fields.message_stream | path}}/suppressions/dump", query: {EmailAddress: "{{fields.email_address}}"}}
    output: {path: Suppressions}

  - name: Add Suppressions
    resource: Suppression
    description: Stops a message stream from sending to some addresses.
    fields:
      - {name: message_stream, label: Message stream, required: true, default: outbound}
      - {name: emails, label: Emails, required: true, description: "One email, or several separated by commas."}
    request:
      method: POST
      path: "message-streams/{{fields.message_stream | path}}/suppressions"
      body: {Suppressions: {_each: "{{fields.emails}}", EmailAddress: "{{item}}"}}
    output: {path: Suppressions}

  - name: Remove Suppressions
    resource: Suppression
    description: Lets a message stream send to some addresses again.
    fields:
      - {name: message_stream, label: Message stream, required: true, default: outbound}
      - {name: emails, label: Emails, required: true, description: "One email, or several separated by commas."}
    request:
      method: POST
      path: "message-streams/{{fields.message_stream | path}}/suppressions/delete"
      body: {Suppressions: {_each: "{{fields.emails}}", EmailAddress: "{{item}}"}}
    output: {path: Suppressions}

  # Stats
  - name: Get Delivery Stats
    resource: Stats
    description: Counts the inactive addresses and bounces by type.
    request: {method: GET, path: deliverystats}

  - name: Get Sent Stats
    resource: Stats
    description: Reads sent, bounced, opened and clicked totals, by tag and date.
    fields:
      - {name: tag, label: Tag}
      - {name: fromdate, label: From, description: As YYYY-MM-DD.}
      - {name: todate, label: To, description: As YYYY-MM-DD.}
      - {name: message_stream, label: Message stream}
    request: {method: GET, path: stats/outbound, query: {tag: "{{fields.tag}}", fromdate: "{{fields.fromdate}}", todate: "{{fields.todate}}", messagestream: "{{fields.message_stream}}"}}

  - name: Get Server
    resource: Server
    description: Reads the server's settings.
    request: {method: GET, path: server}

i18n:
  pt-BR:
    description: "Envie e-mails transacionais, simples ou de templates, acompanhe entregas, bounces, aberturas e cliques, e gerencie supressões da Postmark."
    triggers:
      Email Event: {name: "Evento de e-mail", description: "Inicia o fluxo quando a Postmark avisa uma entrega, bounce, abertura, clique, reclamação de spam ou mudança de inscrição, conforme os eventos escolhidos.", fields: {message_stream: "Message stream", delivery: "Entregas", bounce: "Bounces", open: "Aberturas", click: "Cliques", spam_complaint: "Reclamações de spam", subscription_change: "Mudanças de inscrição"}}
    actions:
      Send Email: {name: "Enviar e-mail", description: "Envia um e-mail com texto, HTML ou os dois.", fields: {from: "De", to: "Para", cc: "Cc", bcc: "Cco", reply_to: "Responder para", subject: "Assunto", text_body: "Texto", html_body: "HTML", tag: "Tag", track_opens: "Rastrear aberturas", track_links: "Rastrear links", metadata: "Metadados", message_stream: "Message stream"}}
      Send Template Email: {name: "Enviar e-mail de template", description: "Envia um e-mail a partir de um template, preenchido com seus dados.", fields: {from: "De", to: "Para", template: "Template", model: "Dados do template", cc: "Cc", bcc: "Cco", reply_to: "Responder para", tag: "Tag", track_opens: "Rastrear aberturas", metadata: "Metadados", message_stream: "Message stream"}}
      Send Batch: {name: "Enviar em lote", description: "Envia até 500 e-mails numa chamada; a resposta traz um resultado por e-mail.", fields: {messages: "Mensagens"}}
      Search Sent Messages: {name: "Pesquisar mensagens enviadas", description: "Lista mensagens enviadas por destinatário, tag, status ou data.", fields: {recipient: "Destinatário", tag: "Tag", status: "Status", fromdate: "De", todate: "Até", count: "Limite", offset: "Pular"}}
      Get Sent Message: {name: "Ler mensagem enviada", description: "Lê uma mensagem enviada, com o corpo e os eventos de entrega.", fields: {message_id: "ID da mensagem"}}
      List Templates: {name: "Listar templates", description: "Lista os templates do servidor.", fields: {count: "Limite", offset: "Pular"}}
      Get Template: {name: "Ler template", description: "Lê um template pelo ID ou alias.", fields: {template: "ID ou alias do template"}}
      List Bounces: {name: "Listar bounces", description: "Lista bounces por tipo, e-mail ou data.", fields: {type: "Tipo", email_filter: "E-mail", tag: "Tag", fromdate: "De", todate: "Até", count: "Limite", offset: "Pular"}}
      Get Bounce: {name: "Ler bounce", description: "Lê um bounce, com o motivo.", fields: {bounce_id: "ID do bounce"}}
      Activate Bounce: {name: "Reativar endereço", description: "Reativa um endereço que deu bounce, para voltar a receber e-mails.", fields: {bounce_id: "ID do bounce"}}
      List Suppressions: {name: "Listar supressões", description: "Lista os endereços para os quais um message stream não envia.", fields: {message_stream: "Message stream", email_address: "E-mail"}}
      Add Suppressions: {name: "Adicionar supressões", description: "Faz um message stream parar de enviar para alguns endereços.", fields: {message_stream: "Message stream", emails: "E-mails"}}
      Remove Suppressions: {name: "Remover supressões", description: "Deixa um message stream voltar a enviar para alguns endereços.", fields: {message_stream: "Message stream", emails: "E-mails"}}
      Get Delivery Stats: {name: "Estatísticas de entrega", description: "Conta os endereços inativos e os bounces por tipo."}
      Get Sent Stats: {name: "Estatísticas de envio", description: "Lê totais de enviados, bounces, aberturas e cliques, por tag e data.", fields: {tag: "Tag", fromdate: "De", todate: "Até", message_stream: "Message stream"}}
      Get Server: {name: "Ler servidor", description: "Lê as configurações do servidor."}
