# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
id: resend
name: Resend
version: 1.0.0
description: Send email through Resend's API.
icon: hero-paper-airplane
logo: |
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#fff"/><path fill="#000000" transform="translate(3.6 3.6) scale(0.7)" d="M2.023 0v24h5.553v-8.434h2.998L15.326 24h6.65l-5.372-9.258a7.652 7.652 0 0 0 3.316-3.016c.709-1.21 1.062-2.57 1.062-4.08 0-1.462-.353-2.767-1.062-3.91-.709-1.165-1.692-2.079-2.95-2.742C15.737.331 14.355 0 12.823 0Zm5.553 4.87h4.219c.731 0 1.349.125 1.851.376.526.252.925.618 1.2 1.098.274.457.412.994.412 1.611S15.132 9.12 14.88 9.6c-.229.48-.572.856-1.03 1.13-.434.252-.948.38-1.542.38H7.576Z"/></svg>
author: heddlehq
homepage: https://resend.com/docs/api-reference
base_url: https://api.resend.com/

credential:
  label: Resend
  fields:
    - name: api_key
      label: API key
      secret: true
      required: true
  auth:
    type: bearer
    token: "{{credential.api_key}}"

errors:
  message_path: message

actions:
  - name: Send Email
    description: Sends an email from a domain verified in Resend.
    fields:
      - {name: from, label: "From, like Ana <ana@example.com>"}
      - {name: to, label: To}
      - {name: subject, label: Subject}
      - {name: html, label: Body (HTML), type: textarea}
    request:
      method: POST
      path: emails
      body:
        from: "{{fields.from}}"
        to: "{{fields.to}}"
        subject: "{{fields.subject}}"
        html: "{{fields.html}}"
    output:
      pick: [id]

  - name: Get Email
    description: Returns an email that was sent, with its status.
    fields:
      - {name: id, label: Email ID, default: "{{result.id}}"}
    request:
      method: GET
      path: "emails/{{fields.id}}"
    output:
      pick: [id, to, subject, last_event, created_at]
