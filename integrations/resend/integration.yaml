      Send Email With Attachment: {name: "Enviar e-mail com anexo", description: "Envia um e-mail com um arquivo de um nó anterior anexado.", fields: {from: "De", to: "Para", subject: "Assunto", html: "Corpo (HTML)", file: "Anexo", filename: "Nome do anexo"}}
      Send Batch: {name: "Enviar em lote", description: "Envia até 100 e-mails numa chamada.", fields: {emails: "E-mails"}}
