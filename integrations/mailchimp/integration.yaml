# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Mailchimp, through the Marketing API 3.0. Connect with an API key from Mailchimp's
# Profile › Extras › API keys. The part after the dash, like us21, is the data center.
# A member is named by its email, which Mailchimp takes in place of its hash.
# Mailchimp doesn't sign its webhooks, so the triggers check for news every 5 minutes.
id: mailchimp
name: Mailchimp
version: 1.0.0
description: Audiences, contacts, tags and campaigns in Mailchimp.
icon: hero-envelope-open
