category: marketing
author: Heddle
homepage: https://mailchimp.com/developer/marketing/api/
base_url: "https://{{credential.host}}.api.mailchimp.com/3.0/"

credential:
  label: Mailchimp
  fields:
    - {name: api_key, label: API key, secret: true, required: true}
    - {name: host, label: Data center, required: true, description: "The end of the key, like us21."}
  auth:
    type: basic
    username: heddle
    password: "{{credential.api_key}}"

errors:
  message_path: detail

triggers:
  - name: New Subscriber
    description: Starts the flow for each new contact in an audience, checking every 5 minutes.
    fields:
      - {name: list, label: Audience, type: select, required: true, options_from: {request: {method: GET, path: lists, query: {count: 1000}}, path: lists, label: name, value: id}}
    request:
      method: GET
      path: "lists/{{fields.list}}/members"
      query: {sort_field: timestamp_opt, sort_dir: DESC, count: 200}
    output: {path: members}
    poll: {every: 5, id: id}

  - name: Unsubscribed
    description: Starts the flow for each contact who leaves an audience, checking every 5 minutes.
    fields:
      - {name: list, label: Audience, type: select, required: true, options_from: {request: {method: GET, path: lists, query: {count: 1000}}, path: lists, label: name, value: id}}
    request:
      method: GET
      path: "lists/{{fields.list}}/members"
      query: {status: unsubscribed, sort_field: last_changed, sort_dir: DESC, count: 200}
    output: {path: members}
    poll: {every: 5, id: id}

actions:
  # Members
  - name: Add Member
    resource: Member
    description: Adds a contact to an audience, or updates it when it's there.
    fields:
      - {name: list, label: Audience, type: select, required: true, options_from: {request: {method: GET, path: lists, query: {count: 1000}}, path: lists, label: name, value: id}}
      - {name: email, label: Email, required: true}
      - {name: status, label: Status, type: select, default: subscribed, options: [{label: Subscribed, value: subscribed}, {label: Pending (sends a confirmation), value: pending}, {label: Unsubscribed, value: unsubscribed}, {label: Transactional only, value: transactional}]}
      - {name: first_name, label: First name}
      - {name: last_name, label: Last name}
      - {name: merge_fields, label: Other fields, type: json, description: 'Audience fields by tag, like {"PHONE": "+55 11 99999-0000"}'}
      - {name: tags, label: Tags, description: "Like vip, 2026"}
      - {name: language, label: Language, description: "Like pt or en"}
      - {name: vip, label: VIP, type: boolean}
    request:
      method: PUT
      path: "lists/{{fields.list}}/members/{{fields.email}}"
      body:
        email_address: "{{fields.email}}"
        status_if_new: "{{fields.status}}"
        status: "{{fields.status}}"
        merge_fields: {FNAME: "{{fields.first_name}}", LNAME: "{{fields.last_name}}", _merge: "{{fields.merge_fields}}"}
        tags: {_each: "{{fields.tags}}", _value: "{{item}}"}
        language: "{{fields.language}}"
        vip: "{{fields.vip}}"

  - name: Update Member
    resource: Member
    description: Changes a contact. Empty fields stay as they are.
    fields:
      - {name: list, label: Audience, type: select, required: true, options_from: {request: {method: GET, path: lists, query: {count: 1000}}, path: lists, label: name, value: id}}
      - {name: email, label: Email, required: true}
      - {name: new_email, label: New email}
      - {name: status, label: Status, type: select, options: [{label: Subscribed, value: subscribed}, {label: Unsubscribed, value: unsubscribed}, {label: Cleaned, value: cleaned}, {label: Pending, value: pending}, {label: Transactional only, value: transactional}]}
      - {name: first_name, label: First name}
      - {name: last_name, label: Last name}
      - {name: merge_fields, label: Other fields, type: json}
      - {name: vip, label: VIP, type: boolean}
    request:
      method: PATCH
      path: "lists/{{fields.list}}/members/{{fields.email}}"
      body:
        email_address: "{{fields.new_email}}"
        status: "{{fields.status}}"
        merge_fields: {FNAME: "{{fields.first_name}}", LNAME: "{{fields.last_name}}", _merge: "{{fields.merge_fields}}"}
        vip: "{{fields.vip}}"

  - name: Get Member
    resource: Member
    description: Reads a contact of an audience.
    fields:
      - {name: list, label: Audience, type: select, required: true, options_from: {request: {method: GET, path: lists, query: {count: 1000}}, path: lists, label: name, value: id}}
      - {name: email, label: Email, required: true}
    request: {method: GET, path: "lists/{{fields.list}}/members/{{fields.email}}"}

  - name: List Members
    resource: Member
    description: Lists the contacts of an audience.
    fields:
      - {name: list, label: Audience, type: select, required: true, options_from: {request: {method: GET, path: lists, query: {count: 1000}}, path: lists, label: name, value: id}}
      - {name: status, label: Status, type: select, options: [{label: Subscribed, value: subscribed}, {label: Unsubscribed, value: unsubscribed}, {label: Cleaned, value: cleaned}, {label: Pending, value: pending}, {label: Transactional only, value: transactional}, {label: Archived, value: archived}]}
      - {name: since_changed, label: Changed since, type: datetime}
      - {name: since_opt, label: Joined since, type: datetime}
    request:
      method: GET
      path: "lists/{{fields.list}}/members"
      query: {status: "{{fields.status}}", since_last_changed: "{{fields.since_changed}}", since_timestamp_opt: "{{fields.since_opt}}"}
    pagination: {type: offset, items_path: members, offset_param: offset, limit_param: count, page_size: 1000}

  - name: Search Members
    resource: Member
    description: Finds contacts by email or name, in one audience or all.
    fields:
      - {name: query, label: Search, required: true}
      - {name: list, label: Audience ID, description: "All audiences when empty."}
    request:
      method: GET
      path: search-members
      query: {query: "{{fields.query}}", list_id: "{{fields.list}}"}
    output: {path: full_search.members}

  - name: Archive Member
    resource: Member
    description: Archives a contact. It can be added again later.
    fields:
      - {name: list, label: Audience, type: select, required: true, options_from: {request: {method: GET, path: lists, query: {count: 1000}}, path: lists, label: name, value: id}}
      - {name: email, label: Email, required: true}
    request: {method: DELETE, path: "lists/{{fields.list}}/members/{{fields.email}}"}
    output:
      value: {email: "{{fields.email}}", archived: true}

  - name: Delete Member Permanently
    resource: Member
    description: Erases a contact and its history. It can't be added again with the API.
    fields:
      - {name: list, label: Audience, type: select, required: true, options_from: {request: {method: GET, path: lists, query: {count: 1000}}, path: lists, label: name, value: id}}
      - {name: email, label: Email, required: true}
    request: {method: POST, path: "lists/{{fields.list}}/members/{{fields.email}}/actions/delete-permanent"}
    output:
      value: {email: "{{fields.email}}", deleted: true}

  - name: Add Note
    resource: Member
    description: Writes a note on a contact.
    fields:
      - {name: list, label: Audience, type: select, required: true, options_from: {request: {method: GET, path: lists, query: {count: 1000}}, path: lists, label: name, value: id}}
      - {name: email, label: Email, required: true}
      - {name: note, label: Note, type: textarea, required: true}
    request:
      method: POST
      path: "lists/{{fields.list}}/members/{{fields.email}}/notes"
      body: {note: "{{fields.note}}"}

  # Tags
  - name: Add Tags
    resource: Tag
    description: Puts tags on a contact. Tags that don't exist are created.
    fields:
      - {name: list, label: Audience, type: select, required: true, options_from: {request: {method: GET, path: lists, query: {count: 1000}}, path: lists, label: name, value: id}}
      - {name: email, label: Email, required: true}
      - {name: tags, label: Tags, required: true, description: "Like vip, 2026"}
    request:
      method: POST
      path: "lists/{{fields.list}}/members/{{fields.email}}/tags"
      body: {tags: {_each: "{{fields.tags}}", name: "{{item}}", status: active}}
    output:
      value: {email: "{{fields.email}}", tags: "{{fields.tags}}"}

  - name: Remove Tags
    resource: Tag
    description: Takes tags off a contact.
    fields:
      - {name: list, label: Audience, type: select, required: true, options_from: {request: {method: GET, path: lists, query: {count: 1000}}, path: lists, label: name, value: id}}
      - {name: email, label: Email, required: true}
      - {name: tags, label: Tags, required: true, description: "Like vip, 2026"}
    request:
      method: POST
      path: "lists/{{fields.list}}/members/{{fields.email}}/tags"
      body: {tags: {_each: "{{fields.tags}}", name: "{{item}}", status: inactive}}
    output:
      value: {email: "{{fields.email}}", removed: "{{fields.tags}}"}

  - name: List Tags
    resource: Tag
    description: Lists the tags of an audience.
    fields:
      - {name: list, label: Audience, type: select, required: true, options_from: {request: {method: GET, path: lists, query: {count: 1000}}, path: lists, label: name, value: id}}
    request: {method: GET, path: "lists/{{fields.list}}/tag-search"}
    output: {path: tags}

  # Audiences
  - name: List Audiences
    resource: Audience
    description: Lists the audiences, with their stats.
    request: {method: GET, path: lists}
    pagination: {type: offset, items_path: lists, offset_param: offset, limit_param: count, page_size: 1000}

  - name: Get Audience
    resource: Audience
    description: Reads an audience.
    fields:
      - {name: list, label: Audience, type: select, required: true, options_from: {request: {method: GET, path: lists, query: {count: 1000}}, path: lists, label: name, value: id}}
    request: {method: GET, path: "lists/{{fields.list}}"}

  - name: List Segments
    resource: Audience
    description: Lists the segments and saved tags of an audience.
    fields:
      - {name: list, label: Audience, type: select, required: true, options_from: {request: {method: GET, path: lists, query: {count: 1000}}, path: lists, label: name, value: id}}
    request: {method: GET, path: "lists/{{fields.list}}/segments"}
    pagination: {type: offset, items_path: segments, offset_param: offset, limit_param: count, page_size: 1000}

  # Campaigns
  - name: List Campaigns
    resource: Campaign
    description: Lists the campaigns.
    fields:
      - {name: status, label: Status, type: select, options: [{label: Draft, value: save}, {label: Paused, value: paused}, {label: Scheduled, value: schedule}, {label: Sending, value: sending}, {label: Sent, value: sent}]}
      - {name: list, label: Audience ID}
      - {name: since_sent, label: Sent since, type: datetime}
    request:
      method: GET
      path: campaigns
      query: {status: "{{fields.status}}", list_id: "{{fields.list}}", since_send_time: "{{fields.since_sent}}", sort_field: create_time, sort_dir: DESC}
    pagination: {type: offset, items_path: campaigns, offset_param: offset, limit_param: count, page_size: 1000}

  - name: Get Campaign
    resource: Campaign
    description: Reads a campaign.
    fields:
      - {name: campaign, label: Campaign ID, required: true}
    request: {method: GET, path: "campaigns/{{fields.campaign}}"}

  - name: Create Campaign
    resource: Campaign
    description: Creates a regular email campaign to an audience, as a draft.
    fields:
      - {name: list, label: Audience, type: select, required: true, options_from: {request: {method: GET, path: lists, query: {count: 1000}}, path: lists, label: name, value: id}}
      - {name: subject, label: Subject, required: true}
      - {name: from_name, label: From name, required: true}
      - {name: reply_to, label: Reply-to email, required: true}
      - {name: title, label: Internal name}
      - {name: preview, label: Preview text}
      - {name: segment, label: Segment ID, type: number}
    request:
      method: POST
      path: campaigns
      body:
        type: regular
        recipients: {list_id: "{{fields.list}}", segment_opts: {saved_segment_id: "{{fields.segment}}"}}
        settings: {subject_line: "{{fields.subject}}", from_name: "{{fields.from_name}}", reply_to: "{{fields.reply_to}}", title: "{{fields.title}}", preview_text: "{{fields.preview}}"}

  - name: Set Campaign Content
    resource: Campaign
    description: Sets the HTML of a draft campaign.
    fields:
      - {name: campaign, label: Campaign ID, required: true}
      - {name: html, label: HTML, type: textarea, required: true}
    request:
      method: PUT
      path: "campaigns/{{fields.campaign}}/content"
      body: {html: "{{fields.html}}"}

  - name: Send Campaign
    resource: Campaign
    description: Sends a draft campaign now.
    fields:
      - {name: campaign, label: Campaign ID, required: true}
    request: {method: POST, path: "campaigns/{{fields.campaign}}/actions/send"}
    output:
      value: {id: "{{fields.campaign}}", sent: true}

  - name: Schedule Campaign
    resource: Campaign
    description: Schedules a draft campaign, at a quarter hour like 09:15.
    fields:
      - {name: campaign, label: Campaign ID, required: true}
      - {name: at, label: Send at, type: datetime, required: true}
    request:
      method: POST
      path: "campaigns/{{fields.campaign}}/actions/schedule"
      body: {schedule_time: "{{fields.at}}"}
    output:
      value: {id: "{{fields.campaign}}", scheduled: "{{fields.at}}"}

  - name: Send Test Email
    resource: Campaign
    description: Sends a test of a campaign to some emails.
    fields:
      - {name: campaign, label: Campaign ID, required: true}
      - {name: emails, label: Emails, required: true, description: "Like ana@acme.com, bia@acme.com"}
    request:
      method: POST
      path: "campaigns/{{fields.campaign}}/actions/test"
      body: {test_emails: {_each: "{{fields.emails}}", _value: "{{item}}"}, send_type: html}
    output:
      value: {id: "{{fields.campaign}}", tested: "{{fields.emails}}"}

  - name: Replicate Campaign
    resource: Campaign
    description: Makes a copy of a campaign, as a draft.
    fields:
      - {name: campaign, label: Campaign ID, required: true}
    request: {method: POST, path: "campaigns/{{fields.campaign}}/actions/replicate"}

  - name: Delete Campaign
    resource: Campaign
    description: Deletes a campaign that wasn't sent.
    fields:
      - {name: campaign, label: Campaign ID, required: true}
    request: {method: DELETE, path: "campaigns/{{fields.campaign}}"}
    output:
      value: {id: "{{fields.campaign}}", deleted: true}

  - name: Get Campaign Report
    resource: Campaign
    description: Reads how a sent campaign did, with opens, clicks and bounces.
    fields:
      - {name: campaign, label: Campaign ID, required: true}
    request: {method: GET, path: "reports/{{fields.campaign}}"}

i18n:
  pt-BR:
    description: Públicos, contatos, tags e campanhas no Mailchimp.
    triggers:
      New Subscriber: {name: Novo inscrito, description: "Inicia o fluxo para cada contato novo num público, olhando a cada 5 minutos.", fields: {list: Público}}
      Unsubscribed: {name: Descadastrou, description: "Inicia o fluxo para cada contato que sai de um público, olhando a cada 5 minutos.", fields: {list: Público}}
    actions:
      Add Member: {name: Adicionar contato, description: "Adiciona um contato a um público, ou atualiza se já existir.", fields: {list: Público, email: E-mail, status: Status, first_name: Nome, last_name: Sobrenome, merge_fields: Outros campos, tags: Tags, language: Idioma, vip: VIP}}
      Update Member: {name: Atualizar contato, description: Altera um contato. Campos vazios ficam como estão., fields: {list: Público, email: E-mail, new_email: Novo e-mail, status: Status, first_name: Nome, last_name: Sobrenome, merge_fields: Outros campos, vip: VIP}}
      Get Member: {name: Ler contato, description: Lê um contato de um público., fields: {list: Público, email: E-mail}}
      List Members: {name: Listar contatos, description: Lista os contatos de um público., fields: {list: Público, status: Status, since_changed: Alterado desde, since_opt: Entrou desde}}
      Search Members: {name: Buscar contatos, description: "Encontra contatos por e-mail ou nome, num público ou em todos.", fields: {query: Busca, list: ID do público}}
      Archive Member: {name: Arquivar contato, description: Arquiva um contato. Dá para adicionar de novo depois., fields: {list: Público, email: E-mail}}
      Delete Member Permanently: {name: Excluir contato de vez, description: Apaga um contato e o histórico. Não dá para adicionar de novo pela API., fields: {list: Público, email: E-mail}}
      Add Note: {name: Adicionar nota, description: Escreve uma nota num contato., fields: {list: Público, email: E-mail, note: Nota}}
      Add Tags: {name: Adicionar tags, description: Põe tags num contato. Tags que não existem são criadas., fields: {list: Público, email: E-mail, tags: Tags}}
      Remove Tags: {name: Remover tags, description: Tira tags de um contato., fields: {list: Público, email: E-mail, tags: Tags}}
      List Tags: {name: Listar tags, description: Lista as tags de um público., fields: {list: Público}}
