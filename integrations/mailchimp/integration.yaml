1.299.38 1.299s.219-.04.4.073c.173.106.299.326.213.895c-.176 1.063-.628 1.926-1.387 2.72a5.7 5.7 0 0 1-1.666 1.244q-.511.27-1.087.46c-2.863.935-5.794-.093-6.739-2.3a3.6 3.6 0 0 1-.189-.522c-.403-1.455-.06-3.2 1.008-4.299c.065-.07.132-.153.132-.256c0-.087-.055-.179-.102-.243c-.374-.543-1.669-1.466-1.409-3.254c.187-1.284 1.31-2.189 2.357-2.135l.266.015c.453.027.85.085 1.223.1c.625.028 1.187-.063 1.853-.618c.225-.187.405-.35.71-.401c.028-.005.092-.028.215-.028m.022 2.18a.4.4 0 0 0-.06.005c-.335.054-.347.468-.228 1.04c.068.32.187.595.32.765q.264-.031.498 0c.089-.205.104-.557.024-.942c-.112-.535-.261-.872-.554-.868m-3.66 1.546a1.72 1.72 0 0 0-1.016.326c-.16.117-.311.28-.29.378c.008.032.031.056.088.063c.131.015.592-.217 1.122-.25c.374-.023.684.094.923.2c.239.104.386.173.443.113c.037-.038.026-.11-.031-.204c-.118-.192-.36-.387-.618-.497a1.6 1.6 0 0 0-.621-.129m4.082.81c-.171-.003-.313.186-.317.42c-.004.236.131.43.303.432s.314-.185.318-.42c.004-.236-.132-.429-.304-.432m-3.58.172q-.075 0-.155.008c-.311.05-.483.152-.593.247c-.094.082-.152.173-.152.237a.075.075 0 0 0 .075.076c.07 0 .228-.063.228-.063a2 2 0 0 1 1.001-.104c.157.018.23.027.265-.026c.01-.016.022-.049-.01-.1c-.063-.103-.311-.269-.66-.275zm2.26.4c-.127 0-.235.051-.283.148c-.075.154.035.363.246.466c.21.104.443.063.52-.09c.075-.155-.035-.364-.246-.467a.54.54 0 0 0-.237-.058zm-11.635.024q.072 0 .149.003c.73.04 1.806.6 2.052 2.19c.217 1.41-.128 2.843-1.449 3.069q-.185.03-.374.026c-1.22-.033-2.539-1.132-2.67-2.435c-.145-1.44.591-2.548 1.894-2.811q.177-.037.398-.042m-.07.927a1.14 1.14 0 0 0-.847.364c-.38.418-.439.988-.366 1.19c.027.073.07.094.1.098c.064.008.16-.039.22-.2l.017-.052a1.6 1.6 0 0 1 .157-.37a.69.69 0 0 1 .955-.199c.266.174.369.5.255.81c-.058.161-.154.469-.133.721c.043.511.357.717.64.738c.274.01.466-.143.515-.256c.029-.067.005-.107-.011-.125c-.043-.053-.113-.037-.18-.021a.6.6 0 0 1-.16.022a.35.35 0 0 1-.294-.148c-.078-.12-.073-.3.013-.504l.04-.092c.138-.308.368-.825.11-1.317c-.195-.37-.513-.602-.894-.65a1 1 0 0 