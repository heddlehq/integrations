# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Microsoft To Do, through Microsoft Graph v1.0. Connect with an app registered in
# Microsoft Entra ID (Azure), with the delegated permission Tasks.ReadWrite.
id: microsoft_todo
name: Microsoft To Do
version: 1.0.0
description: Task lists, tasks and their linked resources in Microsoft To Do.
icon: hero-check-circle
logo: |
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><defs><linearGradient id="a" x1="15.292" y1="37.062" x2="41.417" y2="10.938" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#408ffd"/><stop offset="1" stop-color="#57aefd"/></linearGradient></defs><rect width="48" height="48" fill="none"/><path d="M9.641,16.588,3.526,22.7a1.832,1.832,0,0,0,0,2.592l8.708,8.709L20.942,25.3l-8.708-8.708A1.834,1.834,0,0,0,9.641,16.588Z" fill="#185abd"/><path d="M44.474,14,38.359,7.88a1.834,1.834,0,0,0-2.593,0l-7.412,7.412h0L19.646,24h0l-7.412,7.412a1.834,1.834,0,0,0,0,2.593l6.115,6.115a1.834,1.834,0,0,0,2.593,0l7.412-7.412h0L37.062,24l7.412-7.412A1.834,1.834,0,0,0,44.474,14Z" fill="url(#a)"/></svg>
category: productivity
author: Heddle
homepage: https://learn.microsoft.com/graph/api/resources/todo-overview
base_url: https://graph.microsoft.com/v1.0/

credential:
  label: Microsoft To Do
  auth:
    type: oauth2
    authorize_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
    token_auth: body
    scopes: [offline_access, User.Read, Tasks.ReadWrite, MailboxSettings.Read]

errors:
  message_path: error.message

triggers:
  - name: New Task
    description: Starts the flow for each new task in a list, checking every 5 minutes.
    fields:
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: me/todo/lists}, path: value, label: displayName, value: id}}
    request:
      method: GET
      path: "me/todo/lists/{{fields.list}}/tasks"
      query: {$orderby: createdDateTime desc, $top: 50}
    output:
      path: value
    poll:
      every: 5
      id: id

actions:
  # Lists
  - name: Create List
    resource: List
    description: Creates a task list.
    fields:
      - {name: name, label: Name, required: true}
    request:
      method: POST
      path: me/todo/lists
      body: {displayName: "{{fields.name}}"}

  - name: Get List
    resource: List
    description: Gets a task list.
    fields:
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: me/todo/lists}, path: value, label: displayName, value: id}}
    request: {method: GET, path: "me/todo/lists/{{fields.list}}"}

  - name: Get Lists
    resource: List
    description: Lists the task lists.
    request: {method: GET, path: me/todo/lists}
    pagination: {type: link, items_path: value, next_path: "@odata.nextLink"}

  - name: Update List
    resource: List
    description: Renames a task list.
    fields:
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: me/todo/lists}, path: value, label: displayName, value: id}}
      - {name: name, label: Name, required: true}
    request:
      method: PATCH
      path: "me/todo/lists/{{fields.list}}"
      body: {displayName: "{{fields.name}}"}

  - name: Delete List
    resource: List
    description: Deletes a task list and its tasks.
    fields:
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: me/todo/lists}, path: value, label: displayName, value: id}}
    request: {method: DELETE, path: "me/todo/lists/{{fields.list}}"}
    output:
      value: {deleted: true}

  # Tasks
  - name: Create Task
    resource: Task
    description: Creates a task in a list.
    fields:
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: me/todo/lists}, path: value, label: displayName, value: id}}
      - {name: title, label: Title, required: true}
      - {name: content, label: Notes, type: textarea}
      - {name: importance, label: Importance, type: select, options: [{label: Low, value: low}, {label: Normal, value: normal}, {label: High, value: high}]}
      - {name: status, label: Status, type: select, options: [{label: Not started, value: notStarted}, {label: In progress, value: inProgress}, {label: Completed, value: completed}, {label: Waiting on others, value: waitingOnOthers}, {label: Deferred, value: deferred}]}
      - {name: due, label: Due, type: datetime}
      - {name: reminder, label: Reminder, type: datetime}
      - {name: reminder_on, label: Remind me, type: boolean, description: Turns the reminder on.}
      - {name: time_zone, label: Time zone, description: "Of the due date and the reminder, like America/Sao_Paulo. UTC when empty.", default: UTC}
      - {name: categories, label: Categories, type: multiselect, options_from: {request: {method: GET, path: me/outlook/masterCategories}, path: value, label: displayName, value: displayName}}
      - {name: extra, label: Other fields, type: json, description: "Other properties of the task, as JSON, like {\"recurrence\": {...}}."}
    request:
      method: POST
      path: "me/todo/lists/{{fields.list}}/tasks"
      body:
        title: "{{fields.title}}"
        body: {content: "{{fields.content}}", contentType: text, _if: "{{fields.content}}"}
        importance: "{{fields.importance}}"
        status: "{{fields.status}}"
        dueDateTime: {dateTime: "{{fields.due}}", timeZone: "{{fields.time_zone}}", _if: "{{fields.due}}"}
        reminderDateTime: {dateTime: "{{fields.reminder}}", timeZone: "{{fields.time_zone}}", _if: "{{fields.reminder}}"}
        isReminderOn: "{{fields.reminder_on}}"
        categories: "{{fields.categories}}"
        _merge: "{{fields.extra}}"

  - name: Get Task
    resource: Task
    description: Gets a task.
    fields:
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: me/todo/lists}, path: value, label: displayName, value: id}}
      - {name: task, label: Task ID, required: true}
    request: {method: GET, path: "me/todo/lists/{{fields.list}}/tasks/{{fields.task}}"}

  - name: Get Tasks
    resource: Task
    description: Lists the tasks of a list, with an OData filter if you want one.
    fields:
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: me/todo/lists}, path: value, label: displayName, value: id}}
      - {name: filter, label: Filter, description: "An OData filter, like status ne 'completed'."}
    request:
      method: GET
      path: "me/todo/lists/{{fields.list}}/tasks"
      query: {$filter: "{{fields.filter}}"}
    pagination: {type: link, items_path: value, next_path: "@odata.nextLink"}

  - name: Update Task
    resource: Task
    description: Changes a task. Empty fields stay as they are.
    fields:
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: me/todo/lists}, path: value, label: displayName, value: id}}
      - {name: task, label: Task ID, required: true}
      - {name: title, label: Title}
      - {name: content, label: Notes, type: textarea}
      - {name: importance, label: Importance, type: select, options: [{label: Low, value: low}, {label: Normal, value: normal}, {label: High, value: high}]}
      - {name: status, label: Status, type: select, options: [{label: Not started, value: notStarted}, {label: In progress, value: inProgress}, {label: Completed, value: completed}, {label: Waiting on others, value: waitingOnOthers}, {label: Deferred, value: deferred}]}
      - {name: due, label: Due, type: datetime}
      - {name: reminder, label: Reminder, type: datetime}
      - {name: reminder_on, label: Remind me, type: boolean}
      - {name: time_zone, label: Time zone, description: "Of the due date and the reminder, like America/Sao_Paulo. UTC when empty.", default: UTC}
      - {name: categories, label: Categories, type: multiselect, options_from: {request: {method: GET, path: me/outlook/masterCategories}, path: value, label: displayName, value: displayName}}
      - {name: extra, label: Other fields, type: json}
    request:
      method: PATCH
      path: "me/todo/lists/{{fields.list}}/tasks/{{fields.task}}"
      body:
        title: "{{fields.title}}"
        body: {content: "{{fields.content}}", contentType: text, _if: "{{fields.content}}"}
        importance: "{{fields.importance}}"
        status: "{{fields.status}}"
        dueDateTime: {dateTime: "{{fields.due}}", timeZone: "{{fields.time_zone}}", _if: "{{fields.due}}"}
        reminderDateTime: {dateTime: "{{fields.reminder}}", timeZone: "{{fields.time_zone}}", _if: "{{fields.reminder}}"}
        isReminderOn: "{{fields.reminder_on}}"
        categories: "{{fields.categories}}"
        _merge: "{{fields.extra}}"

  - name: Delete Task
    resource: Task
    description: Deletes a task.
    fields:
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: me/todo/lists}, path: value, label: displayName, value: id}}
      - {name: task, label: Task ID, required: true}
    request: {method: DELETE, path: "me/todo/lists/{{fields.list}}/tasks/{{fields.task}}"}
    output:
      value: {deleted: true}

  # Linked resources
  - name: Create Linked Resource
    resource: Linked Resource
    description: Links a task to an item in another app, like an email or a ticket.
    fields:
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: me/todo/lists}, path: value, label: displayName, value: id}}
      - {name: task, label: Task ID, required: true}
      - {name: application, label: Application, required: true, description: The name of the app the item is in.}
      - {name: name, label: Name}
      - {name: url, label: URL}
      - {name: external_id, label: ID in the app}
    request:
      method: POST
      path: "me/todo/lists/{{fields.list}}/tasks/{{fields.task}}/linkedResources"
      body: {applicationName: "{{fields.application}}", displayName: "{{fields.name}}", webUrl: "{{fields.url}}", externalId: "{{fields.external_id}}"}

  - name: Get Linked Resource
    resource: Linked Resource
    description: Gets a linked resource of a task.
    fields:
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: me/todo/lists}, path: value, label: displayName, value: id}}
      - {name: task, label: Task ID, required: true}
      - {name: id, label: Linked resource ID, required: true}
    request: {method: GET, path: "me/todo/lists/{{fields.list}}/tasks/{{fields.task}}/linkedResources/{{fields.id}}"}

  - name: Get Linked Resources
    resource: Linked Resource
    description: Lists the linked resources of a task.
    fields:
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: me/todo/lists}, path: value, label: displayName, value: id}}
      - {name: task, label: Task ID, required: true}
    request: {method: GET, path: "me/todo/lists/{{fields.list}}/tasks/{{fields.task}}/linkedResources"}
    pagination: {type: link, items_path: value, next_path: "@odata.nextLink"}

  - name: Update Linked Resource
    resource: Linked Resource
    description: Changes a linked resource. Empty fields stay as they are.
    fields:
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: me/todo/lists}, path: value, label: displayName, value: id}}
      - {name: task, label: Task ID, required: true}
      - {name: id, label: Linked resource ID, required: true}
      - {name: application, label: Application}
      - {name: name, label: Name}
      - {name: url, label: URL}
      - {name: external_id, label: ID in the app}
    request:
      method: PATCH
      path: "me/todo/lists/{{fields.list}}/tasks/{{fields.task}}/linkedResources/{{fields.id}}"
      body: {applicationName: "{{fields.application}}", displayName: "{{fields.name}}", webUrl: "{{fields.url}}", externalId: "{{fields.external_id}}"}

  - name: Delete Linked Resource
    resource: Linked Resource
    description: Deletes a linked resource of a task.
    fields:
      - {name: list, label: List, type: select, required: true, options_from: {request: {method: GET, path: me/todo/lists}, path: value, label: displayName, value: id}}
      - {name: task, label: Task ID, required: true}
      - {name: id, label: Linked resource ID, required: true}
    request: {method: DELETE, path: "me/todo/lists/{{fields.list}}/tasks/{{fields.task}}/linkedResources/{{fields.id}}"}
    output:
      value: {deleted: true}

i18n:
  pt-BR:
    description: Listas de tarefas, tarefas e seus recursos vinculados no Microsoft To Do.
    triggers:
      New Task: {name: Nova tarefa, description: "Inicia o fluxo para cada tarefa nova numa lista, olhando a cada 5 minutos.", fields: {list: Lista}}
    actions:
      Create List: {name: Criar lista, description: Cria uma lista de tarefas., fields: {name: Nome}}
      Get List: {name: Ler lista, description: Lê uma lista de tarefas., fields: {list: Lista}}
      Get Lists: {name: Listar listas, description: Lista as listas de tarefas.}
      Update List: {name: Atualizar lista, description: Renomeia uma lista de tarefas., fields: {list: Lista, name: Nome}}
      Delete List: {name: Excluir lista, description: Exclui uma lista de tarefas e as tarefas dela., fields: {list: Lista}}
      Create Task: {name: Criar tarefa, description: Cria uma tarefa numa lista., fields: {list: Lista, title: Título, content: Anotações, importance: Importância, status: Situação, due: Prazo, reminder: Lembrete, reminder_on: Lembrar, time_zone: Fuso horário, categories: Categorias, extra: Outros campos}}
      Get Task: {name: Ler tarefa, description: Lê uma tarefa., fields: {list: Lista, task: ID da tarefa}}
      Get Tasks: {name: Listar tarefas, description: "Lista as tarefas de uma lista, com um filtro OData se quiser.", fields: {list: Lista, filter: Filtro}}
      Update Task: {name: Atualizar tarefa, description: Muda uma tarefa. Campos vazios ficam como estão., fields: {list: Lista, task: ID da tarefa, title: Título, content: Anotações, importance: Importância, status: Situação, due: Prazo, reminder: Lembrete, reminder_on: Lembrar, time_zone: Fuso horário, categories: Categorias, extra: Outros campos}}
      Delete Task: {name: Excluir tarefa, description: Exclui uma tarefa., fields: {list: Lista, task: ID da tarefa}}
      Create Linked Resource: {name: Criar recurso vinculado, description: "Vincula uma tarefa a um item de outro app, como um email ou um chamado.", fields: {list: Lista, task: ID da tarefa, application: Aplicativo, name: Nome, url: URL, external_id: ID no app}}
      Get Linked Resource: {name: Ler recurso vinculado, description: Lê um recurso vinculado de uma tarefa., fields: {list: Lista, task: ID da tarefa, id: ID do recurso vinculado}}
      Get Linked Resources: {name: Listar recursos vinculados, description: Lista os recursos vinculados de uma tarefa., fields: {list: Lista, task: ID da tarefa}}
      Update Linked Resource: {name: Atualizar recurso vinculado, description: Muda um recurso vinculado. Campos vazios ficam como estão., fields: {list: Lista, task: ID da tarefa, id: ID do recurso vinculado, application: Aplicativo, name: Nome, url: URL, external_id: ID no app}}
      Delete Linked Resource: {name: Excluir recurso vinculado, description: Exclui um recurso vinculado de uma tarefa., fields: {list: Lista, task: ID da tarefa, id: ID do recurso vinculado}}
