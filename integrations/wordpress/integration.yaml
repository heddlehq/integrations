# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# WordPress, through its REST API. Connect with a user and an application password,
# made in Users › Profile › Application Passwords. The site must answer on HTTPS.
# Works with WordPress.com sites on a Business plan or above, and with any site you run.
id: wordpress
name: WordPress
version: 1.0.0
description: Posts, pages, media, users and comments on a WordPress site.
icon: hero-newspaper
logo: |
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#21759B" d="M21.469 6.825c.84 1.537 1.318 3.3 1.318 5.175c0 3.979-2.156 7.456-5.363 9.325l3.295-9.527c.615-1.54.82-2.771.82-3.864c0-.405-.026-.78-.07-1.11m-7.981.105c.647-.03 1.232-.105 1.232-.105c.582-.075.514-.93-.067-.899c0 0-1.755.135-2.88.135c-1.064 0-2.85-.15-2.85-.15c-.585-.03-.661.855-.075.885c0 0 .54.061 1.125.09l1.68 4.605l-2.37 7.08L5.354 6.9c.649-.03 1.234-.1 1.234-.1c.585-.075.516-.93-.065-.896c0 0-1.746.138-2.874.138c-.2 0-.438-.008-.69-.015C4.911 3.15 8.235 1.215 12 1.215c2.809 0 5.365 1.072 7.286 2.833c-.046-.003-.091-.009-.141-.009c-1.06 0-1.812.923-1.812 1.914c0 .89.513 1.643 1.06 2.531c.411.72.89 1.643.89 2.977c0 .915-.354 1.994-.821 3.479l-1.075 3.585l-3.9-11.61zM12 22.784c-1.059 0-2.081-.153-3.048-.437l3.237-9.406l3.315 9.087q.036.078.078.149c-1.12.393-2.325.609-3.582.609M1.211 12c0-1.564.336-3.05.935-4.39L7.29 21.709A10.79 10.79 0 0 1 1.211 12M12 0C5.385 0 0 5.385 0 12s5.385 12 12 12s12-5.385 12-12S18.615 0 12 0"/></svg>
category: cms
author: Heddle
homepage: https://developer.wordpress.org/rest-api/reference/
base_url: "{{credential.url}}/wp-json/wp/v2/"

credential:
  label: WordPress
  fields:
    - {name: url, label: Site URL, required: true, description: "Like https://acme.com"}
    - {name: username, label: Username, required: true}
    - {name: password, label: Application password, secret: true, required: true}
  auth:
    type: basic
    username: "{{credential.username}}"
    password: "{{credential.password}}"

errors:
  message_path: message

triggers:
  - name: New Post
    description: Starts the flow for each newly published post, checking every 5 minutes.
    fields:
      - {name: categories, label: Category IDs, description: "Like 3, 7. All when empty."}
    request:
      method: GET
      path: posts
      query: {categories: "{{fields.categories}}", orderby: date, order: desc, per_page: 100}
    poll: {every: 5, id: id}

  - name: New Comment
    description: Starts the flow for each new comment, checking every 5 minutes.
    fields:
      - {name: status, label: Status, type: select, default: approve, options: [{label: Approved, value: approve}, {label: Waiting, value: hold}]}
    request:
      method: GET
      path: comments
      query: {status: "{{fields.status}}", orderby: date_gmt, order: desc, per_page: 100}
    poll: {every: 5, id: id}

actions:
  # Posts
  - name: Create Post
    resource: Post
    description: Writes a post, as a draft unless another status is picked.
    fields:
      - {name: title, label: Title, required: true}
      - {name: content, label: Content, type: textarea, description: "In HTML or blocks."}
      - {name: excerpt, label: Excerpt, type: textarea}
      - {name: status, label: Status, type: select, default: draft, options: [{label: Published, value: publish}, {label: Draft, value: draft}, {label: Pending review, value: pending}, {label: Private, value: private}, {label: Scheduled, value: future}]}
      - {name: date, label: Publish at, type: datetime, description: "For a scheduled post."}
      - {name: slug, label: Slug}
      - {name: author, label: Author ID, type: number}
      - {name: featured_media, label: Featured image ID, type: number}
      - {name: comment_status, label: Comments, type: select, options: [{label: Open, value: open}, {label: Closed, value: closed}]}
      - {name: categories, label: Category IDs, description: "Like 3, 7"}
      - {name: tags, label: Tag IDs, description: "Like 12, 15"}
      - {name: sticky, label: Sticky, type: boolean}
      - {name: extra, label: More fields, type: json, description: 'Like {"meta": {"key": "value"}}'}
    request:
      method: POST
      path: posts
      body:
        title: "{{fields.title}}"
        content: "{{fields.content}}"
        excerpt: "{{fields.excerpt}}"
        status: "{{fields.status}}"
        date_gmt: "{{fields.date}}"
        slug: "{{fields.slug}}"
        author: "{{fields.author}}"
        featured_media: "{{fields.featured_media}}"
        comment_status: "{{fields.comment_status}}"
        categories: {_each: "{{fields.categories}}", _value: "{{item}}"}
        tags: {_each: "{{fields.tags}}", _value: "{{item}}"}
        sticky: "{{fields.sticky}}"
        _merge: "{{fields.extra}}"

  - name: Get Post
    resource: Post
    description: Reads a post.
    fields:
      - {name: post, label: Post ID, required: true}
    request: {method: GET, path: "posts/{{fields.post}}", query: {context: edit}}

  - name: List Posts
    resource: Post
    description: Lists the posts, newest first.
    fields:
      - {name: search, label: Search}
      - {name: status, label: Status, type: multiselect, options: [{label: Published, value: publish}, {label: Draft, value: draft}, {label: Pending review, value: pending}, {label: Private, value: private}, {label: Scheduled, value: future}]}
      - {name: categories, label: Category IDs}
      - {name: tags, label: Tag IDs}
      - {name: author, label: Author IDs}
      - {name: after, label: Published after, type: datetime}
      - {name: before, label: Published before, type: datetime}
    request:
      method: GET
      path: posts
      query: {search: "{{fields.search}}", status: "{{fields.status}}", categories: "{{fields.categories}}", tags: "{{fields.tags}}", author: "{{fields.author}}", after: "{{fields.after}}", before: "{{fields.before}}", context: edit}
    pagination: {type: page, page_param: page, limit_param: per_page, page_size: 100}

  - name: Update Post
    resource: Post
    description: Changes a post. Empty fields stay as they are.
    fields:
      - {name: post, label: Post ID, required: true}
      - {name: title, label: Title}
      - {name: content, label: Content, type: textarea, description: "In HTML or blocks."}
      - {name: excerpt, label: Excerpt, type: textarea}
      - {name: status, label: Status, type: select, options: [{label: Published, value: publish}, {label: Draft, value: draft}, {label: Pending review, value: pending}, {label: Private, value: private}, {label: Scheduled, value: future}]}
      - {name: date, label: Publish at, type: datetime, description: "For a scheduled post."}
      - {name: slug, label: Slug}
      - {name: author, label: Author ID, type: number}
      - {name: featured_media, label: Featured image ID, type: number}
      - {name: comment_status, label: Comments, type: select, options: [{label: Open, value: open}, {label: Closed, value: closed}]}
      - {name: categories, label: Category IDs}
      - {name: tags, label: Tag IDs}
      - {name: extra, label: More fields, type: json}
    request:
      method: POST
      path: "posts/{{fields.post}}"
      body:
        title: "{{fields.title}}"
        content: "{{fields.content}}"
        excerpt: "{{fields.excerpt}}"
        status: "{{fields.status}}"
        date_gmt: "{{fields.date}}"
        slug: "{{fields.slug}}"
        author: "{{fields.author}}"
        featured_media: "{{fields.featured_media}}"
        comment_status: "{{fields.comment_status}}"
        categories: {_each: "{{fields.categories}}", _value: "{{item}}"}
        tags: {_each: "{{fields.tags}}", _value: "{{item}}"}
        _merge: "{{fields.extra}}"

  - name: Delete Post
    resource: Post
    description: Moves a post to the trash, or deletes it for good.
    fields:
      - {name: post, label: Post ID, required: true}
      - {name: force, label: Delete for good, type: boolean, default: false}
    request: {method: DELETE, path: "posts/{{fields.post}}", query: {force: "{{fields.force}}"}}

  # Pages
  - name: Create Page
    resource: Page
    description: Writes a page, as a draft unless another status is picked.
    fields:
      - {name: title, label: Title, required: true}
      - {name: content, label: Content, type: textarea, description: "In HTML or blocks."}
      - {name: excerpt, label: Excerpt, type: textarea}
      - {name: status, label: Status, type: select, default: draft, options: [{label: Published, value: publish}, {label: Draft, value: draft}, {label: Pending review, value: pending}, {label: Private, value: private}, {label: Scheduled, value: future}]}
      - {name: date, label: Publish at, type: datetime, description: "For a scheduled post."}
      - {name: slug, label: Slug}
      - {name: author, label: Author ID, type: number}
      - {name: featured_media, label: Featured image ID, type: number}
      - {name: comment_status, label: Comments, type: select, options: [{label: Open, value: open}, {label: Closed, value: closed}]}
      - {name: parent, label: Parent page ID, type: number}
      - {name: template, label: Template}
      - {name: extra, label: More fields, type: json}
    request:
      method: POST
      path: pages
      body:
        title: "{{fields.title}}"
        content: "{{fields.content}}"
        excerpt: "{{fields.excerpt}}"
        status: "{{fields.status}}"
        date_gmt: "{{fields.date}}"
        slug: "{{fields.slug}}"
        author: "{{fields.author}}"
        featured_media: "{{fields.featured_media}}"
        comment_status: "{{fields.comment_status}}"
        parent: "{{fields.parent}}"
        template: "{{fields.template}}"
        _merge: "{{fields.extra}}"

  - name: Get Page
    resource: Page
    description: Reads a page.
    fields:
      - {name: page, label: Page ID, required: true}
    request: {method: GET, path: "pages/{{fields.page}}", query: {context: edit}}

  - name: List Pages
    resource: Page
    description: Lists the pages.
    fields:
      - {name: search, label: Search}
      - {name: status, label: Status, type: multiselect, options: [{label: Published, value: publish}, {label: Draft, value: draft}, {label: Pending review, value: pending}, {label: Private, value: private}, {label: Scheduled, value: future}]}
      - {name: parent, label: Parent page IDs}
    request:
      method: GET
      path: pages
      query: {search: "{{fields.search}}", status: "{{fields.status}}", parent: "{{fields.parent}}", context: edit}
    pagination: {type: page, page_param: page, limit_param: per_page, page_size: 100}

  - name: Update Page
    resource: Page
    description: Changes a page. Empty fields stay as they are.
    fields:
      - {name: page, label: Page ID, required: true}
      - {name: title, label: Title}
      - {name: content, label: Content, type: textarea, description: "In HTML or blocks."}
      - {name: excerpt, label: Excerpt, type: textarea}
      - {name: status, label: Status, type: select, options: [{label: Published, value: publish}, {label: Draft, value: draft}, {label: Pending review, value: pending}, {label: Private, value: private}, {label: Scheduled, value: future}]}
      - {name: date, label: Publish at, type: datetime, description: "For a scheduled post."}
      - {name: slug, label: Slug}
      - {name: author, label: Author ID, type: number}
      - {name: featured_media, label: Featured image ID, type: number}
      - {name: comment_status, label: Comments, type: select, options: [{label: Open, value: open}, {label: Closed, value: closed}]}
      - {name: parent, label: Parent page ID, type: number}
      - {name: extra, label: More fields, type: json}
    request:
      method: POST
      path: "pages/{{fields.page}}"
      body:
        title: "{{fields.title}}"
        content: "{{fields.content}}"
        excerpt: "{{fields.excerpt}}"
        status: "{{fields.status}}"
        date_gmt: "{{fields.date}}"
        slug: "{{fields.slug}}"
        author: "{{fields.author}}"
        featured_media: "{{fields.featured_media}}"
        comment_status: "{{fields.comment_status}}"
        parent: "{{fields.parent}}"
        _merge: "{{fields.extra}}"

  - name: Delete Page
    resource: Page
    description: Moves a page to the trash, or deletes it for good.
    fields:
      - {name: page, label: Page ID, required: true}
      - {name: force, label: Delete for good, type: boolean, default: false}
    request: {method: DELETE, path: "pages/{{fields.page}}", query: {force: "{{fields.force}}"}}

  # Media
  - name: Upload Media
    resource: Media
    description: Sends an image or another file to the media library.
    fields:
      - {name: file, label: File, type: file, required: true, default: "{{result}}"}
      - {name: title, label: Title}
      - {name: alt_text, label: Alt text}
      - {name: caption, label: Caption}
    request:
      method: POST
      path: media
      body_type: multipart
      body: {file: "{{fields.file}}", title: "{{fields.title}}", alt_text: "{{fields.alt_text}}", caption: "{{fields.caption}}"}

  - name: List Media
    resource: Media
    description: Lists the files of the media library.
    fields:
      - {name: search, label: Search}
      - {name: media_type, label: Type, type: select, options: [{label: Image, value: image}, {label: Video, value: video}, {label: Audio, value: audio}, {label: Document, value: application}]}
    request:
      method: GET
      path: media
      query: {search: "{{fields.search}}", media_type: "{{fields.media_type}}"}
    pagination: {type: page, page_param: page, limit_param: per_page, page_size: 100}

  - name: Delete Media
    resource: Media
    description: Deletes a file of the media library.
    fields:
      - {name: media, label: Media ID, required: true}
    request: {method: DELETE, path: "media/{{fields.media}}", query: {force: true}}

  # Categories and tags
  - name: List Categories
    resource: Taxonomy
    description: Lists the categories.
    fields:
      - {name: search, label: Search}
    request: {method: GET, path: categories, query: {search: "{{fields.search}}"}}
    pagination: {type: page, page_param: page, limit_param: per_page, page_size: 100}

  - name: Create Category
    resource: Taxonomy
    description: Creates a category.
    fields:
      - {name: name, label: Name, required: true}
      - {name: slug, label: Slug}
      - {name: parent, label: Parent category ID, type: number}
      - {name: description, label: Description, type: textarea}
    request:
      method: POST
      path: categories
      body: {name: "{{fields.name}}", slug: "{{fields.slug}}", parent: "{{fields.parent}}", description: "{{fields.description}}"}

  - name: List Tags
    resource: Taxonomy
    description: Lists the tags.
    fields:
      - {name: search, label: Search}
    request: {method: GET, path: tags, query: {search: "{{fields.search}}"}}
    pagination: {type: page, page_param: page, limit_param: per_page, page_size: 100}

  - name: Create Tag
    resource: Taxonomy
    description: Creates a tag.
    fields:
      - {name: name, label: Name, required: true}
      - {name: slug, label: Slug}
    request:
      method: POST
      path: tags
      body: {name: "{{fields.name}}", slug: "{{fields.slug}}"}

  # Users
  - name: Create User
    resource: User
    description: Creates a user.
    fields:
      - {name: username, label: Username, required: true}
      - {name: email, label: Email, required: true}
      - {name: password, label: Password, required: true}
      - {name: name, label: Display name}
      - {name: first_name, label: First name}
      - {name: last_name, label: Last name}
      - {name: roles, label: Roles, description: "Like author or editor"}
    request:
      method: POST
      path: users
      body:
        username: "{{fields.username}}"
        email: "{{fields.email}}"
        password: "{{fields.password}}"
        name: "{{fields.name}}"
        first_name: "{{fields.first_name}}"
        last_name: "{{fields.last_name}}"
        roles: {_each: "{{fields.roles}}", _value: "{{item}}"}

  - name: Get User
    resource: User
    description: Reads a user. "me" is the connected one.
    fields:
      - {name: user, label: User ID, required: true, default: me}
    request: {method: GET, path: "users/{{fields.user}}", query: {context: edit}}

  - name: List Users
    resource: User
    description: Lists the users.
    fields:
      - {name: search, label: Search}
      - {name: roles, label: Roles}
    request: {method: GET, path: users, query: {search: "{{fields.search}}", roles: "{{fields.roles}}", context: edit}}
    pagination: {type: page, page_param: page, limit_param: per_page, page_size: 100}

  - name: Update User
    resource: User
    description: Changes a user. Empty fields stay as they are.
    fields:
      - {name: user, label: User ID, required: true}
      - {name: email, label: Email}
      - {name: name, label: Display name}
      - {name: first_name, label: First name}
      - {name: last_name, label: Last name}
      - {name: password, label: New password}
      - {name: roles, label: Roles}
    request:
      method: POST
      path: "users/{{fields.user}}"
      body:
        email: "{{fields.email}}"
        name: "{{fields.name}}"
        first_name: "{{fields.first_name}}"
        last_name: "{{fields.last_name}}"
        password: "{{fields.password}}"
        roles: {_each: "{{fields.roles}}", _value: "{{item}}"}

  - name: Delete User
    resource: User
    description: Deletes a user, giving their posts to another.
    fields:
      - {name: user, label: User ID, required: true}
      - {name: reassign, label: Give the posts to user ID, type: number, required: true}
    request: {method: DELETE, path: "users/{{fields.user}}", query: {force: true, reassign: "{{fields.reassign}}"}}

  # Comments
  - name: List Comments
    resource: Comment
    description: Lists the comments.
    fields:
      - {name: post, label: Post ID}
      - {name: status, label: Status, type: select, options: [{label: Approved, value: approve}, {label: Waiting, value: hold}, {label: Spam, value: spam}, {label: Trash, value: trash}]}
      - {name: search, label: Search}
    request: {method: GET, path: comments, query: {post: "{{fields.post}}", status: "{{fields.status}}", search: "{{fields.search}}"}}
    pagination: {type: page, page_param: page, limit_param: per_page, page_size: 100}

  - name: Create Comment
    resource: Comment
    description: Writes a comment on a post, as the connected user.
    fields:
      - {name: post, label: Post ID, required: true}
      - {name: content, label: Comment, type: textarea, required: true}
      - {name: parent, label: Replying to comment ID, type: number}
    request:
      method: POST
      path: comments
      body: {post: "{{fields.post}}", content: "{{fields.content}}", parent: "{{fields.parent}}"}

  - name: Update Comment
    resource: Comment
    description: Changes a comment or its status, like approving it.
    fields:
      - {name: comment, label: Comment ID, required: true}
      - {name: content, label: Comment, type: textarea}
      - {name: status, label: Status, type: select, options: [{label: Approved, value: approved}, {label: Waiting, value: hold}, {label: Spam, value: spam}]}
    request:
      method: POST
      path: "comments/{{fields.comment}}"
      body: {content: "{{fields.content}}", status: "{{fields.status}}"}

  - name: Delete Comment
    resource: Comment
    description: Moves a comment to the trash, or deletes it for good.
    fields:
      - {name: comment, label: Comment ID, required: true}
      - {name: force, label: Delete for good, type: boolean, default: false}
    request: {method: DELETE, path: "comments/{{fields.comment}}", query: {force: "{{fields.force}}"}}

i18n:
  pt-BR:
    description: Posts, páginas, mídia, usuários e comentários num site WordPress.
    triggers:
      New Post: {name: Novo post, description: "Inicia o fluxo para cada post publicado, olhando a cada 5 minutos.", fields: {categories: IDs das categorias}}
      New Comment: {name: Novo comentário, description: "Inicia o fluxo para cada comentário novo, olhando a cada 5 minutos.", fields: {status: Status}}
    actions:
      Create Post: {name: Criar post, description: "Escreve um post, como rascunho se outro status não for escolhido.", fields: {title: Título, content: Conteúdo, excerpt: Resumo, status: Status, date: Publicar em, slug: Slug, author: ID do autor, featured_media: ID da imagem destacada, comment_status: Comentários, categories: IDs das categorias, tags: IDs das tags, sticky: Fixado, extra: Mais campos}}
      Get Post: {name: Ler post, description: Lê um post., fields: {post: ID do post}}
      List Posts: {name: Listar posts, description: "Lista os posts, dos mais novos.", fields: {search: Busca, status: Status, categories: IDs das categorias, tags: IDs das tags, author: IDs dos autores, after: Publicado depois de, before: Publicado antes de}}
      Update Post: {name: Atualizar post, description: Altera um post. Campos vazios ficam como estão., fields: {post: ID do post, title: Título, content: Conteúdo, excerpt: Resumo, status: Status, date: Publicar em, slug: Slug, author: ID do autor, featured_media: ID da imagem destacada, comment_status: Comentários, categories: IDs das categorias, tags: IDs das tags, extra: Mais campos}}
      Delete Post: {name: Excluir post, description: "Manda um post para a lixeira, ou exclui de vez.", fields: {post: ID do post, force: Excluir de vez}}
      Create Page: {name: Criar página, description: "Escreve uma página, como rascunho se outro status não for escolhido.", fields: {title: Título, content: Conteúdo, excerpt: Resumo, status: Status, date: Publicar em, slug: Slug, author: ID do autor, featured_media: ID da imagem destacada, comment_status: Comentários, parent: ID da página mãe, template: Modelo, extra: Mais campos}}
      Get Page: {name: Ler página, description: Lê uma página., fields: {page: ID da página}}
      List Pages: {name: Listar páginas, description: Lista as páginas., fields: {search: Busca, status: Status, parent: IDs das páginas mães}}
      Update Page: {name: Atualizar página, description: Altera uma página. Campos vazios ficam como estão., fields: {page: ID da página, title: Título, content: Conteúdo, excerpt: Resumo, status: Status, date: Publicar em, slug: Slug, author: ID do autor, featured_media: ID da imagem destacada, comment_status: Comentários, parent: ID da página mãe, extra: Mais campos}}
      Delete Page: {name: Excluir página, description: "Manda uma página para a lixeira, ou exclui de vez.", fields: {page: ID da página, force: Excluir de vez}}
      Upload Media: {name: Enviar mídia, description: Envia uma imagem ou outro arquivo para a biblioteca de mídia., fields: {file: Arquivo, title: Título, alt_text: Texto alternativo, caption: Legenda}}
      List Media: {name: Listar mídia, description: Lista os arquivos da biblioteca de mídia., fields: {search: Busca, media_type: Tipo}}
      Delete Media: {name: Excluir mídia, description: Exclui um arquivo da biblioteca de mídia., fields: {media: ID da mídia}}
      List Categories: {name: Listar categorias, description: Lista as categorias., fields: {search: Busca}}
      Create Category: {name: Criar categoria, description: Cria uma categoria., fields: {name: Nome, slug: Slug, parent: ID da categoria mãe, description: Descrição}}
      List Tags: {name: Listar tags, description: Lista as tags., fields: {search: Busca}}
      Create Tag: {name: Criar tag, description: Cria uma tag., fields: {name: Nome, slug: Slug}}
      Create User: {name: Criar usuário, description: Cria um usuário., fields: {username: Usuário, email: E-mail, password: Senha, name: Nome de exibição, first_name: Nome, last_name: Sobrenome, roles: Papéis}}
