# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Excel workbooks in OneDrive or SharePoint, through Microsoft Graph v1.0. Connect with
# an app registered in Microsoft Entra ID (Azure), with the delegated permission
# Files.ReadWrite.All.
id: microsoft_excel
name: Microsoft Excel 365
version: 1.0.0
description: Workbooks, worksheets, ranges and tables in Excel 365.
icon: hero-table-cells
logo: |
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><defs><linearGradient id="a" x1="5.822" y1="11.568" x2="20.178" y2="36.432" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#18884f"/><stop offset=".5" stop-color="#117e43"/><stop offset="1" stop-color="#0b6631"/></linearGradient></defs><path d="M29 23l-17-3v22.167A1.833 1.833 0 0 0 13.833 44h29.334A1.833 1.833 0 0 0 45 42.167V34z" fill="#185c37"/><path d="M29 4H13.833A1.833 1.833 0 0 0 12 5.833V14l17 10 9 3 7-3V14z" fill="#21a366"/><path fill="#107c41" d="M12 14h17v10H12z"/><path fill="none" d="M0 0h48v48H0z"/><path d="M24.167 12H12v25h12.167A1.839 1.839 0 0 0 26 35.167V13.833A1.839 1.839 0 0 0 24.167 12z" opacity=".1"/><path d="M23.167 13H12v25h11.167A1.839 1.839 0 0 0 25 36.167V14.833A1.839 1.839 0 0 0 23.167 13z" opacity=".2"/><path d="M23.167 13H12v23h11.167A1.839 1.839 0 0 0 25 34.167V14.833A1.839 1.839 0 0 0 23.167 13z" opacity=".2"/><path d="M22.167 13H12v23h10.167A1.839 1.839 0 0 0 24 34.167V14.833A1.839 1.839 0 0 0 22.167 13z" opacity=".2"/><rect x="2" y="13" width="22" height="22" rx="1.833" fill="url(#a)"/><path d="M7.677 29.958l3.856-5.975L8 18.041h2.842l1.928 3.8c.178.361.3.629.366.806h.025q.19-.432.4-.839l2.061-3.765h2.609l-3.623 5.907 3.715 6.008h-2.776l-2.227-4.171a3.5 3.5 0 0 1-.266-.557h-.033a2.638 2.638 0 0 1-.258.54l-2.293 4.188z" fill="#fff"/><path d="M43.167 4H29v10h16V5.833A1.833 1.833 0 0 0 43.167 4z" fill="#33c481"/><path fill="#107c41" d="M29 24h16v10H29z"/></svg>
category: productivity
author: Heddle
homepage: https://learn.microsoft.com/graph/api/resources/excel
base_url: https://graph.microsoft.com/v1.0/

credential:
  label: Microsoft Excel 365
  auth:
    type: oauth2
    authorize_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
    token_auth: body
    scopes: [offline_access, User.Read, Files.ReadWrite.All]

errors:
  message_path: error.message

triggers:
  - name: New Table Row
    description: Starts the flow for each row added to a table, checking every 5 minutes.
    fields:
      - {name: workbook, label: Workbook, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/root/search(q='.xlsx')", query: {$select: "id,name"}}, path: value, label: name, value: id}}
      - {name: table, label: Table, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/items/{{fields.workbook}}/workbook/tables"}, path: value, label: name, value: id}}
    request: {method: GET, path: "me/drive/items/{{fields.workbook}}/workbook/tables/{{fields.table}}/rows"}
    output:
      path: value
    poll:
      every: 5
      id: index

actions:
  # Workbooks
  - name: Get Workbooks
    resource: Workbook
    description: Lists the Excel workbooks in the drive.
    request: {method: GET, path: "me/drive/root/search(q='.xlsx')"}
    pagination: {type: link, items_path: value, next_path: "@odata.nextLink"}

  - name: Add Worksheet
    resource: Workbook
    description: Adds a worksheet to a workbook.
    fields:
      - {name: workbook, label: Workbook, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/root/search(q='.xlsx')", query: {$select: "id,name"}}, path: value, label: name, value: id}}
      - {name: name, label: Name, description: "Excel names it when empty."}
    request:
      method: POST
      path: "me/drive/items/{{fields.workbook}}/workbook/worksheets/add"
      body: {name: "{{fields.name}}"}

  - name: Delete Workbook
    resource: Workbook
    description: Deletes a workbook, to the recycle bin.
    fields:
      - {name: workbook, label: Workbook, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/root/search(q='.xlsx')", query: {$select: "id,name"}}, path: value, label: name, value: id}}
    request: {method: DELETE, path: "me/drive/items/{{fields.workbook}}"}
    output:
      value: {deleted: true}

  # Worksheets
  - name: Get Worksheets
    resource: Worksheet
    description: Lists the worksheets of a workbook.
    fields:
      - {name: workbook, label: Workbook, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/root/search(q='.xlsx')", query: {$select: "id,name"}}, path: value, label: name, value: id}}
    request: {method: GET, path: "me/drive/items/{{fields.workbook}}/workbook/worksheets"}
    output:
      path: value

  - name: Read Rows
    resource: Worksheet
    description: Reads every used cell of a worksheet, as rows.
    fields:
      - {name: workbook, label: Workbook, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/root/search(q='.xlsx')", query: {$select: "id,name"}}, path: value, label: name, value: id}}
      - {name: worksheet, label: Worksheet, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/items/{{fields.workbook}}/workbook/worksheets"}, path: value, label: name, value: id}}
    request: {method: GET, path: "me/drive/items/{{fields.workbook}}/workbook/worksheets/{{fields.worksheet}}/usedRange(valuesOnly=true)", query: {$select: "address,values,text,rowCount,columnCount"}}

  - name: Read Range
    resource: Worksheet
    description: Reads the values of a range.
    fields:
      - {name: workbook, label: Workbook, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/root/search(q='.xlsx')", query: {$select: "id,name"}}, path: value, label: name, value: id}}
      - {name: worksheet, label: Worksheet, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/items/{{fields.workbook}}/workbook/worksheets"}, path: value, label: name, value: id}}
      - {name: address, label: Range, required: true, description: Like A1:D20.}
    request: {method: GET, path: "me/drive/items/{{fields.workbook}}/workbook/worksheets/{{fields.worksheet}}/range(address='{{fields.address}}')", query: {$select: "address,values,text,rowCount,columnCount"}}

  - name: Update Range
    resource: Worksheet
    description: Writes values into a range, as rows of cells.
    fields:
      - {name: workbook, label: Workbook, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/root/search(q='.xlsx')", query: {$select: "id,name"}}, path: value, label: name, value: id}}
      - {name: worksheet, label: Worksheet, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/items/{{fields.workbook}}/workbook/worksheets"}, path: value, label: name, value: id}}
      - {name: address, label: Range, required: true, description: "Like A2:C3. The values must fill it."}
      - {name: values, label: Values, type: json, required: true, description: "Rows of cells, like [[\"Ana\", 30, true], [\"Bia\", 25, false]]."}
    request:
      method: PATCH
      path: "me/drive/items/{{fields.workbook}}/workbook/worksheets/{{fields.worksheet}}/range(address='{{fields.address}}')"
      body: {values: "{{fields.values}}"}

  - name: Clear Range
    resource: Worksheet
    description: Clears the values, the formats or both of a range.
    fields:
      - {name: workbook, label: Workbook, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/root/search(q='.xlsx')", query: {$select: "id,name"}}, path: value, label: name, value: id}}
      - {name: worksheet, label: Worksheet, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/items/{{fields.workbook}}/workbook/worksheets"}, path: value, label: name, value: id}}
      - {name: address, label: Range, required: true, description: Like A2:C30.}
      - {name: apply_to, label: Clear, type: select, default: All, options: [{label: Everything, value: All}, {label: Values, value: Contents}, {label: Formats, value: Formats}]}
    request:
      method: POST
      path: "me/drive/items/{{fields.workbook}}/workbook/worksheets/{{fields.worksheet}}/range(address='{{fields.address}}')/clear"
      body: {applyTo: "{{fields.apply_to}}"}
    output:
      value: {cleared: true}

  - name: Delete Worksheet
    resource: Worksheet
    description: Deletes a worksheet.
    fields:
      - {name: workbook, label: Workbook, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/root/search(q='.xlsx')", query: {$select: "id,name"}}, path: value, label: name, value: id}}
      - {name: worksheet, label: Worksheet, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/items/{{fields.workbook}}/workbook/worksheets"}, path: value, label: name, value: id}}
    request: {method: DELETE, path: "me/drive/items/{{fields.workbook}}/workbook/worksheets/{{fields.worksheet}}"}
    output:
      value: {deleted: true}

  # Tables
  - name: Add Table
    resource: Table
    description: Turns a range into a table.
    fields:
      - {name: workbook, label: Workbook, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/root/search(q='.xlsx')", query: {$select: "id,name"}}, path: value, label: name, value: id}}
      - {name: address, label: Range, required: true, description: "With the sheet, like Sheet1!A1:D1."}
      - {name: has_headers, label: First row is the header, type: boolean, default: true}
    request:
      method: POST
      path: "me/drive/items/{{fields.workbook}}/workbook/tables/add"
      body: {address: "{{fields.address}}", hasHeaders: "{{fields.has_headers}}"}

  - name: Append Rows
    resource: Table
    description: Adds rows at the end of a table.
    fields:
      - {name: workbook, label: Workbook, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/root/search(q='.xlsx')", query: {$select: "id,name"}}, path: value, label: name, value: id}}
      - {name: table, label: Table, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/items/{{fields.workbook}}/workbook/tables"}, path: value, label: name, value: id}}
      - {name: values, label: Rows, type: json, required: true, description: "Rows of cells, in the order of the columns, like [[\"Ana\", 30], [\"Bia\", 25]]."}
    request:
      method: POST
      path: "me/drive/items/{{fields.workbook}}/workbook/tables/{{fields.table}}/rows/add"
      body: {values: "{{fields.values}}"}

  - name: Get Rows
    resource: Table
    description: Lists the rows of a table.
    fields:
      - {name: workbook, label: Workbook, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/root/search(q='.xlsx')", query: {$select: "id,name"}}, path: value, label: name, value: id}}
      - {name: table, label: Table, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/items/{{fields.workbook}}/workbook/tables"}, path: value, label: name, value: id}}
    request: {method: GET, path: "me/drive/items/{{fields.workbook}}/workbook/tables/{{fields.table}}/rows"}
    output:
      path: value

  - name: Get Columns
    resource: Table
    description: Lists the columns of a table, with their values.
    fields:
      - {name: workbook, label: Workbook, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/root/search(q='.xlsx')", query: {$select: "id,name"}}, path: value, label: name, value: id}}
      - {name: table, label: Table, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/items/{{fields.workbook}}/workbook/tables"}, path: value, label: name, value: id}}
    request: {method: GET, path: "me/drive/items/{{fields.workbook}}/workbook/tables/{{fields.table}}/columns"}
    output:
      path: value

  - name: Convert Table to Range
    resource: Table
    description: Turns a table back into a plain range, keeping its values.
    fields:
      - {name: workbook, label: Workbook, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/root/search(q='.xlsx')", query: {$select: "id,name"}}, path: value, label: name, value: id}}
      - {name: table, label: Table, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/items/{{fields.workbook}}/workbook/tables"}, path: value, label: name, value: id}}
    request: {method: POST, path: "me/drive/items/{{fields.workbook}}/workbook/tables/{{fields.table}}/convertToRange"}

  - name: Delete Table
    resource: Table
    description: Deletes a table and its values.
    fields:
      - {name: workbook, label: Workbook, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/root/search(q='.xlsx')", query: {$select: "id,name"}}, path: value, label: name, value: id}}
      - {name: table, label: Table, type: select, required: true, options_from: {request: {method: GET, path: "me/drive/items/{{fields.workbook}}/workbook/tables"}, path: value, label: name, value: id}}
    request: {method: DELETE, path: "me/drive/items/{{fields.workbook}}/workbook/tables/{{fields.table}}"}
    output:
      value: {deleted: true}

i18n:
  pt-BR:
    description: Pastas de trabalho, planilhas, intervalos e tabelas no Excel 365.
    triggers:
      New Table Row: {name: Nova linha na tabela, description: "Inicia o fluxo para cada linha adicionada a uma tabela, olhando a cada 5 minutos.", fields: {workbook: Pasta de trabalho, table: Tabela}}
    actions:
      Get Workbooks: {name: Listar pastas de trabalho, description: Lista as pastas de trabalho do Excel no drive.}
      Add Worksheet: {name: Adicionar planilha, description: Adiciona uma planilha a uma pasta de trabalho., fields: {workbook: Pasta de trabalho, name: Nome}}
      Delete Workbook: {name: Excluir pasta de trabalho, description: "Exclui uma pasta de trabalho, para a lixeira.", fields: {workbook: Pasta de trabalho}}
      Get Worksheets: {name: Listar planilhas, description: Lista as planilhas de uma pasta de trabalho., fields: {workbook: Pasta de trabalho}}
      Read Rows: {name: Ler linhas, description: "Lê todas as células usadas de uma planilha, como linhas.", fields: {workbook: Pasta de trabalho, worksheet: Planilha}}
      Read Range: {name: Ler intervalo, description: Lê os valores de um intervalo., fields: {workbook: Pasta de trabalho, worksheet: Planilha, address: Intervalo}}
      Update Range: {name: Atualizar intervalo, description: "Escreve valores num intervalo, como linhas de células.", fields: {workbook: Pasta de trabalho, worksheet: Planilha, address: Intervalo, values: Valores}}
      Clear Range: {name: Limpar intervalo, description: "Limpa os valores, os formatos ou os dois de um intervalo.", fields: {workbook: Pasta de trabalho, worksheet: Planilha, address: Intervalo, apply_to: Limpar}}
      Delete Worksheet: {name: Excluir planilha, description: Exclui uma planilha., fields: {workbook: Pasta de trabalho, worksheet: Planilha}}
      Add Table: {name: Criar tabela, description: Transforma um intervalo numa tabela., fields: {workbook: Pasta de trabalho, address: Intervalo, has_headers: Primeira linha é o cabeçalho}}
      Append Rows: {name: Adicionar linhas, description: Adiciona linhas no fim de uma tabela., fields: {workbook: Pasta de trabalho, table: Tabela, values: Linhas}}
      Get Rows: {name: Listar linhas, description: Lista as linhas de uma tabela., fields: {workbook: Pasta de trabalho, table: Tabela}}
      Get Columns: {name: Listar colunas, description: "Lista as colunas de uma tabela, com os valores.", fields: {workbook: Pasta de trabalho, table: Tabela}}
      Convert Table to Range: {name: Converter tabela em intervalo, description: "Volta uma tabela a um intervalo comum, mantendo os valores.", fields: {workbook: Pasta de trabalho, table: Tabela}}
      Delete Table: {name: Excluir tabela, description: Exclui uma tabela e os valores dela., fields: {workbook: Pasta de trabalho, table: Tabela}}
