category: data
base_url: https://gateway.apiserpro.serpro.gov.br/

credential:
  label: Serpro
  fields:
    - {name: consumer_key, label: Consumer Key, required: true, description: "From cliente.serpro.gov.br, in the contract's credentials."}
    - {name: consumer_secret, label: Consumer Secret, secret: true, required: true}
  auth:
    type: client_credentials
    token_url: https://gateway.apiserpro.serpro.gov.br/token
    client_id: "{{credential.consumer_key}}"
    client_secret: "{{credential.consumer_secret}}"

errors:
  message_path: message

actions:
  - name: Consult CPF
    resource: CPF
    description: Reads a person's record at the Receita Federal, with name, status, birth date and death year.
    fields:
      - {name: cpf, label: CPF, required: true, description: "11 digits, without dots or dash."}
    request: {method: GET, path: "consulta-cpf-df/v2/cpf/{{fields.cpf}}"}

  - name: Consult CNPJ
    resource: CNPJ
    description: Reads a company's basic record at the Receita Federal, with name, status, address and activities.
    fields:
      - {name: cnpj, label: CNPJ, required: true, description: "14 digits, without dots, slash or dash."}
    request: {method: GET, path: "consulta-cnpj-df/v2/basica/{{fields.cnpj}}"}

  - name: Consult CNPJ With Partners
    resource: CNPJ
    description: Reads a company's record with its partners and administrators (QSA), their CPFs masked.
    fields:
      - {name: cnpj, label: CNPJ, required: true, description: "14 digits."}
    request: {method: GET, path: "consulta-cnpj-df/v2/qsa/{{fields.cnpj}}"}

  - name: Consult Company
    resource: CNPJ
    description: Reads a company's full record, with partners and their CPFs, for contracts that allow it.
    fields:
      - {name: cnpj, label: CNPJ, required: true, description: "14 digits."}
    request: {method: GET, path: "consulta-cnpj-df/v2/empresa/{{fields.cnpj}}"}

  - name: Consult NF-e
    resource: NF-e
    description: Reads an NF-e as the Receita Federal keeps it, with issuer, recipient, items, taxes and events.
    fields:
      - {name: key, label: Access key, required: true, description: "The 44 digits of the NF-e's key."}
    request: {method: GET, path: "consulta-nfe-df/api/v1/nfe/{{fields.key}}"}

i18n:
  pt-BR:
    description: "Consulte CPF, CNPJ e NF-e na Receita Federal pelas APIs oficiais do Serpro."
    actions:
      Consult CPF: {name: "Consultar CPF", description: "Lê o cadastro de uma pessoa na Receita Federal, com nome, situação, data de nascimento e ano de óbito.", fields: {cpf: "CPF"}}
      Consult CNPJ: {name: "Consultar CNPJ", description: "Lê o cadastro básico de uma empresa na Receita Federal, com razão social, situação, endereço e atividades.", fields: {cnpj: "CNPJ"}}
      Consult CNPJ With Partners: {name: "Consultar CNPJ com sócios", description: "Lê o cadastro de uma empresa com o quadro de sócios e administradores (QSA), com CPFs mascarados.", fields: {cnpj: "CNPJ"}}
      Consult Company: {name: "Consultar empresa", description: "Lê o cadastro completo de uma empresa, com sócios e seus CPFs, nos contratos que permitem.", fields: {cnpj: "CNPJ"}}
      Consult NF-e: {name: "Consultar NF-e", description: "Lê uma NF-e como a Receita Federal guarda, com emitente, destinatário, itens, impostos e eventos.", fields: {key: "Chave de acesso"}}
