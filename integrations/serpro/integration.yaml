#
# Serpro's APIs on its gateway, with the Consumer Key and Consumer Secret of the
# contract in Área do Cliente; the token comes by client credentials. Each query is
# billed by Serpro. CPF and CNPJ go as digits only.
id: serpro
name: Serpro
version: 1.0.0
homepage: https://apicenter.estaleiro.serpro.gov.br/documentacao/
description: Query the Receita Federal's CPF and CNPJ records and NF-e invoices through Serpro's official APIs.
