# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Octadesk, the help desk and WhatsApp chat. Octadesk's support gives out the API key
# and the API address of the account (like https://o123456-abc.api002.octadesk.services);
# every request also names the agent's email in octa-agent-email. Lists answer a plain
# array, take page and limit (up to 100), filter with filters[n][property|operator|value]
# and order with sort[property] and sort[direction].
id: octadesk
name: Octadesk
version: 1.0.0
homepage: https://developers.octadesk.com/reference
description: Create and read tickets and contacts, list and answer chats, transfer and close them, and send WhatsApp templates, and start flows on new tickets and chats, in Octadesk.
icon: hero-chat-bubble-left-right
logo: |-
