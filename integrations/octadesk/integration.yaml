82 14.986 11.6982 13.3654C11.6982 9.50798 15.1159 6.4767 18.7872 6.4767C22.4584 6.4767 25.8761 9.50798 25.8761 13.3654C25.8761 14.986 25.1356 16.2491 24.4568 17.2625C23.9384 17.9911 23.5547 18.6187 23.5917 19.6163C23.7229 21.356 24.9191 22.3183 26.4652 22.5022C26.9465 22.5862 27.613 22.559 28.0473 22.4795C28.9224 22.2718 29.8033 22.8029 30.0366 23.6802C30.2756 24.5791 29.7572 25.5289 28.8697 25.7707" fill="white"/> <path d="M16.6935 12.7607C15.9553 12.7607 15.3685 13.2782 15.3685 14.3961C15.3685 15.5139 15.9654 15.7954 16.7036 15.7954C17.4419 15.7954 18.0388 15.5139 18.0388 14.3961C18.0388 13.2782 17.4329 12.7607 16.6946 12.7607" fill="white"/> <path d="M20.8571 12.7607C20.1188 12.7607 19.532 13.2782 19.532 14.3961C19.532 15.5139 20.1289 15.7954 20.8672 15.7954C21.6055 15.7954 22.2024 15.5139 22.2024 14.3961C22.2024 13.2782 21.5965 12.7607 20.8583 12.7607" fill="white"/> </g> <defs> <clipPath id="clip0_2143_467"> <rect width="176" height="38" fill="white"/> </clipPath> </defs></svg></svg>
category: support
base_url: "{{credential.url}}/"
headers:
  User-Agent: Heddle/1.0
  octa-agent-email: "{{credential.agent_email}}"

credential:
  label: Octadesk
  fields:
    - {name: url, label: API address, required: true, description: "The account's API address from Octadesk, like https://o123456-abc.api002.octadesk.services"}
    - {name: api_key, label: API key, secret: true, required: true}
    - {name: agent_email, label: Agent email, required: true, description: The email of the agent the API key belongs to.}
  auth:
    type: header
    name: X-API-KEY
    value: "{{credential.api_key}}"

errors:
  message_path: message

triggers:
  - name: New Ticket
    description: Starts the flow for each new ticket, checking every 5 minutes.
    request:
      method: GET
      path: tickets
      query: {"sort[property]": number, "sort[direction]": desc, limit: 50}
    poll: {every: 5, id: id}

  - name: New Chat
    description: Starts the flow for each new chat, checking every 5 minutes.
    request:
      method: GET
      path: chat
      query: {"sort[property]": createdAt, "sort[direction]": desc, limit: 50}
    poll: {every: 5, id: id}

actions:
  # Tickets
  - name: Create Ticket
    resource: Ticket
    description: Opens a ticket for a requester.
    fields:
      - {name: summary, label: Summary, required: true}
      - {name: description, label: Description, type: textarea, required: true}
      - {name: requester_email, label: Requester email, required: true}
      - {name: requester_name, label: Requester name}
      - {name: status_id, label: Status ID, description: From List Ticket Statuses.}
      - {name: type_id, label: Type ID, description: From List Ticket Types.}
      - {name: priority_id, label: Priority ID, description: From List Ticket Priorities.}
      - {name: group_id, label: Group ID, description: From List Ticket Groups.}
      - {name: assigned_email, label: Agent email, description: The agent to assign the ticket to.}
      - {name: tags, label: Tags, type: json, description: "A list of tag names, like [\"billing\"]"}
      - {name: custom_fields, label: Custom fields, type: json, description: "Like [{\"key\": \"plan\", \"value\": \"pro\"}]"}
    request:
      method: POST
      path: tickets
      body:
        summary: "{{fields.summary}}"
        description: "{{fields.description}}"
        requester: {email: "{{fields.requester_email}}", name: "{{fields.requester_name}}"}
        status: {_if: "{{fields.status_id}}", id: "{{fields.status_id}}"}
        type: {_if: "{{fields.type_id}}", id: "{{fields.type_id}}"}
        priority: {_if: "{{fields.priority_id}}", id: "{{fields.priority_id}}"}
        group: {_if: "{{fields.group_id}}", id: "{{fields.group_id}}"}
        assigned: {_if: "{{fields.assigned_email}}", email: "{{fields.assigned_email}}"}
        tags: "{{fields.tags}}"
        customField: "{{fields.custom_fields}}"

  - name: Get Ticket
    resource: Ticket
    description: Reads a ticket by its number.
    fields:
      - {name: number, label: Ticket number, type: number, required: true}
    request: {method: GET, path: "tickets/{{fields.number}}"}

  - name: List Tickets
    resource: Ticket
    description: Lists tickets, filtered by one property if you like.
    fields:
      - {name: filter_property, label: Filter by, description: "A ticket property, like status.name or requester.email"}
      - {name: filter_operator, label: Operator, type: select, description: Needed with Filter by., options: [{label: Equal, value: eq}, {label: Not equal, value: ne}, {label: Less than, value: lt}, {label: Greater than, value: gt}, {label: Less or equal, value: le}, {label: Greater or equal, value: ge}]}
      - {name: filter_value, label: Value}
      - {name: sort, label: Order by, default: number}
      - {name: direction, label: Direction, type: select, default: desc, options: [{label: Ascending, value: asc}, {label: Descending, value: desc}]}
      - {name: page, label: Page, type: number, default: 1}
      - {name: limit, label: Limit, type: number, default: 50}
    request:
      method: GET
      path: tickets
      query:
        "filters[0][property]": "{{fields.filter_property}}"
        "filters[0][operator]": "{{fields.filter_operator}}"
        "filters[0][value]": "{{fields.filter_value}}"
        "sort[property]": "{{fields.sort}}"
        "sort[direction]": "{{fields.direction}}"
        page: "{{fields.page}}"
        limit: "{{fields.limit}}"

  - name: List Ticket Interactions
    resource: Ticket
    description: Lists a ticket's interactions, its replies and changes.
    fields:
      - {name: number, label: Ticket number, type: number, required: true}
      - {name: handlers, label: Only handler interactions, type: boolean}
    request: {method: GET, path: "tickets/{{fields.number}}/interactions", query: {handlers: "{{fields.handlers}}"}}

  - name: List Ticket Statuses
    resource: Ticket
    description: Lists the ticket statuses.
    request: {method: GET, path: tickets/status}

  - name: List Ticket Types
    resource: Ticket
    description: Lists the ticket types.
    request: {method: GET, path: tickets/types}

  - name: List Ticket Priorities
    resource: Ticket
    description: Lists the ticket priorities.
    request: {method: GET, path: tickets/priorities}

  - name: List Ticket Groups
    resource: Ticket
    description: Lists the agent groups tickets go to.
    request: {method: GET, path: tickets/groups}

  - name: List Ticket Tags
    resource: Ticket
    description: Lists the ticket tags.
    request: {method: GET, path: tickets/tags}

  - name: List Ticket Channels
    resource: Ticket
    description: Lists the channels tickets come from.
    request: {method: GET, path: tickets/channels}

  # Contacts
  - name: Create Contact
    resource: Contact
    description: Creates a contact.
    fields:
      - {name: name, label: Name, required: true}
      - {name: email, label: Email, required: true}
      - {name: phone, label: Phone, description: "With the area code, like 11999999999"}
      - {name: country_code, label: Country code, default: "55"}
      - {name: custom_fields, label: Custom fields, type: json, description: "Like [{\"key\": \"plan\", \"value\": \"pro\"}]"}
    request:
      method: POST
      path: contacts
      body:
        name: "{{fields.name}}"
        email: "{{fields.email}}"
        phoneContacts: [{_if: "{{fields.phone}}", number: "{{fields.phone}}", countryCode: "{{fields.country_code}}"}]
        customFields: "{{fields.custom_fields}}"

  - name: Get Contact
    resource: Contact
    description: Reads a contact.
    fields:
      - {name: id, label: Contact ID, required: true}
    request: {method: GET, path: "contacts/{{fields.id}}"}

  - name: Update Contact
    resource: Contact
    description: Changes a contact's name, email, phone or custom fields.
    fields:
      - {name: id, label: Contact ID, required: true}
      - {name: name, label: Name, required: true}
      - {name: email, label: Email, required: true}
      - {name: phone, label: Phone, description: "With the area code, like 11999999999"}
      - {name: country_code, label: Country code, default: "55"}
      - {name: custom_fields, label: Custom fields, type: json, description: "Like [{\"key\": \"plan\", \"value\": \"pro\"}]"}
    request:
      method: PUT
      path: "contacts/{{fields.id}}"
      body:
        name: "{{fields.name}}"
        email: "{{fields.email}}"
        phoneContacts: [{_if: "{{fields.phone}}", number: "{{fields.phone}}", countryCode: "{{fields.country_code}}"}]
        customFields: "{{fields.custom_fields}}"

  - name: List Contacts
    resource: Contact
    description: Lists contacts, filtered by one property if you like.
    fields:
      - {name: filter_property, label: Filter by, description: "A contact property, like name or email"}
      - {name: filter_operator, label: Operator, type: select, description: Needed with Filter by., options: [{label: Equal, value: eq}, {label: Not equal, value: ne}, {label: Less than, value: lt}, {label: Greater than, value: gt}, {label: Less or equal, value: le}, {label: Greater or equal, value: ge}]}
      - {name: filter_value, label: Value}
      - {name: page, label: Page, type: number, default: 1}
      - {name: limit, label: Limit, type: number, default: 50}
    request:
      method: GET
      path: contacts
      query:
        "filters[0][property]": "{{fields.filter_property}}"
        "filters[0][operator]": "{{fields.filter_operator}}"
        "filters[0][value]": "{{fields.filter_value}}"
        page: "{{fields.page}}"
        limit: "{{fields.limit}}"

  - name: List Organizations
    resource: Contact
    description: Lists the organizations contacts belong to.
    fields:
      - {name: page, label: Page, type: number, default: 1}
      - {name: limit, label: Limit, type: number, default: 50}
    request: {method: GET, path: organizations, query: {page: "{{fields.page}}", limit: "{{fields.limit}}"}}

  # Chat
  - name: List Chats
    resource: Chat
    description: Lists chats, filtered by one property if you like.
    fields:
      - {name: filter_property, label: Filter by, description: "A chat property, like status or channel"}
      - {name: filter_operator, label: Operator, type: select, description: Needed with Filter by., options: [{label: Equal, value: eq}, {label: Not equal, value: ne}, {label: Less than, value: lt}, {label: Greater than, value: gt}, {label: Less or equal, value: le}, {label: Greater or equal, value: ge}]}
      - {name: filter_value, label: Value}
      - {name: page, label: Page, type: number, default: 1}
      - {name: limit, label: Limit, type: number, default: 50}
    request:
      method: GET
      path: chat
      query:
        "filters[0][property]": "{{fields.filter_property}}"
        "filters[0][operator]": "{{fields.filter_operator}}"
        "filters[0][value]": "{{fields.filter_value}}"
        "sort[property]": createdAt
        "sort[direction]": desc
        page: "{{fields.page}}"
        limit: "{{fields.limit}}"

  - name: Get Chat
    resource: Chat
    description: Reads a chat.
    fields:
      - {name: id, label: Chat ID, required: true}
    request: {method: GET, path: "chat/{{fields.id}}", query: {property: createdAt, direction: desc}}

  - name: List Chat Messages
    resource: Chat
    description: Lists the messages of a chat, newest first.
    fields:
      - {name: id, label: Chat ID, required: true}
      - {name: page, label: Page, type: number, default: 1}
      - {name: limit, label: Limit, type: number, default: 50}
    request: {method: GET, path: "chat/{{fields.id}}/messages", query: {property: time, direction: desc, page: "{{fields.page}}", limit: "{{fields.limit}}"}}

  - name: Send Chat Message
    resource: Chat
    description: Sends a message in a chat, to the contact or as an internal note.
    fields:
      - {name: id, label: Chat ID, required: true}
      - {name: body, label: Message, type: textarea, required: true}
      - {name: type, label: Kind, type: select, default: public, options: [{label: To the contact, value: public}, {label: Internal note, value: internal}]}
      - {name: channel, label: Channel, type: select, required: true, default: whatsapp, options: [{label: WhatsApp, value: whatsapp}, {label: Web, value: web}, {label: Messenger, value: facebook-messenger}, {label: Instagram, value: instagram}, {label: Email, value: email}, {label: Widget, value: widget}]}
    request:
      method: POST
      path: "chat/{{fields.id}}/messages"
      body: {chatId: "{{fields.id}}", type: "{{fields.type}}", body: "{{fields.body}}", channel: "{{fields.channel}}"}

  - name: Close Chat
    resource: Chat
    description: Closes a chat.
    fields:
      - {name: id, label: Chat ID, required: true}
    request: {method: PUT, path: "chat/{{fields.id}}/close"}

  - name: Transfer Chat to Agent
    resource: Chat
    description: Hands a chat to an agent.
    fields:
      - {name: id, label: Chat ID, required: true}
      - {name: agent_id, label: Agent ID, required: true}
    request: {method: PUT, path: "chat/{{fields.id}}/agent/{{fields.agent_id}}"}

  - name: Transfer Chat to Group
    resource: Chat
    description: Hands a chat to a group of agents.
    fields:
      - {name: id, label: Chat ID, required: true}
      - {name: group_id, label: Group ID, required: true}
    request: {method: PUT, path: "chat/{{fields.id}}/group/{{fields.group_id}}"}

  - name: Tag Chat
    resource: Chat
    description: Sets a chat's tags.
    fields:
      - {name: id, label: Chat ID, required: true}
      - {name: tags, label: Tags, type: json, required: true, description: "Like [{\"id\": \"…\", \"name\": \"vip\"}]"}
    request: {method: POST, path: "chat/{{fields.id}}/tags", body: {tags: "{{fields.tags}}"}}

  - name: List Template Messages
    resource: Chat
    description: Lists the WhatsApp template messages.
    fields:
      - {name: page, label: Page, type: number, default: 1}
      - {name: limit, label: Limit, type: number, default: 50}
    request: {method: GET, path: chat/templates-message, query: {page: "{{fields.page}}", limit: "{{fields.limit}}"}}

  - name: Send Template Message
    resource: Chat
    description: Sends a WhatsApp template to a phone, opening a chat.
    fields:
      - {name: to, label: To, required: true, description: "The contact's phone, like +5511999999999"}
      - {name: from, label: From, required: true, description: "The account's WhatsApp number, like +5511999999999"}
      - {name: template_id, label: Template ID, description: From List Template Messages.}
      - {name: template_code, label: Template code, description: "The template's name at WhatsApp, if you don't give the ID."}
      - {name: variables, label: Variables, type: json, description: "The template's variables, like [{\"key\": \"name\", \"value\": \"Ana\"}]"}
      - {name: assign, label: Assign automatically, type: boolean, default: true}
    request:
      method: POST
      path: chat/conversation/send-template
      body:
        target: {contact: {phoneContact: {number: "{{fields.to}}"}, customFields: "{{fields.variables}}"}}
        content: {templateMessage: {id: "{{fields.template_id}}", code: "{{fields.template_code}}"}}
        origin: {from: {number: "{{fields.from}}"}}
        options: {automaticAssign: "{{fields.assign}}"}

