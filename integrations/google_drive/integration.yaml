# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Google Drive, through the Drive API v3. Connect with an OAuth client from Google
# Cloud, with the Drive API turned on and the scope .../auth/drive. Shared drives work
# everywhere, as long as the account can see them.
id: google_drive
name: Google Drive
version: 1.0.0
description: Files, folders and shared drives in Google Drive.
icon: hero-cloud
logo: |
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 229"><g><path d="M19.3542312,196.033928 L30.644172,215.534816 C32.9900287,219.64014 36.3622164,222.86588 40.3210929,225.211737 C51.6602421,210.818376 59.5534225,199.772864 64.000634,192.075201 C68.5137119,184.263529 74.0609657,172.045039 80.6423954,155.41973 C62.9064315,153.085282 49.4659974,151.918058 40.3210929,151.918058 C31.545465,151.918058 18.1051007,153.085282 0,155.41973 C0,159.964996 1.17298825,164.510261 3.51893479,168.615586 L19.3542312,196.033928 Z" fill="#0066DA"></path><path d="M215.681443,225.211737 C219.64032,222.86588 223.012507,219.64014 225.358364,215.534816 L230.050377,207.470615 L252.483511,168.615586 C254.829368,164.510261 256.002446,159.964996 256.002446,155.41973 C237.79254,153.085282 224.376613,151.918058 215.754667,151.918058 C206.488712,151.918058 193.072785,153.085282 175.506888,155.41973 C182.010479,172.136093 187.484394,184.354584 191.928633,192.075201 C196.412073,199.863919 204.329677,210.909431 215.681443,225.211737 Z" fill="#EA4335"></path><path d="M128.001268,73.3111515 C141.121182,57.4655263 150.162898,45.2470011 155.126415,36.6555757 C159.123121,29.7376196 163.521739,18.6920726 168.322271,3.51893479 C164.363395,1.1729583 159.818129,0 155.126415,0 L100.876121,0 C96.1841079,0 91.638842,1.31958557 87.6799655,3.51893479 C93.7861943,20.9210065 98.9675428,33.3058067 103.224011,40.6733354 C107.927832,48.8151881 116.186918,59.6944602 128.001268,73.3111515 Z" fill="#00832D"></path><path d="M175.360141,155.41973 L80.6420959,155.41973 L40.3210929,225.211737 C44.2799694,227.557893 48.8252352,228.730672 53.5172481,228.730672 L202.485288,228.730672 C207.177301,228.730672 211.722567,227.411146 215.681443,225.211737 L175.360141,155.41973 Z" fill="#2684FC"></path><path d="M128.001268,73.3111515 L87.680265,3.51893479 C83.7213885,5.86488134 80.3489013,9.09044179 78.0030446,13.1960654 L3.51893479,142.223575 C1.17298825,146.329198 0,150.874464 0,155.41973 L80.6423954,155.41973 L128.001268,73.3111515 Z" fill="#00AC47"></path><path d="M215.241501,77.7099697 L177.999492,13.1960654 C175.653635,9.09044179 172.281148,5.86488134 168.322271,3.51893479 L128.001268,73.3111515 L175.360141,155.41973 L255.855999,155.41973 C255.855999,150.874464 254.682921,146.329198 252.337064,142.223575 L215.241501,77.7099697 Z" fill="#FFBA00"></path></g></svg>
category: files
author: Heddle
homepage: https://developers.google.com/drive/api/reference/rest/v3
base_url: https://www.googleapis.com/

credential:
  label: Google Drive
  auth:
    type: oauth2
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes: [https://www.googleapis.com/auth/drive]
    authorize_params: {access_type: offline, prompt: consent}

errors:
  message_path: error.message

triggers:
  - name: New File
    description: Starts the flow for each new file in a folder, checking every 5 minutes.
    fields:
      - {name: folder, label: Folder, type: select, required: true, default: root, description: "The top of My Drive when left as is.", options_from: {request: {method: GET, path: drive/v3/files, query: {q: "mimeType = 'application/vnd.google-apps.folder' and trashed = false", pageSize: 200, fields: "files(id,name)", orderBy: name, supportsAllDrives: true, includeItemsFromAllDrives: true}}, path: files, label: name, value: id}}
    request:
      method: GET
      path: drive/v3/files
      query:
        q: "'{{fields.folder}}' in parents and mimeType != 'application/vnd.google-apps.folder' and trashed = false"
        orderBy: createdTime desc
        pageSize: 100
        fields: "files(id,name,mimeType,parents,size,createdTime,modifiedTime,webViewLink,owners)"
        supportsAllDrives: true
        includeItemsFromAllDrives: true
    output:
      path: files
    poll:
      every: 5
      id: id

  - name: New Folder
    description: Starts the flow for each new folder inside a folder, checking every 5 minutes.
    fields:
      - {name: folder, label: Folder, type: select, required: true, default: root, description: "The top of My Drive when left as is.", options_from: {request: {method: GET, path: drive/v3/files, query: {q: "mimeType = 'application/vnd.google-apps.folder' and trashed = false", pageSize: 200, fields: "files(id,name)", orderBy: name, supportsAllDrives: true, includeItemsFromAllDrives: true}}, path: files, label: name, value: id}}
    request:
      method: GET
      path: drive/v3/files
      query:
        q: "'{{fields.folder}}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false"
        orderBy: createdTime desc
        pageSize: 100
        fields: "files(id,name,mimeType,parents,createdTime,modifiedTime,webViewLink)"
        supportsAllDrives: true
        includeItemsFromAllDrives: true
    output:
      path: files
    poll:
      every: 5
      id: id

  - name: File Changed
    description: Starts the flow when a file in a folder is created or changed, checking every 5 minutes.
    fields:
      - {name: folder, label: Folder, type: select, required: true, default: root, description: "The top of My Drive when left as is.", options_from: {request: {method: GET, path: drive/v3/files, query: {q: "mimeType = 'application/vnd.google-apps.folder' and trashed = false", pageSize: 200, fields: "files(id,name)", orderBy: name, supportsAllDrives: true, includeItemsFromAllDrives: true}}, path: files, label: name, value: id}}
    request:
      method: GET
      path: drive/v3/files
      query:
        q: "'{{fields.folder}}' in parents and mimeType != 'application/vnd.google-apps.folder' and trashed = false"
        orderBy: modifiedTime desc
        pageSize: 100
        fields: "files(id,name,mimeType,parents,size,version,createdTime,modifiedTime,webViewLink,lastModifyingUser)"
        supportsAllDrives: true
        includeItemsFromAllDrives: true
    output:
      path: files
    poll:
      every: 5
      id: modifiedTime

actions:
  # Files
  - name: Upload File
    resource: File
    description: Uploads a file, up to 5 MB, into a folder, with its own name.
    fields:
      - {name: file, label: File, type: file, required: true, default: "{{result}}"}
      - {name: folder, label: Folder, type: select, required: true, default: root, options_from: {request: {method: GET, path: drive/v3/files, query: {q: "mimeType = 'application/vnd.google-apps.folder' and trashed = false", pageSize: 200, fields: "files(id,name)", orderBy: name, supportsAllDrives: true, includeItemsFromAllDrives: true}}, path: files, label: name, value: id}}
      - {name: convert, label: Convert to, type: select, description: "Keeps the file as it is when empty.", options: [{label: Google Docs, value: application/vnd.google-apps.document}, {label: Google Sheets, value: application/vnd.google-apps.spreadsheet}, {label: Google Slides, value: application/vnd.google-apps.presentation}]}
      - {name: description, label: Description}
    request:
      method: POST
      path: upload/drive/v3/files
      query: {uploadType: multipart, supportsAllDrives: true, fields: "id,name,mimeType,parents,size,webViewLink"}
      body_type: related
      body:
        metadata: {name: "{{fields.file | name}}", parents: ["{{fields.folder}}"], mimeType: "{{fields.convert}}", description: "{{fields.description}}"}
        media: "{{fields.file}}"

  - name: Create From Text
    resource: File
    description: Creates a file from a text, as a plain text file or as a Google Doc.
    fields:
      - {name: name, label: File name, required: true}
      - {name: text, label: Text, type: textarea, required: true}
      - {name: folder, label: Folder, type: select, required: true, default: root, options_from: {request: {method: GET, path: drive/v3/files, query: {q: "mimeType = 'application/vnd.google-apps.folder' and trashed = false", pageSize: 200, fields: "files(id,name)", orderBy: name, supportsAllDrives: true, includeItemsFromAllDrives: true}}, path: files, label: name, value: id}}
      - {name: convert, label: Create as, type: select, required: true, default: text/plain, options: [{label: Text file, value: text/plain}, {label: Google Doc, value: application/vnd.google-apps.document}]}
    request:
      method: POST
      path: upload/drive/v3/files
      query: {uploadType: multipart, supportsAllDrives: true, fields: "id,name,mimeType,parents,webViewLink"}
      body_type: related
      body:
        metadata: {name: "{{fields.name}}", parents: ["{{fields.folder}}"], mimeType: "{{fields.convert}}"}
        media: "{{fields.text}}"

  - name: Download File
    resource: File
    description: Downloads a file. Google Docs, Sheets and Slides are downloaded with Export File.
    fields:
      - {name: file, label: File ID, required: true}
      - {name: name, label: Save as, description: "The name the file gets in the flow, like report.pdf."}
    request:
      method: GET
      path: "drive/v3/files/{{fields.file}}"
      query: {alt: media, supportsAllDrives: true}
    output:
      file: {name: "{{fields.name}}"}

  - name: Export File
    resource: File
    description: Downloads a Google Doc, Sheet or Slides file converted to another format, up to 10 MB.
    fields:
      - {name: file, label: File ID, required: true}
      - name: format
        label: Format
        type: select
        required: true
        default: application/pdf
        options:
          - {label: PDF, value: application/pdf}
          - {label: Word (.docx), value: application/vnd.openxmlformats-officedocument.wordprocessingml.document}
          - {label: Excel (.xlsx), value: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet}
          - {label: PowerPoint (.pptx), value: application/vnd.openxmlformats-officedocument.presentationml.presentation}
          - {label: OpenDocument text (.odt), value: application/vnd.oasis.opendocument.text}
          - {label: OpenDocument spreadsheet (.ods), value: application/vnd.oasis.opendocument.spreadsheet}
          - {label: CSV (first sheet), value: text/csv}
          - {label: Plain text, value: text/plain}
          - {label: HTML, value: text/html}
          - {label: Rich text (.rtf), value: application/rtf}
          - {label: EPUB, value: application/epub+zip}
          - {label: PNG image, value: image/png}
          - {label: JPEG image, value: image/jpeg}
      - {name: name, label: Save as, description: "The name the file gets in the flow, like report.pdf."}
    request:
      method: GET
      path: "drive/v3/files/{{fields.file}}/export"
      query: {mimeType: "{{fields.format}}"}
    output:
      file: {name: "{{fields.name}}"}

  - name: Get File
    resource: File
    description: Gets a file's details.
    fields:
      - {name: file, label: File ID, required: true}
    request:
      method: GET
      path: "drive/v3/files/{{fields.file}}"
      query: {supportsAllDrives: true, fields: "*"}

  - name: Copy File
    resource: File
    description: Copies a file, into the same folder or another.
    fields:
      - {name: file, label: File ID, required: true}
      - {name: name, label: New name, description: "\"Copy of\" and the name when empty."}
      - {name: folder, label: Into folder, type: select, description: "The file's own folder when empty.", options_from: {request: {method: GET, path: drive/v3/files, query: {q: "mimeType = 'application/vnd.google-apps.folder' and trashed = false", pageSize: 200, fields: "files(id,name)", orderBy: name, supportsAllDrives: true, includeItemsFromAllDrives: true}}, path: files, label: name, value: id}}
      - {name: description, label: Description}
    request:
      method: POST
      path: "drive/v3/files/{{fields.file}}/copy"
      query: {supportsAllDrives: true, fields: "id,name,mimeType,parents,webViewLink"}
      body: {name: "{{fields.name}}", parents: ["{{fields.folder}}"], description: "{{fields.description}}"}

  - name: Move File
    resource: File
    description: Moves a file into another folder, out of the one it is in.
    fields:
      - {name: file, label: File ID, required: true}
      - {name: from, label: From folder ID, required: true, description: "The folder it is in now, the parents of Get File."}
      - {name: folder, label: Into folder, type: select, required: true, options_from: {request: {method: GET, path: drive/v3/files, query: {q: "mimeType = 'application/vnd.google-apps.folder' and trashed = false", pageSize: 200, fields: "files(id,name)", orderBy: name, supportsAllDrives: true, includeItemsFromAllDrives: true}}, path: files, label: name, value: id}}
    request:
      method: PATCH
      path: "drive/v3/files/{{fields.file}}"
      query: {addParents: "{{fields.folder}}", removeParents: "{{fields.from}}", supportsAllDrives: true, fields: "id,name,parents"}
      body: {}

  - name: Update File
    resource: File
    description: Renames a file, or changes its description or star.
    fields:
      - {name: file, label: File ID, required: true}
      - {name: name, label: New name}
      - {name: description, label: Description}
      - {name: starred, label: Starred, type: select, options: [{label: "Yes", value: true}, {label: "No", value: false}]}
    request:
      method: PATCH
      path: "drive/v3/files/{{fields.file}}"
      query: {supportsAllDrives: true, fields: "id,name,mimeType,description,starred,modifiedTime,webViewLink"}
      body: {name: "{{fields.name}}", description: "{{fields.description}}", starred: "{{fields.starred}}"}

  - name: Update File Content
    resource: File
    description: Replaces a file's content with another file, keeping its ID, link and sharing.
    fields:
      - {name: file, label: File ID, required: true}
      - {name: content, label: New content, type: file, required: true, default: "{{result}}"}
    request:
      method: PATCH
      path: "upload/drive/v3/files/{{fields.file}}"
      query: {uploadType: media, supportsAllDrives: true, fields: "id,name,mimeType,size,modifiedTime,webViewLink"}
      body_type: binary
      body: "{{fields.content}}"

  - name: Share File
    resource: File
    description: Gives a person, a group, a domain or anyone with the link access to a file.
    fields:
      - {name: file, label: File ID, required: true}
      - {name: type, label: Share with, type: select, required: true, default: user, options: [{label: A person, value: user}, {label: A group, value: group}, {label: A domain, value: domain}, {label: Anyone with the link, value: anyone}]}
      - {name: email, label: Email, description: For a person or a group.}
      - {name: domain, label: Domain, description: "For a domain, like example.com."}
      - {name: role, label: Role, type: select, required: true, default: reader, options: [{label: Viewer, value: reader}, {label: Commenter, value: commenter}, {label: Editor, value: writer}, {label: Content manager (shared drives), value: fileOrganizer}, {label: Manager (shared drives), value: organizer}]}
      - {name: discoverable, label: Findable in search, type: select, description: "For a domain or anyone. No when empty.", options: [{label: "Yes", value: true}, {label: "No", value: false}]}
      - {name: notify, label: Send an email, type: select, description: "For a person or a group. Yes when empty.", options: [{label: "Yes", value: true}, {label: "No", value: false}]}
      - {name: message, label: Email message}
      - {name: expires, label: Expires, type: datetime}
    request:
      method: POST
      path: "drive/v3/files/{{fields.file}}/permissions"
      query: {sendNotificationEmail: "{{fields.notify}}", emailMessage: "{{fields.message}}", supportsAllDrives: true}
      body: {type: "{{fields.type}}", role: "{{fields.role}}", emailAddress: "{{fields.email}}", domain: "{{fields.domain}}", allowFileDiscovery: "{{fields.discoverable}}", expirationTime: "{{fields.expires}}"}

  - name: Delete File
    resource: File
    description: Moves a file to the trash.
    fields:
      - {name: file, label: File ID, required: true}
    request:
      method: PATCH
      path: "drive/v3/files/{{fields.file}}"
      query: {supportsAllDrives: true, fields: "id,name,trashed"}
      body: {trashed: true}

  - name: Delete File Permanently
    resource: File
    description: Deletes a file for good, skipping the trash.
    fields:
      - {name: file, label: File ID, required: true}
    request:
      method: DELETE
      path: "drive/v3/files/{{fields.file}}"
      query: {supportsAllDrives: true}
    output:
      value: {deleted: true}

  # Folders
  - name: Create Folder
    resource: Folder
    description: Creates a folder, at the top of My Drive or inside another.
    fields:
      - {name: name, label: Name, required: true}
      - {name: parent, label: Parent folder, type: select, required: true, default: root, options_from: {request: {method: GET, path: drive/v3/files, query: {q: "mimeType = 'application/vnd.google-apps.folder' and trashed = false", pageSize: 200, fields: "files(id,name)", orderBy: name, supportsAllDrives: true, includeItemsFromAllDrives: true}}, path: files, label: name, value: id}}
      - {name: color, label: Color, description: "In hex, like #4986e7."}
    request:
      method: POST
      path: drive/v3/files
      query: {supportsAllDrives: true, fields: "id,name,mimeType,parents,webViewLink"}
      body: {name: "{{fields.name}}", mimeType: application/vnd.google-apps.folder, parents: ["{{fields.parent}}"], folderColorRgb: "{{fields.color}}"}

  - name: Get Folder Items
    resource: Folder
    description: Lists the files and folders inside a folder.
    fields:
      - {name: folder, label: Folder, type: select, required: true, default: root, options_from: {request: {method: GET, path: drive/v3/files, query: {q: "mimeType = 'application/vnd.google-apps.folder' and trashed = false", pageSize: 200, fields: "files(id,name)", orderBy: name, supportsAllDrives: true, includeItemsFromAllDrives: true}}, path: files, label: name, value: id}}
    request:
      method: GET
      path: drive/v3/files
      query:
        q: "'{{fields.folder}}' in parents and trashed = false"
        orderBy: "folder,name"
        fields: "nextPageToken,files(id,name,mimeType,parents,size,createdTime,modifiedTime,webViewLink)"
        supportsAllDrives: true
        includeItemsFromAllDrives: true
    pagination: {type: cursor, items_path: files, cursor_param: pageToken, next_path: nextPageToken, limit_param: pageSize, page_size: 200}

  - name: Share Folder
    resource: Folder
    description: Gives a person, a group, a domain or anyone with the link access to a folder and what is in it.
    fields:
      - {name: file, label: Folder ID, required: true}
      - {name: type, label: Share with, type: select, required: true, default: user, options: [{label: A person, value: user}, {label: A group, value: group}, {label: A domain, value: domain}, {label: Anyone with the link, value: anyone}]}
      - {name: email, label: Email, description: For a person or a group.}
      - {name: domain, label: Domain, description: "For a domain, like example.com."}
      - {name: role, label: Role, type: select, required: true, default: reader, options: [{label: Viewer, value: reader}, {label: Commenter, value: commenter}, {label: Editor, value: writer}, {label: Content manager (shared drives), value: fileOrganizer}, {label: Manager (shared drives), value: organizer}]}
      - {name: discoverable, label: Findable in search, type: select, description: "For a domain or anyone. No when empty.", options: [{label: "Yes", value: true}, {label: "No", value: false}]}
      - {name: notify, label: Send an email, type: select, description: "For a person or a group. Yes when empty.", options: [{label: "Yes", value: true}, {label: "No", value: false}]}
      - {name: message, label: Email message}
      - {name: expires, label: Expires, type: datetime}
    request: {method: POST, path: 'drive/v3/files/{{fields.file}}/permissions', query: {sendNotificationEmail: '{{fields.notify}}', emailMessage: '{{fields.message}}', supportsAllDrives: true}, body: {type: '{{fields.type}}', role: '{{fields.role}}', emailAddress: '{{fields.email}}', domain: '{{fields.domain}}', allowFileDiscovery: '{{fields.discoverable}}', expirationTime: '{{fields.expires}}'}}

  - name: Delete Folder
    resource: Folder
    description: Moves a folder, and what is in it, to the trash.
    fields:
      - {name: folder, label: Folder ID, required: true}
    request:
      method: PATCH
      path: "drive/v3/files/{{fields.folder}}"
      query: {supportsAllDrives: true, fields: "id,name,trashed"}
      body: {trashed: true}

  - name: Delete Folder Permanently
    resource: Folder
    description: Deletes a folder, and what is in it, for good, skipping the trash.
    fields:
      - {name: folder, label: Folder ID, required: true}
    request:
      method: DELETE
      path: "drive/v3/files/{{fields.folder}}"
      query: {supportsAllDrives: true}
    output:
      value: {deleted: true}

  # Search
  - name: Search
    resource: File and Folder
    description: Finds files and folders by name, in your Drive, shared with you or in every drive.
    fields:
      - {name: name, label: Name contains, required: true}
      - {name: what, label: Find, type: select, default: "", options: [{label: Files and folders, value: ""}, {label: Only files, value: "and mimeType != 'application/vnd.google-apps.folder'"}, {label: Only folders, value: "and mimeType = 'application/vnd.google-apps.folder'"}]}
      - {name: where, label: Where, type: select, required: true, default: user, options: [{label: My Drive and shared with me, value: user}, {label: Every drive, value: allDrives}]}
    request:
      method: GET
      path: drive/v3/files
      query:
        q: "name contains '{{fields.name}}' and trashed = false {{fields.what}}"
        corpora: "{{fields.where}}"
        fields: "nextPageToken,files(id,name,mimeType,parents,size,createdTime,modifiedTime,webViewLink,driveId)"
        supportsAllDrives: true
        includeItemsFromAllDrives: true
    pagination: {type: cursor, items_path: files, cursor_param: pageToken, next_path: nextPageToken, limit_param: pageSize, page_size: 200}

  - name: Search With Query
    resource: File and Folder
    description: "Finds files and folders with Drive's search language, like modifiedTime > '2026-01-01' and 'me' in owners."
    fields:
      - {name: query, label: Query, required: true, default: "trashed = false"}
      - {name: where, label: Where, type: select, required: true, default: user, options: [{label: My Drive and shared with me, value: user}, {label: Every drive, value: allDrives}]}
      - {name: order, label: Order by, description: "Like modifiedTime desc or name."}
    request:
      method: GET
      path: drive/v3/files
      query:
        q: "{{fields.query}}"
        corpora: "{{fields.where}}"
        orderBy: "{{fields.order}}"
        fields: "nextPageToken,files(id,name,mimeType,parents,size,createdTime,modifiedTime,webViewLink,driveId)"
        supportsAllDrives: true
        includeItemsFromAllDrives: true
    pagination: {type: cursor, items_path: files, cursor_param: pageToken, next_path: nextPageToken, limit_param: pageSize, page_size: 200}

  # Shared drives
  - name: Create Shared Drive
    resource: Shared Drive
    description: Creates a shared drive. Creating again with the same name answers with the drive already made.
    fields:
      - {name: name, label: Name, required: true}
      - {name: color, label: Color, description: "In hex, like #4986e7."}
    request:
      method: POST
      path: drive/v3/drives
      query: {requestId: "{{fields.name}}"}
      body: {name: "{{fields.name}}", colorRgb: "{{fields.color}}"}

  - name: Get Shared Drive
    resource: Shared Drive
    description: Gets a shared drive's details.
    fields:
      - {name: drive, label: Shared drive, type: select, required: true, options_from: {request: {method: GET, path: drive/v3/drives, query: {pageSize: 100}}, path: drives, label: name, value: id}}
    request: {method: GET, path: "drive/v3/drives/{{fields.drive}}"}

  - name: List Shared Drives
    resource: Shared Drive
    description: Lists the shared drives you are a member of, or those matching a query.
    fields:
      - {name: query, label: Query, description: "Like name contains 'Sales'."}
    request:
      method: GET
      path: drive/v3/drives
      query: {q: "{{fields.query}}"}
    pagination: {type: cursor, items_path: drives, cursor_param: pageToken, next_path: nextPageToken, limit_param: pageSize, page_size: 100}

  - name: Update Shared Drive
    resource: Shared Drive
    description: Renames a shared drive or changes its color.
    fields:
      - {name: drive, label: Shared drive, type: select, required: true, options_from: {request: {method: GET, path: drive/v3/drives, query: {pageSize: 100}}, path: drives, label: name, value: id}}
      - {name: name, label: New name}
      - {name: color, label: Color, description: "In hex, like #4986e7."}
    request:
      method: PATCH
      path: "drive/v3/drives/{{fields.drive}}"
      body: {name: "{{fields.name}}", colorRgb: "{{fields.color}}"}

  - name: Delete Shared Drive
    resource: Shared Drive
    description: Deletes a shared drive. It must be empty.
    fields:
      - {name: drive, label: Shared drive, type: select, required: true, options_from: {request: {method: GET, path: drive/v3/drives, query: {pageSize: 100}}, path: drives, label: name, value: id}}
    request: {method: DELETE, path: "drive/v3/drives/{{fields.drive}}"}
    output:
      value: {deleted: true}

