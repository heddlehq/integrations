# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Sympla, the events and ticketing platform. Generate the token in Sympla under
# Minha Conta › Integrações; it goes in the s_token header. Lists answer
# {"data", "pagination", "sort"}, page with page_size (up to 200) and a cursor, and
# sort with field_sort and sort (asc or desc).
id: sympla
name: Sympla
version: 1.0.0
homepage: https://developers.sympla.com.br/api-doc/index.html
description: Read events, sessions, orders and participants, check participants in, and start flows on new orders and participants, in Sympla.
icon: hero-ticket
logo: |-
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#0097FF"/><svg x="3.00" y="8.25" width="18.00" height="7.50" viewBox="0 0 60 25"><title>Sympla</title> <path d="M58.592 9.913v8.375a.226.226 0 0 1-.227.225H56.15a.226.226 0 0 1-.227-.225v-.605c-.587.67-1.459 1.077-2.652 1.077-2.331 0-4.253-2.03-4.253-4.66 0-2.63 1.922-4.659 4.253-4.659 1.193 0 2.065.406 2.652 1.077v-.605c0-.124.102-.225.227-.225h2.216c.126 0 .227.1.227.225zM1.114 15.645l2.083-1.197a.228.228 0 0 1 .317.093c.46.908 1.216 1.504 2.528 1.504 1.36 0 1.7-.532 1.7-1.011 0-.763-.716-1.065-2.595-1.58-1.86-.514-3.685-1.4-3.685-3.778 0-2.395 2.04-3.779 4.204-3.779 1.984 0 3.552.907 4.48 2.61.058.107.02.24-.086.302L8.04 9.98a.229.229 0 0 1-.316-.087c-.421-.764-1.005-1.23-2.058-1.23-.894 0-1.342.444-1.342.94 0 .569.305.96 2.255 1.545 1.896.567 4.025 1.224 4.025 3.85 0 2.394-1.932 3.813-4.651 3.813-2.54 0-4.196-1.158-4.935-2.884a.225.225 0 0 1 .096-.283zm18.65-5.951c.158 0 .268.154.216.3l-2.953 8.304c-.972 2.736-2.5 3.87-4.876 3.822a.227.227 0 0 1-.223-.226V19.85c0-.121.097-.22.219-.226 1.072-.044 1.615-.427 1.985-1.38a.227.227 0 0 0-.002-.17l-3.394-8.067a.226.226 0 0 1 .21-.313h2.45c.097 0 .182.06.215.149l1.931 5.28 1.633-5.27a.228.228 0 0 1 .217-.16h2.373zm24.573 4.435c0 2.643-1.933 4.683-4.276 4.683-1.2 0-2.076-.408-2.666-1.082v4.132c0 .138-.113.25-.253.25h-2.178a.251.251 0 0 1-.253-.25V9.944c0-.138.113-.25.253-.25h2.178c.14 0 .253.112.253.25v.583c.59-.674 1.467-1.082 2.666-1.082 2.343 0 4.276 2.04 4.276 4.684zM45.57 5.59h2.228c.126 0 .228.1.228.226v12.498a.227.227 0 0 1-.228.226H45.57a.227.227 0 0 1-.228-.226V5.817c0-.125.102-.226.228-.226zM29.972 9.317c2.058 0 3.399 1.455 3.399 3.672v5.22c0 .126-.067.332-.193.332H30.95c-.125 0-.223-.206-.223-.331v-4.99c0-.887-.409-1.455-1.268-1.455-.894 0-1.375.621-1.375 1.668v4.777c0 .125-.147.331-.273.331h-1.996c-.125 0-.273-.206-.273-.331v-4.777c0-1.047-.48-1.668-1.375-1.668-.86 0-1.268.568-1.268 1.455v4.99c0 .125-.097.331-.223.331h-2.228c-.126 0-.193-.206-.193-.331v-5.22c0-2.218 1.34-3.673 3.397-3.673 1.12 0 2.332.099 3.158 1.047.826-.948 2.043-1.047 3.162-1.047zm24.33-2.669a1.524 1.524 0 0 1-1.673 1.356 1.518 1.518 0 0 1-1.367-1.659 1.525 1.525 0 0 1 1.673-1.355c.84.083 1.452.826 1.367 1.658zm5.12-1.78a2.167 2.167 0 0 1-2.377 1.928 2.158 2.158 0 0 1-1.943-2.358 2.167 2.167 0 0 1 2.378-1.927 2.158 2.158 0 0 1 1.943 2.358zm-3.5 9.232c0-1.323-.89-2.153-2.118-2.153-1.228 0-2.118.83-2.118 2.153 0 1.324.89 2.154 2.118 2.154 1.228 0 2.118-.83 2.118-2.154zm-14.269.029c0-1.33-.895-2.164-2.13-2.164-1.234 0-2.128.833-2.128 2.164 0 1.33.894 2.164 2.129 2.164 1.234 0 2.129-.834 2.129-2.164z"></path></svg></svg>
category: events
base_url: https://api.sympla.com.br/public/v1.6.0/
headers:
  User-Agent: Heddle/1.0

credential:
  label: Sympla
  fields:
    - {name: token, label: Token, secret: true, required: true, description: From Minha Conta › Integrações in Sympla.}
  auth:
    type: header
    name: s_token
    value: "{{credential.token}}"

errors:
  message_path: detail

triggers:
  - name: New Order
    description: Starts the flow for each new order of an event, checking every 5 minutes.
    fields:
      - {name: event_id, label: Event ID, required: true, description: From List Events.}
    request:
      method: GET
      path: "events/{{fields.event_id}}/orders"
      query: {field_sort: order_date, sort: desc, page_size: 100}
    output: {path: data}
    poll: {every: 5, id: id}

  - name: New Participant
    description: Starts the flow for each new participant of an event, checking every 5 minutes.
    fields:
      - {name: event_id, label: Event ID, required: true, description: From List Events.}
    request:
      method: GET
      path: "events/{{fields.event_id}}/participants"
      query: {field_sort: ticket_created_at, sort: desc, page_size: 100}
    output: {path: data}
    poll: {every: 5, id: id}

actions:
  # Events
  - name: List Events
    resource: Event
    description: Lists the account's events, published or not, from a date if you like.
    fields:
      - {name: published, label: Published, type: select, default: published, options: [{label: Published, value: published}, {label: Not published, value: not_published}, {label: All, value: all}]}
      - {name: from, label: From, type: datetime}
      - {name: field_sort, label: Order by, type: select, default: start_date, options: [{label: Start date, value: start_date}, {label: End date, value: end_date}, {label: Name, value: name}]}
      - {name: sort, label: Direction, type: select, default: desc, options: [{label: Ascending, value: asc}, {label: Descending, value: desc}]}
      - {name: page_size, label: Per page, type: number, default: 100}
    request:
      method: GET
      path: events
      query: {published: "{{fields.published}}", from: "{{fields.from}}", field_sort: "{{fields.field_sort}}", sort: "{{fields.sort}}", page_size: "{{fields.page_size}}"}
    output: {path: data}

  - name: Get Event
    resource: Event
    description: Reads an event.
    fields:
      - {name: event_id, label: Event ID, required: true}
    request: {method: GET, path: "events/{{fields.event_id}}"}

  - name: List Sessions
    resource: Event
    description: Lists the sessions (presentations) of an event.
    fields:
      - {name: event_id, label: Event ID, required: true}
      - {name: page_size, label: Per page, type: number, default: 100}
    request: {method: GET, path: "events/{{fields.event_id}}/presentations", query: {page_size: "{{fields.page_size}}"}}
    output: {path: data}

  - name: Get Session
    resource: Event
    description: Reads a session of an event.
    fields:
      - {name: event_id, label: Event ID, required: true}
      - {name: presentation_id, label: Session ID, required: true}
    request: {method: GET, path: "events/{{fields.event_id}}/presentations/{{fields.presentation_id}}"}

  # Orders
  - name: List Orders
    resource: Order
    description: Lists the orders of an event, by buyer email or date.
    fields:
      - {name: event_id, label: Event ID, required: true}
      - {name: buyer_email, label: Buyer email}
      - {name: from, label: From, type: datetime}
      - {name: to, label: To, type: datetime}
      - {name: cancelled_filter, label: Cancelled, type: select, default: none, options: [{label: Leave out, value: none}, {label: Include, value: include}, {label: Only cancelled, value: only}]}
      - {name: page_size, label: Per page, type: number, default: 100}
    request:
      method: GET
      path: "events/{{fields.event_id}}/orders"
      query: {buyer_email: "{{fields.buyer_email}}", from: "{{fields.from}}", to: "{{fields.to}}", cancelled_filter: "{{fields.cancelled_filter}}", field_sort: order_date, sort: desc, page_size: "{{fields.page_size}}"}
    output: {path: data}

  - name: Get Order
    resource: Order
    description: Reads an order.
    fields:
      - {name: event_id, label: Event ID, required: true}
      - {name: order_id, label: Order ID, required: true}
    request: {method: GET, path: "events/{{fields.event_id}}/orders/{{fields.order_id}}"}
    output: {path: data}

  - name: List Order Participants
    resource: Order
    description: Lists the participants of an order.
    fields:
      - {name: event_id, label: Event ID, required: true}
      - {name: order_id, label: Order ID, required: true}
    request: {method: GET, path: "events/{{fields.event_id}}/orders/{{fields.order_id}}/participants", query: {page_size: 200}}
    output: {path: data}

  - name: List Order Products
    resource: Order
    description: Lists the Sympla Store products of an order.
    fields:
      - {name: event_id, label: Event ID, required: true}
      - {name: order_id, label: Order ID, required: true}
    request: {method: GET, path: "events/{{fields.event_id}}/orders/{{fields.order_id}}/products", query: {page_size: 200}}
    output: {path: data}

  # Participants
  - name: List Participants
    resource: Participant
    description: Lists the participants of an event, by email or changed since a date.
    fields:
      - {name: event_id, label: Event ID, required: true}
      - {name: participant_email, label: Email}
      - {name: from, label: Changed since, type: datetime}
      - {name: cancelled_filter, label: Cancelled, type: select, default: none, options: [{label: Leave out, value: none}, {label: Include, value: include}, {label: Only cancelled, value: only}]}
      - {name: page_size, label: Per page, type: number, default: 100}
    request:
      method: GET
      path: "events/{{fields.event_id}}/participants"
      query: {participant_email: "{{fields.participant_email}}", from: "{{fields.from}}", cancelled_filter: "{{fields.cancelled_filter}}", page_size: "{{fields.page_size}}"}
    output: {path: data}

  - name: Get Participant
    resource: Participant
    description: Reads a participant by ID.
    fields:
      - {name: event_id, label: Event ID, required: true}
      - {name: participant_id, label: Participant ID, required: true}
    request: {method: GET, path: "events/{{fields.event_id}}/participants/{{fields.participant_id}}"}
    output: {path: data}

  - name: Get Participant by Ticket
    resource: Participant
    description: Reads a participant by the ticket number.
    fields:
      - {name: event_id, label: Event ID, required: true}
      - {name: ticket_number, label: Ticket number, required: true}
    request: {method: GET, path: "events/{{fields.event_id}}/participants/ticketNumber/{{fields.ticket_number}}"}
    output: {path: data}

  - name: Check In Participant
    resource: Participant
    description: Checks a participant in, by ID.
    fields:
      - {name: event_id, label: Event ID, required: true}
      - {name: participant_id, label: Participant ID, required: true}
    request: {method: POST, path: "events/{{fields.event_id}}/participants/{{fields.participant_id}}/check-in"}
    output: {path: data}

  - name: Check In by Ticket
    resource: Participant
    description: Checks a participant in, by the ticket number.
    fields:
      - {name: event_id, label: Event ID, required: true}
      - {name: ticket_number, label: Ticket number, required: true}
    request: {method: POST, path: "events/{{fields.event_id}}/participants/ticketNumber/{{fields.ticket_number}}/check-in"}
    output: {path: data}

i18n:
  pt-BR:
    description: "Consulte eventos, sessões, pedidos e participantes, faça check-in e inicie fluxos com novos pedidos e participantes, na Sympla."
    triggers:
      New Order: {name: "Novo pedido", description: "Inicia o fluxo a cada novo pedido de um evento, verificando a cada 5 minutos.", fields: {event_id: "ID do evento"}}
      New Participant: {name: "Novo participante", description: "Inicia o fluxo a cada novo participante de um evento, verificando a cada 5 minutos.", fields: {event_id: "ID do evento"}}
    actions:
      List Events: {name: "Listar eventos", description: "Lista os eventos da conta, publicados ou não, a partir de uma data se quiser.", fields: {published: "Publicado", from: "A partir de", field_sort: "Ordenar por", sort: "Direção", page_size: "Por página"}}
      Get Event: {name: "Buscar evento", description: "Lê um evento.", fields: {event_id: "ID do evento"}}
      List Sessions: {name: "Listar sessões", description: "Lista as sessões (apresentações) de um evento.", fields: {event_id: "ID do evento", page_size: "Por página"}}
      Get Session: {name: "Buscar sessão", description: "Lê uma sessão de um evento.", fields: {event_id: "ID do evento", presentation_id: "ID da sessão"}}
      List Orders: {name: "Listar pedidos", description: "Lista os pedidos de um evento, por e-mail do comprador ou data.", fields: {event_id: "ID do evento", buyer_email: "E-mail do comprador", from: "A partir de", to: "Até", cancelled_filter: "Cancelados", page_size: "Por página"}}
      Get Order: {name: "Buscar pedido", description: "Lê um pedido.", fields: {event_id: "ID do evento", order_id: "ID do pedido"}}
      List Order Participants: {name: "Listar participantes do pedido", description: "Lista os participantes de um pedido.", fields: {event_id: "ID do evento", order_id: "ID do pedido"}}
      List Order Products: {name: "Listar produtos do pedido", description: "Lista os produtos da Sympla Store de um pedido.", fields: {event_id: "ID do evento", order_id: "ID do pedido"}}
      List Participants: {name: "Listar participantes", description: "Lista os participantes de um evento, por e-mail ou alterados desde uma data.", fields: {event_id: "ID do evento", participant_email: "E-mail", from: "Alterados desde", cancelled_filter: "Cancelados", page_size: "Por página"}}
      Get Participant: {name: "Buscar participante", description: "Lê um participante pelo ID.", fields: {event_id: "ID do evento", participant_id: "ID do participante"}}
      Get Participant by Ticket: {name: "Buscar participante pelo ingresso", description: "Lê um participante pelo número do ingresso.", fields: {event_id: "ID do evento", ticket_number: "Número do ingresso"}}
      Check In Participant: {name: "Fazer check-in", description: "Faz o check-in de um participante pelo ID.", fields: {event_id: "ID do evento", participant_id: "ID do participante"}}
      Check In by Ticket: {name: "Fazer check-in pelo ingresso", description: "Faz o check-in de um participante pelo número do ingresso.", fields: {event_id: "ID do evento", ticket_number: "Número do ingresso"}}
