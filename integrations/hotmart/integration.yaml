 8.75938C5.93312 8.81425 5.82059 8.84494 5.70805 8.85052C5.54065 8.83378 4.71105 8.68032 5.43369 7.29271C5.49414 7.17738 5.33511 7.05927 5.24768 7.15506L4.67757 7.78284C4.65246 7.81074 4.62549 7.83771 4.60038 7.86561L4.50458 7.9707C4.48784 7.99024 4.47482 8.00605 4.46087 8.02558C2.66404 10.0791 1.40756 12.7046 0.683992 15.1348C0.0366861 17.4729 -0.00516555 19.3358 0.000414671 20.0463V20.2035C0.000414671 23.3433 1.19458 26.2934 3.36622 28.5152C5.53507 30.7334 8.4219 31.9582 11.4892 31.9582C14.5564 31.9582 17.4433 30.7362 19.6121 28.5152C21.781 26.2943 22.9779 23.3433 22.9779 20.2026C22.9779 18.2011 22.7203 16.5726 22.285 15.0139" fill="#FF4000"/></svg></svg>
category: ecommerce
author: Heddle
homepage: https://developers.hotmart.com/docs/en/
base_url: "{{credential.url}}/"
headers:
  User-Agent: Heddle

credential:
  label: Hotmart
  fields:
    - {name: client_id, label: Client ID, required: true}
    - {name: client_secret, label: Client secret, secret: true, required: true}
    - {name: basic, label: Basic token, secret: true, required: true, description: "The Basic shown next to the client secret, without the word Basic."}
    - {name: hottok, label: Hottok, secret: true, description: "From Ferramentas › Webhook, for the trigger."}
    - {name: url, label: API address, default: "https://developers.hotmart.com", description: "https://sandbox.hotmart.com for the sandbox."}
  auth:
    type: login
    request:
      method: POST
      url: "https://api-sec-vlc.hotmart.com/security/oauth/token?grant_type=client_credentials&client_id={{credential.client_id}}&client_secret={{credential.client_secret}}"
      headers: {Authorization: "Basic {{credential.basic}}"}
    token_path: access_token
    expires_path: expires_in

errors:
  message_path: error_description

triggers:
  - name: Hotmart Event
    description: Starts the flow when Hotmart sends an event, like a purchase approved, refunded or canceled. Set the address in Hotmart's Webhook page.
    webhook:
      signature: {header: X-HOTMART-HOTTOK, token: "{{credential.hottok}}"}

actions:
  # Sales
  - name: List Sales
    resource: Sale
    description: Lists sales, by status, product, buyer or dates.
    fields:
      - name: transaction_status
        label: Status
        type: select
        options:
          - {label: Approved, value: APPROVED}
          - {label: Complete, value: COMPLETE}
          - {label: Waiting payment, value: WAITING_PAYMENT}
          - {label: Canceled, value: CANCELLED}
          - {label: Refunded, value: REFUNDED}
          - {label: Chargeback, value: CHARGEBACK}
          - {label: Expired, value: EXPIRED}
          - {label: Delayed, value: DELAYED}
          - {label: Protested, value: PROTESTED}
      - {name: product_id, label: Product ID}
      - {name: buyer_email, label: Buyer email}
      - {name: transaction, label: Transaction code, description: "Like HP17715690036014"}
      - {name: start_date, label: From (ms), type: number}
      - {name: end_date, label: To (ms), type: number}
      - name: payment_type
        label: Paid with
        type: select
        options:
          - {label: Card, value: CREDIT_CARD}
          - {label: Pix, value: PIX}
          - {label: Boleto, value: BILLET}
          - {label: PayPal, value: PAYPAL}
    request:
      method: GET
      path: payments/api/v1/sales/history
      query: {transaction_status: "{{fields.transaction_status}}", product_id: "{{fields.product_id}}", buyer_email: "{{fields.buyer_email}}", transaction: "{{fields.transaction}}", start_date: "{{fields.start_date}}", end_date: "{{fields.end_date}}", payment_type: "{{fields.payment_type}}"}
    pagination: {type: cursor, items_path: items, cursor_param: page_token, next_path: page_info.next_page_token, limit_param: max_results, page_size: 100}

  - name: Get Sales Summary
    resource: Sale
    description: Sums up sales by currency, for a product or dates.
    fields:
      - {name: product_id, label: Product ID}
      - {name: start_date, label: From (ms), type: number}
      - {name: end_date, label: To (ms), type: number}
      - {name: transaction_status, label: Status}
    request:
      method: GET
      path: payments/api/v1/sales/summary
      query: {product_id: "{{fields.product_id}}", start_date: "{{fields.start_date}}", end_date: "{{fields.end_date}}", transaction_status: "{{fields.transaction_status}}"}

  - name: List Sale Participants
    resource: Sale
    description: Lists the buyers, producers and affiliates of sales.
    fields:
      - {name: transaction, label: Transaction code}
      - {name: product_id, label: Product ID}
      - {name: buyer_email, label: Buyer email}
      - {name: start_date, label: From (ms), type: number}
      - {name: end_date, label: To (ms), type: number}
    request:
      method: GET
      path: payments/api/v1/sales/users
      query: {transaction: "{{fields.transaction}}", product_id: "{{fields.product_id}}", buyer_email: "{{fields.buyer_email}}", start_date: "{{fields.start_date}}", end_date: "{{fields.end_date}}"}
    pagination: {type: cursor, items_path: items, cursor_param: page_token, next_path: page_info.next_page_token, limit_param: max_results, page_size: 100}

  - name: List Commissions
    resource: Sale
    description: Lists the commissions of sales, by product, affiliate or dates.
    fields:
      - {name: transaction, label: Transaction code}
      - {name: product_id, label: Product ID}
      - {name: commission_as, label: Commission as, type: select, options: [{label: Producer, value: PRODUCER}, {label: Co-producer, value: COPRODUCER}, {label: Affiliate, value: AFFILIATE}]}
      - {name: start_date, label: From (ms), type: number}
      - {name: end_date, label: To (ms), type: number}
    request:
      method: GET
      path: payments/api/v1/sales/commissions
      query: {transaction: "{{fields.transaction}}", product_id: "{{fields.product_id}}", commission_as: "{{fields.commission_as}}", start_date: "{{fields.start_date}}", end_date: "{{fields.end_date}}"}
    pagination: {type: cursor, items_path: items, cursor_param: page_token, next_path: page_info.next_page_token, limit_param: max_results, page_size: 100}

  - name: Get Sale Price Details
    resource: Sale
    description: Reads the price breakdown of sales, with fees and installments.
    fields:
      - {name: transaction, label: Transaction code}
      - {name: product_id, label: Product ID}
      - {name: start_date, label: From (ms), type: number}
      - {name: end_date, label: To (ms), type: number}
    request:
      method: GET
      path: payments/api/v1/sales/price/details
      query: {transaction: "{{fields.transaction}}", product_id: "{{fields.product_id}}", start_date: "{{fields.start_date}}", end_date: "{{fields.end_date}}"}
    pagination: {type: cursor, items_path: items, cursor_param: page_token, next_path: page_info.next_page_token, limit_param: max_results, page_size: 100}

  - name: Refund Sale
    resource: Sale
    description: Refunds a sale.
    fields:
      - {name: transaction, label: Transaction code, required: true}
    request: {method: PUT, path: "payments/api/v1/sales/{{fields.transaction}}/refund"}

  # Subscriptions
  - name: List Subscriptions
    resource: Subscription
    description: Lists subscriptions, by status, product, plan or subscriber.
    fields:
      - name: status
        label: Status
        type: select
        options:
          - {label: Active, value: ACTIVE}
          - {label: Inactive, value: INACTIVE}
          - {label: Delayed, value: DELAYED}
          - {label: Canceled by customer, value: CANCELLED_BY_CUSTOMER}
          - {label: Canceled by seller, value: CANCELLED_BY_SELLER}
          - {label: Canceled by admin, value: CANCELLED_BY_ADMIN}
          - {label: Started, value: STARTED}
          - {label: Overdue, value: OVERDUE}
      - {name: product_id, label: Product ID}
      - {name: plan, label: Plan name}
      - {name: subscriber_email, label: Subscriber email}
      - {name: subscriber_code, label: Subscriber code}
      - {name: transaction, label: Transaction code}
      - {name: accession_date, label: Joined from (ms), type: number}
      - {name: end_accession_date, label: Joined to (ms), type: number}
    request:
      method: GET
      path: payments/api/v1/subscriptions
      query: {status: "{{fields.status}}", product_id: "{{fields.product_id}}", plan: "{{fields.plan}}", subscriber_email: "{{fields.subscriber_email}}", subscriber_code: "{{fields.subscriber_code}}", transaction: "{{fields.transaction}}", accession_date: "{{fields.accession_date}}", end_accession_date: "{{fields.end_accession_date}}"}
    pagination: {type: cursor, items_path: items, cursor_param: page_token, next_path: page_info.next_page_token, limit_param: max_results, page_size: 100}

  - name: Get Subscriptions Summary
    resource: Subscription
    description: Sums up subscriptions, with how many charges each has had.
    fields:
      - {name: product_id, label: Product ID}
      - {name: subscriber_code, label: Subscriber code}
    request:
      method: GET
      path: payments/api/v1/subscriptions/summary
      query: {product_id: "{{fields.product_id}}", subscriber_code: "{{fields.subscriber_code}}"}
    pagination: {type: cursor, items_path: items, cursor_param: page_token, next_path: page_info.next_page_token, limit_param: max_results, page_size: 100}

  - name: List Subscription Purchases
    resource: Subscription
    description: Lists the charges of a subscription.
    fields:
      - {name: subscriber_code, label: Subscriber code, required: true}
    request: {method: GET, path: "payments/api/v1/subscriptions/{{fields.subscriber_code}}/purchases"}

  - name: Cancel Subscriptions
    resource: Subscription
    description: Cancels one or more subscriptions.
    fields:
      - {name: subscriber_codes, label: Subscriber codes, type: json, required: true, description: 'Like ["ABC123"]'}
      - {name: send_mail, label: Email the subscribers, type: boolean, default: true}
    request:
      method: POST
      path: payments/api/v1/subscriptions/cancel
      body: {subscriber_code: "{{fields.subscriber_codes}}", send_mail: "{{fields.send_mail}}"}

  - name: Reactivate Subscriptions
    resource: Subscription
    description: Reactivates canceled or overdue subscriptions, charging now if you like.
    fields:
      - {name: subscriber_codes, label: Subscriber codes, type: json, required: true}
      - {name: charge, label: Charge now, type: boolean, default: false}
    request:
      method: POST
      path: payments/api/v1/subscriptions/reactivate
      body: {subscriber_code: "{{fields.subscriber_codes}}", charge: "{{fields.charge}}"}

  - name: Change Due Day
    resource: Subscription
    description: Changes the day of the month a subscription is charged.
    fields:
      - {name: subscriber_code, label: Subscriber code, required: true}
      - {name: due_day, label: Day, type: number, required: true, description: "1 to 31"}
    request:
      method: PATCH
      path: "payments/api/v1/subscriptions/{{fields.subscriber_code}}"
      body: {due_day: "{{fields.due_day}}"}

  # Products
  - name: List Products
    resource: Product
    description: Lists your products.
    fields:
      - {name: status, label: Status, type: select, options: [{label: Active, value: ACTIVE}, {label: Draft, value: DRAFT}, {label: Paused, value: PAUSED}, {label: Not approved, value: NOT_APPROVED}, {label: In review, value: IN_REVIEW}, {label: Deleted, value: DELETED}]}
      - {name: format, label: Format, type: select, options: [{label: Online course, value: ONLINE_COURSE}, {label: Ebook, value: EBOOK}, {label: Software, value: SOFTWARE}, {label: Community, value: COMMUNITY}, {label: Event, value: ONLINE_EVENT}]}
    request:
      method: GET
      path: products/api/v1/products
      query: {status: "{{fields.status}}", format: "{{fields.format}}"}
    pagination: {type: cursor, items_path: items, cursor_param: page_token, next_path: page_info.next_page_token, limit_param: max_results, page_size: 100}

  - name: List Offers
    resource: Product
    description: Lists a product's offers, with their prices and payment options.
    fields:
      - {name: ucode, label: Product ucode, required: true, description: The product's UUID.}
    request: {method: GET, path: "products/api/v1/products/{{fields.ucode}}/offers"}
    pagination: {type: cursor, items_path: items, cursor_param: page_token, next_path: page_info.next_page_token, limit_param: max_results, page_size: 100}

  - name: List Plans
    resource: Product
    description: Lists a subscription product's plans.
    fields:
      - {name: ucode, label: Product ucode, required: true}
    request: {method: GET, path: "products/api/v1/products/{{fields.ucode}}/plans"}
    pagination: {type: cursor, items_path: items, cursor_param: page_token, next_path: page_info.next_page_token, limit_param: max_results, page_size: 100}

  # Members area
  - name: List Students
    resource: Members Area
    description: Lists the students of a members area.
    fields:
      - {name: subdomain, label: Members area subdomain, required: true, description: "Like meucurso, from meucurso.club.hotmart.com"}
      - {name: email, label: Email}
    request:
      method: GET
      path: club/api/v1/users
      query: {subdomain: "{{fields.subdomain}}", email: "{{fields.email}}"}
    pagination: {type: cursor, items_path: items, cursor_param: page_token, next_path: page_info.next_page_token, limit_param: max_results, page_size: 100}

  - name: List Modules
    resource: Members Area
    description: Lists the modules of a members area.
    fields:
      - {name: subdomain, label: Members area subdomain, required: true}
    request:
      method: GET
      path: club/api/v1/modules
      query: {subdomain: "{{fields.subdomain}}"}

  - name: Get Student Progress
    resource: Members Area
    description: Lists the lessons a student finished.
    fields:
      - {name: subdomain, label: Members area subdomain, required: true}
      - {name: user_id, label: Student ID, required: true}
    request:
      method: GET
      path: "club/api/v1/users/{{fields.user_id}}/lessons"
      query: {subdomain: "{{fields.subdomain}}"}

i18n:
  pt-BR:
    description: "Vendas, reembolsos, assinaturas, produtos e alunos da área de membros na Hotmart, e um gatilho para compras."
    triggers:
