# yaml-language-server: $schema=https://raw.githubusercontent.com/heddlehq/Bobbin/main/priv/integration.schema.json
#
# Hotmart, through its developer API. Connect with the client ID, client secret and
# Basic token of a credential from Hotmart's Ferramentas › Credenciais Hotmart. For
# the trigger, set the address Heddle shows in Ferramentas › Webhook, and give the
# credential the Hottok shown there. Dates go as milliseconds since 1970, like
# 1767225600000.
id: hotmart
name: Hotmart
version: 1.0.0
description: Sales, refunds, subscriptions, products and members area students in Hotmart, and a trigger for purchases.
icon: hero-shopping-bag
